<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Service Projects</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2a36;--muted:#5b6878;--line:#dbe2ea;--navy:#243b53;--accent:#2f6fb0;--box:#f8fafc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1a2129;--ink:#e3e8ee;--muted:#9aa7b5;--line:#2c3743;--navy:#9cc1e6;--accent:#6aa7e0;--box:#141a21}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1a2129;--ink:#e3e8ee;--muted:#9aa7b5;--line:#2c3743;--navy:#9cc1e6;--accent:#6aa7e0;--box:#141a21}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.65 "Segoe UI",Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 60px}
.top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px;z-index:2}
.top h1{font-size:22px;margin:0;color:var(--navy)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:2px}
.crumb a{color:var(--accent);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;margin-top:6px}
nav a{color:var(--accent);text-decoration:none}
h2{font-size:18px;color:var(--navy);margin:34px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--line)}
h3{font-size:15.5px;color:var(--navy);margin:22px 0 6px}
a{color:var(--accent)}
ul,ol{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 32px}
footer{margin-top:36px;font-size:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.bar .gap{flex:1}
.linkbtn{display:inline-block;font-size:14px;font-weight:600;padding:6px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;text-decoration:none}
.linkbtn.primary{background:var(--accent);color:#fff}
.card{display:grid;grid-template-columns:240px 1fr;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:12px 16px}
.card .kick{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.card h3{margin:2px 0 4px}
.card p{margin:0 0 8px;font-size:14px}
.card .acts{display:flex;flex-wrap:wrap;gap:8px}
.others{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:700px){.card{grid-template-columns:1fr}.card img{height:180px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="crumb"><a href="index.html">AI Projects</a> › Problem type</div><h1 id="title"></h1>
<div class="bar"><nav id="toc"></nav><span class="gap"></span><a class="linkbtn" href="index.html">Home</a><a class="linkbtn primary" id="wa-link" target="_blank" rel="noopener">Discuss a project</a></div></div>

<p id="intro"></p>

<h2>Projects</h2>
<div id="cards"></div>

<h2>What These Projects Share</h2>
<ul id="common"></ul>

<h2 id="others-h">Other Problem Types</h2>
<div class="others" id="others"></div>

<footer id="foot"></footer></div>
<script src="site-data.js"></script>
<script>
// One template for every problem type: set TYPE and save as category-{type}.html.
const TYPE = "customer-service";
const S = window.SITE;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const t = S.types.find(x => x.id === TYPE);
const list = S.projects.filter(p => p.type === TYPE).sort((a,b) => b.added.localeCompare(a.added));
document.title = t.name + " Projects";
document.getElementById("title").textContent = t.name;
document.getElementById("intro").textContent = t.intro + " " + list.length + " project" + (list.length === 1 ? "" : "s") + " so far.";
document.getElementById("wa-link").href = S.whatsapp;
document.getElementById("cards").innerHTML = list.map(p => `<div class="card">
  <a href="${encodeURI(p.page)}"><img src="${encodeURI(p.cover)}" alt="${esc(p.title)} cover"></a>
  <div class="cb"><div class="kick">${esc(p.valueProposition)}</div><h3><a href="${encodeURI(p.page)}">${esc(p.title)}</a></h3>
  ${p.hero ? `<p>${esc(p.hero)}</p>` : `<p>${esc(p.tagline)}</p><p>${esc(p.problem)}</p>`}
  <div class="acts"><a class="linkbtn primary" href="${encodeURI(p.page)}">View project</a><a class="linkbtn" href="${p.demo}" target="_blank" rel="noopener">Live demo</a></div></div></div>`).join("");
document.getElementById("common").innerHTML = t.common.map(c => `<li>${esc(c)}</li>`).join("");
// Only problem types that have projects are listed (founder, 16 Oct); the section hides when there are none.
const others = S.types.filter(x => x.id !== TYPE && S.projects.some(p => p.type === x.id));
document.getElementById("others").innerHTML = others.map(x => {
  const n = S.projects.filter(p => p.type === x.id).length;
  return `<a class="linkbtn" href="category-${x.id}.html">${esc(x.name)} (${n})</a>`;
}).join("");
if (!others.length) { document.getElementById("others-h").remove(); document.getElementById("others").remove(); }
document.getElementById("foot").textContent = "© 2026 Lee Yih Ven · " + t.name + " Projects";
const toc = document.getElementById("toc");
document.querySelectorAll("h2").forEach((h,i) => { h.id = "s" + (i+1); h.textContent = (i+1) + ". " + h.textContent; const a = document.createElement("a"); a.href = "#" + h.id; a.textContent = h.textContent; toc.appendChild(a); });
</script></body>
</html>
