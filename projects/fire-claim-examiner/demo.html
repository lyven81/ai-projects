</td><td>13 June 2023. House inspected with the Insured; tenant's remaining belongings and the mail box inspected.</td></tr><tr><td>Cause and origin</td><td>Fire began at the double power socket behind the refrigerator in the kitchen; the socket and plug show arcing damage. Fire spread to the kitchen cabinets and up into the rear roof.</td></tr><tr><td>Reports relied on</td><td>Bomba report, 10 June 2023: fire of electrical origin at the kitchen socket, house found locked and empty. Police report at Melaka Tengah district police headquarters, 10 June 2023. Tenaga Nasional Berhad billing for the address: 312 kWh in March 2023, 61 kWh in April 2023, 9 kWh in May 2023. Water bills for the same months: 18, 6 and 0 cubic metres.</td></tr><tr><td>People interviewed</td><td>The Insured. The tenant, Encik Kamal Arif bin Zainal, by telephone on 14 June 2023 and in a signed statement on 20 June 2023: he moved to Johor Bahru for a new job on 15 April 2023, took most of his belongings, left the refrigerator running, and had not returned to the house since; he kept paying the rent and intended to end the tenancy at the end of June. Neighbours at Nos. 35 and 39: no one seen at the house since mid April; mail and flyers piling at the gate.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Let under a tenancy from 1 January 2023, but no one living in or attending the house from 15 April 2023 to the date of loss, 56 days. Verified against the tenant's signed statement, the electricity and water consumption, the uncollected mail and the neighbours' accounts.</td></tr><tr><td>Maintenance and prior defects</td><td>None reported to the Insured.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey intermediate terrace house let as a private dwelling, as scheduled, but unoccupied at the date of loss.</td></tr><tr><td>Damage found per item</td><td>Kitchen, rear roof and rear ceiling destroyed; wiring in the rear half burnt; smoke damage throughout. Landlord's kitchen cabinets and dining set destroyed; beds and wardrobes smoke damaged.</td></tr><tr><td>Discrepancies with the incident report</td><td>The Insured states the tenant was staying in the house at the time. The tenant confirms he had not lived there since 15 April 2023. The Insured was not aware of this: the rent continued to be paid and the tenant had not told her.</td></tr><tr><td>Irregularities</td><td>None found as to the amounts claimed.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>House repair: kitchen, rear roof, ceiling, wiring, doors, painting</td><td>Item 1 Building</td><td class=\"num\">85,000.00</td><td class=\"num\">79,000.00</td><td>Reinstatement; rates adjusted</td></tr><tr><td>2</td><td>Landlord's furniture: kitchen cabinets, dining set, beds, wardrobes</td><td>Item 2 Landlord's contents</td><td class=\"num\">12,000.00</td><td class=\"num\">11,000.00</td><td>Replacement, depreciation for age</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>97,000.00</b></td><td class=\"num\"><b>90,000.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">250,000.00</td><td class=\"num\">240,000.00</td></tr><tr><td>Item 2 Landlord's contents</td><td class=\"num\">20,000.00</td><td class=\"num\">15,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. The tenant's goods are not the Insured's property and are not claimed.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 90,000.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/ML/2023/002184</td></tr><tr><td>Insured</td><td>Lau Bee Choo (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 February 2023 to 31 January 2024</td></tr><tr><td>Risk address</td><td>37, Jalan MP 12, Taman Merdeka Permai, 75350 Melaka</td></tr><tr><td>Construction</td><td>Single-storey intermediate terrace house; brick walls, concrete floor, concrete tile roof on timber trusses</td></tr><tr><td>Occupation</td><td>Private dwelling, let to a tenant</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">250,000.00</td></tr><tr><td>2</td><td>Landlord's contents</td><td class=\"num\">20,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>270,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>None</td><td>No endorsements or clauses</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 2023-06-10 falls within the schedule period 2023-02-01 to 2024-01-31. FC815 and premium questions do not arise.</td><td>date_of_loss 2023-06-10 <span class=\"meta\">(Incident report, email of 10 June 2023; Adjuster's report, Investigation)</span><br>period 2023-02-01 to 2024-01-31 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Proximate cause is fire, a base insured peril. The electrical arcing is the origin of the fire, not a separate cause of damage. No intervening event. FP508A.01 and FP508B are not held and cannot override; FP508B would in any case cover electrical damage only where fire resulted.</td><td>Fire began at the double power socket behind the refrigerator; arcing damage; spread to cabinets and rear roof <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Intervening event: none <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote>Written claim delivered 2023-06-19, day 9 of 15. No written extension is needed. No fraud or false declaration: the adjuster found the Insured was unaware the tenant had left and found no irregularity in the amounts.</td><td>Written claim date 2023-06-19 <span class=\"meta\">(Incident report, email of 19 June 2023)</span><br>No fraud or false declaration; insured not aware tenant had left <span class=\"meta\">(Adjuster's report, Findings: Discrepancies with the incident report; Irregularities: none)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Fire is a base peril. No endorsement is needed and none is held. The schedule shows no endorsements or clauses.</td><td>Endorsements held: none <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>(b) If the building insured or containing the insured property becomes unoccupied and so remains for a period of more than thirty (30) days.<span class=\"cite\">Condition 9</span></blockquote>The tenant left on 2023-04-15 and no one lived in or attended the house until the loss on 2023-06-10, which is 56 days. That is over 30 days, and no sanction is endorsed on the policy, so the insurance ceased to attach under Condition 9(b). The other Condition 9 limbs were tested and passed: no change of occupation increasing risk (9(a)) and no passing of interest (9(d)). There is no warranty and no Condition 4 issue, as the building did not fall or get displaced by the fire. The claimant's account that the tenant was in occupation is not accepted; the adjuster's finding is applied.</td><td>Unoccupied 56 days, 2023-04-15 to 2023-06-10 <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss; tenant's signed statement of 20 June 2023; utility and mail evidence)</span><br>Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Sanctions endorsed under Condition 9)</span><br>Warranties: None <span class=\"meta\">(Schedule, Warranties)</span><br>Occupation: private dwelling let to a tenant, as scheduled; no change increasing risk <span class=\"meta\">(Adjuster's report, Findings, Risk as found against the schedule)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 5 failed. The adjuster's measurement is recorded in the but-for figure only: RM 79,000.00 building and RM 11,000.00 landlord's contents, total RM 90,000.00.</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>fire</p><p>Arcing at the double power socket behind the kitchen refrigerator (electrical origin per the Bomba report and the adjuster) set fire to the kitchen cabinets, then spread up into the rear roof.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>The Insured says the tenant was staying in the house at the time of the fire (incident report, 10 June and 19 June 2023).</td><td>The house was unoccupied from 15 April 2023 to the date of loss, 56 days. The tenant confirms he moved to Johor Bahru on 15 April 2023 and had not returned. The Insured was not aware: rent continued and the tenant had not told her.</td><td>Adjuster's finding: unoccupied for 56 days. Gate 5 fails on Condition 9(b).</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>Gate 5 is decided on the adjuster's occupancy finding. The Insured's account of tenant occupation is not accepted. The Insured's lack of knowledge does not alter the Condition 9(b) test on its face, since Condition 9 turns on the building's occupation, not the Insured's knowledge. The examiner may wish to confirm that position.</li><li>Adjuster's assessed figures were RM 90,000.00 before policy terms. The tenant's goods are not claimed and are not the Insured's property.</li></ul>\n<h3>Advice</h3><p>Gate 5 fails: the building was unoccupied for 56 days against the 30-day limit in Condition 9(b), and no sanction is endorsed. The fire itself is an insured peril, and the claim is in time and not fraudulent, so the outcome rests on Condition 9(b). Payable is nil. The but-for figure of RM 90,000.00 (RM 79,000.00 building and RM 11,000.00 landlord's contents, with no average or excess) is shown for reference only. The examiner decides.</p>\n<p class=\"meta\">Governing clause: Condition 9(b). The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 90,000.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  250,000.00  value    RM 240,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   20,000.00  value     RM 15,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 2]</code></td></tr><tr><td><code>     subtotal          RM    90,000.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM    90,000.00</code></td></tr><tr><td><code>  CLAIMED             RM    90,000.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM    90,000.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 12 tool calls: 5 searches of the policy, 5 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>\"electrical fault fire damage exclusion machine where fault began\"</td><td><code>ENDORSEMENT-FP508A.01</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP508B</code> informational <span class=\"meta\">(not held: cannot override)</span></td></tr>\n<tr><td>6</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-06-10</td><td class=\"meta\">Incident report, email of 10 June 2023; Adjuster's report, Investigation</td></tr><tr><td><code>period_start</code></td><td>2023-02-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-01-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 10 June 2023 falls inside 1 February 2023 to 31 January 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>7</td><td><code>check_gate</code></td><td>Gate 2, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>fire</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: fire began at the double power socket behind the refrigerator, arcing damage; spread to kitchen cabinets and rear roof</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: fire, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-06-10</td><td class=\"meta\">Incident report, email of 10 June 2023</td></tr><tr><td><code>written_claim_date</code></td><td>2023-06-19</td><td class=\"meta\">Incident report, claim email of 19 June 2023</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Schedule and file: no written extension of time on record</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: discrepancies with the incident report; Irregularities: none found as to the amounts claimed; Insured not aware tenant had left</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 19 June 2023, day 9 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>none</td><td class=\"meta\">Schedule, Endorsements and clauses: None</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. No endorsement is required for a base peril.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 5, 5 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Warranties: None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: single-storey house let as a private dwelling, as scheduled</td></tr><tr><td><code>unoccupied_days</code></td><td>56</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: no one living in or attending from 15 April 2023 to date of loss, 56 days</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Schedule and Adjuster's report: insured remains owner, no change of interest recorded</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>Condition 9(b)</b>. The building was unoccupied for more than thirty days, with no sanction of the Company endorsed on the policy.<span class=\"meta\"><br>Warranty pass; Condition 9(a) pass; Condition 9(b) fail; Condition 9(d) pass</span></td></tr>\n<tr><td>11</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>2 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 90,000.00<details><summary>Working</summary><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  250,000.00  value    RM 240,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   20,000.00  value     RM 15,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 2]</code></div><div><code>     subtotal          RM    90,000.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM    90,000.00</code></div><div><code>  CLAIMED             RM    90,000.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM    90,000.00</code></div></details></td></tr>\n<tr><td>12</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2023-07326": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Saturday, 12 August 2023</div><div class=\"msg out\">Mr Ong, assalamualaikum. Kitchen restoran saya terbakar just now 😭 Wok with oil caught fire during our afternoon break, my cook went to the back for a while. Bomba came, already put out<span class=\"t\">3:41 pm</span></div><div class=\"msg out\"><span class=\"att\">6 photos</span><span class=\"t\">3:42 pm</span></div><div class=\"msg in\"><span class=\"who\">Ong Chee Keong</span>Puan Siti, so sorry. Anyone hurt? Please don't clean up yet, take photos of everything first and keep the damaged things<span class=\"t\">3:58 pm</span></div><div class=\"msg out\">No one hurt alhamdulillah. Kitchen ceiling black, exhaust hood melted, stove and fryer finished. Some tables near the kitchen door also burnt<span class=\"t\">4:02 pm</span></div><div class=\"msg out\">My cash drawer at the back counter also burnt, inside got the takings from this morning. And my motorcycle parked at the back of kitchen also kena<span class=\"t\">4:05 pm</span></div><div class=\"msg in\"><span class=\"who\">Ong Chee Keong</span>Noted. I will inform the insurance company now. Please get the Bomba report and make a police report. Then send me the claim with the list and amounts, quotations and receipts<span class=\"t\">4:20 pm</span></div><div class=\"day\">Sunday, 13 August 2023</div><div class=\"msg in\"><span class=\"who\">Ong Chee Keong</span>Puan, I have notified the insurance company yesterday evening. Adjuster will call you<span class=\"t\">10:15 am</span></div><div class=\"msg out\">Ok thank you Mr Ong 🙏<span class=\"t\">10:20 am</span></div><div class=\"day\">Sunday, 20 August 2023</div><div class=\"msg out\">Mr Ong, here is my claim for the fire on 12 Aug<span class=\"t\">8:47 pm</span></div><div class=\"msg out\">1. Kitchen ceiling, wall tiles, exhaust hood and ducting RM 41,500<br>2. Gas stoves, fryer, chiller RM 26,500<br>3. Tables and chairs RM 9,800<br>4. Food stock in kitchen RM 2,600<br>5. Cash in drawer RM 3,400<br>6. My motorcycle Honda RS150 RM 5,200<br>7. Sales books and receipt books RM 800<br><b>Total RM 89,800</b><span class=\"t\">8:49 pm</span></div><div class=\"msg out\"><span class=\"att\">Bomba report 12 Aug.pdf</span> <span class=\"att\">Police report Batu Pahat 12 Aug.pdf</span> <span class=\"att\">Quotation renovation 18 Aug.pdf</span> <span class=\"att\">Kitchen equipment quotation.pdf</span> <span class=\"att\">Food stock receipts.pdf</span> <span class=\"att\">Motorcycle grant copy.pdf</span> <span class=\"att\">21 photos</span><span class=\"t\">8:51 pm</span></div><div class=\"msg out\">No other insurance for the restaurant. The motorcycle got its own motor insurance but only third party<span class=\"t\">8:52 pm</span></div><div class=\"msg in\"><span class=\"who\">Ong Chee Keong</span>Received Puan Siti. I will submit to the insurance company tomorrow morning<span class=\"t\">9:05 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Cahaya Adjusters Sdn Bhd</b> · Our ref CAS/BP/23/1187 · Report dated 4 September 2023 · Adjuster: Nadia binti Azman</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>15 August 2023. Ground floor restaurant kitchen, back counter and dining area nearest the kitchen inspected with the Insured.</td></tr><tr><td>Cause and origin</td><td>Fire started at the wok burner on the main gas stove: overheated cooking oil ignited while the burner was left unattended. Flames entered the exhaust hood and ducting and spread across the kitchen ceiling.</td></tr><tr><td>Reports relied on</td><td>Bomba report dated 12 August 2023: accidental kitchen fire from overheated cooking oil, extinguished by 3:30 pm. Police report at Batu Pahat district police headquarters, 12 August 2023.</td></tr><tr><td>People interviewed</td><td>The Insured. The cook, who left the burner on low heat to fetch supplies from the rear store for about ten minutes. The kitchen helper who called Bomba.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Restaurant trading daily, 7:00 am to 10:00 pm, with an afternoon break. Staff on the premises at the time of the fire.</td></tr><tr><td>Maintenance and prior defects</td><td>Exhaust hood cleaned in June 2023 per contractor receipt. Gas piping and regulator intact after the fire. No explosion occurred.</td></tr><tr><td>Risk as found against the schedule</td><td>Ground floor of a two-storey shophouse used as a restaurant, as scheduled. No change of trade or occupation.</td></tr><tr><td>Damage found per item</td><td>Kitchen ceiling, wall tiles, hood and ducting burnt; two stoves, fryer and chiller destroyed; six tables and 24 chairs near the kitchen door burnt or heat warped; kitchen food stock destroyed. Cash drawer charred with partly burnt notes inside. Motorcycle parked inside the rear kitchen door burnt. Sales and receipt books burnt.</td></tr><tr><td>Discrepancies with the incident report</td><td>Item 1 claimed at RM 41,500.00 included a hood upgrade from galvanised to stainless steel; the existing hood was stainless steel, so the difference is a pricing correction, not betterment. Assessed at RM 38,000.00.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Kitchen ceiling, wall tiles, exhaust hood and ducting</td><td>Item 1 Renovation and building</td><td class=\"num\">41,500.00</td><td class=\"num\">38,000.00</td><td>Reinstatement; hood priced at like-for-like stainless steel</td></tr><tr><td>2</td><td>Gas stoves (2), deep fryer, upright chiller</td><td>Item 2 Furniture, fittings and kitchen equipment</td><td class=\"num\">26,500.00</td><td class=\"num\">26,500.00</td><td>Replacement, supplier quotation checked</td></tr><tr><td>3</td><td>Tables (6) and chairs (24) near the kitchen</td><td>Item 2 Furniture, fittings and kitchen equipment</td><td class=\"num\">9,800.00</td><td class=\"num\">9,800.00</td><td>Replacement</td></tr><tr><td>4</td><td>Food stock in the kitchen</td><td>Item 3 Stock</td><td class=\"num\">2,600.00</td><td class=\"num\">2,600.00</td><td>Purchase receipts</td></tr><tr><td>5</td><td>Cash in the back counter drawer</td><td>None</td><td class=\"num\">3,400.00</td><td class=\"num\">3,400.00</td><td>Takings from the morning, per the Insured; charred notes recovered</td></tr><tr><td>6</td><td>Motorcycle, Honda RS150, parked in the rear kitchen</td><td>None</td><td class=\"num\">5,200.00</td><td class=\"num\">5,200.00</td><td>Market value of a 2019 model</td></tr><tr><td>7</td><td>Sales books and receipt books</td><td>None</td><td class=\"num\">800.00</td><td class=\"num\">800.00</td><td>Insured's estimate</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>89,800.00</b></td><td class=\"num\"><b>86,300.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Renovation and building</td><td class=\"num\">300,000.00</td><td class=\"num\">290,000.00</td></tr><tr><td>Item 2 Furniture, fittings and kitchen equipment</td><td class=\"num\">120,000.00</td><td class=\"num\">110,000.00</td></tr><tr><td>Item 3 Stock</td><td class=\"num\">15,000.00</td><td class=\"num\">12,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil. Scrap value of the stoves and chiller is offset by the cost of removal.</td></tr><tr><td>Other insurance and recovery</td><td>No other fire insurance. The motorcycle carries a separate third party only motor policy, which does not respond to fire damage to the motorcycle itself. No third-party recovery.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>Bank deposit records for the cash figure, if the insurer requires them.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 86,300.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/JH/2023/005218</td></tr><tr><td>Insured</td><td>Siti Khadijah binti Omar, trading as Restoran Selera Khadijah (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 May 2023 to 30 April 2024</td></tr><tr><td>Risk address</td><td>Ground floor, 14, Jalan Rahmat, 83000 Batu Pahat, Johor</td></tr><tr><td>Construction</td><td>Ground floor of a two-storey intermediate shophouse; brick walls, reinforced concrete slab, concrete tile roof</td></tr><tr><td>Occupation</td><td>Restaurant</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Renovation and building</td><td>300,000.00</td></tr><tr><td>2</td><td>Furniture, fittings and kitchen equipment</td><td>120,000.00</td></tr><tr><td>3</td><td>Stock</td><td>15,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>435,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not insured</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>None</td><td>No endorsements or clauses</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 2023-08-12 falls inside the period 1 May 2023 to 30 April 2024. FC815 and premium questions do not arise.</td><td>date_of_loss 2023-08-12 <span class=\"meta\">(Incident report, 12 August 2023 (WhatsApp 3:41 pm))</span><br>period 2023-05-01 to 2024-04-30 <span class=\"meta\">(Policy schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Proximate cause is fire, a base insured peril. The cook's unattended burner is the same chain of events, not a new independent intervening event, so intervening event is none. No explosion occurred.</td><td>proximate_cause fire; intervening_event none <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>No explosion; gas piping intact <span class=\"meta\">(Adjuster's report, Findings, Maintenance and prior defects)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Agent notified the insurer on the evening of 12 August. The written claim with the itemised list and attachments was sent on 20 August 2023, day 8 of 15. No extension was needed. The adjuster found no irregularities and no false declaration.</td><td>written_claim_date 2023-08-20 <span class=\"meta\">(Incident report, Sunday 20 August 2023 (8:47 pm))</span><br>Notice given 12 August evening <span class=\"meta\">(Incident report, Ong Chee Keong 13 August 10:15 am)</span><br>Irregularities: none found <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Fire is a base peril. No endorsement is needed and none is held. The schedule shows None.</td><td>Endorsements: None <span class=\"meta\">(Policy schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>Under any of the following circumstances the insurance ceases to attach as regards the property affected unless the Insured, before the occurrence of any loss or damage, obtains the sanction of the Company<span class=\"cite\">Condition 9</span></blockquote><blockquote>If the building insured or containing the insured property becomes unoccupied and so remains for a period of more than thirty (30) days.<span class=\"cite\">Condition 9</span></blockquote>No warranties. The restaurant traded daily with no change of trade or occupation, no unoccupancy, and no passing of interest. No Condition 9 sanction is needed. Condition 4 does not apply because the building did not fall or get displaced.</td><td>Warranties: None <span class=\"meta\">(Policy schedule, Terms)</span><br>Trading daily, staff present; no change of trade or occupation <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss and Risk as found)</span><br>Sanctions endorsed under Condition 9: None <span class=\"meta\">(Policy schedule)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>Securities, obligations, or documents of any kind, stamps, coins or paper money, cheques, books of account or other business books, or computer systems records.<span class=\"cite\">Condition 8</span></blockquote>Four items are admitted: ref 1 (RM 38,000, item 1), ref 2 (RM 26,500, item 2), ref 3 (RM 9,800, item 2) and ref 4 (RM 2,600, item 3). Ref 5 cash RM 3,400 is excluded as money under Condition 8(e). Ref 7 sales and receipt books RM 800 are excluded as business books under Condition 8(e). Ref 6 motorcycle RM 5,200 is not property insured under the schedule, because the schedule has no item for it and the motorcycle belonged to the insured's private motor policy, not this policy. The schedule also records money and cash as not insured.</td><td>Assessed amounts per item <span class=\"meta\">(Adjuster's report, Measurement table)</span><br>Item 1 hood priced like-for-like stainless steel, assessed 38,000 <span class=\"meta\">(Adjuster's report, Findings, Discrepancies with the incident report)</span><br>Money and cash: Not insured <span class=\"meta\">(Policy schedule, Sums insured)</span><br>Motorcycle has own third party only motor policy <span class=\"meta\">(Adjuster's report, Other insurance and recovery)</span></td></tr></table>\n<h3>Proximate cause</h3><p>fire</p><p>Overheated cooking oil in a wok on the main gas stove ignited while the burner was left unattended by the cook (about ten minutes, low heat). Flames entered the exhaust hood and ducting and spread across the kitchen ceiling.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Item 1 kitchen ceiling, tiles, hood and ducting claimed at RM 41,500, including a hood upgrade from galvanised to stainless steel.</td><td>The existing hood was already stainless steel, so the difference is a pricing correction, not betterment. Assessed at RM 38,000.</td><td>RM 38,000.00 (adjuster's finding)</td></tr><tr><td>Cash in the drawer RM 3,400 is takings from this morning; the claimant says the drawer was burnt.</td><td>Cash figure per the Insured's account only; notes partly charred and recovered. Bank deposit records are outstanding if the insurer requires them.</td><td>Cash excluded under Condition 8(e) and money not insured under the schedule, so the adjuster's figure is not payable in any event.</td></tr><tr><td>Motorcycle parked at the back of the kitchen.</td><td>Motorcycle parked inside the rear kitchen door, burnt.</td><td>Adjuster's position accepted; not property insured under this policy, so excluded.</td></tr></table>\n<h3>Advice</h3><p>The claim passes all six gates. Fire is the insured peril, the claim was made in time, and no endorsement is needed. Four items totalling RM 76,900.00 are admitted: the building item at RM 38,000 (the hood is priced at like-for-like stainless steel), kitchen equipment RM 26,500 and RM 9,800, and stock RM 2,600. Cash RM 3,400 and sales books RM 800 are excluded under Condition 8(e), and the motorcycle RM 5,200 is not property insured under this policy. The examiner decides the final payment.</p>\n<p class=\"meta\">Governing clause: Operative clause (fire is the insured peril). Items excluded under Condition 8(e). Condition 9 not engaged. Condition 20 average not applied (factor 1.0 on all items).. The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 76,900.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 5  RM     3,400.00  EXCLUDED by Condition 8(e)  (Cash in the back counter drawer)</code></td></tr><tr><td><code>  ref 6  RM     5,200.00  EXCLUDED by Operative clause (Property Insured described in the Schedule)  (Motorcycle, Honda RS150, parked in the rear )</code></td></tr><tr><td><code>  ref 7  RM       800.00  EXCLUDED by Condition 8(e)  (Sales books and receipt books)</code></td></tr><tr><td><code>  excluded total       RM     9,400.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  300,000.00  value    RM 290,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM  120,000.00  value    RM 110,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM   15,000.00  value     RM 12,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 2, 3, 4]</code></td></tr><tr><td><code>     subtotal          RM    76,900.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM    76,900.00</code></td></tr><tr><td><code>  CLAIMED             RM    86,300.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    76,900.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 14 tool calls: 6 searches of the policy, 6 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>7</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-08-12</td><td class=\"meta\">Incident report, Saturday 12 August 2023 (WhatsApp 3:41 pm)</td></tr><tr><td><code>period_start</code></td><td>2023-05-01</td><td class=\"meta\">Policy schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-04-30</td><td class=\"meta\">Policy schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 12 August 2023 falls inside 1 May 2023 to 30 April 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 2, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>fire</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: overheated cooking oil at the wok burner ignited and flames spread</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: cook left burner on low heat for about ten minutes; no separate event. No explosion (Findings, Maintenance and prior defects)</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: fire, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-08-12</td><td class=\"meta\">Incident report, 12 August 2023</td></tr><tr><td><code>written_claim_date</code></td><td>2023-08-20</td><td class=\"meta\">Incident report, Sunday 20 August 2023 (8:47 pm claim list and attachments)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report and adjuster's report: no extension given in writing</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 20 August 2023, day 8 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>none</td><td class=\"meta\">Policy schedule, Endorsements and clauses: None</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. No endorsement is required for a base peril.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 5, 5 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Policy schedule, Terms: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Risk as found against the schedule: no change of trade or occupation</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: trading daily</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Incident report and adjuster's report: Insured continues to trade; no transfer of interest recorded</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Policy schedule, Sanctions endorsed under Condition 9: None; no change requiring sanction</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 9</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>7 items</td><td class=\"meta\">Adjuster's report, Measurement table</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. 4 of 7 items admitted.<span class=\"meta\"><br>ref 1 admitted; ref 2 admitted; ref 3 admitted; ref 4 admitted; ref 5 excluded (Condition 8(e)); ref 6 excluded (Operative clause (Property Insured described in the Schedule)); ref 7 excluded (Condition 8(e))</span></td></tr>\n<tr><td>13</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>7 items, sums insured and values at risk</td><td><span class=\"chip ok\">Payable</span> RM 76,900.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 5  RM     3,400.00  EXCLUDED by Condition 8(e)  (Cash in the back counter drawer)</code></div><div><code>  ref 6  RM     5,200.00  EXCLUDED by Operative clause (Property Insured described in the Schedule)  (Motorcycle, Honda RS150, parked in the rear )</code></div><div><code>  ref 7  RM       800.00  EXCLUDED by Condition 8(e)  (Sales books and receipt books)</code></div><div><code>  excluded total       RM     9,400.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  300,000.00  value    RM 290,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM  120,000.00  value    RM 110,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM   15,000.00  value     RM 12,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 2, 3, 4]</code></div><div><code>     subtotal          RM    76,900.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM    76,900.00</code></div><div><code>  CLAIMED             RM    86,300.00</code></div><div><code>  RECOMMENDED PAYABLE RM    76,900.00</code></div></details></td></tr>\n<tr><td>14</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-01385": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Saturday, 27 January 2024</div><div class=\"msg out\">Puan Sharmila, my warehouse at Kawasan Perindustrian Sungai Puloh is on fire right now. Bomba already here, 4 fire engines. Very big smoke<span class=\"t\">11:58 pm</span></div><div class=\"msg out\"><span class=\"att\">3 photos</span> <span class=\"att\">1 video</span><span class=\"t\">11:59 pm</span></div><div class=\"day\">Sunday, 28 January 2024</div><div class=\"msg in\"><span class=\"who\">Sharmila a/p Devan</span>Encik Latif, I just saw your message. Is everyone safe? Is the fire out?<span class=\"t\">7:10 am</span></div><div class=\"msg out\">Safe, nobody inside at night. Bomba finished at about 3 am. Half of the roof collapsed. Most of my garment stock in cartons burnt or wet from the water<span class=\"t\">7:22 am</span></div><div class=\"msg out\">Fire started from the back side, the part I rent out to the other company. They keep their things there<span class=\"t\">7:24 am</span></div><div class=\"msg in\"><span class=\"who\">Sharmila a/p Devan</span>Ok. I will notify the insurance company this morning. Please get the Bomba report and police report. Send me your claim with the list, amounts and quotations<span class=\"t\">8:05 am</span></div><div class=\"msg in\"><span class=\"who\">Sharmila a/p Devan</span>Encik Latif, insurance company notified. Adjuster will contact you<span class=\"t\">10:40 am</span></div><div class=\"day\">Friday, 2 February 2024</div><div class=\"msg out\">Puan Sharmila, here is my claim<span class=\"t\">4:16 pm</span></div><div class=\"msg out\">1. Warehouse building: roof, steel trusses, walls, wiring RM 180,000<br>2. Garment stock in cartons RM 65,000<br><b>Total RM 245,000</b><span class=\"t\">4:18 pm</span></div><div class=\"msg out\"><span class=\"att\">Bomba report 28 Jan.pdf</span> <span class=\"att\">Police report Klang 28 Jan.pdf</span> <span class=\"att\">Contractor quotation 1 Feb.pdf</span> <span class=\"att\">Stock list Jan 2024.pdf</span> <span class=\"att\">30 photos</span><span class=\"t\">4:19 pm</span></div><div class=\"msg out\">No other insurance for my warehouse<span class=\"t\">4:20 pm</span></div><div class=\"msg in\"><span class=\"who\">Sharmila a/p Devan</span>Received, I will submit to the insurance company<span class=\"t\">4:35 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Bayu Loss Adjusters Sdn Bhd</b> · Our ref BLA/SL/24/0094 · Report dated 23 February 2024 · Adjuster: Chan Kok Leong</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>30 January 2024, after Bomba released the site. Whole warehouse inspected with the Insured; the rear bay inspected with the sub-tenant's supervisor.</td></tr><tr><td>Cause and origin</td><td>Fire began at an electrically driven tyre shredding machine in the rear bay, which was in use until about 9:00 pm. Smouldering rubber crumb at the discharge chute ignited the stockpile of used tyres around it. The fire spread through the rear bay and roof into the front bay where the Insured's garment stock was held.</td></tr><tr><td>Reports relied on</td><td>Bomba fire investigation report, 28 January 2024: fire originated at the tyre shredder in the rear bay; heavy fire load from about 3,000 used tyres and rubber crumb. Police report at Klang district police headquarters, 28 January 2024. Sublease agreement between the Insured and Rubber Kitar Enterprise dated 1 September 2023, produced by the Insured. Klang municipal council business licence record for Rubber Kitar Enterprise at the risk address, issued October 2023, activity: recycling of used tyres.</td></tr><tr><td>People interviewed</td><td>The Insured. The supervisor of Rubber Kitar Enterprise, who confirmed shredding operations in the rear bay from October 2023, five days a week. Two neighbouring occupiers.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Front bay used by the Insured for storage of finished garments. Rear bay, about half the floor area, occupied since September 2023 by the sub-tenant for storing used tyres and shredding them into rubber crumb. The two bays are under one roof with no fire wall between them.</td></tr><tr><td>Maintenance and prior defects</td><td>No fire detection installed in the rear bay. Rubber crumb accumulated around the shredder.</td></tr><tr><td>Risk as found against the schedule</td><td>Scheduled as a warehouse for the storage of finished garments. Found partly used for tyre storage and mechanical shredding of tyres from September and October 2023, about four months before the loss. No endorsement on the policy records this use.</td></tr><tr><td>Damage found per item</td><td>Roof sheets and trusses collapsed over the rear bay and two-thirds of the front bay; walls spalled; wiring destroyed. Garment cartons in the front bay burnt or soaked by fire-fighting water; cartons nearest the front door salvageable.</td></tr><tr><td>Discrepancies with the incident report</td><td>The Insured describes the rear bay as rented to 'the other company' to 'keep their things'. The sub-tenant operated a tyre shredding process there, not storage only.</td></tr><tr><td>Irregularities</td><td>None found as to the amounts claimed. The Insured signed the sublease and received rent from September 2023.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Warehouse building: roof sheets, steel trusses, walls, wiring</td><td>Item 1 Building</td><td class=\"num\">180,000.00</td><td class=\"num\">172,000.00</td><td>Reinstatement; rates adjusted</td></tr><tr><td>2</td><td>Finished garment stock in cartons</td><td>Item 2 Stock in trade</td><td class=\"num\">65,000.00</td><td class=\"num\">61,000.00</td><td>Cost price per stock records; cartons in the front bay salvageable</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>245,000.00</b></td><td class=\"num\"><b>233,000.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">900,000.00</td><td class=\"num\">850,000.00</td></tr><tr><td>Item 2 Stock in trade</td><td class=\"num\">300,000.00</td><td class=\"num\">260,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Front bay cartons sold to a salvage buyer for RM 4,000.00, deducted from ref 2.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared by the Insured. The sub-tenant holds no insurance on the premises. Possible recovery from the sub-tenant under the sublease, not pursued at the date of this report.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 233,000.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/SL/2023/009612</td></tr><tr><td>Insured</td><td>Abdul Latif bin Ismail, trading as Syarikat Teguh Tekstil (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 July 2023 to 30 June 2024</td></tr><tr><td>Risk address</td><td>Lot 3112, Jalan Sungai Puloh 7, Kawasan Perindustrian Sungai Puloh, 42100 Klang, Selangor</td></tr><tr><td>Construction</td><td>Single-storey detached warehouse; steel portal frame, brick walls, metal deck roof, concrete floor</td></tr><tr><td>Occupation</td><td>Warehouse for the storage of finished garments</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">900,000.00</td></tr><tr><td>2</td><td>Stock in trade</td><td class=\"num\">300,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>1,200,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>None</td><td>No endorsements or clauses</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 27 January 2024 falls inside the period 1 July 2023 to 30 June 2024. FC815 and receipt questions do not arise.</td><td>date_of_loss 2024-01-27 <span class=\"meta\">(Incident report, Saturday 27 January 2024)</span><br>period 2023-07-01 to 2024-06-30 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Proximate cause is fire, a base insured peril. No intervening event: the fire started at the shredder and spread from the rear bay. The electrical machine is not treated as an independent cause; the adjuster found a smouldering rubber crumb ignition, not an electrical fault.</td><td>proximate cause fire; no intervening event <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>If the claim be in any respect fraudulent, or if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim sent 2 February 2024, day 6 of the 15 days. No written extension is needed. The adjuster found no irregularity as to the amounts claimed.</td><td>written claim 2024-02-02 <span class=\"meta\">(Incident report, Friday 2 February 2024)</span><br>no fraud or false declaration; no irregularity as to amounts <span class=\"meta\">(Adjuster's report, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Fire is a base peril. No endorsement is required and none is held. The schedule records no endorsements.</td><td>endorsements held: none <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>(a) If the trade or manufacture carried on be altered, or if the nature of the occupation of or other circumstances affecting the building insured or containing the insured property be changed in such a way as to increase the risk of loss or damage by fire.<span class=\"cite\">Condition 9</span></blockquote><blockquote>PROVIDED that such fall or displacement is not caused by fire, loss or damage by which is covered by this Policy<span class=\"cite\">Condition 4</span></blockquote>The schedule describes the occupation as a warehouse for finished garments. From September 2023 the rear bay (about half the floor area) was let to a sub-tenant who stored used tyres and ran a mechanical tyre shredder, with shredding from October 2023 (business licence for recycling of used tyres). Four months before the loss, with no fire detection and rubber crumb accumulating at the machine, this increased the fire risk. No sanction is endorsed (Schedule: Sanctions endorsed under Condition 9: None). Condition 9(a) therefore fails and the insurance ceases as regards the property affected. Condition 9(b) (unoccupied), 9(d) (interest passed) and Condition 4 (collapse caused by fire, so the proviso applies) do not bite. Warranties: none. Gate 6 not reached.</td><td>occupation changed: rear bay used for tyre storage and shredding from Sept/Oct 2023 <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss and Risk as found against the schedule)</span><br>sub-tenant's tyre shredding confirmed by supervisor; licence activity recycling of used tyres <span class=\"meta\">(Adjuster's report, Investigation, Reports relied on and People interviewed)</span><br>no sanction endorsed under Condition 9 <span class=\"meta\">(Schedule, Sanctions endorsed under Condition 9: None)</span><br>no warranties <span class=\"meta\">(Schedule, Warranties: None)</span><br>unoccupied days 0; no change of interest <span class=\"meta\">(Adjuster's report, Findings; Incident report)</span><br>roof collapse caused by fire <span class=\"meta\">(Adjuster's report, Cause and origin and Damage found per item)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because Gate 5 failed. The adjuster's measurement (RM 172,000 building; RM 61,000 stock net of RM 4,000 salvage) is noted for the examiner only.</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>fire</p><p>Smouldering rubber crumb at the discharge chute of the electrically driven tyre shredder in the rear bay ignited the surrounding stockpile of used tyres; fire spread through the rear bay and roof into the front bay (Adjuster's report, Cause and origin; Bomba report 28 January 2024).</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Incident report: the rear bay was rented to 'the other company' to 'keep their things' there, i.e. storage only; the fire started in the part rented out.</td><td>Adjuster's report, Discrepancies: the sub-tenant operated a tyre shredding process there, not storage only, from October 2023, with the supervisor's confirmation and the licence record. The Insured signed the sublease dated 1 September 2023.</td><td>Adjuster's finding applied: the rear bay was used for tyre storage and mechanical shredding, which changed the occupation of the risk without sanction.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>Scheduled occupation is storage of finished garments; the adjuster found the rear bay used for tyre storage and shredding from September/October 2023, about four months before the loss. No endorsement records this use. Condition 9(a) applies.</li><li>Possible recovery from the sub-tenant under the sublease is noted by the adjuster and not pursued. This is for the examiner and does not affect the gate result.</li><li>The adjuster's assessed amounts were used. Gate 6 was not reached, so no item-by-item classing was tested at a gate.</li></ul>\n<h3>Advice</h3><p>The loss is by fire within the period and the claim was made in time, but Condition 9(a) fails at Gate 5. The rear bay was used for tyre storage and mechanical shredding from September/October 2023, against a schedule for garment storage, and no sanction was endorsed. On the adjuster's assessed amounts the but-for figure is RM 233,000.00, but the policy would pay nil on this ground. The examiner decides whether the Condition 9(a) position is maintained, and should also consider the recovery against the sub-tenant.</p>\n<p class=\"meta\">Governing clause: Condition 9(a). The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 233,000.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  900,000.00  value    RM 850,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM  300,000.00  value    RM 260,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 2]</code></td></tr><tr><td><code>     subtotal          RM   233,000.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM   233,000.00</code></td></tr><tr><td><code>  CLAIMED             RM   233,000.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM   233,000.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 14 tool calls: 7 searches of the policy, 5 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>7</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-01-27</td><td class=\"meta\">Incident report, Saturday 27 January 2024</td></tr><tr><td><code>period_start</code></td><td>2023-07-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-06-30</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 27 January 2024 falls inside 1 July 2023 to 30 June 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>search_policy</code></td><td>code \"Condition 4\"</td><td><code>CONDITION-4</code> primary</td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 2, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>fire</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (smouldering rubber crumb ignited stockpile; spread through rear bay and roof)</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin; Bomba report 28 January 2024</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: fire, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-01-27</td><td class=\"meta\">Incident report, Saturday 27 January 2024</td></tr><tr><td><code>written_claim_date</code></td><td>2024-02-02</td><td class=\"meta\">Incident report, Friday 2 February 2024 (claim list sent 4:16 pm)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Schedule and file: no written extension recorded</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Irregularities: none found as to the amounts claimed</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 2 February 2024, day 6 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>none</td><td class=\"meta\">Schedule, Endorsements and clauses: None</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. No endorsement is required for a base peril.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 5, 8 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>True</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss and Risk as found against the schedule (rear bay used for tyre storage and shredding since September/October 2023; scheduled as garment storage)</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Schedule and adjuster's report: no change of interest recorded</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr><tr><td><code>fall_or_displacement</code></td><td>True</td><td class=\"meta\">Adjuster's report, Findings, Damage found per item: roof sheets and trusses collapsed</td></tr><tr><td><code>displacement_caused_by_insured_peril</code></td><td>True</td><td class=\"meta\">Adjuster's report, Cause and origin: collapse resulted from the fire</td></tr><tr><td><code>displaced_part_isolated</code></td><td>False</td><td class=\"meta\">Adjuster's report, Damage found per item: collapse over rear bay and two-thirds of front bay</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>Condition 9(a)</b>. The trade or occupation changed in a way that increased the risk of fire, with no sanction of the Company endorsed on the policy.<span class=\"meta\"><br>Warranty pass; Condition 9(a) fail; Condition 9(b) pass; Condition 9(d) pass; Condition 4 pass</span></td></tr>\n<tr><td>13</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>2 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 233,000.00<details><summary>Working</summary><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  900,000.00  value    RM 850,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM  300,000.00  value    RM 260,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 2]</code></div><div><code>     subtotal          RM   233,000.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM   233,000.00</code></div><div><code>  CLAIMED             RM   233,000.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM   233,000.00</code></div></details></td></tr>\n<tr><td>14</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-03187": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Nurul Ain Mohd Faizal &lt;[redacted]&gt;<br><b>To:</b> Rosnah Hamid &lt;[redacted]&gt;<br><b>Date:</b> Sunday, 15 September 2024, 8:20 am<br><b>Subject:</b> Fire at the bakery, 12 Jalan Badlishah</div><p>Dear Puan Rosnah,</p>\n<p>I am Nurul Ain, daughter of Encik Mohd Faizal bin Abdul Rahman. I manage his bakery at 12, Jalan Badlishah, Sungai Petani. Early yesterday morning, 14 September, there was a fire in the bakery. Sorry I am only writing now, yesterday the whole day was with Bomba and the clean-up.</p>\n<p>We closed at about 10 pm on Friday after the evening production run and all the staff left by 10.30 pm. Nobody stays upstairs; it is only our store and office.</p>\n<p>At about 1.40 am a passer-by saw smoke coming from the shopfront and called Bomba. They came at 1.58 am and the fire was out by 3.12 am. Bomba said it started at the spiral dough mixer against the back wall of the production area, maybe electrical. From there it spread to the timber shelves and the packaging, then across the production area. The deck oven, the proofer and the two stainless steel worktables are damaged, and part of the ceiling downstairs is burnt through. Soot everywhere downstairs and on the lower staircase; upstairs only smoke stains. All the flour, sugar, butter, fillings and packaging are spoilt.</p>\n<p>Nobody was hurt. My father asked me to handle this for him. Please inform the insurance company.</p>\n<p>Thank you,<br>Nurul Ain binti Mohd Faizal<br>Tel: [redacted]</p>\n<p><b>Attachments:</b> 9 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Rosnah Hamid &lt;[redacted]&gt;<br><b>To:</b> Nurul Ain Mohd Faizal &lt;[redacted]&gt;<br><b>Date:</b> Sunday, 15 September 2024, 10:45 am<br><b>Subject:</b> Re: Fire at the bakery, 12 Jalan Badlishah</div><p>Dear Cik Nurul Ain,</p>\n<p>So sorry to hear this. I have notified the insurance company this morning. Please keep the mixer and the other damaged machines for the adjuster. Since the policy is in your father's name, please get a letter of authorisation signed by him. Then send me the written claim with the list, amounts and quotations, together with the Bomba report.</p>\n<p>Regards,<b
