schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 15 tool calls: 7 searches of the policy, 6 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP512B\"</td><td><code>ENDORSEMENT-FP512B</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-09-08</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2024-04-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2025-03-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 8 September 2024 falls inside 1 April 2024 to 31 March 2025.<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>riot</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin; Police statement to the press</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>endorsements_held</code></td><td>FP512B</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP512A or FP512B</b>. Proximate cause: riot. Not a base peril; FP512A or FP512B brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary> act</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses (Warranties: None)</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss (restaurant trading)</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Schedule, Occupation (tenant's interest; no change reported)</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr><tr><td><code>popular_rising_or_terrorism</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: police describe a fight between supporters, no political or other organised motive</td></tr><tr><td><code>in_course_of_housebreaking_or_theft</code></td><td>True</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: cash removed from till during the commotion, seen on CCTV</td></tr><tr><td><code>fall_or_displacement</code></td><td>False</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (no collapse or displacement)</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP512B</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>FP512B Special Condition 6 pass; Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>6 items</td><td class=\"meta\">Adjuster's report, Measurem governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2025-03362": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Sunday, 9 March 2025</div><div class=\"msg out\">Ms Yong, we just came back from Kuala Lumpur and found my house broken into. The front grille and door forced open, my TV smashed on the floor, wardrobe mirror broken, and they sprayed paint on the living room wall 😡<span class=\"t\">9:47 pm</span></div><div class=\"msg out\"><span class=\"att\">8 photos</span><span class=\"t\">9:48 pm</span></div><div class=\"msg out\">They also took my wife's gold jewellery and some cash in the drawer. Already called police, they are coming<span class=\"t\">9:50 pm</span></div><div class=\"msg in\"><span class=\"who\">Yong Siew Peng</span>Shahrul, so sorry. Is your family ok? Don't touch anything until the police finish. Make the police report and keep a copy. I will notify the insurance company first thing tomorrow<span class=\"t\">10:15 pm</span></div><div class=\"day\">Monday, 10 March 2025</div><div class=\"msg in\"><span class=\"who\">Yong Siew Peng</span>Shahrul, I have notified the insurance company. Send me the written claim with the list and amounts, the police report and quotations<span class=\"t\">9:10 am</span></div><div class=\"msg out\">Ok. Police said they came in through the front Saturday night, the neighbour heard noise around 2 am<span class=\"t\">9:25 am</span></div><div class=\"day\">Sunday, 16 March 2025</div><div class=\"msg out\">Ms Yong, claim for the vandalism at my house<span class=\"t\">8:30 pm</span></div><div class=\"msg out\">1. Front grille and main door RM 3,800<br>2. Repaint living room walls (spray paint) RM 1,600<br>3. TV 65 inch RM 2,900<br>4. Wardrobe mirror doors RM 1,200<br>5. Gold jewellery stolen RM 6,500<br>6. Cash stolen RM 800<br><b>Total RM 16,800</b><span class=\"t\">8:32 pm</span></div><div class=\"msg out\"><span class=\"att\">Police report Sitiawan 9 Mar.pdf</span> <span class=\"att\">Grille and door quotation.pdf</span> <span class=\"att\">Painting quotation.pdf</span> <span class=\"att\">TV receipt.pdf</span> <span class=\"att\">Jewellery receipts.pdf</span> <span class=\"att\">15 photos</span><span class=\"t\">8:33 pm</span></div><div class=\"msg out\">My policy has the malicious damage cover right? This is vandalism. No other insurance<span class=\"t\">8:34 pm</span></div><div class=\"msg in\"><span class=\"who\">Yong Siew Peng</span>Received Shahrul. I will submit everything to the insurance company tomorrow<span class=\"t\">8:50 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Seri Adjusters Sdn Bhd</b> · Our ref SAS/PK/25/0219 · Report dated 31 March 2025 · Adjuster: Thinesh a/l Rajan</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>12 March 2025. House inspected with the Insured; front grille, door, living room, master bedroom inspected.</td></tr><tr><td>Cause and origin</td><td>Entry by night through the front: the grille padlock hasp was cut and the main door lock forced with a lever. Inside, the intruders searched the master bedroom, broke the wardrobe mirror doors, took jewellery from a drawer and cash from the dressing table, threw the television to the floor and sprayed paint on the living room wall before leaving.</td></tr><tr><td>Reports relied on</td><td>Police report lodged by the Insured at Sitiawan district police headquarters, 9 March 2025: house broken into by night and property stolen; investigation opened as housebreaking by night and theft. Police forensic attendance, 9 March 2025: tool marks on the grille and door lock.</td></tr><tr><td>People interviewed</td><td>The Insured and his wife. The neighbour at No. 16, who heard banging at about 2:00 am on 9 March 2025 but did not look out.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Family home. The Insured and his family were away from the evening of Friday 7 March to the evening of Sunday 9 March 2025.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey intermediate terrace house used as a private dwelling, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Grille hasp cut and main door lock and frame damaged by forcing; wardrobe mirror doors broken; television screen smashed; spray paint on one living room wall. Jewellery and cash missing.</td></tr><tr><td>Discrepancies with the incident report</td><td>The Insured describes the event as vandalism. The physical evidence and the police report show a housebreaking, with the damage done by the intruders in the course of it.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Front grille and main door, forced</td><td>Item 1 Building</td><td class=\"num\">3,800.00</td><td class=\"num\">3,800.00</td><td>Replacement, quotation checked</td></tr><tr><td>2</td><td>Repainting living room walls marked with spray paint</td><td>Item 1 Building</td><td class=\"num\">1,600.00</td><td class=\"num\">1,600.00</td><td>Quotation checked</td></tr><tr><td>3</td><td>65 inch television, smashed</td><td>Item 2 Household contents</td><td class=\"num\">2,900.00</td><td class=\"num\">2,900.00</td><td>Replacement, receipt seen</td></tr><tr><td>4</td><td>Wardrobe mirror doors, broken</td><td>Item 2 Household contents</td><td class=\"num\">1,200.00</td><td class=\"num\">1,200.00</td><td>Replacement</td></tr><tr><td>5</td><td>Gold jewellery, stolen</td><td>Item 2 Household contents</td><td class=\"num\">6,500.00</td><td class=\"num\">6,500.00</td><td>Receipts seen</td></tr><tr><td>6</td><td>Cash, stolen</td><td>None</td><td class=\"num\">800.00</td><td class=\"num\">800.00</td><td>Insured's statement</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>16,800.00</b></td><td class=\"num\"><b>16,800.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">300,000.00</td><td class=\"num\">290,000.00</td></tr><tr><td>Item 2 Household contents</td><td class=\"num\">60,000.00</td><td class=\"num\">50,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found; no householder's burglary policy in force. No recovery: no suspect identified at the date of this report.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 16,800.00 as claimed, before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PK/2025/000611</td></tr><tr><td>Insured</td><td>Mohd Shahrul bin Ibrahim (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 January 2025 to 31 December 2025</td></tr><tr><td>Risk address</td><td>14, Jalan Taman Sitiawan Jaya 3, 32000 Sitiawan, Perak</td></tr><tr><td>Construction</td><td>Single-storey intermediate terrace house; brick walls, concrete floor, concrete tile roof</td></tr><tr><td>Occupation</td><td>Private dwelling</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td>300,000.00</td></tr><tr><td>2</td><td>Household contents</td><td>60,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>360,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not insured</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP512A</td><td>Riot Strike and Malicious Damage, Residential Properties</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 9 March 2025 falls within the period 1 January 2025 to 31 December 2025. FC815 and receipt questions do not arise.</td><td>Date of loss 2025-03-09 <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin; Incident report, Sunday 9 March 2025)</span><br>Period 2025-01-01 to 2025-12-31 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote><blockquote>nor for any loss or damage arising out of or in the course of burglary, housebreaking, theft or larceny or any attempt thereat or caused by any person taking part therein<span class=\"cite\">FP512A: Riot Strike And Malicious Damage - Residential Properties</span></blockquote>The proximate cause is burglary or housebreaking with theft. The base cover responds only to fire or lightning. FP512A (held) extends to malicious damage but expressly excludes loss arising out of or in the course of burglary, housebreaking or theft. Theft is insured nowhere in the policy. The damage to the door, grille, television, mirror doors and walls was done by the intruders during the housebreaking, so it is not malicious damage independent of the burglary. The chain stops here; gates 3 to 6 are not reached.</td><td>Proximate cause: burglary or housebreaking by night with theft; no intervening event <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin and Reports relied on (police report: house broken into by night and property stolen))</span><br>Endorsements held: FP512A only; no warranties; no Condition 9 sanctions <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Insured's description of the event as vandalism is not accepted; the physical evidence shows housebreaking <span class=\"meta\">(Adjuster's report, Findings, Discrepancies with the incident report)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain failed at gate 2. For the record only: the written claim (16 March 2025) was within 15 days of the loss (9 March 2025), and no false declaration was found.</td><td></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain failed at gate 2.</td><td></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain failed at gate 2.</td><td></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain failed at gate 2. For the record only: cash is not insured under the schedule (Money and cash: Not insured) and Condition 8(e) excludes coins and paper money.</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>burglary_or_theft (housebreaking by night, with malicious damage done by the intruders in the course of it)</p><p>Night entry through the front grille and main door by forcing (grille hasp cut, main door lock forced with a lever); intruders searched the master bedroom, took jewellery and cash, broke the wardrobe mirror doors, threw the television to the floor and sprayed paint on the living room wall.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Incident report, 16 March 2025: claim for the vandalism at my house; the insured says this is vandalism and that the malicious damage cover applies.</td><td>Adjuster's report, Findings: the physical evidence and the police report show a housebreaking, with the damage done by the intruders in the course of it.</td><td>Adjuster's finding applied: housebreaking and theft, not vandalism.</td></tr></table>\n<h3>Advice</h3><p>Recommend declining on gate 2: the loss arose from a housebreaking with theft, which is not an insured peril under the base cover (fire or lightning) or under the held endorsement FP512A, whose malicious damage extension expressly excludes loss arising out of burglary, housebreaking or theft. The check returned peril_not_insured on the ground that theft is insured nowhere in the wording and the damage was done by intruders in the course of the burglary. Because there is no cover to price, the calculation returns not priced and no but-for figure is given; the adjuster's RM 16,800.00 is not payable on this wording. The examiner decides, and should confirm the adjuster's housebreaking finding against the police report before communicating the decision.</p>\n<p class=\"meta\">Governing clause: peril_not_insured. The claims examiner decides.</p>\n<h3>Figure</h3><p>Not priced. The proximate cause is insured nowhere in the policy, so there is no cover to price at any figure.</p>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 16 tool calls: 10 searches of the policy, 3 gate checks, 1 pricing and 2 submissions. 2 calls were refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"FP512A\"</td><td><code>ENDORSEMENT-FP512A</code> override</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>8</td><td><code>search_policy</code></td><td>\"burglary housebreaking theft cover\"</td><td><code>ENDORSEMENT-FP512B</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP512A</code> override</td></tr>\n<tr><td>9</td><td><code>search_policy</code></td><td>code \"Condition 4\"</td><td><code>CONDITION-4</code> primary</td></tr>\n<tr><td>10</td><td><code>search_policy</code></td><td>\"money cash stolen not insured\"</td><td><code>CLAUSE-FC804</code> secondary<br><code>CLAUSE-FC816</code> secondary<br><code>CLAUSE-FC805</code> secondary<br><code>CLAUSE-FC802B</code> secondary</td></tr>\n<tr><td>11</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2025-03-09</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin; Incident report, Sunday 9 March 2025</td></tr><tr><td><code>period_start</code></td><td>2025-01-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2025-12-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip err\">clause_not_retrieved</span> Search the policy for Operative clause before this gate; a gate rests only on wording retrieved for this claim.</td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2025-03-09</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin; Incident report, Sunday 9 March 2025</td></tr><tr><td><code>period_start</code></td><td>2025-01-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2025-12-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 9 March 2025 falls inside 1 January 2025 to 31 December 2025.<span class=\"meta\"></span></td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>burglary_or_theft</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (entry by night, forced; property searched, jewellery and cash taken)</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (damage done by intruders in the course of the same housebreaking)</td></tr><tr><td><code>endorsements_held</code></td><td>FP512A</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>peril_not_insured</b>. Proximate cause: burglary or theft. It is insured nowhere in the policy, base cover or any endorsement. Theft is insured nowhere in the wording. Damage done maliciously by intruders is malicious_damage.<span class=\"meta\"></span></td></tr>\n<tr><td>14</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>6 items, sums insured and values at risk</td><td><span class=\"chip no\">Not priced</span> The proximate cause is insured nowhere in the policy, so there is no cover to price at any figure.</td></tr>\n<tr><td>15</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">clause_mismatch</span> <code>governing_clause</code> The governing clause is 'Operative clause, with FP512A, Malicious Damage paragraph (burglary, housebreaking, theft exclusion)', but the result rests on 'peril_not_insured' (the clause check_gate returned at the deciding gate). Name that clause; mention other grounds in the advice text.</div></td></tr>\n<tr><td>16</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2022-06033": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Thursday, 30 June 2022</div><div class=\"msg out\">Good evening Mr Prakash, this is Kamalaveni, Mr Rajendran's daughter, the house at Lorong Cempaka 3, Taman Cempaka. Very bad thunderstorm just now around 5.30 to 6pm, very strong wind. Part of the roof tiles at the back flew off, can see the sky from the roof space<span class=\"t\">6:52 pm</span></div><div class=\"msg out\"><span class=\"att\">6 photos</span><span class=\"t\">6:53 pm</span></div><div class=\"msg out\">Now the rain is coming inside through the roof. Water coming down through the ceiling in the back bedroom and the passage, two ceiling boards fell down. Bedroom floor, wardrobe, mattress and bedsheets all wet<span class=\"t\">7:40 pm</span></div><div class=\"msg in\"><span class=\"who\">Prakash a/l Selvaraj</span>Alamak Kamala, everyone ok? Put buckets and move what you can. Take photos and videos of the roof and inside before anything is cleaned. Where is your father?<span class=\"t\">7:58 pm</span></div><div class=\"msg out\">Amma was at home, she is ok. Appa is in Hospital Raja Permaisuri Bainun since yesterday, so I am handling. Also one big branch from the rain tree on the empty lot next door broke and fell on the car porch, 3 roof sheets cracked and the gutter dented<span class=\"t\">8:03 pm</span></div><div class=\"msg out\">And our family name signboard on the front wall and the fabric awning over the front windows, the wind tore them off. Cannot repair already<span class=\"t\">8:05 pm</span></div><div class=\"msg in\"><span class=\"who\">Prakash a/l Selvaraj</span>Ok noted. I will inform the insurance company first thing tomorrow morning. Try to get the roof covered to stop more water coming in<span class=\"t\">8:15 pm</span></div><div class=\"day\">Friday, 1 July 2022</div><div class=\"msg in\"><span class=\"who\">Prakash a/l Selvaraj</span>Kamala, I have called the insurance company and notified them. Since you are claiming for your father, please get a letter of authorisation signed by him. Then send me the claim with the list and amounts, quotations, photos and the weather record if you can get it<span class=\"t\">9:20 am</span></div><div class=\"msg out\">Ok thank you. Contractor put tarpaulin over the back roof today, RM 950<span class=\"t\">4:30 pm</span></div><div class=\"day\">Saturday, 2 July 2022</div><div class=\"msg out\">Council came this morning and took away the branch<span class=\"t\">11:10 am</span></div><div class=\"day\">Friday, 8 July 2022</div><div class=\"msg out\">Mr Prakash, here is the claim for the storm on 30 June<span class=\"t\">8:45 pm</span></div><div class=\"msg out\">1. Roof: clay tiles, battens, back gable coping RM 28,400<br>2. Ceiling boards back bedroom and passage, with painting RM 6,700<br>3. Bedroom floor and skirting RM 2,900<br>4. Wardrobe, mattress and bedding RM 7,150<br>5. Car porch roof sheets and gutter RM 4,300<br>6. Metal signboard on front boundary wall RM 1,850<br>7. Fabric awning front windows RM 3,600<br>8. Emergency tarpaulin and labour RM 950<br><b>Total RM 55,850</b><span class=\"t\">8:47 pm</span></div><div class=\"msg out\"><span class=\"att\">Authorisation letter 5 Jul.pdf</span> <span class=\"att\">MetMalaysia record Ipoh 30 Jun.pdf</span> <span class=\"att\">Roof and ceiling quotation 6 Jul.pdf</span> <span class=\"att\">Car porch quotation 6 Jul.pdf</span> <span class=\"att\">Wardrobe and mattress receipts.pdf</span> <span class=\"att\">Council branch removal notice 2 Jul.pdf</span> <span class=\"att\">Tarpaulin invoice 1 Jul.pdf</span> <span class=\"att\">40 photos</span><span class=\"t\">8:48 pm</span></div><div class=\"msg out\">Appa's IC no: <span class=\"att\">redacted</span>. He will be discharged next week. No other insurance on the house<span class=\"t\">8:50 pm</span></div><div class=\"msg in\"><span class=\"who\">Prakash a/l Selvaraj</span>Received Kamala, thank you. Submitting to the insurance company now. The adjuster will contact you<span class=\"t\">9:05 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Kenari Loss Adjusters Sdn Bhd</b> · Our ref KLA/PK/22/0367 · Report dated 22 July 2022 · Adjuster: Siti Hajar binti Rosli</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>5 July 2022. Main roof from a ladder and from the roof space, rear bedroom, passage, car porch and front boundary wall inspected with the claimant. Tarpaulin over the rear roof slope in place since 1 July 2022.</td></tr><tr><td>Cause and origin</td><td>Thunderstorm with strong wind on the late afternoon of 30 June 2022. The wind lifted and displaced a section of clay tiles on the rear slope of the main roof, broke two timber battens and dislodged part of the rear gable coping. Rain then entered the roof space through that opening and came through the ceilings of the rear bedroom and the passage. Separately, in the same storm, a branch broke off a mature rain tree standing on the neighbouring vacant lot and fell across the car porch.</td></tr><tr><td>Reports relied on</td><td>Malaysian Meteorological Department record, Ipoh station, 30 June 2022: thunderstorm, maximum gusts 68 km/h between 5:20 pm and 6:15 pm. Local council removal notice for the fallen branch, 2 July 2022. Contractor quotations for the roof and ceiling and for the car porch, 6 July 2022. The claimant's photographs, timestamped 30 June and 1 July 2022. Title search: the Insured is the registered owner.</td></tr><tr><td>People interviewed</td><td>The claimant. The Insured's spouse, at home during the storm. The roofing contractor who laid the tarpaulin on 1 July 2022.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Dwelling occupied throughout; the Insured's spouse was at home at the time of the storm.</td></tr><tr><td>Maintenance and prior defects</td><td>Remaining tiles and battens on the rear slope sound. No old water staining in the roof space outside the area below the opening.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey detached dwelling with an attached car porch roofed in translucent sheeting, as scheduled. No change of occupation or use and no transfer of interest.</td></tr><tr><td>Damage found per item</td><td>Sequence confirmed on site: tiles missing and two battens broken on the rear slope directly above the wetted ceilings, with water staining running from the opening to the collapsed boards. Ceiling boards down in the rear bedroom and passage; bedroom floor finishes and skirting, wardrobe, mattress and bedding wetted. Car porch: three translucent sheets cracked and the gutter dented beneath where the branch fell. The metal signboard on the front boundary wall and the retractable fabric awning over the front windows torn from their fixings by the wind.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Roof reinstatement: clay tiles, battens, rear gable coping</td><td>Item 1 Building</td><td class=\"num\">28,400.00</td><td class=\"num\">28,400.00</td><td>Reinstatement, quotation checked</td></tr><tr><td>2</td><td>Ceiling boards, rear bedroom and passage, replacement and repainting</td><td>Item 1 Building</td><td class=\"num\">6,700.00</td><td class=\"num\">6,700.00</td><td>Reinstatement, quotation checked</td></tr><tr><td>3</td><td>Bedroom floor finishes and skirting</td><td>Item 1 Building</td><td class=\"num\">2,900.00</td><td class=\"num\">2,900.00</td><td>Reinstatement</td></tr><tr><td>4</td><td>Wardrobe, mattress and bedding</td><td>Item 2 Contents and personal effects</td><td class=\"num\">7,150.00</td><td class=\"num\">7,150.00</td><td>Replacement; receipts of 2019 and 2021 seen</td></tr><tr><td>5</td><td>Car porch translucent roof sheets and gutter</td><td>Item 1 Building</td><td class=\"num\">4,300.00</td><td class=\"num\">4,300.00</td><td>Replacement, quotation checked; damage by the falling branch</td></tr><tr><td>6</td><td>Metal signboard on the front boundary wall</td><td>None (outdoor fixture)</td><td class=\"num\">1,850.00</td><td class=\"num\">1,850.00</td><td>Replacement</td></tr><tr><td>7</td><td>Retractable fabric awning, front windows</td><td>None (outdoor fixture)</td><td class=\"num\">3,600.00</td><td class=\"num\">3,600.00</td><td>Replacement</td></tr><tr><td>8</td><td>Emergency tarpaulin and labour, 1 July 2022</td><td>Item 1 Building</td><td class=\"num\">950.00</td><td class=\"num\">950.00</td><td>Invoice</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>55,850.00</b></td><td class=\"num\"><b>55,850.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">380,000.00</td><td class=\"num\">365,000.00</td></tr><tr><td>Item 2 Contents and personal effects</td><td class=\"num\">95,000.00</td><td class=\"num\">80,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. The branch came from a tree on the neighbouring vacant lot, not on the insured premises; no recovery identified.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 55,850.00 before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PK/2022/007745</td></tr><tr><td>Insured</td><td>Rajendran a/l Muthusamy (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>2 June 2022 to 1 June 2023</td></tr><tr><td>Risk address</td><td>7, Lorong Cempaka 3, Taman Cempaka, 31400 Ipoh, Perak</td></tr><tr><td>Construction</td><td>Single-storey detached dwelling; brick walls, concrete floor, clay tile roof on timber trusses; attached car porch with translucent roof sheeting</td></tr><tr><td>Occupation</td><td>Private dwelling, owner occupied</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td>380,000.00</td></tr><tr><td>2</td><td>Contents and personal effects</td><td>95,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>475,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not itemised</td></tr><tr><td></td><td>Outdoor fixtures, signs, awnings</td><td>Not separately insured</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP503</td><td>Storm, Tempest Endorsement</td></tr><tr><td>FP513</td><td>Damage by Falling Trees or Branches and Objects Therefrom</td></tr><tr><td>FC816</td><td>Reinstatement Value Clause</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 30 June 2022 is inside the period 2 June 2022 to 1 June 2023. FC815 and the premium questions do not arise.</td><td>Date of loss 2022-06-30 <span class=\"meta\">(Incident report, WhatsApp 30 June 2022)</span><br>Period 2022-06-02 to 2023-06-01 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Hurricane, Cyclone, Typhoon and Windstorm<span class=\"cite\">FP503: Storm, Tempest Endorsement</span></blockquote><blockquote>the insurance under this Policy shall extend to include loss or damage to the property described in the Schedule and/or to walls, gates and fences around and pertaining thereto directly resulting from damage by falling trees or branches and objects therefrom<span class=\"cite\">FP513: Damage By Falling Trees Or Branches And Objects Therefrom</span></blockquote>Storm is not a base peril; FP503 brings windstorm in. The falling branch is a separate cause affecting item 5 only and is insured under FP513. No intervening event: the rain entered through the wind-made opening.</td><td>Wind lifted tiles, broke battens, dislodged coping; rain entered through the opening <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Branch from neighbouring vacant lot fell across car porch in same storm <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>If the claim be in any respect fraudulent, or if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written itemised claim received 8 July 2022, day 8 of the 15 days. No written extension needed. No fraud or false declaration found.</td><td>Written claim 8 July 2022 with itemised list <span class=\"meta\">(Incident report, WhatsApp 8 July 2022)</span><br>Irregularities: none found <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Hurricane, Cyclone, Typhoon and Windstorm<span class=\"cite\">FP503: Storm, Tempest Endorsement</span></blockquote>FP503 (storm) and FP513 (falling branch) are both on the schedule and answer the two causes. No building-variant mismatch.</td><td>Endorsements FP503, FP513, FC816 held <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>The Company shall not be liable for any loss or damage caused by water or rain, whether driven by wind or not unless the building insured or containing the property insured shall first sustain actual damage to the roof or walls of same by the direct force of Hurricane, Cyclone, Typhoon and Windstorm<span class=\"cite\">FP503: Storm, Tempest Endorsement</span></blockquote><blockquote>If the building insured or containing the insured property becomes unoccupied and so remains for a period of more than thirty (30) days.<span class=\"cite\">Condition 9</span></blockquote><blockquote>shall cease immediately upon any fall or displacement (a) of such building or of any part thereof<span class=\"cite\">Condition 4</span></blockquote>Special Condition 1 is met: wind first damaged the roof (tiles lifted, battens broken) and rain then entered through that opening. Condition 9: no change of occupation, dwelling occupied throughout, no transfer of interest, no sanction needed. Condition 4: no fall or displacement of the building or a substantial part; only a section of tiles and coping was displaced. No warranties.</td><td>Wind displaced tiles and broke battens before rain entered <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Dwelling occupied throughout; spouse at home; no change of occupation or use; no transfer of interest <span class=\"meta\">(Adjuster's report, Findings)</span><br>Warranties: None; Sanctions under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>Unless specifically and separately insured this endorsement does not cover:- (a) Metal smoke stacks, awnings, blinds, signs or other outdoor fixtures or fittings of any description.<span class=\"cite\">FP503: Storm, Tempest Endorsement</span></blockquote>Six of eight items admitted. Items 1-4 and 8 (roof, ceilings, floor, wardrobe/bedding, tarpaulin) admitted under FP503 or the building/contents items. Item 5 (car porch) admitted as falling-branch damage under FP513. Items 6 (signboard, RM 1,850) and 7 (fabric awning, RM 3,600) excluded: they are outdoor fixtures and the schedule records outdoor fixtures, signs and awnings as not separately insured. Gate passed on the admitted items.</td><td>Outdoor fixtures, signs, awnings: Not separately insured <span class=\"meta\">(Schedule, Sums insured)</span><br>Signboard and awning torn off by the wind; assessed RM 1,850.00 and RM 3,600.00 <span class=\"meta\">(Adjuster's report, Findings and Measurement, items 6 and 7)</span><br>Items 1-8 assessed amounts and classes <span class=\"meta\">(Adjuster's report, Measurement)</span></td></tr></table>\n<h3>Proximate cause</h3><p>storm</p><p>Thunderstorm with strong wind on 30 June 2022 lifted and displaced clay tiles on the rear roof slope, broke two battens and dislodged the rear gable coping. Rain entered through that opening and came through the rear bedroom and passage ceilings, wetting the floor, wardrobe, mattress and bedding. Separately, in the same storm, a branch from a rain tree on the neighbouring vacant lot fell across the car porch (item 5, falling-branch damage under FP513).</p><p>Intervening event: none.</p>\n<h3>Flags for the claims examiner</h3><ul><li>Mitigation expenditure admitted with the group it protected; for the claims examiner to confirm.</li><li>Items 6 and 7 (signboard and awning, RM 5,450.00 total) are excluded under FP503 Special Condition 4(a), which covers awnings, signs and other outdoor fixtures unless specifically and separately insured. The schedule records outdoor fixtures, signs and awnings as not separately insured.</li><li>Item 5 (car porch, RM 4,300.00) is damage by a falling branch from a neighbouring vacant lot. It is admitted under FP513, which carries a separate RM 250.00 first-loss deduction. The branch was not on the insured premises; the adjuster found no recovery.</li><li>The claimant's account and the adjuster's findings agree in substance; the adjuster found no material discrepancy and no irregularity.</li></ul>\n<h3>Advice</h3><p>The storm damage to the roof and interior is insured under FP503 (Special Condition 1 met, all gates passed). The car porch is admitted under FP513 for the falling branch. The signboard and awning (RM 5,450.00) are excluded as outdoor fixtures not separately insured. The calculate_payable working applies the FP503 excess of RM 200.00 to the storm group (subtotal RM 46,100.00, net RM 45,900.00) and the FP513 excess of RM 250.00 to item 5 (net RM 4,050.00), giving RM 49,950.00 payable. The examiner decides, including on the mitigation flag.</p>\n<p class=\"meta\">Governing clause: FP503, Excess Clause and Special Condition 1; FP503 Special Condition 4(a); FP513. The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 49,950.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 6  RM     1,850.00  EXCLUDED by FP503 Special Condition 4(a)  (Metal signboard on front boundary wall)</code></td></tr><tr><td><code>  ref 7  RM     3,600.00  EXCLUDED by FP503 Special Condition 4(a)  (Retractable fabric awning, front windows)</code></td></tr><tr><td><code>  excluded total       RM     5,450.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  380,000.00  value    RM 365,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   95,000.00  value     RM 80,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP503] refs [1, 2, 3, 4, 8]</code></td></tr><tr><td><code>     subtotal          RM    46,100.00</code></td></tr><tr><td><code>     excess            RM       200.00   Lesser of (a) 1.0% of total sums insured RM 475,000.00 = RM 4,750.00, or (b) RM 200.00. Lesser = RM 200.00.</code></td></tr><tr><td><code>     net               RM    45,900.00</code></td></tr><tr><td><code>  [FP513] refs [5]</code></td></tr><tr><td><code>     subtotal          RM     4,300.00</code></td></tr><tr><td><code>     excess            RM       250.00   Flat first RM 250.00 of each and every loss.</code></td></tr><tr><td><code>     net               RM     4,050.00</code></td></tr><tr><td><code>  CLAIMED             RM    55,850.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    49,950.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 17 tool calls: 9 searches of the policy, 6 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"FP503\"</td><td><code>ENDORSEMENT-FP503</code> override</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"FP513\"</td><td><code>ENDORSEMENT-FP513</code> override</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>8</td><td><code>search_policy</code></td><td>code \"Condition 4\"</td><td><code>CONDITION-4</code> primary</td></tr>\n<tr><td>9</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2022-06-30</td><td class=\"meta\">Incident report, WhatsApp 30 June 2022</td></tr><tr><td><code>period_start</code></td><td>2022-06-02</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2023-06-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 30 June 2022 falls inside 2 June 2022 to 1 June 2023.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>storm</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: thunderstorm with strong wind lifted and displaced clay tiles, broke battens, dislodged gable coping; rain entered through opening</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: rain entered through the wind-made opening; no separate event</td></tr><tr><td><code>endorsements_held</code></td><td>FP503, FP513, FC816</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP503</b>. Proximate cause: storm. Not a base peril; FP503 brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2022-06-30</td><td class=\"meta\">Incident report, WhatsApp 30 June 2022</td></tr><tr><td><code>written_claim_date</code></td><td>2022-07-08</td><td class=\"meta\">Incident report, WhatsApp 8 July 2022 (claim with itemised list)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Schedule and claim file: no written extension found</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 8 July 2022, day 8 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP503, FP513, FC816</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP503</b>. FP503 is on the schedule and answers the cause.<span class=\"meta\"></span></td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 5, 10 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Warranties: None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Risk as found against the schedule: no change of occupation or use</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: dwelling occupied throughout</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: no transfer of interest; Insured is registered owner</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None; none needed as no change</td></tr><tr><td><code>water_or_rain_damage_claimed</code></td><td>True</td><td class=\"meta\">Incident report, 30 June 7:40 pm and 8 July claim item 2-4: rain entered through roof</td></tr><tr><td><code>wind_damaged_roof_or_walls_first</code></td><td>True</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: wind lifted and displaced clay tiles and broke battens before rain entered</td></tr><tr><td><code>fall_or_displacement</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: a section of tiles displaced; no fall or displacement of the building or a substantial part</td></tr><tr><td><code>displacement_caused_by_insured_peril</code></td><td>False</td><td class=\"meta\">Adjuster's report: no fall or displacement of the building</td></tr><tr><td><code>displaced_part_isolated</code></td><td>False</td><td class=\"meta\">Adjuster's report: no fall or displacement of the building</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP503</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>FP503 Special Condition 1 pass; Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>14</td><td><code>search_policy</code></td><td>\"expenses incurred to protect property from further damage after loss, temporary repairs, sue and labour\"</td><td><code>CONDITION-12</code> primary<br><code>CLAUSE-FC818</code> secondary<br><code>CLAUSE-FC802B</code> secondary<br><code>CONDITION-16</code> primary</td></tr>\n<tr><td>15</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>8 items</td><td class=\"meta\">Adjuster's report, Measurement table</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP503</b>. 6 of 8 items admitted.<span class=\"meta\"><br>ref 1 admitted; ref 2 admitted; ref 3 admitted; ref 4 admitted; ref 5 admitted; ref 6 excluded (FP503 Special Condition 4(a)); ref 7 excluded (FP503 Special Condition 4(a)); ref 8 admitted</span></td></tr>\n<tr><td>16</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>8 items, sums insured and values at risk</td><td><span class=\"chip ok\">Payable</span> RM 49,950.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 6  RM     1,850.00  EXCLUDED by FP503 Special Condition 4(a)  (Metal signboard on front boundary wall)</code></div><div><code>  ref 7  RM     3,600.00  EXCLUDED by FP503 Special Condition 4(a)  (Retractable fabric awning, front windows)</code></div><div><code>  excluded total       RM     5,450.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  380,000.00  value    RM 365,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   95,000.00  value     RM 80,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [FP503] refs [1, 2, 3, 4, 8]</code></div><div><code>     subtotal          RM    46,100.00</code></div><div><code>     excess            RM       200.00   Lesser of (a) 1.0% of total sums insured RM 475,000.00 = RM 4,750.00, or (b) RM 200.00. Lesser = RM 200.00.</code></div><div><code>     net               RM    45,900.00</code></div><div><code>  [FP513] refs [5]</code></div><div><code>     subtotal          RM     4,300.00</code></div><div><code>     excess            RM       250.00   Flat first RM 250.00 of each and every loss.</code></div><div><code>     net               RM     4,050.00</code></div><div><code>  CLAIMED             RM    55,850.00</code></div><div><code>  RECOMMENDED PAYABLE RM    49,950.00</code></div></details></td></tr>\n<tr><td>17</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-06472": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Haslinda Mat Noor &lt;[redacted]&gt;<br><b>To:</b> Teoh Boon Huat &lt;[redacted]&gt;<br><b>Date:</b> Wednesday, 22 May 2024, 8:05 am<br><b>Subject:</b> Rumah saya rosak masa ribut semalam</div><p>Dear Mr Teoh,</p>\n<p>Last night (21 May) around 7 pm there was a very bad thunderstorm with strong wind in Kuala Terengganu. At about 8 pm water started dripping from the ceiling in the back bedroom upstairs and in the upstairs corridor. Part of the ceiling in the bedroom came down at about 10 pm and wet the bed, the wardrobe and the carpet.</p>\n<p>I think the strong wind blew off some roof tiles because the water came from above. This morning I can see two tiles at the back look cracked.</p>\n<p>Please advise what I should do. My house is at No. 9, Lorong Bukit Kecil 3, Taman Bukit Kecil.</p>\n<p>Thank you,<br>Haslinda</p>\n<p><b>Attachments:</b> 5 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Teoh Boon Huat &lt;[redacted]&gt;<br><b>To:</b> Haslinda Mat Noor &lt;[redacted]&gt;<br><b>Date:</b> Wednesday, 22 May 2024, 9:40 am<br><b>Subject:</b> Re: Rumah saya rosak masa ribut semalam</div><p>Dear Puan Haslinda,</p>\n<p>Sorry to hear that. I have informed the insurance company this morning. Your policy has the storm endorsement. Please do not repair the roof or the ceiling yet, only put a cover to stop more water. Send me your claim with the list and amounts and the contractor quotation.</p>\n<p>Regards,<br>Teoh</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Haslinda Mat Noor &lt;[redacted]&gt;<br><b>To:</b> Teoh Boon Huat &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 28 May 2024, 9:22 pm<br><b>Subject:</b> Claim for storm damage 21 May 2024</div><p>Dear Mr Teoh,</p>\n<p>My claim for the damage on 21 May 2024:</p>\n<p>1. Ceiling boards back bedroom and corridor: RM 6,800.00<br>2. Repainting ceiling and walls upstairs: RM 2,400.00<br>3. Mattress, bed frame and wardrobe: RM 4,200.00<br>4. Carpet and curtains: RM 1,500.00</p>\n<p>Total RM 14,900.00</p>\n<p>Attached the contractor quotation and photos. No other insurance.</p>\n<p>Thank you,<br>Haslinda</p>\n<p><b>Attachments:</b> Quotation Kontraktor Seri Pantai 27 May.pdf; Furniture receipts.pdf; 12 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Teoh Boon Huat &lt;[redacted]&gt;<br><b>To:</b> Haslinda Mat Noor &lt;[redacted]&gt;<br><b>Date:</b> Wednesday, 29 May 2024, 10:10 am<br><b>Subject:</b> Re: Claim for storm damage 21 May 2024</div><p>Received Puan, I have submitted it to the insurance company.</p>\n<p>Teoh</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Kenari Loss Adjusters Sdn Bhd</b> · Our ref KLA/TR/24/0288 · Report dated 12 June 2024 · Adjuster: Kavitha a/p Ramasamy</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>24 May 2024. Roof inspected from a ladder and from inside the roof space with the Insured's contractor; upstairs rooms inspected.</td></tr><tr><td>Cause and origin</td><td>Rainwater overflowed the rear box gutter, which was blocked with leaves and silt, and ran back under the bottom row of tiles into the roof space above the rear bedroom and corridor. Further water was driven in through gaps in the deteriorated sealant around the rear bedroom window frame. All roof tiles were in place; no tile, ridge or wall was displaced or broken by the wind.</td></tr><tr><td>Reports relied on</td><td>Malaysian Meteorological Department record for Kuala Terengganu, 21 May 2024: thunderstorm with heavy rain from 6:45 pm, maximum gust 48 km/h. Roofing contractor's inspection note, 24 May 2024: gutter blocked, tiles intact, two tiles with old hairline cracks.</td></tr><tr><td>People interviewed</td><td>The Insured. Her roofing contractor. The neighbour at No. 11, whose house had no damage.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Occupied by the Insured and her family as their home.</td></tr><tr><td>Maintenance and prior defects</td><td>Rear box gutter not cleared for some time: compacted leaves and silt found along its length. Window frame sealant cracked and partly missing. The two cracked tiles at the rear show lichen growth in the cracks, consistent with cracking well before the storm; the roof space below them was dry.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey intermediate terrace house used as a private dwelling, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Water-stained and collapsed ceiling boards in the rear bedroom and corridor; stained paintwork; wet mattress, swollen wardrobe panels, stained carpet and curtains.</td></tr><tr><td>Discrepancies with the incident report</td><td>The Insured believes the wind blew off roof tiles. No tile was missing or displaced; the water entered through the overflowing gutter and the window frame gaps, not through any opening made by the wind.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Ceiling boards, rear bedroom and upstairs corridor</td><td>Item 1 Building</td><td class=\"num\">6,800.00</td><td class=\"num\">6,300.00</td><td>Reinstatement; area remeasured</td></tr><tr><td>2</td><td>Repainting ceiling and walls upstairs</td><td>Item 1 Building</td><td class=\"num\">2,400.00</td><td class=\"num\">2,400.00</td><td>Quotation checked</td></tr><tr><td>3</td><td>Mattress, bed frame and wardrobe</td><td>Item 2 Household contents</td><td class=\"num\">4,200.00</td><td class=\"num\">4,200.00</td><td>Replacement, receipts seen</td></tr><tr><td>4</td><td>Carpet and curtains</td><td>Item 2 Household contents</td><td class=\"num\">1,500.00</td><td class=\"num\">1,500.00</td><td>Replacement</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>14,900.00</b></td><td class=\"num\"><b>14,400.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">350,000.00</td><td class=\"num\">330,000.00</td></tr><tr><td>Item 2 Household contents</td><td class=\"num\">50,000.00</td><td class=\"num\">45,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 14,400.00 before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/TR/2023/002947</td></tr><tr><td>Insured</td><td>Haslinda binti Mat Noor (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 October 2023 to 30 September 2024</td></tr><tr><td>Risk address</td><td>9, Lorong Bukit Kecil 3, Taman Bukit Kecil, 20400 Kuala Terengganu, Terengganu</td></tr><tr><td>Construction</td><td>Two-storey intermediate terrace house; brick walls, reinforced concrete first floor slab, concrete tile roof on timber trusses</td></tr><tr><td>Occupation</td><td>Private dwelling</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">350,000.00</td></tr><tr><td>2</td><td>Household contents</td><td class=\"num\">50,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>400,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP503</td><td>Storm, Tempest Endorsement</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 21 May 2024 falls within the period 1 October 2023 to 30 September 2024. FC815 is not needed.</td><td>Date of loss 2024-05-21 <span class=\"meta\">(Incident report, email of 22 May 2024)</span><br>Period 2023-10-01 to 2024-09-30 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Hurricane, Cyclone, Typhoon and Windstorm<span class=\"cite\">FP503: Storm, Tempest Endorsement</span></blockquote>The proximate cause is taken as storm, the event of 21 May 2024. Storm is not a base peril and is brought in by FP503. The water damage itself is rain, not wind, and that is tested at gate 5. No new independent event: the blocked gutter and cracked sealant were prior defects.</td><td>Cause and origin: rainwater overflowed a blocked rear box gutter and entered through window frame sealant gaps; no tile or wall displaced by wind <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Meteorological record: thunderstorm with heavy rain from 6:45 pm, maximum gust 48 km/h <span class=\"meta\">(Adjuster's report, Investigation, Reports relied on)</span><br>FP503 Storm, Tempest Endorsement held <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>If the claim be in any respect fraudulent, or if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim sent 28 May 2024, day 7 of the 15 days allowed. Adjuster found no irregularities, so Condition 15 is not engaged.</td><td>Written claim email dated 28 May 2024, Claim for storm damage 21 May 2024 <span class=\"meta\">(Incident report, claimant email of 28 May 2024)</span><br>Irregularities: none found <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Hurricane, Cyclone, Typhoon and Windstorm<span class=\"cite\">FP503: Storm, Tempest Endorsement</span></blockquote>FP503 is on the schedule and answers the storm cause. The building is a two-storey house, so no variant issue arises.</td><td>FP503 on the schedule <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>The Company shall not be liable for any loss or damage caused by water or rain, whether driven by wind or not unless the building insured or containing the property insured shall first sustain actual damage to the roof or walls of same by the direct force of Hurricane, Cyclone, Typhoon and Windstorm<span class=\"cite\">FP503: Storm, Tempest Endorsement</span></blockquote><blockquote>Under any of the following circumstances the insurance ceases to attach as regards the property affected unless the Insured, before the occurrence of any loss or damage, obtains the sanction of the Company<span class=\"cite\">Condition 9</span></blockquote>The damage claimed is water and rain damage. The adjuster found all roof tiles in place and no tile, ridge or wall displaced or broken by wind, so the wind did not first damage the roof or walls. FP503 Special Condition 1 therefore bars the claim. Condition 9 is satisfied: occupied as a home, no unoccupied period, no interest passed, no sanction required.</td><td>All roof tiles in place; no tile, ridge or wall displaced or broken by the wind <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Occupied by the Insured and her family as their home <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Warranties: None; Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Claimed items are water and rain damage to ceiling, decoration, contents <span class=\"meta\">(Incident report, claim email 28 May 2024; Adjuster's report, Findings, Damage found per item)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 5 failed. The adjuster's assessed amounts are shown in the figure only as the but-for calculation.</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>Rain driven by the storm of 21 May 2024, entering the rear roof space through an overflowing blocked rear box gutter and through deteriorated window frame sealant. Not wind damage to the roof or walls.</p><p>Storm and heavy rain on 21 May 2024 -&gt; rear box gutter, already blocked with leaves and silt, overflowed and ran back under the bottom row of tiles -&gt; water entered the roof space above the rear bedroom and corridor; further water entered through cracked sealant at the rear bedroom window frame -&gt; ceiling boards collapsed and contents wet.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>The wind blew off some roof tiles and the water came in from above because of that (incident report, email of 22 May 2024).</td><td>No tile was missing or displaced. Water entered through the overflowing gutter and the window frame gaps, not through an opening made by the wind. The two cracked tiles show lichen growth, consistent with cracking well before the storm (Adjuster's report, Investigation and Findings).</td><td>Adjuster's finding applied: no wind damage to the roof was found, so FP503 Special Condition 1 is not met.</td></tr><tr><td>Ceiling boards in the back bedroom and corridor claimed at RM 6,800.00.</td><td>Assessed at RM 6,300.00 after the area was remeasured (Adjuster's report, Measurement, ref 1).</td><td>Adjuster's assessed figure RM 6,300.00 used in the but-for calculation.</td></tr></table>\n<h3>Advice</h3><p>The claim fails at gate 5. FP503 Special Condition 1 excludes water or rain damage unless wind first damaged the roof or walls and the water entered through those openings. The adjuster found the roof intact and the water came through a blocked gutter and cracked window sealant, so the exception is not met. Gate 6 was not reached. For the examiner's information only, the but-for figure is RM 14,200.00 (claimed RM 14,400.00 less the RM 200.00 FP503 excess), which is not payable. The examiner decides.</p>\n<p class=\"meta\">Governing clause: FP503, Special Condition 1. The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 14,200.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  350,000.00  value    RM 330,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   50,000.00  value     RM 45,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP503] refs [1, 2, 3, 4]</code></td></tr><tr><td><code>     subtotal          RM    14,400.00</code></td></tr><tr><td><code>     excess            RM       200.00   Lesser of (a) 1.0% of total sums insured RM 400,000.00 = RM 4,000.00, or (b) RM 200.00. Lesser = RM 200.00.</code></td></tr><tr><td><code>     net               RM    14,200.00</code></td></tr><tr><td><code>  CLAIMED             RM    14,400.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM    14,200.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 14 tool calls: 6 searches of the policy, 5 gate checks, 2 pricing and 1 submission. 1 call was refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's s
