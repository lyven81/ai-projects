v></td><td>4 items, sums insured and values at risk</td><td><span class=\"chip ok\">Payable</span> RM 35,000.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 4  RM     3,200.00  EXCLUDED by FP507A Special Condition 2  (Two days' loss of sales)</code></div><div><code>  excluded total       RM     3,200.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  450,000.00  value    RM 430,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   60,000.00  value     RM 55,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM   80,000.00  value RM  100,000.00  factor 0.8000  UNDERINSURED</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [FP507A] refs [1, 2, 3]</code></div><div><code>     subtotal          RM    38,500.00</code></div><div><code>     after average     RM    36,000.00</code></div><div><code>     excess            RM     1,000.00   Flat first RM 1,000.00 of each and every loss.</code></div><div><code>     net               RM    35,000.00</code></div><div><code>  CLAIMED             RM    41,700.00</code></div><div><code>  RECOMMENDED PAYABLE RM    35,000.00</code></div></details></td></tr>\n<tr><td>16</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">quote_not_retrieved</span> <code>gates[4].quotes[0]</code> This quote is not in any wording retrieved for this claim: \"Applies to buildings exceeding five (5) storeys (including a mezzanine floor).\". Quote retrieved wording exactly, or search for it first.</div><div><span class=\"chip err\">quote_not_retrieved</span> <code>gates[4].quotes[1]</code> This quote is not in any wording retrieved for this claim: \"Applies to other buildings (generally 5 storeys and below).\". Quote retrieved wording exactly, or search for it first.</div></td></tr>\n<tr><td>17</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-05128": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Tuesday, 23 April 2024</div><div class=\"msg out\">Encik Mazlan, good morning. My cold room compressor at the Kulim warehouse broke down last night. When my worker opened this morning the cold room was already -2 degrees only, should be -18. The compressor motor burnt, very strong burning smell inside the machine<span class=\"t\">7:38 am</span></div><div class=\"msg out\"><span class=\"att\">4 photos</span><span class=\"t\">7:39 am</span></div><div class=\"msg in\"><span class=\"who\">Mazlan bin Hussin</span>Mr Koay, any fire? Anybody hurt?<span class=\"t\">8:02 am</span></div><div class=\"msg out\">No fire, no one hurt. Only the motor burnt inside, the panel also tripped. Technician coming at 9am. My frozen stock inside all thawing, I am moving what I can to the lorry freezer<span class=\"t\">8:05 am</span></div><div class=\"msg in\"><span class=\"who\">Mazlan bin Hussin</span>Ok noted. I will notify the insurance company this morning. Keep the burnt motor and get the technician's report. Take photos of the stock. Then send me the claim with the list and amounts<span class=\"t\">8:30 am</span></div><div class=\"msg in\"><span class=\"who\">Mazlan bin Hussin</span>Mr Koay, insurance company notified<span class=\"t\">11:15 am</span></div><div class=\"day\">Thursday, 2 May 2024</div><div class=\"msg out\">Encik Mazlan, here is my claim for the cold room breakdown on 22/23 April<span class=\"t\">4:40 pm</span></div><div class=\"msg out\">1. Compressor condensing unit, motor burnt RM 18,500<br>2. Control panel contactors and overload relay RM 2,300<br>3. Frozen stock spoilt (chicken, seafood, frozen food) RM 26,400<br><b>Total RM 47,200</b><span class=\"t\">4:42 pm</span></div><div class=\"msg out\"><span class=\"att\">Refrigeration technician report 23 Apr.pdf</span> <span class=\"att\">Engineer report 26 Apr.pdf</span> <span class=\"att\">Compressor quotation.pdf</span> <span class=\"att\">Stock list and invoices.pdf</span> <span class=\"att\">Health office disposal letter.pdf</span> <span class=\"att\">16 photos</span><span class=\"t\">4:43 pm</span></div><div class=\"msg out\">My policy got the electrical clause right? No other insurance<span class=\"t\">4:44 pm</span></div><div class=\"msg in\"><span class=\"who\">Mazlan bin Hussin</span>Received Mr Koay. Will submit to the insurance company tomorrow<span class=\"t\">5:00 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Cahaya Adjusters Sdn Bhd</b> · Our ref CAS/KD/24/0533 · Report dated 20 May 2024 · Adjuster: Ho Mei Fong</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>24 April 2024. Warehouse, cold room, condensing unit and electrical control panel inspected with the Insured and his refrigeration technician.</td></tr><tr><td>Cause and origin</td><td>Single phasing: one phase of the incoming supply to the condensing unit was lost at a loose, overheated terminal in the motor starter. The compressor motor ran on two phases, overran and its windings burnt out at about 2:00 am on 23 April 2024 (time from the cold room temperature logger). The overload relay contacts had welded and did not trip in time. No fire occurred: there is no flame, charring or smoke damage outside the motor casing and the starter, and no fire was reported or attended. The burning smell reported came from the motor windings.</td></tr><tr><td>Reports relied on</td><td>Refrigeration technician's report by Utara Sejuk Engineering, 23 April 2024: compressor motor burnt out, starter terminal L2 overheated and loose, no fire. Electrical engineer's report by Ir. Suresh a/l Pillai, 26 April 2024: failure caused by single phasing and overrunning; no fire; no lightning involvement, and the building's surge arrester shows no operation. Malaysian Meteorological Department record for Kulim, 22 to 23 April 2024: no thunderstorm or lightning activity. Kulim district health office letter, 25 April 2024, supervising disposal of thawed stock.</td></tr><tr><td>People interviewed</td><td>The Insured. The worker who opened the warehouse at 7:00 am. The refrigeration technician.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Frozen food distribution warehouse in daily use, closed overnight.</td></tr><tr><td>Maintenance and prior defects</td><td>Condensing unit serviced in November 2023; the starter terminals were not checked at that service.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey terrace factory unit used as a frozen food distribution warehouse with one walk-in cold room, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Compressor motor windings burnt out; starter contactors and overload relay contacts burnt. Frozen stock in the cold room thawed and was condemned. No other damage to the building or contents.</td></tr><tr><td>Discrepancies with the incident report</td><td>None.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Compressor condensing unit, motor windings burnt out</td><td>Item 2 Machinery and equipment</td><td class=\"num\">18,500.00</td><td class=\"num\">18,500.00</td><td>Replacement unit, quotation checked</td></tr><tr><td>2</td><td>Control panel contactors and overload relay</td><td>Item 2 Machinery and equipment</td><td class=\"num\">2,300.00</td><td class=\"num\">2,300.00</td><td>Replacement</td></tr><tr><td>3</td><td>Frozen stock spoilt by temperature rise</td><td>Item 3 Stock in trade</td><td class=\"num\">26,400.00</td><td class=\"num\">24,800.00</td><td>Cost price; stock moved to the lorry freezer in time deducted</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>47,200.00</b></td><td class=\"num\"><b>45,600.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">380,000.00</td><td class=\"num\">360,000.00</td></tr><tr><td>Item 2 Machinery and equipment</td><td class=\"num\">120,000.00</td><td class=\"num\">110,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">150,000.00</td><td class=\"num\">130,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Copper scrap from the motor RM 120.00, not deducted pending the insurer's instruction.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found; no machinery breakdown or deterioration of stock policy in force. No third-party recovery: the fault lies in the Insured's own installation.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 45,600.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/KD/2023/004470</td></tr><tr><td>Insured</td><td>Koay Chee Wah, trading as Syarikat Sejuk Beku Utara (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 October 2023 to 30 September 2024</td></tr><tr><td>Risk address</td><td>No. 6, Lorong Perusahaan Ringan 2, Kawasan Perindustrian Ringan Kulim, 09000 Kulim, Kedah</td></tr><tr><td>Construction</td><td>Single-storey terrace factory unit; brick walls, concrete floor, metal deck roof; insulated panel walk-in cold room</td></tr><tr><td>Occupation</td><td>Frozen food distribution warehouse</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">380,000.00</td></tr><tr><td>2</td><td>Machinery and equipment</td><td class=\"num\">120,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td class=\"num\">150,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>650,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP508B</td><td>Electrical Installation Clause (B)</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 23 April 2024 is inside the period 1 October 2023 to 30 September 2024, so FC815 and the premium questions do not arise.</td><td>date_of_loss 2024-04-23 <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>period 2023-10-01 to 2024-09-30 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote><blockquote>no liability exists under this Policy for loss or damage to any electrical machine, apparatus, fixture or fitting, or to any portion of the electrical installation, unless caused by fire or lightning<span class=\"cite\">FP508B: Electrical Installation Clause (B)</span></blockquote>The proximate cause is an electrical fault (single phasing and overrunning) that burnt out the compressor motor with no fire and no lightning. The base cover insures only fire or lightning. FP508B brings in electrical over-running only where the loss is by fire or lightning, and expressly excludes electrical machines and installation otherwise. The check returned fail: the peril is insured nowhere in the policy. Gates 3 to 6 are not reached.</td><td>proximate_cause electrical_fault; no fire, no lightning <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin and Reports relied on (electrical engineer, MMD record, surge arrester))</span><br>intervening_event none <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>endorsements_held FP508B <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain stopped at gate 2.</td><td></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain stopped at gate 2. FP508B is held on the schedule, but it does not bring in this cause without fire or lightning.</td><td></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain stopped at gate 2.</td><td></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain stopped at gate 2. Item classing was prepared for the calculation only: compressor and control panel as electrical_machine_where_fault_began; stock as insured_damage at RM 24,800.00 (adjuster's assessed figure, after the lorry freezer deduction).</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>electrical_fault</p><p>Single phasing: one incoming phase to the condensing unit was lost at a loose, overheated terminal in the motor starter. The compressor motor ran on two phases, overran and its windings burnt out at about 2:00 am on 23 April 2024. The overload relay contacts had welded and did not trip. The cold room then warmed and the frozen stock thawed. No fire and no lightning (Adjuster's report, Investigation, Cause and origin; Reports relied on).</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Insured claims RM 47,200.00 and asks whether the policy 'got the electrical clause right'; his account is that there was no fire and no one was hurt, only the motor burnt.</td><td>Single phasing at a loose terminal, motor overran and burnt out; no fire, no lightning, surge arrester did not operate; adjusted at RM 45,600.00 before policy terms.</td><td>Adjuster's finding applied: no fire and no lightning, so FP508B does not respond to this electrical machine loss.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>No fire and no lightning on the adjuster's findings. The insured's question about the electrical clause is answered by FP508B's own wording: cover for electrical over-running is given only where the loss is by fire or lightning.</li><li>Stock loss (RM 24,800.00) is a consequence of the same breakdown. It is not a separate fire or lightning event, so it does not bring the claim within cover. Gate 2 is decided on the proximate cause, not on the size of the consequential stock loss.</li><li>Classing of the control panel contactors (RM 2,300.00) as electrical_machine_where_fault_began is the adjuster's description of the starter, where the fault began. The examiner may wish to confirm this, though it does not change the outcome at gate 2.</li></ul>\n<h3>Advice</h3><p>The claim fails at gate 2. The proximate cause is an electrical fault (single phasing and motor overrun) with no fire and no lightning. The base Operative clause insures only fire or lightning, and FP508B, although held, responds to electrical over-running only where the loss is by fire or lightning. The examiner should decline on gate 2. The but-for figure is not priced because the calculation tool found no cover to price at any figure. The examiner decides.</p>\n<p class=\"meta\">Governing clause: FP508B. The claims examiner decides.</p>\n<h3>Figure</h3><p>Not priced. The proximate cause is insured nowhere in the policy, so there is no cover to price at any figure.</p>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 15 tool calls: 8 searches of the policy, 4 gate checks, 1 pricing and 2 submissions. 3 calls were refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP508B\"</td><td><code>ENDORSEMENT-FP508B</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>8</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-04-23</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (motor burnt out about 2:00 am 23 April 2024)</td></tr><tr><td><code>period_start</code></td><td>2023-10-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-09-30</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip err\">clause_not_retrieved</span> Search the policy for Operative clause before this gate; a gate rests only on wording retrieved for this claim.</td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>electrical_fault</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (single phasing at loose overheated terminal; motor overran and burnt out; no fire)</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>endorsements_held</code></td><td>FP508B</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip err\">gate_out_of_order</span> Gate 1 (Period of insurance) must be checked before gate 2.</td></tr>\n<tr><td>10</td><td><code>search_policy</code></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-04-23</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (motor burnt out about 2:00 am 23 April 2024)</td></tr><tr><td><code>period_start</code></td><td>2023-10-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-09-30</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 23 April 2024 falls inside 1 October 2023 to 30 September 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>electrical_fault</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (single phasing at loose overheated terminal; motor overran and burnt out; no fire)</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>endorsements_held</code></td><td>FP508B</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>FP508B</b>. Proximate cause: electrical fault. It is insured nowhere in the policy, base cover or any endorsement. Over-running, short-circuiting or burnout with no fire and no lightning. FP508A.01 and FP508B restrict cover for electrical machines; neither insures a breakdown.<span class=\"meta\"></span></td></tr>\n<tr><td>13</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>3 items, sums insured and values at risk</td><td><span class=\"chip no\">Not priced</span> The proximate cause is insured nowhere in the policy, so there is no cover to price at any figure.</td></tr>\n<tr><td>14</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">clause_mismatch</span> <code>governing_clause</code> The governing clause is 'Operative clause, with FP508B (no cover for electrical machines unless caused by fire or lightning)', but the result rests on 'FP508B' (the clause check_gate returned at the deciding gate). Name that clause; mention other grounds in the advice text.</div></td></tr>\n<tr><td>15</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2023-09814": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ganesan Periasamy &lt;[redacted]&gt;<br><b>To:</b> Tan Mei Kuan &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 19 September 2023, 8:20 pm<br><b>Subject:</b> Tree fell this afternoon, my electrical items all spoilt</div><p>Dear Ms Tan,</p>\n<p>This afternoon at about 3:30 pm a big tree fell at Jalan Langgar, near the junction to our taman. It fell on the TNB electric cables. Our lights went very bright and then there was a loud pop and everything went off. When the power came back at about 7 pm, my TV, fridge, the aircon in three rooms, my son's computer and the wifi and CCTV are not working. Some of my neighbours also have the same problem.</p>\n<p>My policy has the falling tree cover. Please help me to claim.</p>\n<p>Thank you,<br>Ganesan<br>No. 21, Jalan Uda 5, Taman Uda, Alor Setar</p>\n<p><b>Attachments:</b> 4 photos of the fallen tree; 3 photos of the appliances</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Tan Mei Kuan &lt;[redacted]&gt;<br><b>To:</b> Ganesan Periasamy &lt;[redacted]&gt;<br><b>Date:</b> Wednesday, 20 September 2023, 9:05 am<br><b>Subject:</b> Re: Tree fell this afternoon, my electrical items all spoilt</div><p>Dear Mr Ganesan,</p>\n<p>Sorry to hear that. I have notified the insurance company this morning. Please keep the damaged items and get a repair technician's report for each one. Send me your claim with the list of items and amounts.</p>\n<p>Regards,<br>Mei Kuan</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ganesan Periasamy &lt;[redacted]&gt;<br><b>To:</b> Tan Mei Kuan &lt;[redacted]&gt;<br><b>Date:</b> Wednesday, 27 September 2023, 10:12 pm<br><b>Subject:</b> Claim: falling tree 19 September 2023</div><p>Dear Ms Tan,</p>\n<p>My claim:</p>\n<p>1. 55 inch LED TV: RM 3,600.00<br>2. Refrigerator (2 door): RM 2,800.00<br>3. Air-conditioner control boards, 3 units: RM 2,250.00<br>4. Desktop computer: RM 2,400.00<br>5. Wifi router and CCTV recorder: RM 900.00</p>\n<p>Total RM 11,950.00</p>\n<p>Technician reports and receipts attached. No other insurance.</p>\n<p>Thank you,<br>Ganesan</p>\n<p><b>Attachments:</b> Technician report Kedah Elektrik 25 Sep.pdf; Computer shop report 26 Sep.pdf; Purchase receipts.pdf; TNB complaint reference.pdf; 11 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Tan Mei Kuan &lt;[redacted]&gt;<br><b>To:</b> Ganesan Periasamy &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 28 September 2023, 10:00 am<br><b>Subject:</b> Re: Claim: falling tree 19 September 2023</div><p>Received Mr Ganesan, submitted to the insurance company today.</p>\n<p>Mei Kuan</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Kenari Loss Adjusters Sdn Bhd</b> · Our ref KLA/KD/23/0461 · Report dated 13 October 2023 · Adjuster: Faridah binti Osman</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>22 September 2023. House, compound, roof, boundary wall and gate inspected with the Insured; the fallen tree site on Jalan Langgar inspected the same day.</td></tr><tr><td>Cause and origin</td><td>An angsana tree on the road reserve of Jalan Langgar, about 350 metres from the risk, fell across the overhead low voltage lines at about 3:30 pm. The fall caused a fault on the feeder serving Taman Uda; the resulting overvoltage damaged electrical equipment in the Insured's house and in other houses on the same feeder. The tree did not touch the Insured's house, compound, walls, gate or fence; no branch or other object from it reached the property.</td></tr><tr><td>Reports relied on</td><td>Tenaga Nasional Berhad outage record for the Taman Uda feeder, 19 September 2023: fault due to a fallen tree on the overhead line, supply restored at 6:55 pm. Alor Setar City Council record of the tree removal, 19 September 2023: roadside tree with root decay. Weather: Malaysian Meteorological Department record for Alor Setar shows no thunderstorm or strong wind that afternoon. Technician reports dated 25 September 2023 and 26 September 2023: damage consistent with an electrical surge.</td></tr><tr><td>People interviewed</td><td>The Insured. His neighbours at Nos. 19 and 23, whose appliances were also damaged. The city council officer in charge of the tree removal.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Occupied by the Insured and his family as their home.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant. The house wiring and distribution board tested sound after the event; no surge protection device fitted.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey semi-detached house used as a private dwelling, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Television, refrigerator, three air-conditioner indoor control boards, desktop computer, router and CCTV recorder damaged by overvoltage. No physical damage to the building, the compound, the boundary wall, the gate or the fence. No fire.</td></tr><tr><td>Discrepancies with the incident report</td><td>None. The Insured's account of the tree falling on the cables and the surge is confirmed.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>55 inch LED television</td><td>Item 2 Household contents</td><td class=\"num\">3,600.00</td><td class=\"num\">3,600.00</td><td>Replacement; main board burnt, uneconomical to repair</td></tr><tr><td>2</td><td>Two-door refrigerator</td><td>Item 2 Household contents</td><td class=\"num\">2,800.00</td><td class=\"num\">2,800.00</td><td>Replacement; compressor relay and control board burnt</td></tr><tr><td>3</td><td>Air-conditioner control boards, three indoor units</td><td>Item 1 Building (fixed installation)</td><td class=\"num\">2,250.00</td><td class=\"num\">2,250.00</td><td>Repair invoice</td></tr><tr><td>4</td><td>Desktop computer</td><td>Item 2 Household contents</td><td class=\"num\">2,400.00</td><td class=\"num\">2,400.00</td><td>Replacement; power supply and motherboard burnt</td></tr><tr><td>5</td><td>Wifi router and CCTV recorder</td><td>Item 2 Household contents</td><td class=\"num\">900.00</td><td class=\"num\">900.00</td><td>Replacement</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>11,950.00</b></td><td class=\"num\"><b>11,950.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">420,000.00</td><td class=\"num\">400,000.00</td></tr><tr><td>Item 2 Household contents</td><td class=\"num\">80,000.00</td><td class=\"num\">70,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. The Insured has lodged a complaint with Tenaga Nasional Berhad; the outcome is not known at the date of this report.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 11,950.00 before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/KD/2023/003358</td></tr><tr><td>Insured</td><td>Ganesan a/l Periasamy (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 June 2023 to 31 May 2024</td></tr><tr><td>Risk address</td><td>21, Jalan Uda 5, Taman Uda, 05200 Alor Setar, Kedah</td></tr><tr><td>Construction</td><td>Two-storey semi-detached house; brick walls, reinforced concrete first floor slab, concrete tile roof; brick boundary wall and steel gate</td></tr><tr><td>Occupation</td><td>Private dwelling</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">420,000.00</td></tr><tr><td>2</td><td>Household contents</td><td class=\"num\">80,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>500,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP513</td><td>Damage by Falling Trees or Branches and Objects Therefrom</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 2023-09-19 is within 2023-06-01 to 2024-05-31.</td><td>Date of loss 2023-09-19; period 2023-06-01 to 2024-05-31 <span class=\"meta\">(Schedule, Period of insurance; Adjuster's report, Cause and origin)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote><blockquote>no liability exists under this Policy for loss or damage to any electrical machine, apparatus, fixture or fitting, or to any portion of the electrical installation, unless caused by fire or lightning.<span class=\"cite\">FP508B: Electrical Installation Clause (B)</span></blockquote>The proximate cause is electrical overvoltage with no fire and no lightning. The base cover is fire or lightning only. FP513 covers damage directly resulting from falling trees or branches and objects therefrom, but the tree was 350 m away, touched nothing at the risk, and the damage came from the surge. The check found this cause insured nowhere in the policy, including FP508B, which is not held.</td><td>Overvoltage from feeder fault damaged equipment; tree did not touch the property; no fire <span class=\"meta\">(Adjuster's report, Cause and origin; Findings, Damage found per item)</span><br>No thunderstorm or strong wind <span class=\"meta\">(Adjuster's report, Reports relied on)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached after the gate 2 failure.</td><td></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached.</td><td></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached.</td><td></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached.</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>electrical_fault</p><p>Angsana tree on Jalan Langgar (about 350 m from the risk) fell across overhead LV lines at about 3:30 pm. This caused a fault on the Taman Uda feeder. The resulting overvoltage burnt out electrical equipment in the house. No fire, no lightning, no thunderstorm or strong wind. The tree did not touch the property.</p><p>Intervening event: Overvoltage surge on the TNB feeder, a separate electrical event between the tree fall and the damage..</p>\n<h3>Advice</h3><p>Gate 2 fails because the peril is not insured. The damage was caused by electrical overvoltage with no fire or lightning, and that cause is insured nowhere in the policy. FP513 is held but does not reach damage from a surge caused by a tree 350 m away that never touched the property. The calculation returned not priced, because there is no cover to price. The examiner decides.</p>\n<p class=\"meta\">Governing clause: peril_not_insured. The claims examiner decides.</p>\n<h3>Figure</h3><p>Not priced. The proximate cause is insured nowhere in the policy, so there is no cover to price at any figure.</p>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Sonnet 5.5 read the incident report, the adjuster's report, the policy schedule, then made 9 tool calls: 4 searches of the policy, 2 gate checks, 1 pricing and 2 submissions. 1 call was refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP513\"</td><td><code>ENDORSEMENT-FP513</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>\"electrical damage surge overvoltage not covered\"</td><td><code>ENDORSEMENT-FP508B</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP505C</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP505D</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP505B</code> informational <span class=\"meta\">(not held: cannot override)</span></td></tr>\n<tr><td>5</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-09-19</td><td class=\"meta\">Incident report, email 19 Sep 2023; Adjuster's report, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2023-06-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-05-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 19 September 2023 falls inside 1 June 2023 to 31 May 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>6</td><td><code>check_gate</code></td><td>Gate 2, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>electrical_fault</td><td class=\"meta\">Adjuster's report, Cause and origin: fault on feeder, overvoltage damaged equipment</td></tr><tr><td><code>intervening_event</code></td><td>overvoltage surge on the TNB feeder after tree fell on lines 350 m away</td><td class=\"meta\">Adjuster's report, Cause and origin</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>peril_not_insured</b>. Proximate cause: electrical fault. It is insured nowhere in the policy, base cover or any endorsement. Over-running, short-circuiting or burnout with no fire and no lightning. FP508A.01 and FP508B restrict cover for electrical machines; neither insures a breakdown.<span class=\"meta\"></span></td></tr>\n<tr><td>7</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>5 items, sums insured and values at risk</td><td><span class=\"chip no\">Not priced</span> The proximate cause is insured nowhere in the policy, so there is no cover to price at any figure.</td></tr>\n<tr><td>8</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">clause_mismatch</span> <code>governing_clause</code> The governing clause is 'Operative clause', but the result rests on 'peril_not_insured' (the clause check_gate returned at the deciding gate). Name that clause; mention other grounds in the advice text.</div></td></tr>\n<tr><td>9</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2022-08841": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Tan Wei Ming &lt;[redacted]&gt;<br><b>To:</b> Ahmad Fadzli &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 4 August 2022, 9:15 am<br><b>Subject:</b> Fire at the hardware shop, 42 Jalan Pasar</div><p>Dear Encik Fadzli,</p>\n<p>I am Tan Wei Ming, son of Mr Tan Cheng Hock. I run the hardware and household goods shop at 42, Jalan Pasar, Bukit Mertajam. Sorry for informing you only now; this past week I was busy with Bomba, the clean-up and the suppliers.</p>\n<p>Last Thursday, 28 July, at about 2.15 am, a fire started in the back storeroom on the ground floor. The shop was closed. Our neighbour next door saw the smoke and called Bomba. They came at about 2.40 am and put out the fire by about 4.05 am. Nobody was hurt.</p>\n<p>The shelving and stock in the storeroom are all burnt. Heat and smoke went up the inside staircase to the upstairs store, and the back part of the roof collapsed while Bomba was fighting the fire. The front shop is black with smoke all over.</p>\n<p>The Bomba report came out yesterday. It says the cause is undetermined, but the burning pattern is at the distribution board in the storeroom. I think it was an electrical fault.</p>\n<p>My father retired from the business in March this year and I have been running the shop in my own name since then. The fire insurance premium is still paid every year by bank standing instruction, so the policy should still be active. Please inform the insurance company.</p>\n<p>Regards,<br>Tan Wei Ming<br>Tel: [redacted]</p>\n<p><b>Attachments:</b> Bomba report 3 Aug.pdf; 8 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ahmad Fadzli &lt;[redacted]&gt;<br><b>To:</b> Tan Wei Ming &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 4 August 2022, 11:30 am<br><b>Subject:</b> Re: Fire at the hardware shop, 42 Jalan Pasar</div><p>Dear Mr Tan,</p>\n<p>Sorry to hear about the fire. I have notified the insurance company this morning. The policy is in your father's name, so please also send me the business registration transfer and the bank statement for the standing instruction. Send me the written claim with the list of items, amounts and quotations.</p>\n<p>Regards,<br>Fadzli</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Tan Wei Ming &lt;[redacted]&gt;<br><b>To:</b> Ahmad Fadzli &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 11 August 2022, 3:40 pm<br><b>Subject:</b> Claim for fire 28 July 2022, 42 Jalan Pasar</div><p>Dear Encik Fadzli,</p>\n<p>My claim for the fire on 28 July 2022:</p>\n<p>1. Building repair: rear roof structure, tiles, trusses, ceiling and rear wall: RM 185,000.00<br>2. Rewiring of the ground floor distribution board and affected circuits: RM 14,500.00<br>3. Stock destroyed or smoke damaged (hardware, paint, household goods): RM 62,000.00<br>4. Shelving, counters and fixtures: RM 21,800.00<br>5. Cleaning and smoke deodorising, both floors: RM 12,400.00</p>\n<p>Total RM 295,700.00</p>\n<p>Attached also the business registration transfer from my father to me, effective 1 March 2022, and the bank standing instruction statement from January 2021 to July 2022. I do not have any receipt from the insurance company for the renewal; the bank deducts automatically. No other insurance.</p>\n<p>Regards,<br>Tan Wei Ming</p>\n<p><b>Attachments:</b> Bomba report 3 Aug.pdf; Contractor quotation 8 Aug.pdf; Stock list.pdf; Business registration transfer 1 Mar 2022.pdf; Bank standing instruction statement Jan 2021 to Jul 2022.pdf; 26 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ahmad Fadzli &lt;[redacted]&gt;<br><b>To:</b> Tan Wei Ming &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 11 August 2022, 5:10 pm<br><b>Subject:</b> Re: Claim for fire 28 July 2022, 42 Jalan Pasar</div><p>Received Mr Tan. I have submitted it to the insurance company.</p>\n<p>Fadzli</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Seri Adjusters Sdn Bhd</b> · Our ref SAS/PG/22/0590 · Report dated 2 September 2022 · Adjuster: Yeoh Kian Huat</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>15 August 2022. Ground floor retail area and rear storeroom, internal staircase and first floor store inspected with the claimant; the collapsed rear roof viewed from the first floor and the rear lane.</td></tr><tr><td>Cause and origin</td><td>Fire in the rear storeroom on the ground floor in the early hours of 28 July 2022, with the heaviest burning at and around the distribution board. Heat and smoke travelled up the internal staircase to the first floor store. The rear section of the roof collapsed during firefighting. Smoke staining throughout the front retail area.</td></tr><tr><td>Reports relied on</td><td>Fire and Rescue Department report, 3 August 2022: attended at about 2:40 am, fire extinguished by 4:05 am; cause undetermined, burn patterns consistent with an origin at or near the distribution board. Contractor quotation for building reinstatement, 8 August 2022. Business registration transfer record, effective 1 March 2022. Bank standing instruction statement, January 2021 to July 2022. The Company's file for policy FP/PG/2021/004512: a renewal notice for the period following 31 January 2021 issued to the Insured's registered address; no renewal schedule, renewal endorsement or later policy on the file.</td></tr><tr><td>People interviewed</td><td>The claimant. The occupier of the adjoining lot, who noticed the smoke and called the Fire and Rescue Department.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Hardware and household goods shop, closed for business at the time of the fire. First floor used for stock storage.</td></tr><tr><td>Maintenance and prior defects</td><td>None established; the Fire and Rescue Department records the cause as undetermined.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey intermediate shophouse, no mezzanine; ground floor retail, first floor stock storage. The business is now carried on by the claimant: the sole proprietorship passed from Tan Cheng Hock to Tan Wei Ming with effect from 1 March 2022. No endorsement recording a change of insured interest seen.</td></tr><tr><td>Damage found per item</td><td>Rear roof structure, tiles and trusses collapsed; ceiling and rear wall of the storeroom burnt; distribution board and storeroom circuits destroyed; storeroom shelving and stock burnt; stock on both floors smoke damaged; counters and fixtures in the retail area smoke and heat damaged.</td></tr><tr><td>Discrepancies with the incident report</td><td>The claimant believes the policy is current because the premium continues to be paid by bank standing instruction. The standing instruction statement is a bank record. No premium receipt signed by an official or appointed agent of the Company was produced, and no renewal schedule was located. The only schedule seen runs from 1 January 2021 to 31 January 2021.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Building repair: rear roof structure, tiles, trusses, ceiling and rear wall</td><td>Item 1 Building</td><td class=\"num\">185,000.00</td><td class=\"num\">185,000.00</td><td>Reinstatement, quotation checked</td></tr><tr><td>2</td><td>Rewiring of the ground floor distribution board and affected circuits</td><td>Item 1 Building</td><td class=\"num\">14,500.00</td><td class=\"num\">14,500.00</td><td>Electrical contractor's rates checked</td></tr><tr><td>3</td><td>Stock in trade destroyed or smoke damaged: hardware, paint, household goods</td><td>Item 3 Stock in trade</td><td class=\"num\">62,000.00</td><td class=\"num\">62,000.00</td><td>Cost price per the claimant's stock listing, checked against the debris seen</td></tr><tr><td>4</td><td>Shelving, counters and fixtures</td><td>Item 2 Contents, fixtures and fittings</td><td class=\"num\">21,800.00</td><td class=\"num\">21,800.00</td><td>Replacement</td></tr><tr><td>5</td><td>Cleaning and smoke deodorising, both floors</td><td>Item 1 Building</td><td class=\"num\">12,400.00</td><td class=\"num\">12,400.00</td><td>Specialist cleaner's rates checked</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>295,700.00</b></td><td class=\"num\"><b>295,700.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">450,000.00</td><td class=\"num\">430,000.00</td></tr><tr><td>Item 2 Contents, fixtures and fittings</td><td class=\"num\">120,000.00</td><td class=\"num\">100,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">80,000.00</td><td class=\"num\">70,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 295,700.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PG/2021/004512</td></tr><tr><td>Insured</td><td>Tan Cheng Hock (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 January 2021 to 31 January 2021</td></tr><tr><td>Risk address</td><td>42, Jalan Pasar, 14000 Bukit Mertajam, Pulau Pinang</td></tr><tr><td>Construction</td><td>Two-storey intermediate shophouse; brick walls, reinforced concrete floor, clay tile roof on timber trusses; no mezzanine</td></tr><tr><td>Occupation</td><td>Hardware and household goods retail (ground floor); stock storage (first floor)</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td>450,000.00</td></tr><tr><td>2</td><td>Contents, fixtures and fittings</td><td>120,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td>80,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>650,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not itemised</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP509</td><td>Bush / Lalang Fire Endorsement</td></tr><tr><td>FC805</td><td>Capital Additions Clause</td></tr><tr><td>FC815</td><td>Automatic Renewal Clause</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st flag\">Passed, flagged</span></td><td><blockquote>This Policy is deemed to be automatically renewed and the appropriate premium charged upon expiry<span class=\"cite\">FC815: Automatic Renewal Clause</span></blockquote><blockquote>No payment in respect of any premium shall be deemed to be payment to the Company<span class=\"cite\">Condition 2</span></blockquote>Loss on 2022-07-28 is after the schedule period (2021-01-01 to 2021-01-31). FC815 is held and the claimant says premium was paid by bank standing instruction, but no Company-signed receipt was produced and no renewal schedule was located. Passes with a flag for the examiner to decide whether renewal is proven.</td><td>Period of insurance 1 Jan 2021 to 31 Jan 2021; FC815 held <span class=\"meta\">(Schedule, Period of insurance and Endorsements and clauses)</span><br>Loss date 2022-07-28 <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>No premium receipt signed by Company official or agent produced; only renewal notice for period after 31 Jan 2021 on file <span class=\"meta\">(Adjuster's report, Findings, Discrepancies with the incident report, and Reports relied on)</span><br>Premium paid by standing instruction (claimant's account; bank statement Jan 2021 to Jul 2022) <span class=\"meta\">(Incident report, email 11 Aug 2022)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Fire is a base insured peril. The roof collapse was a consequence of the fire during firefighting, not an independent event. The origin is undetermined, but burning at the distribution board does not change the proximate cause from fire.</td><td>Proximate cause fire; no intervening event <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin and Reports relied on (FRD report 3 Aug 2022))</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim with items and amounts received 11 August 2022, day 14 of the 15 allowed. No fraud or false declaration found.</td><td>Written claim dated 11 Aug 2022 <span class=\"meta\">(Incident report, claimant's email 11 Aug 2022)</span><br>Irregularities: none found <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Fire is a base peril; no endorsement required. FP509 (bush/lalang) is held but is not relevant to this cause.</td><td>Endorsements held: FP509, FC805, FC815 <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>(d) If the interest in the property insured pass from the Insured otherwise than by will or operation of law.<span class=\"cite\">Condition 9</span></blockquote>The sole proprietorship passed from Tan Cheng Hock to Tan Wei Ming with effect from 1 March 2022 by business registration transfer, not by will or operation of law. No sanction endorsed under Condition 9. Condition 9(a) and (b) are not engaged (same occupation; no unoccupied period). Insurance ceases to attach as regards the property affected.</td><td>Interest passed from Tan Cheng Hock to Tan Wei Ming effective 1 March 2022 <span class=\"meta\">(Adjuster's report, Findings, Risk as found against the schedule; Incident report, business registration transfer)</span><br>Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Occupation unchanged: hardware and household goods shop <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Warranties: none <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: chain stopped at gate 5. Adjuster's measurement totals RM 295,700.00 across items 1 to 5 and is priced only as a but-for figure.</td><td>Assessed amounts RM 295,700.00 <span class=\"meta\">(Adjuster's report, Measurement)</span></td></tr></table>\n<h3>Proximate cause</h3><p>Fire (base insured peril), starting in the rear ground-floor storeroom; origin undetermined by the Fire and Rescue Department, burning heaviest at the distribution board</p><p>Fire in rear storeroom, early hours 28 July 2022 -&gt; heat and smoke up internal staircase to first-floor store; rear roof section collapsed during firefighting</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Policy is current: the premium is paid every year by bank standing instruction, so the policy should still be active (incident report, email 4 Aug 2022).</td><td>No premium receipt signed by a Company official or agent was produced; no renewal schedule located; the only schedule runs 1 Jan 2021 to 31 Jan 2021 (adjuster's report, Discrepancies with the incident report).</td><td>Adjuster's finding applied at gate 1: renewal not proven by a Company-signed receipt; flagged rather than failed because FC815 is held and premium appears paid.</td></tr><tr><td>The business is the claimant's own; the policy was in the father's name (incident report, claimant's email 11 Aug 2022 notes business transferred effective 1 March 2022).</td><td>Sole proprietorship passed from Tan Cheng Hock to Tan Wei Ming effective 1 March 2022; no endorsement recording a change of insured interest seen (adjuster's report, Risk as found).</td><td>Adjuster's finding applied at gate 5: Condition 9(d) fails with no sanction endorsed.</td></tr><tr><td>Electrical fault suspected at the distribution board (incident report, email 4 Aug 2022).</td><td>Fire and Rescue Department records the cause as undetermined; no maintenance or prior defect established (adjuster's report, Findings).</td><td>Adjuster's finding applied: proximate cause recorded as fire of undetermined origin; no electrical_fault cause assigned.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>Renewal not proven by receipt: FC815 held and premium paid, no receipt signed by the Company under Condition 2 (gate 1 pass_flagged).</li><li>Gate 5 failure under Condition 9(d) is the ground on which the claim is declined. Gate 6 (item admission) was not reached; the classing of items 1 to 5 as insured_damage is for the examiner if the decline is reviewed.</li></ul>\n<h3>Advice</h3><p>The claim fails at gate 5. The sole proprietorship passed from Tan Cheng Hock to Tan Wei Ming on 1 March 2022 by transfer, not by will or operation of law, and no sanction was endorsed, so under Condition 9(d) the insurance ceased to attach to the property affected. Separately, gate 1 is flagged because the loss falls after the schedule period and no Company-signed receipt proves renewal, although FC815 is held. The examiner decides; the but-for figure of RM 295,700.00 is shown for reference only and is not payable.</p>\n<p class=\"meta\">Governing clause: Condition 9(d). The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 295,700.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  450,000.00  value    RM 430,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM  120,000.00  value    RM 100,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM   80,000.00  value     RM 70,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 2, 3, 4, 5]</code></td></tr><tr><td><code>     subtotal          RM   295,700.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM   295,700.00</code></td></tr><tr><td><code>  CLAIMED             RM   295,700.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM   295,700.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 18 tool calls: 8 searches of the policy, 7 gate checks, 1 pricing and 2 submissions. 3 calls were refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"FP509\"</td><td><code>ENDORSEMENT-FP509</code> override</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>8</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 6 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2022-07-28</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2021-01-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2021-01-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>auto_renewal_clause_held</code></td><td>True</td><td class=\"meta\">Schedule, Endorsements and clauses (FC815)</td></tr><tr><td><code>premium_paid_to_date_of_loss</code></td><td>True</td><td class=\"meta\">Incident report, email 11 Aug 2022 (claimant states premium paid by bank standing instruction; bank statement Jan 2021 to Jul 2022 attached)</td></tr><tr><td><code>company_receipt_produced</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Discrepancies with the incident report (no premium receipt signed by an official or appointed agent of the Company produced; no renewal schedule located)</td></tr></table></details></td><td><span class=\"chip err\">clause_not_retrieved</span> Search the policy for FC815 before this gate; a gate rests only on wording retrieved for this claim.</td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 1, 6 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2022-07-28</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2021-01-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2021-01-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>auto_renewal_clause_held</code></td><td>True</td><td class=\"meta\">Schedule, Endorsements and clauses (FC815)</td></tr><tr><td><code>premium_paid_to_date_of_loss</code></td><td>True</td><td class=\"meta\">Incident report, email 11 Aug 2022 (claimant states premium paid by bank standing instruction; bank statement Jan 2021 to Jul 2022 attached)</td></tr><tr><td><code>company_receipt_produced</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Discrepancies with the incident report (no premium receipt signed by an official or appointed agent of the Company produced; no renewal schedule located)</td></tr></table></details></td><td><span class=\"chip err\">clause_not_retrieved</span> Search the policy for CONDITION-2 before this gate; a gate rests only on wording retrieved for this claim.</td></tr>\n<tr><td>10</td><td><code>search_policy</code></td><td>code \"Condition 2\"</td><td><code>CONDITION-2</code> primary</td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 1, 6 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2022-07-28</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2021-01-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2021-01-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>auto_renewal_clause_held</code></td><td>True</td><td class=\"meta\">Schedule, Endorsements and clauses (FC815)</td></tr><tr><td><code>premium_paid_to_date_of_loss</code></td><td>True</td><td class=\"meta\">Incident report, email 11 Aug 2022 (claimant states premium paid by bank standing instruction; bank statement Jan 2021 to Jul 2022 attached)</td></tr><tr><td><code>company_receipt_produced</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Discrepancies with the incident report (no premium receipt signed by an official or appointed agent of the Company produced; no renewal schedule located)</td></tr></table></details></td><td><span class=\"chip flag\">Passed, flagged</span> <b>FC815</b>. Loss on 28 July 2022 falls after the period on the schedule (1 January 2021 to 31 January 2021). FC815 is held and the premium was paid up to the date of loss, but no receipt signed by the Company was produced (Condition 2). Flagged for the claims examiner.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 2, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>fire</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (fire in rear storeroom, early hours 28 July 2022; FRD cause undetermined)</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (roof collapse during firefighting is a consequence of the fire, not a new event)</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: fire, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2022-07-28</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>written_claim_date</code></td><td>2022-08-11</td><td class=\"meta\">Incident report, claimant's email of 11 August 2022 (written claim with items and amounts)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report, Ahmad Fadzli email 4 Aug 2022 (asked for written claim; no written extension of time recorded in the file)</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: None found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 11 August 2022, day 14 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>14</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP509, FC805, FC815</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. No endorsement is required for a base peril.<span class=\"meta\"></span></td></tr>\n<tr><td>15</td><td><code>check_gate</code></td><td>Gate 5, 5 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses (Warranties: None)</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss (hardware and household goods shop, same occupation)</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss (closed for business, not unoccupied)</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>True</td><td class=\"meta\">Adjuster's report, Findings, Risk as found against the schedule (sole proprietorship passed from Tan Cheng Hock to Tan Wei Ming effective 1 March 2022); Incident report, claimant's email 11 Aug 2022 (business registration transfer)</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None; Adjuster's report, Risk as found (no endorsement recording change of insured interest seen)</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>Condition 9(d)</b>. The interest in the property passed from the Insured otherwise than by will or operation of law, with no sanction of the Company endorsed on the policy.<span class=\"meta\"><br>Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) fail</span></td></tr>\n<tr><td>16</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>5 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 295,700.00<details><summary>Working</summary><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  450,000.00  value    RM 430,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM  120,000.00  value    RM 100,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM   80,000.00  value     RM 70,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 2, 3, 4, 5]</code></div><div><code>     subtotal          RM   295,700.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM   295,700.00</code></div><div><code>  CLAIMED             RM   295,700.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM   295,700.00</code></div></details></td></tr>\n<tr><td>17</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">quote_not_retrieved</span> <code>gates[1].quotes[0]</code> This quote is not in any wording retrieved for this claim: \"This Policy is deemed to be automatically renewed and the appropriate premium ch\". Quote retrieved wording exactly, or search for it first.</div></td></tr>\n<tr><td>18</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2023-06205": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Lau Bee Choo &lt;[redacted]&gt;<br><b>To:</b> Mohd Nizam Saad &lt;[redacted]&gt;<br><b>Date:</b> Saturday, 10 June 2023, 1:35 pm<br><b>Subject:</b> Fire at my rented house, Taman Merdeka Permai</div><p>Dear Encik Nizam,</p>\n<p>My house at No. 37, Jalan MP 12, Taman Merdeka Permai, Melaka caught fire this morning around 10 am. The neighbour called me. Bomba came and put it out. The kitchen and the back part of the house are burnt, and the roof at the back has fallen in.</p>\n<p>The house is rented to my tenant, Encik Kamal Arif bin Zainal. He is staying there, he always pays the rent on time. I called him but cannot get through yet. Luckily nobody was inside at the time.</p>\n<p>Please inform the insurance for me.</p>\n<p>Thank you,<br>Lau Bee Choo</p>\n<p><b>Attachments:</b> 5 photos from the neighbour</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Mohd Nizam Saad &lt;[redacted]&gt;<br><b>To:</b> Lau Bee Choo &lt;[redacted]&gt;<br><b>Date:</b> Saturday, 10 June 2023, 3:10 pm<br><b>Subject:</b> Re: Fire at my rented house, Taman Merdeka Permai</div><p>Dear Madam Lau,</p>\n<p>Very sorry to hear. I have notified the insurance company. Please get the Bomba report and make a police report. Send me the written claim with the list and amounts and the contractor quotation. Please also send a copy of the tenancy agreement.</p>\n<p>Regards,<br>Nizam</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Lau Bee Choo &lt;[redacted]&gt;<br><b>To:</b> Mohd Nizam Saad &lt;[redacted]&gt;<br><b>Date:</b> Monday, 19 June 2023, 11:02 am<br><b>Subject:</b> Claim for fire 10 June 2023, No. 37 Jalan MP 12</div><p>Dear Encik Nizam,</p>\n<p>My claim:</p>\n<p>1. Repair of house: kitchen, rear roof, ceiling, wiring, doors, painting: RM 85,000.00<br>2. My furniture in the house (kitchen cabinets, dining set, beds, wardrobes): RM 12,000.00</p>\n<p>Total RM 97,000.00</p>\n<p>The house was occupied by my tenant at the time, tenancy agreement attached. No other insurance.</p>\n<p>Thank you,<br>Lau Bee Choo</p>\n<p><b>Attachments:</b> Bomba report 10 Jun.pdf; Police report Melaka Tengah 10 Jun.pdf; Contractor quotation Binaan Bandar Hilir 16 Jun.pdf; Furniture list.pdf; Tenancy agreement 1 Jan 2023.pdf; 17 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Mohd Nizam Saad &lt;[redacted]&gt;<br><b>To:</b> Lau Bee Choo &lt;[redacted]&gt;<br><b>Date:</b> Monday, 19 June 2023, 2:45 pm<br><b>Subject:</b> Re: Claim for fire 10 June 2023, No. 37 Jalan MP 12</div><p>Received Madam Lau, submitted to the insurance company.</p>\n<p>Nizam</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Cahaya Adjusters Sdn Bhd</b> · Our ref CAS/ML/23/0655 · Report dated 5 July 2023 · Adjuster: Deepa a/p Murugan</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection
