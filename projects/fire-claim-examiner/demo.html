vice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-13208": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Harjit Singh &lt;[redacted]&gt;<br><b>To:</b> Nur Izzati Kamal &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 17 October 2024, 7:15 pm<br><b>Subject:</b> Lightning strike at our Kluang workshop today</div><p>Dear Cik Izzati,</p>\n<p>I am the managing director of Presisi Mesra Engineering Sdn Bhd at No. 7, Jalan Perindustrian Kluang 4. This afternoon there was a heavy thunderstorm. At about 3:40 pm lightning struck the roof of our neighbour's unit next door, No. 9. My workers heard a very loud bang and saw a flash at the switchboard, and every machine in the workshop stopped at once.</p>\n<p>When we checked, the two CNC machines cannot start and show drive alarms, the air compressor motor smells burnt, the overhead crane control does not respond, and the main incoming breaker and the surge arrester in the switchboard are burnt. There was no fire and we did not call Bomba. Nobody was hurt.</p>\n<p>Our electrical engineer is coming tomorrow morning. Please inform the insurance company.</p>\n<p>Regards,<br>Harjit Singh a/l Gurdev Singh<br>Managing Director, Presisi Mesra Engineering Sdn Bhd<br>Tel: [redacted]</p>\n<p><b>Attachments:</b> 8 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Nur Izzati Kamal &lt;[redacted]&gt;<br><b>To:</b> Harjit Singh &lt;[redacted]&gt;<br><b>Date:</b> Friday, 18 October 2024, 9:10 am<br><b>Subject:</b> Re: Lightning strike at our Kluang workshop today</div><p>Dear Mr Harjit,</p>\n<p>Sorry to hear this. I have notified the insurance company this morning. Please keep all the damaged parts, and get the engineer's report and the machine supplier's service reports. Then send me the written claim with the list, amounts and quotations.</p>\n<p>Regards,<br>Nur Izzati</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Harjit Singh &lt;[redacted]&gt;<br><b>To:</b> Nur Izzati Kamal &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 29 October 2024, 11:20 am<br><b>Subject:</b> Claim for lightning damage 17 October 2024, No. 7 Jalan Perindustrian Kluang 4</div><p>Dear Cik Izzati,</p>\n<p>Our claim for the lightning damage on 17 October 2024:</p>\n<p>1. CNC turning centre, spindle drive and control board (Item 2): RM 46,800.00<br>2. CNC vertical machining centre, two servo amplifiers (Item 2): RM 28,600.00<br>3. Screw air compressor, 22 kW motor rewinding and starter (Item 2): RM 15,400.00<br>4. Main switchboard incoming MCCB, surge arrester module and power meter (Item 1): RM 9,750.00<br>5. Overhead crane pendant control and contactor panel (Item 2): RM 3,900.00</p>\n<p>Total RM 104,450.00</p>\n<p>The engineer's report, the supplier service reports and the quotations are attached. No other insurance.</p>\n<p>Regards,<br>Harjit Singh</p>\n<p><b>Attachments:</b> Engineer report 21 Oct.pdf; CNC supplier service reports 22 Oct.pdf; Compressor rewinding quotation.pdf; Switchboard quotation.pdf; Crane panel quotation.pdf; 26 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Nur Izzati Kamal &lt;[redacted]&gt;<br><b>To:</b> Harjit Singh &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 29 October 2024, 2:05 pm<br><b>Subject:</b> Re: Claim for lightning damage 17 October 2024, No. 7 Jalan Perindustrian Kluang 4</div><p>Received Mr Harjit, thank you. I have submitted it to the insurance company.</p>\n<p>Nur Izzati</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Seri Adjusters Sdn Bhd</b> · Our ref SAS/JH/24/1046 · Report dated 14 November 2024 · Adjuster: Elaine Ng Pei Shan</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>22 October 2024. Workshop floor, main switchboard, CNC turning centre, CNC vertical machining centre, air compressor room and overhead crane inspected with the Insured's managing director and its electrical engineer; the roof of the adjoining unit, No. 9, viewed from the access ladder with the neighbour's consent.</td></tr><tr><td>Cause and origin</td><td>Lightning strike during a thunderstorm at about 3:41 pm on 17 October 2024. The strike point is the steel ridge finial on the roof of the adjoining unit, No. 9, about 15 metres from the Insured's switchboard: the finial tip is melted and blackened and the test joint of its down conductor is scorched. The strike induced a surge on the incoming low voltage supply and the shared earthing system, which passed through the main switchboard into the machines on the workshop floor. No fire ensued: there is no flame, charring or smoke damage outside the burnt components, and no fire was reported or attended.</td></tr><tr><td>Reports relied on</td><td>Malaysian Meteorological Department record for Kluang, 17 October 2024: thunderstorm from 2:50 pm to 4:30 pm. Malaysian Meteorological Department lightning detection record, 17 October 2024: cloud-to-ground strike at 3:41 pm located within 100 metres of the risk. Electrical engineer's report by Ir. Mohamad Firdaus bin Rahim, 21 October 2024: surge arrester module failed, incoming MCCB and power meter burnt; spindle drive, servo amplifiers, compressor motor windings and crane contactor panel damaged by overvoltage from a lightning-induced surge; no fire, no flame and no charring outside the components; the workshop wiring otherwise sound. CNC supplier's service reports, 22 October 2024: drive and control board failures consistent with a supply surge. Tenaga Nasional Berhad: a momentary disturbance recorded on the feeder at 3:41 pm, consistent with lightning; no network fault.</td></tr><tr><td>People interviewed</td><td>The managing director. The machinist and the store assistant who were on the workshop floor at the time. The electrical engineer who prepared the report.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Precision machining workshop in operation on the day; one shift, 8:00 am to 5:30 pm.</td></tr><tr><td>Maintenance and prior defects</td><td>Switchboard inspected by the engineer in March 2024; no defect recorded. Machines under the supplier's service contract; no prior fault reported.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey semi-detached factory with an office annexe, used as a precision machining workshop, as scheduled.</td></tr><tr><td>Damage found per item</td><td>CNC turning centre spindle drive and control board burnt. CNC vertical machining centre servo amplifiers on two axes burnt. Screw air compressor 22 kW motor windings and starter burnt. Main switchboard incoming MCCB, surge arrester module and power meter burnt. Overhead crane pendant control and contactor panel burnt. Every item is an electrical machine, apparatus or portion of the electrical installation. No damage to the building fabric, the stock or work in progress, and no fire.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>CNC turning centre, spindle drive and control board</td><td>Item 2 Machinery and equipment</td><td class=\"num\">46,800.00</td><td class=\"num\">44,500.00</td><td>Supplier's repair quotation checked; on-site commissioning charge reduced to the contract rate</td></tr><tr><td>2</td><td>CNC vertical machining centre, two servo amplifiers</td><td>Item 2 Machinery and equipment</td><td class=\"num\">28,600.00</td><td class=\"num\">28,600.00</td><td>Supplier's quotation checked</td></tr><tr><td>3</td><td>Screw air compressor, 22 kW motor rewinding and starter</td><td>Item 2 Machinery and equipment</td><td class=\"num\">15,400.00</td><td class=\"num\">14,200.00</td><td>Rewinding quotation checked; starter priced at the replacement part only</td></tr><tr><td>4</td><td>Main switchboard incoming MCCB, surge arrester module and power meter</td><td>Item 1 Building (electrical installation)</td><td class=\"num\">9,750.00</td><td class=\"num\">9,750.00</td><td>Electrical contractor's quotation checked</td></tr><tr><td>5</td><td>Overhead crane pendant control and contactor panel</td><td>Item 2 Machinery and equipment</td><td class=\"num\">3,900.00</td><td class=\"num\">3,900.00</td><td>Replacement</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>104,450.00</b></td><td class=\"num\"><b>100,950.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building, including the electrical installation</td><td class=\"num\">1,100,000.00</td><td class=\"num\">1,050,000.00</td></tr><tr><td>Item 2 Machinery and equipment</td><td class=\"num\">1,500,000.00</td><td class=\"num\">1,380,000.00</td></tr><tr><td>Item 3 Stock in trade and work in progress</td><td class=\"num\">250,000.00</td><td class=\"num\">210,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Copper scrap from the compressor rewinding RM 180.00, not deducted pending the insurer's instruction.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found; no machinery breakdown or electronic equipment policy in force. No third-party recovery: the surge came from lightning, not from a fault on the supply network.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 100,950.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/JH/2024/003391</td></tr><tr><td>Insured</td><td>Presisi Mesra Engineering Sdn Bhd (Company No. 201501031177)</td></tr><tr><td>Period of insurance</td><td>1 July 2024 to 30 June 2025</td></tr><tr><td>Risk address</td><td>No. 7, Jalan Perindustrian Kluang 4, Kawasan Perindustrian Kluang, 86000 Kluang, Johor</td></tr><tr><td>Construction</td><td>Single-storey semi-detached factory with a two-storey office annexe; brick and metal clad walls, concrete floor, metal deck roof on steel portal frames</td></tr><tr><td>Occupation</td><td>Precision machining workshop: CNC turning and milling of machine parts</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building, including the electrical installation</td><td class=\"num\">1,100,000.00</td></tr><tr><td>2</td><td>Machinery and equipment</td><td class=\"num\">1,500,000.00</td></tr><tr><td>3</td><td>Stock in trade and work in progress</td><td class=\"num\">250,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>2,850,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP508A.01</td><td>Electrical Installations Clause (A), applicable to electrical machinery, plant and installation in manufacturing risks and workshops</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire and lightning peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 17 October 2024 falls inside the period 1 July 2024 to 30 June 2025. FC815 and the premium and receipt questions do not arise.</td><td>date_of_loss 2024-10-17 <span class=\"meta\">(Incident report, email of 17 October 2024; Adjuster's report, Cause and origin)</span><br>period 2024-07-01 to 2025-06-30 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Proximate cause is lightning, a base insured peril. The surge through the supply and earthing is part of the same lightning sequence, not a new independent event. No fire, so the fire limb does not arise.</td><td>Proximate cause lightning, intervening event none <span class=\"meta\">(Adjuster's report, Cause and origin)</span><br>Lightning detection record: strike at 3:41 pm within 100 metres of the risk <span class=\"meta\">(Adjuster's report, Reports relied on)</span><br>No fire, no flame, no charring outside the components <span class=\"meta\">(Adjuster's report, Cause and origin and Reports relied on (electrical engineer's report))</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing for the loss and damage<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Notice was given on 18 October 2024 and the written claim with the list and amounts was delivered on 29 October 2024, day 12 of 15. The adjuster found no irregularities and no false declaration.</td><td>written_claim_date 2024-10-29 <span class=\"meta\">(Incident report, email from Harjit Singh of 29 October 2024)</span><br>Notice to insurer 18 October 2024 <span class=\"meta\">(Incident report, email from Nur Izzati Kamal of 18 October 2024)</span><br>No irregularities; no extension in writing <span class=\"meta\">(Adjuster's report, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Lightning is a base peril, so no endorsement is needed to bring it in. FP508A.01 is held on the schedule and is considered at gates 5 and 6.</td><td>endorsements_held FP508A.01 <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>If the building insured or containing the insured property becomes unoccupied and so remains for a period of more than thirty (30) days.<span class=\"cite\">Condition 9</span></blockquote>No warranty (schedule states none), no change of occupation (single shift precision machining as scheduled), unoccupied 0 days, no interest passed, no sanction required. Condition 9 tests (a), (b) and (d) pass. The FP508A.01 exclusion was not tested by this gate; the tool applied it at gate 6 to every item, as set out there.</td><td>Schedule: Warranties None; Sanctions under Condition 9 None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Occupancy one shift 8:00 am to 5:30 pm, as scheduled <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss and Risk as found)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>This Company is expressly declared to be free from liability for loss of or damage to, any electrical machine, apparatus, or any portion of the electrical installation arising from or occasioned by over-running, excessive pressure, short-circuiting, self heating, arcing or leakage of electricity from whatever cause (lightning included) arising.<span class=\"cite\">FP508A.01: Electrical Installations Clause (A) (Applicable To Electrical Machinery, Plant And</span></blockquote><blockquote>Provided that this exemption shall only apply to the particular electrical machine, apparatus, or portion of the electrical installation so affected, and not to other machines, apparatus or electrical installation destroyed or damaged by fire set up by such particular machine, apparatus or other electrical installation.<span class=\"cite\">FP508A.01: Electrical Installations Clause (A) (Applicable To Electrical Machinery, Plant And</span></blockquote>All five items are electrical machines, apparatus or portions of the electrical installation burnt by a lightning-induced surge (overvoltage). The proviso preserves cover only for other machines damaged by fire set up by the affected machine, and there was no fire. Every item is excluded under FP508A.01, so no item is admitted. The adjuster's assessed total of RM 100,950.00 is the but-for figure only.</td><td>Each item is an electrical machine, apparatus or portion of the electrical installation; no fire <span class=\"meta\">(Adjuster's report, Findings, Damage found per item)</span><br>Assessed amounts: 44,500.00; 28,600.00; 14,200.00; 9,750.00; 3,900.00 <span class=\"meta\">(Adjuster's report, Measurement)</span><br>Surge arrester and MCCB burnt; motors, drives and crane panel damaged by lightning-induced surge <span class=\"meta\">(Adjuster's report, Reports relied on (electrical engineer's report, 21 October 2024))</span></td></tr></table>\n<h3>Proximate cause</h3><p>lightning</p><p>Lightning struck the steel ridge finial on the roof of the adjoining unit No. 9 at about 3:41 pm on 17 October 2024. The strike induced a surge on the incoming low voltage supply and the shared earthing system, which passed through the main switchboard into the machines on the Insured's workshop floor. No fire ensued.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Claimed RM 104,450.00 in total, including RM 46,800.00 for the CNC turning centre and RM 15,400.00 for the compressor rewinding and starter (Incident report, email of 29 October 2024).</td><td>Assessed RM 100,950.00: the CNC turning centre reduced to RM 44,500.00 (commissioning charge at contract rate) and the compressor to RM 14,200.00 (starter priced at replacement part only) (Adjuster's report, Measurement).</td><td>Adjuster's assessed amounts. Under FP508A.01 they produce a but-for figure only.</td></tr><tr><td>A flash at the switchboard and every machine stopping at once, with the lightning striking the neighbour's roof (Incident report, email of 17 October 2024).</td><td>Strike point is the ridge finial on No. 9, about 15 metres away; the surge entered through the incoming supply and shared earthing (Adjuster's report, Cause and origin).</td><td>Adjuster's finding. The cause is lightning either way, so gate 2 is unchanged.</td></tr></table>\n<h3>Advice</h3><p>Lightning is an insured peril and the notice, claim-timing, and period gates are met. Gate 6 fails because FP508A.01 expressly removes liability for electrical machines, apparatus and portions of the electrical installation damaged by a lightning-induced surge, and the fire proviso does not apply because there was no fire. The payable figure is nil; the but-for figure of RM 100,950.00 is the adjuster's assessed amount before policy terms and is shown for information only. The examiner decides, including whether the FP508A.01 exclusion should have been applied at gate 5 rather than gate 6.</p>\n<p class=\"meta\">Governing clause: FP508A.01, Electrical Installations Clause (A), exclusion for electrical machine, apparatus or installation damaged by lightning-induced surge with no fire. The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 100,950.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM 1,100,000.00  value  RM 1,050,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM 1,500,000.00  value  RM 1,380,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM  250,000.00  value    RM 210,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 2, 3, 4, 5]</code></td></tr><tr><td><code>     subtotal          RM   100,950.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM   100,950.00</code></td></tr><tr><td><code>  CLAIMED             RM   100,950.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM   100,950.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 16 tool calls: 8 searches of the policy, 6 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP508A\"</td><td>Nothing in the wording answers this: an empty result, not an error.</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"FP508A.01\"</td><td><code>ENDORSEMENT-FP508A.01</code> override</td></tr>\n<tr><td>8</td><td><code>search_policy</code></td><td>\"electrical installations clause lightning surge electrical machinery\"</td><td><code>ENDORSEMENT-FP508A.01</code> override<br><code>ENDORSEMENT-FP508B</code> informational <span class=\"meta\">(not held: cannot override)</span></td></tr>\n<tr><td>9</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-10-17</td><td class=\"meta\">Incident report, email of 17 October 2024; Adjuster's report, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2024-07-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2025-06-30</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 17 October 2024 falls inside 1 July 2024 to 30 June 2025.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>lightning</td><td class=\"meta\">Adjuster's report, Cause and origin: lightning strike at about 3:41 pm on 17 October 2024</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Cause and origin: surge via incoming supply and shared earthing; no fire ensued</td></tr><tr><td><code>endorsements_held</code></td><td>FP508A.01</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: lightning, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-10-17</td><td class=\"meta\">Incident report, email of 17 October 2024</td></tr><tr><td><code>written_claim_date</code></td><td>2024-10-29</td><td class=\"meta\">Incident report, email from Harjit Singh of 29 October 2024 (written claim with list and amounts)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report; no extension in writing on file</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 29 October 2024, day 12 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP508A.01</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. No endorsement is required for a base peril.<span class=\"meta\"></span></td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 5, 5 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Warranties: None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy: one shift 8:00 am to 5:30 pm</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Adjuster's report: no change of interest noted</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 9</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>14</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>5 items</td><td class=\"meta\">Adjuster's report, Measurement and Findings: damage found per item; no fire, no flame, no charring outside the components</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>FP508A.01</b>. No item is admitted: every item claimed is excluded.<span class=\"meta\"><br>ref 1 excluded (FP508A.01); ref 2 excluded (FP508A.01); ref 3 excluded (FP508A.01); ref 4 excluded (FP508A.01); ref 5 excluded (FP508A.01)</span></td></tr>\n<tr><td>15</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>5 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 100,950.00<details><summary>Working</summary><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM 1,100,000.00  value  RM 1,050,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM 1,500,000.00  value  RM 1,380,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM  250,000.00  value    RM 210,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 2, 3, 4, 5]</code></div><div><code>     subtotal          RM   100,950.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM   100,950.00</code></div><div><code>  CLAIMED             RM   100,950.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM   100,950.00</code></div></details></td></tr>\n<tr><td>16</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2025-05106": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Tuesday, 22 April 2025</div><div class=\"msg out\">Assalamualaikum Encik Hew. Very big thunderstorm here in Temerloh this evening. At about 5 pm lightning struck the coconut tree behind my neighbour's house, very loud, the whole house shook. After that the main switch tripped and many of my electrical items cannot work<span class=\"t\">6:42 pm</span></div><div class=\"msg out\"><span class=\"att\">5 photos</span><span class=\"t\">6:43 pm</span></div><div class=\"msg in\"><span class=\"who\">Hew Kok Seng</span>Waalaikumsalam Puan Rosmawati. Is there any fire? Anybody hurt?<span class=\"t\">7:05 pm</span></div><div class=\"msg out\">No fire, no one hurt. Only burning smell from the TV and from the DB box at the kitchen. The TV, fridge, washing machine, two aircon, my son's laptop that was charging, the wifi and Astro box all not working. The porch light also cannot on<span class=\"t\">7:09 pm</span></div><div class=\"msg out\">The coconut tree trunk got a long black burnt line from top to bottom. My neighbour at No. 14 also his TV spoilt<span class=\"t\">7:10 pm</span></div><div class=\"msg in\"><span class=\"who\">Hew Kok Seng</span>Ok noted. Please do not switch on the items again. Call an electrician to check the DB and wiring first. Keep all the damaged items and take photos of the coconut tree. I will notify the insurance company tomorrow morning<span class=\"t\">7:22 pm</span></div><div class=\"day\">Wednesday, 23 April 2025</div><div class=\"msg in\"><span class=\"who\">Hew Kok Seng</span>Puan Rosmawati, insurance company notified. Please get the electrician's report and the repair reports for each item, then send me the claim with the list and amounts<span class=\"t\">9:30 am</span></div><div class=\"day\">Wednesday, 30 April 2025</div><div class=\"msg out\">Encik Hew, here is my claim for the lightning on 22 April<span class=\"t\">3:15 pm</span></div><div class=\"msg out\">1. 65 inch LED TV RM 4,200<br>2. Fridge 2 door inverter RM 3,100<br>3. Washing machine control board RM 780<br>4. Aircon control boards 2 units RM 1,600<br>5. DB box RCCB, 2 MCB and porch light wiring RM 1,450<br>6. Laptop RM 3,200<br>7. Wifi router and Astro decoder RM 620<br><b>Total RM 14,950</b><span class=\"t\">3:17 pm</span></div><div class=\"msg out\"><span class=\"att\">Electrician report 24 Apr.pdf</span> <span class=\"att\">Technician reports 25 Apr.pdf</span> <span class=\"att\">Laptop shop report 26 Apr.pdf</span> <span class=\"att\">Fridge quotation.pdf</span> <span class=\"att\">Receipts.pdf</span> <span class=\"att\">14 photos</span><span class=\"t\">3:18 pm</span></div><div class=\"msg out\">For the fridge the shop said better buy new one, but the repair man said can change the board only. I put the new one price first. No other insurance<span class=\"t\">3:20 pm</span></div><div class=\"msg in\"><span class=\"who\">Hew Kok Seng</span>Received Puan Rosmawati. Will submit to the insurance company today<span class=\"t\">3:41 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Mutiara Loss Adjusters Sdn Bhd</b> · Our ref MLA/PH/25/0391 · Report dated 21 May 2025 · Adjuster: Amirul Hakim bin Zainal</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>25 April 2025. House, distribution board, service cable entry, appliances and the rear compound inspected with the Insured; the coconut palm at the rear of the neighbouring lot, No. 14, inspected the same day with the neighbour's consent.</td></tr><tr><td>Cause and origin</td><td>Lightning strike during a thunderstorm at about 5:08 pm on 22 April 2025. The strike point is a coconut palm at the rear of No. 14, about 20 metres from the Insured's house: its crown is scorched and the bark is split in a continuous burnt strip down the trunk to the ground. The strike induced a surge on the overhead service cable to the house, which entered through the distribution board and the circuits beyond it and damaged the appliances and the electrical installation. No fire ensued: there is no flame, charring or smoke damage outside the burnt components, and no fire was reported or attended.</td></tr><tr><td>Reports relied on</td><td>Malaysian Meteorological Department record for Temerloh, 22 April 2025: thunderstorm from 4:35 pm to 6:20 pm. Malaysian Meteorological Department lightning detection record, 22 April 2025: cloud-to-ground strike at 5:08 pm located within 150 metres of the risk. Electrician's report by Temerloh Elektrik Jaya, registered wireman, 24 April 2025: RCCB and two MCBs burnt, porch lighting circuit cable insulation pitted at the external junction box; damage pattern consistent with a lightning-induced surge entering through the service cable; no fire. Appliance technician's reports, 25 April 2025, and laptop service centre report, 26 April 2025: main boards, control boards and power circuits burnt by overvoltage. Tenaga Nasional Berhad: no network fault recorded on the feeder that afternoon and supply not interrupted.</td></tr><tr><td>People interviewed</td><td>The Insured. Her neighbour at No. 14, whose television was also damaged. The registered wireman who prepared the electrician's report.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Occupied by the Insured and her family as their home.</td></tr><tr><td>Maintenance and prior defects</td><td>Wiring and distribution board otherwise sound on test after the event; no surge protection device fitted. No prior defect in the appliances reported or found.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey semi-detached house used as a private dwelling, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Television main board burnt. Refrigerator inverter control board burnt; compressor and cabinet sound. Washing machine control board burnt. Control boards of two wall-mounted air-conditioner indoor units burnt. RCCB and two MCBs in the distribution board burnt; porch lighting circuit cable damaged at the junction box. Laptop power circuit and motherboard burnt while on charge. Wifi router and pay-TV decoder burnt. No damage to the building fabric and no fire.</td></tr><tr><td>Discrepancies with the incident report</td><td>The refrigerator is claimed at the price of a new unit; it is repairable by replacing the inverter control board.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>65 inch LED television, main board burnt</td><td>Item 2 Household contents</td><td class=\"num\">4,200.00</td><td class=\"num\">4,200.00</td><td>Replacement; uneconomical to repair</td></tr><tr><td>2</td><td>Two-door inverter refrigerator</td><td>Item 2 Household contents</td><td class=\"num\">3,100.00</td><td class=\"num\">1,850.00</td><td>Repair: replacement of the inverter control board, technician's quotation; a new unit is not needed</td></tr><tr><td>3</td><td>Front-loading washing machine, control board</td><td>Item 2 Household contents</td><td class=\"num\">780.00</td><td class=\"num\">780.00</td><td>Repair invoice</td></tr><tr><td>4</td><td>Air-conditioner indoor unit control boards, two units</td><td>Item 1 Building (fixed installation)</td><td class=\"num\">1,600.00</td><td class=\"num\">1,600.00</td><td>Repair invoice</td></tr><tr><td>5</td><td>Distribution board RCCB and two MCBs; porch lighting circuit rewiring</td><td>Item 1 Building (electrical installation)</td><td class=\"num\">1,450.00</td><td class=\"num\">1,450.00</td><td>Electrician's invoice</td></tr><tr><td>6</td><td>Laptop computer, power circuit and motherboard burnt</td><td>Item 2 Household contents</td><td class=\"num\">3,200.00</td><td class=\"num\">2,900.00</td><td>Actual value: equivalent replacement less wear for two years' use</td></tr><tr><td>7</td><td>Wifi router and pay-TV decoder</td><td>Item 2 Household contents</td><td class=\"num\">620.00</td><td class=\"num\">620.00</td><td>Replacement</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>14,950.00</b></td><td class=\"num\"><b>13,400.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">320,000.00</td><td class=\"num\">300,000.00</td></tr><tr><td>Item 2 Household contents</td><td class=\"num\">80,000.00</td><td class=\"num\">72,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery: the surge came from lightning, not from a fault on the supply network.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 13,400.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PH/2025/001187</td></tr><tr><td>Insured</td><td>Rosmawati binti Che Lah (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 February 2025 to 31 January 2026</td></tr><tr><td>Risk address</td><td>12, Jalan Seri Mentakab 3, Taman Seri Temerloh, 28000 Temerloh, Pahang</td></tr><tr><td>Construction</td><td>Single-storey semi-detached house; brick walls, concrete floor, concrete tile roof on timber trusses; overhead service cable from the street pole</td></tr><tr><td>Occupation</td><td>Private dwelling</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">320,000.00</td></tr><tr><td>2</td><td>Household contents</td><td class=\"num\">80,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>400,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP508B</td><td>Electrical Installation Clause (B)</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire and lightning peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 22 April 2025 falls inside the schedule period 1 February 2025 to 31 January 2026. FC815 and receipt questions do not arise.</td><td>Date of loss 2025-04-22 <span class=\"meta\">(Incident report, 22 April 2025 entries; Adjuster's report, Cause and origin)</span><br>Period 2025-02-01 to 2026-01-31 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote><blockquote>no liability exists under this Policy for loss or damage to any electrical machine, apparatus, fixture or fitting, or to any portion of the electrical installation, unless caused by fire or lightning.<span class=\"cite\">FP508B: Electrical Installation Clause (B)</span></blockquote>Proximate cause is lightning, a base insured peril. No intervening event: the surge travelled from the strike through the service cable to the installation, and no fire occurred. FP508B is held and also brings lightning in for electrical machines and installation.</td><td>Lightning strike at about 5:08 pm; surge on service cable; no fire <span class=\"meta\">(Adjuster's report, Cause and origin)</span><br>Lightning detection record: strike within 150 metres of the risk <span class=\"meta\">(Adjuster's report, Investigation: Reports relied on)</span><br>Endorsement FP508B held <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Loss notified 23 April 2025 through the agent. Written claim with itemised list delivered 30 April 2025, day 8 of 15. The adjuster records no irregularities and no false declaration, so Condition 15 is not engaged.</td><td>Loss 22 April; agent notified insurer 23 April <span class=\"meta\">(Incident report, 22 and 23 April 2025 entries)</span><br>Written claim 30 April 2025 <span class=\"meta\">(Incident report, 30 April 2025, 3:15 pm)</span><br>Irregularities: None found <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Lightning is a base insured peril, so no endorsement is required to respond. FP508B is held in any case.</td><td>Endorsements held: FP508B <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>Under any of the following circumstances the insurance ceases to attach as regards the property affected unless the Insured, before the occurrence of any loss or damage, obtains the sanction of the Company<span class=\"cite\">Condition 9</span></blockquote>No warranties on the schedule. The building is occupied as the insured's home, as scheduled, so no change of occupation and no unoccupied period. No change of interest. No sanctions endorsed. FP508B carries no separate special condition that is engaged.</td><td>Warranties: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Occupied by the Insured and family as their home; private dwelling as scheduled <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Building did not fall or displace; Condition 4 not engaged <span class=\"meta\">(Adjuster's report, Cause and origin)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>no liability exists under this Policy for loss or damage to any electrical machine, apparatus, fixture or fitting, or to any portion of the electrical installation, unless caused by fire or lightning.<span class=\"cite\">FP508B: Electrical Installation Clause (B)</span></blockquote>All seven items are admitted as electrical damage caused by lightning with no fire, which the proviso allows. Item 2 (television, refrigerator, washing machine, laptop, wifi router and decoder) and Item 1 (air-conditioner control boards, distribution board and porch lighting wiring) are each within their schedule item. Assessed amounts are used: refrigerator at RM 1,850.00 (repair) and laptop at RM 2,900.00 (actual value). Total RM 13,400.00 against claimed RM 14,950.00. Item 1 value at risk RM 300,000.00 against sum insured RM 320,000.00; Item 2 RM 72,000.00 against RM 80,000.00; no average applied. No excess.</td><td>Measured and assessed items, total RM 13,400.00 <span class=\"meta\">(Adjuster's report, Measurement table)</span><br>Values at risk: Item 1 RM 300,000.00; Item 2 RM 72,000.00 <span class=\"meta\">(Adjuster's report, Measurement table)</span><br>Excess nil for fire and lightning <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr></table>\n<h3>Proximate cause</h3><p>Lightning</p><p>Lightning strike at about 5:08 pm on 22 April 2025 on a coconut palm about 20 metres from the house (Adjuster's report, Cause and origin). The strike induced a surge on the overhead service cable, which entered through the distribution board and the circuits beyond and damaged the appliances and the electrical installation. No fire ensued.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Refrigerator claimed at RM 3,100.00 as a new unit: the shop said a new one was better, and the claimant priced the new unit first.</td><td>Refrigerator is repairable by replacing the inverter control board; compressor and cabinet sound. Technician's quotation RM 1,850.00. A new unit is not needed.</td><td>Adjuster's finding applied: RM 1,850.00 for the repair.</td></tr><tr><td>Laptop claimed at RM 3,200.00.</td><td>Actual value after two years' wear: RM 2,900.00.</td><td>Adjuster's assessed RM 2,900.00 applied.</td></tr></table>\n<h3>Advice</h3><p>The claim passes all six gates. Lightning is the proximate cause with no fire and no intervening event, and the appliances and installation are covered because FP508B admits lightning damage to electrical machines. The examiner should note that the proviso turns on 'unless caused by fire or lightning', since there was no fire, so the appliance cover rests on the lightning limb. The adjuster's assessed figure of RM 13,400.00 is payable with no excess, and the refrigerator and laptop are taken at the adjuster's amounts rather than the claimant's. The examiner decides.</p>\n<p class=\"meta\">Governing clause: Operative clause (lightning, base peril), read with FP508B, Electrical Installation Clause (B), which admits electrical appliances and installation damaged by lightning.. The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 13,400.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  320,000.00  value    RM 300,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   80,000.00  value     RM 72,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 2, 3, 4, 5, 6, 7]</code></td></tr><tr><td><code>     subtotal          RM    13,400.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM    13,400.00</code></td></tr><tr><td><code>  CLAIMED             RM    13,400.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    13,400.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 14 tool calls: 6 searches of the policy, 6 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP508B\"</td><td><code>ENDORSEMENT-FP508B</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2025-04-22</td><td class=\"meta\">Incident report, 22 April 2025 entries; Adjuster's report, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2025-02-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2026-01-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 22 April 2025 falls inside 1 February 2025 to 31 January 2026.<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>lightning</td><td class=\"meta\">Adjuster's report, Cause and origin: lightning strike at about 5:08 pm, surge on overhead service cable</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Cause and origin: no fire ensued; no separate event between strike and damage</td></tr><tr><td><code>endorsements_held</code></td><td>FP508B</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: lightning, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2025-04-22</td><td class=\"meta\">Incident report, 22 April 2025</td></tr><tr><td><code>written_claim_date</code></td><td>2025-04-30</td><td class=\"meta\">Incident report, 30 April 2025 claim message (3:15 pm)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report, 23 April 2025: notice given; no written extension on file</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Irregularities: None found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 30 April 2025, day 8 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP508B</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. No endorsement is required for a base peril.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 5, 5 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: occupied as home, private dwelling as scheduled</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Incident report: insured's own claim; no change of interest recorded</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 9</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>7 items</td><td class=\"meta\">Adjuster's report, Measurement table</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. 7 of 7 items admitted.<span class=\"meta\"><br>ref 1 admitted; ref 2 admitted; ref 3 admitted; ref 4 admitted; ref 5 admitted; ref 6 admitted; ref 7 admitted</span></td></tr>\n<tr><td>13</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>7 items, sums insured and values at risk</td><td><span class=\"chip ok\">Payable</span> RM 13,400.00<details><summary>Working</summary><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  320,000.00  value    RM 300,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   80,000.00  value     RM 72,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 2, 3, 4, 5, 6, 7]</code></div><div><code>     subtotal          RM    13,400.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM    13,400.00</code></div><div><code>  CLAIMED             RM    13,400.00</code></div><div><code>  RECOMMENDED PAYABLE RM    13,400.00</code></div></details></td></tr>\n<tr><td>14</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-11564": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Monday, 9 September 2024</div><div class=\"msg out\">Ms Goh sorry to message so late. Big fight outside my restaurant just now, after the football match. Two groups, maybe 20 people. They threw our chairs into the glass front, the door glass all broken, tables overturned<span class=\"t\">12:48 am</span></div><div class=\"msg out\"><span class=\"att\">7 photos</span> <span class=\"att\">1 video</span><span class=\"t\">12:49 am</span></div><div class=\"msg out\">Police came, caught some of them. Nobody from my staff hurt but very scared<span class=\"t\">12:51 am</span></div><div class=\"msg in\"><span class=\"who\">Goh Swee Lan</span>Kumaran, so sorry, glad your staff are ok. Please make a police report today and get a copy. Keep all the broken things, take photos before cleaning. I will notify the insurance company this morning<span class=\"t\">7:35 am</span></div><div class=\"msg out\">Ok. One more thing, during the fight someone took the cash from the till at the front counter. And the POS machine and drinks chiller also smashed<span class=\"t\">7:42 am</span></div><div class=\"msg in\"><span class=\"who\">Goh Swee Lan</span>Noted. I have notified the insurance company. Send me the claim with the list and amounts, quotations and the police report<span class=\"t\">10:05 am</span></div><div class=\"day\">Monday, 16 September 2024</div><div class=\"msg out\">Ms Goh, here is my claim for 8 Sep night<span class=\"t\">3:20 pm</span></div><div class=\"msg out\">1. Glass front and glass door RM 9,800<br>2. Tables and chairs RM 6,300<br>3. POS terminal and drinks display chiller RM 5,400<br>4. Drinks stock broken RM 1,250<br>5. Cash taken from till RM 1,850<br>6. Closed 3 days, loss of business RM 4,500<br><b>Total RM 29,100</b><span class=\"t\">3:22 pm</span></div><div class=\"msg out\"><span class=\"att\">Police report Seremban 9 Sep.pdf</span> <span class=\"att\">Glass quotation Kaca Jaya 12 Sep.pdf</span> <span class=\"att\">Furniture and equipment quotation.pdf</span> <span class=\"att\">Drinks invoices.pdf</span> <span class=\"att\">Daily sales record Sep.pdf</span> <span class=\"att\">CCTV clips</span><span class=\"t\">3:23 pm</span></div><div class=\"msg out\">No other insurance<span class=\"t\">3:24 pm</span></div><div class=\"msg in\"><span class=\"who\">Goh Swee Lan</span>Received Kumaran, submitting to the insurance company now<span class=\"t\">3:40 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Bayu Loss Adjusters Sdn Bhd</b> · Our ref BLA/NS/24/0917 · Report dated 30 September 2024 · Adjuster: Azlan Shah bin Kamarudin</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>10 September 2024. Ground floor restaurant and five-foot way inspected with the Insured. Broken glass and damaged furniture retained in the rear store.</td></tr><tr><td>Cause and origin</td><td>A fight between two groups of football supporters, about 20 persons, spilled from the street onto the five-foot way at about 11:30 pm on 8 September 2024. Chairs and tables were thrown at the shopfront; the glass panels and door were broken; the counter equipment was struck. During the commotion one person reached over the counter and removed cash from the till. No fire occurred.</td></tr><tr><td>Reports relied on</td><td>Police report lodged by the Insured at Seremban district police headquarters, 9 September 2024. Police statement to the press, 9 September 2024: a public disturbance involving about 20 persons after a football match, nine arrested, the scene cleared by 12:15 am. CCTV footage from the restaurant camera, 11:28 pm to 11:44 pm.</td></tr><tr><td>People interviewed</td><td>The Insured. The cashier on duty. Two waiters. The operator of the adjoining shop, whose glass door was also broken.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Restaurant trading, staff and customers present at the time.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant.</td></tr><tr><td>Risk as found against the schedule</td><td>Ground floor of a three-storey shophouse used as a restaurant, as scheduled. Commercial premises; no residential use.</td></tr><tr><td>Damage found per item</td><td>Four glass shopfront panels and the glass door broken; five tables and 22 chairs broken; POS terminal and display chiller struck and inoperable; drinks stock in the chiller broken. Cash taken from the till during the disturbance, seen on CCTV.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material.</td></tr><tr><td>Irregularities</td><td>None found. The disturbance is confined to one street for about 45 minutes; police describe it as a fight between supporters, with no political or other organised motive.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Glass shopfront panels and glass door</td><td>Item 1 Renovation, fixtures and fittings</td><td class=\"num\">9,800.00</td><td class=\"num\">9,800.00</td><td>Replacement, quotation checked</td></tr><tr><td>2</td><td>Tables (5) and chairs (22)</td><td>Item 2 Furniture and equipment</td><td class=\"num\">6,300.00</td><td class=\"num\">6,300.00</td><td>Replacement</td></tr><tr><td>3</td><td>POS terminal and drinks display chiller</td><td>Item 2 Furniture and equipment</td><td class=\"num\">5,400.00</td><td class=\"num\">5,400.00</td><td>Replacement, model for model</td></tr><tr><td>4</td><td>Bottled and canned drinks broken</td><td>Item 3 Stock</td><td class=\"num\">1,250.00</td><td class=\"num\">1,250.00</td><td>Cost price per invoices</td></tr><tr><td>5</td><td>Cash taken from the till</td><td>None</td><td class=\"num\">1,850.00</td><td class=\"num\">1,850.00</td><td>Per till reading at close of the previous shift</td></tr><tr><td>6</td><td>Three days' loss of business</td><td>None</td><td class=\"num\">4,500.00</td><td class=\"num\">4,500.00</td><td>Insured's figures</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>29,100.00</b></td><td class=\"num\"><b>29,100.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Renovation, fixtures and fittings</td><td class=\"num\">150,000.00</td><td class=\"num\">140,000.00</td></tr><tr><td>Item 2 Furniture and equipment</td><td class=\"num\">90,000.00</td><td class=\"num\">85,000.00</td></tr><tr><td>Item 3 Stock</td><td class=\"num\">20,000.00</td><td class=\"num\">15,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. Recovery from the persons arrested is theoretically open but none is identified as responsible for specific items.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 29,100.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/NS/2024/001302</td></tr><tr><td>Insured</td><td>Kumaran a/l Selvaraj, trading as Restoran Daun Pisang Kumaran (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 April 2024 to 31 March 2025</td></tr><tr><td>Risk address</td><td>Ground floor, 52, Jalan Dato Bandar Tunggal, 70000 Seremban, Negeri Sembilan</td></tr><tr><td>Construction</td><td>Ground floor of a three-storey intermediate shophouse; brick walls, reinforced concrete slabs, concrete roof</td></tr><tr><td>Occupation</td><td>Restaurant (tenant's interest: renovation, fixtures, fittings, furniture, equipment and stock)</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Renovation, fixtures and fittings</td><td>150,000.00</td></tr><tr><td>2</td><td>Furniture and equipment</td><td>90,000.00</td></tr><tr><td>3</td><td>Stock</td><td>20,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>260,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not insured</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP512B</td><td>Riot Strike and Malicious Damage, Other Than Residential Properties</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 8 September 2024 falls within the period 1 April 2024 to 31 March 2025. FC815 and the premium and receipt questions do not arise.</td><td>Date of loss 2024-09-08 <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Period 2024-04-01 to 2025-03-31 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote><blockquote>Loss of or damage to property insured directly caused by :- 1. The act of any person taking part together with other in any disturbance of the public peace<span class=\"cite\">FP512B: Riot Strike And Malicious Damage - Other Than Residential Properties</span></blockquote>Proximate cause is riot. It is not fire or lightning, so the operative clause alone does not respond. FP512B brings riot in and is held on the schedule. No intervening event: the cash theft occurred during the same disturbance and is dealt with at gate 6. Gate 2 passes whether or not FP512B is held; gate 4 tests holding.</td><td>Cause: fight between two groups of football supporters, about 20 persons, chairs and tables thrown at the shopfront <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Police statement: public disturbance, about 20 persons, nine arrested, no political or other organised motive <span class=\"meta\">(Adjuster's report, Investigation, Reports relied on and Findings, Irregularities)</span><br>FP512B held <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Loss 8 September 2024; written claim 16 September 2024, day 8 of 15. No written extension is needed. The adjuster found no irregularities and no false declaration. The agent's notice on 9 September is notice only; it is not the written claim.</td><td>Written claim sent 16 September 2024, 3:20 pm <span class=\"meta\">(Incident report, WhatsApp 16 September 2024)</span><br>No irregularities found <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>RIOT STRIKE AND MALICIOUS DAMAGE - OTHER THAN RESIDENTIAL PROPERTIES<span class=\"cite\">FP512B: Riot Strike And Malicious Damage - Other Than Residential Properties</span></blockquote>FP512B is on the schedule and answers riot. The risk is a non-residential restaurant, which fits the endorsement's scope. No flag.</td><td>FP512B on schedule <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Commercial restaurant; no residential use <span class=\"meta\">(Adjuster's report, Findings, Risk as found against the schedule)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>Loss or damage occasioned by permanent or temporary dispossession<span class=\"cite\">FP512B: Riot Strike And Malicious Damage - Other Than Residential Properties</span></blockquote><blockquote>the insurance ceases to attach as regards the property affected unless the Insured, before the occurrence of any loss or damage, obtains the sanction of the Company<span class=\"cite\">Condition 9</span></blockquote>FP512B Special Condition 6 (popular rising, terrorism) is not engaged: the police describe a fight between supporters with no political or organised motive, confined to one street for about 45 minutes. No warranties on the schedule. Restaurant trading at the date of loss, so no change of occupation and no unoccupied period. No interest passed. No sanction endorsed, and none needed. Building did not fall or displace.</td><td>No political or other organised motive; confined to one street about 45 minutes <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span><br>Restaurant trading, staff and customers present <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Warranties: None; Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>(e) Securities, obligations, or documents of any kind, stamps, coined or paper money, cheques, books of accounts or other business books, or computer systems records.<span class=\"cite\">FP512B: Riot Strike And Malicious Damage - Other Than Residential Properties</span></blockquote><blockquote>(a) Loss of earnings, loss by delay, loss of market or other consequential or indirect loss or damage of any kind or description whatsoever.<span class=\"cite\">FP512B: Riot Strike And Malicious Damage - Other Than Residential Properties</span></blockquote>Items 1 to 4 are insured damage to scheduled items and are admitted. Item 5, cash from the till (RM 1,850.00), is money: excluded by substituted Condition 8(e), and the schedule states money and cash is not insured. Item 6, three days' loss of business (RM 4,500.00), is consequential loss: excluded by Condition 5(a). The theft occurred during the disturbance; the damage to glass, furniture, equipment and stock is claimed under riot limb 1, not the malicious damage extension, so the theft limb of that extension is not engaged for those items.</td><td>Glass RM 9,800.00 (Item 1); tables and chairs RM 6,300.00 and POS and chiller RM 5,400.00 (Item 2); drinks stock RM 1,250.00 (Item 3) <span class=\"meta\">(Adjuster's report, Measurement table)</span><br>Cash RM 1,850.00 taken from the till, seen on CCTV <span class=\"meta\">(Adjuster's report, Investigation and Measurement)</span><br>Money and cash: Not insured <span class=\"meta\">(Schedule, Sums insured)</span><br>Loss of business RM 4,500.00, insured's figures <span class=\"meta\">(Adjuster's report, Measurement table)</span></td></tr></table>\n<h3>Proximate cause</h3><p>Riot: a disturbance of the public peace by about 20 football supporters, outside the insured restaurant, at about 11:30 pm on 8 September 2024. Chairs and tables were thrown at the shopfront and the counter equipment was struck.</p><p>Fight between two groups of supporters spilled onto the five-foot way; thrown furniture broke the glass shopfront panels and door, struck the POS terminal and drinks chiller, and broke drinks stock. During the commotion one person reached over the counter and took cash from the till (seen on CCTV). No fire.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Claim of loss of business: closed three days, loss of business RM 4,500.00 (incident report, 16 September 2024).</td><td>Measured at RM 4,500.00 on the insured's own figures; not independently verified.</td><td>The adjuster's amount is used for the calculation, but the item is excluded under FP512B Condition 5(a), so it does not reach the payable figure.</td></tr></table>\n<h3>Advice</h3><p>The claim passes all six gates. Riot is brought in by FP512B, which is held, and the damage to the glass, furniture, equipment and drinks stock is insured. The cash (RM 1,850.00) is excluded as money, and the business loss (RM 4,500.00) is excluded as consequential loss. The calculation returns RM 22,750.00 payable, with no average and no excess. The examiner decides.</p>\n<p class=\"meta\">Governing clause: FP512B, riot limb 1 (insuring clause), with Special Condition 5(a) and substituted Condition 8(e) for the excluded items. The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 22,750.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 5  RM     1,850.00  EXCLUDED by FP512B substituted Condition 8(e)  (Cash taken from the till)</code></td></tr><tr><td><code>  ref 6  RM     4,500.00  EXCLUDED by FP512B substituted Condition 5(a)  (Three days' loss of business)</code></td></tr><tr><td><code>  excluded total       RM     6,350.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  150,000.00  value    RM 140,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   90,000.00  value     RM 85,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM   20,000.00  value     RM 15,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP512B] refs [1, 2, 3, 4]</code></td></tr><tr><td><code>     subtotal          RM    22,750.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM    22,750.00</code></td></tr><tr><td><code>  CLAIMED             RM    29,100.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    22,750.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/
