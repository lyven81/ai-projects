chedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP503\"</td><td><code>ENDORSEMENT-FP503</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>7</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-05-21</td><td class=\"meta\">Incident report, email of 22 May 2024 and Adjuster's report, Investigation</td></tr><tr><td><code>period_start</code></td><td>2023-10-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-09-30</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 21 May 2024 falls inside 1 October 2023 to 30 September 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>storm</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: rain driven by the storm of 21 May 2024 overflowed the rear box gutter and entered through window frame sealant gaps</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: blocked gutter and cracked sealant are prior defects, not a new event</td></tr><tr><td><code>endorsements_held</code></td><td>FP503</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP503</b>. Proximate cause: storm. Not a base peril; FP503 brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-05-21</td><td class=\"meta\">Incident report, email of 22 May 2024</td></tr><tr><td><code>written_claim_date</code></td><td>2024-05-28</td><td class=\"meta\">Incident report, claimant email 'Claim for storm damage 21 May 2024' of 28 May 2024</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report, no written extension by the Company appears</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 28 May 2024, day 7 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP503</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP503</b>. FP503 is on the schedule and answers the cause.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 5, 7 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: occupied as home</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Schedule, insured is the policyholder; no transfer reported</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr><tr><td><code>water_or_rain_damage_claimed</code></td><td>True</td><td class=\"meta\">Incident report, claim email of 28 May 2024 items 1-4; Adjuster's report, Findings, Damage found per item</td></tr><tr><td><code>wind_damaged_roof_or_walls_first</code></td><td>False</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: all roof tiles in place; no tile, ridge or wall displaced or broken by wind</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>FP503 Special Condition 1</b>. Rain or water damage is covered only where the wind first damaged the roof or walls and the water entered through those openings.<span class=\"meta\"><br>FP503 Special Condition 1 fail; Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>12</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>4 items, sums insured and values at risk</td><td><span class=\"chip err\">invalid_items</span> sums_insured and values_at_risk map schedule item numbers to amounts.</td></tr>\n<tr><td>13</td><td><code>calculate_payable</code></td><td>4 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 14,200.00<details><summary>Working</summary><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  350,000.00  value    RM 330,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   50,000.00  value     RM 45,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [FP503] refs [1, 2, 3, 4]</code></div><div><code>     subtotal          RM    14,400.00</code></div><div><code>     excess            RM       200.00   Lesser of (a) 1.0% of total sums insured RM 400,000.00 = RM 4,000.00, or (b) RM 200.00. Lesser = RM 200.00.</code></div><div><code>     net               RM    14,200.00</code></div><div><code>  CLAIMED             RM    14,400.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM    14,200.00</code></div></details></td></tr>\n<tr><td>14</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2025-00417": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Saturday, 4 January 2025</div><div class=\"msg out\">Ai Ling, sorry early message. Around 4am we heard a loud rumble behind the house. The slope behind our row slipped after all the rain this week. The retaining wall at the back pushed over and the back wall of my kitchen is cracked badly, big gap at the bottom<span class=\"t\">6:22 am</span></div><div class=\"msg out\"><span class=\"att\">7 photos</span><span class=\"t\">6:23 am</span></div><div class=\"msg in\"><span class=\"who\">Tan Ai Ling</span>Arvind, are you all safe?? Please get out of the kitchen area. Call Bomba and MPAJ<span class=\"t\">6:50 am</span></div><div class=\"msg out\">Yes all safe. Bomba and MPAJ came already, they taped the back. We are staying in the front part of the house<span class=\"t\">6:58 am</span></div><div class=\"msg in\"><span class=\"who\">Tan Ai Ling</span>I have notified the insurance company. Your policy has the landslip endorsement. Please get the MPAJ letter and an engineer's report, then send me the claim with amounts<span class=\"t\">9:15 am</span></div><div class=\"day\">Wednesday, 15 January 2025</div><div class=\"msg out\">Ai Ling, here is my claim for the landslip on 4 Jan<span class=\"t\">9:40 pm</span></div><div class=\"msg out\">1. Rear wall rebuild and foundation underpinning RM 68,000<br>2. Kitchen floor slab break and recast RM 14,500<br>3. Kitchen cabinets and wall tiles RM 6,800<br>4. Rear retaining wall RM 22,000<br>5. Front driveway cracks repair RM 4,800<br><b>Total RM 116,100</b><span class=\"t\">9:43 pm</span></div><div class=\"msg out\"><span class=\"att\">MPAJ inspection letter 6 Jan.pdf</span> <span class=\"att\">Geotechnical engineer report 11 Jan.pdf</span> <span class=\"att\">Contractor quotation 13 Jan.pdf</span> <span class=\"att\">24 photos</span><span class=\"t\">9:44 pm</span></div><div class=\"msg out\">No other insurance. The house is mine, mortgage with the bank<span class=\"t\">9:45 pm</span></div><div class=\"msg in\"><span class=\"who\">Tan Ai Ling</span>Received Arvind, will submit tomorrow morning<span class=\"t\">10:02 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Teratai Adjusters Sdn Bhd</b> · Our ref TAS/SL/25/0021 · Report dated 31 January 2025 · Adjuster: Khairul Anuar bin Mustafa</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>7 January 2025, with the Insured and his geotechnical engineer; the slope behind the row inspected from the rear lane.</td></tr><tr><td>Cause and origin</td><td>Shallow landslip of the cut slope behind Nos. 21 to 27 after prolonged rainfall from 29 December 2024. The slipped soil mass pushed the rear retaining wall of the lot over and moved the ground beneath the rear external wall of the house: the strip footing under that wall settled about 40 mm and rotated, cracking the wall and the kitchen floor slab which rests on it.</td></tr><tr><td>Reports relied on</td><td>Ampang Jaya Municipal Council inspection letter, 6 January 2025: slope failure behind the row, rear areas of four houses cordoned. Geotechnical engineer's report by Ir. Ng Kian Seng, 11 January 2025: rain-induced slope failure; the house foundations were built to the approved drawings and are not defective; the slope is not near any river or the coast; no demolition, alteration or repair works were under way. Department of Irrigation and Drainage rainfall records for Ampang, 29 December 2024 to 4 January 2025.</td></tr><tr><td>People interviewed</td><td>The Insured. The engineer. The owners of Nos. 23 and 25, whose rear walls are also cracked.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Occupied by the Insured and his family as their home; the rear kitchen cordoned off since the loss, the family living in the front of the house.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant to the rear of the house. The front driveway shows hairline and 3 mm cracks with dirt and moss in them, consistent with settlement of the driveway fill over several years; the engineer finds no ground movement at the front of the lot on 4 January 2025.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey end terrace house used as a private dwelling, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Rear external wall cracked through with the footing beneath it settled; kitchen floor slab cracked and dropped at the rear edge; kitchen cabinets and tiles cracked by the movement; rear retaining wall overturned. Front driveway cracks not caused by this event.</td></tr><tr><td>Discrepancies with the incident report</td><td>The claim includes the front driveway; its cracking predates the loss and is unrelated to the slip at the rear.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Rear external wall rebuild and foundation underpinning</td><td>Item 1 Building</td><td class=\"num\">68,000.00</td><td class=\"num\">64,000.00</td><td>Reinstatement per engineer's design; rates adjusted</td></tr><tr><td>2</td><td>Kitchen floor slab, break out and recast</td><td>Item 1 Building</td><td class=\"num\">14,500.00</td><td class=\"num\">14,500.00</td><td>Quotation checked</td></tr><tr><td>3</td><td>Built-in kitchen cabinets and wall tiles</td><td>Item 1 Building</td><td class=\"num\">6,800.00</td><td class=\"num\">6,800.00</td><td>Replacement</td></tr><tr><td>4</td><td>Rear retaining wall within the lot boundary</td><td>Item 1 Building</td><td class=\"num\">22,000.00</td><td class=\"num\">22,000.00</td><td>Reinstatement per engineer's design</td></tr><tr><td>5</td><td>Front driveway cracks</td><td>Item 1 Building</td><td class=\"num\">4,800.00</td><td class=\"num\">4,800.00</td><td>Quotation</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>116,100.00</b></td><td class=\"num\"><b>112,100.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">600,000.00</td><td class=\"num\">580,000.00</td></tr><tr><td>Item 2 Household contents</td><td class=\"num\">80,000.00</td><td class=\"num\">70,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. The house is charged to a bank. Possible recovery from the owner of the slope is under review by the municipal council; none at the date of this report.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 107,300.00 for the damage caused by the landslip, excluding the front driveway (RM 4,800.00), before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/SL/2024/012905</td></tr><tr><td>Insured</td><td>Arvind a/l Balakrishnan (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 April 2024 to 31 March 2025</td></tr><tr><td>Risk address</td><td>27, Jalan Bukit Indah 4, Taman Bukit Indah, 68000 Ampang, Selangor</td></tr><tr><td>Construction</td><td>Two-storey end terrace house; reinforced concrete frame on strip and pad footings, brick walls, concrete tile roof; rear retaining wall within the lot</td></tr><tr><td>Occupation</td><td>Private dwelling</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">600,000.00</td></tr><tr><td>2</td><td>Household contents</td><td class=\"num\">80,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>680,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP510</td><td>Subsidence and Landslip Endorsement, Standard Cover</td></tr><tr><td>FC806B</td><td>Mortgagee (Chargee) Clause 2</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 4 January 2025 falls inside the schedule period 1 April 2024 to 31 March 2025. FC815 and renewal facts are not needed.</td><td>Date of loss 2025-01-04 <span class=\"meta\">(Incident report, 4 January 2025 message; Adjuster's report, Cause and origin)</span><br>Period 2024-04-01 to 2025-03-31 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>caused by subsidence and/or heave of the site on which the buildings stand or land belonging thereto, or landslip excluding<span class=\"cite\">FP510: Subsidence And Landslip Endorsement - Standard Cover</span></blockquote>Proximate cause is landslip, which is not a base peril. FP510 brings it in. No intervening event: the engineer attributes the slope failure to rain, and the rain is the start of the same sequence, not a new independent event.</td><td>Shallow landslip after prolonged rainfall; no intervening event <span class=\"meta\">(Adjuster's report, Cause and origin; Reports relied on (engineer's report, 11 January 2025))</span><br>FP510 held <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim sent 15 January 2025, day 11 after the 4 January loss, within 15 days. No fraud or false declaration found. The 4 January WhatsApp message gave immediate notice.</td><td>Written claim 2025-01-15 <span class=\"meta\">(Incident report, 15 January 2025 claim message)</span><br>Irregularities: none found <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>the insurance under this Policy shall extend to cover loss or damage to the property insured caused by subsidence and/or heave of the site on which the buildings stand or land belonging thereto, or landslip<span class=\"cite\">FP510: Subsidence And Landslip Endorsement - Standard Cover</span></blockquote>FP510 is on the schedule and answers the landslip cause. The building is a two-storey end terrace, so no variant mismatch arises.</td><td>Endorsements FP510 and FC806B held <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>(b) loss or damage to or resulting from movement of solid floor slabs unless the foundation beneath the external walls of the Buildings are damaged by the same cause and at the same time.<span class=\"cite\">FP510: Subsidence And Landslip Endorsement - Standard Cover</span></blockquote><blockquote>(c) loss or damage occasioned by happening through, or in consequence of:- l coastal or river erosion. l demolition, structural alteration or structural repair. l defective design or inadequate construction of foundations.<span class=\"cite\">FP510: Subsidence And Landslip Endorsement - Standard Cover</span></blockquote><blockquote>(b) If the building insured or containing the insured property becomes unoccupied and so remains for a period of more than thirty (30) days.<span class=\"cite\">Condition 9</span></blockquote><blockquote>shall cease immediately upon any fall or displacement<span class=\"cite\">Condition 4</span></blockquote>No FP510 exclusion (c) applies: the foundations were built to the approved drawings, the slope is not near a river or the coast, and no works were under way. The floor slab movement is admitted under FP510(b) because the footing under the external wall was damaged by the same cause at the same time. The house was occupied as a family home, with no change of occupation, no unoccupied period, no passing of interest and no sanction required. No warranties. The rear wall cracked and the footing settled, but the building did not fall or displace, so Condition 4 is not engaged.</td><td>Occupied as family home; rear kitchen cordoned off <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Foundations built to approved drawings, not defective; no river or coast; no works under way <span class=\"meta\">(Adjuster's report, Reports relied on (engineer's report))</span><br>Warranties: None; Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Interest is the Insured's own; mortgage to the bank only <span class=\"meta\">(Incident report, 15 January 2025 message)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>(a) loss or damage to swimming pools, terraces, patios, drives, footpaths, walls, gates or fences unless the building, its outbuildings or garages are damaged by the same cause and at the same time.<span class=\"cite\">FP510: Subsidence And Landslip Endorsement - Standard Cover</span></blockquote>Four items admitted at RM 107,300.00 assessed: rear wall RM 64,000.00, kitchen floor slab RM 14,500.00, cabinets and tiles RM 6,800.00, rear retaining wall RM 22,000.00. The front driveway (RM 4,800.00) is excluded as not caused by this event; its cracks predate the loss and the engineer finds no ground movement at the front. The adjuster's assessed total of RM 112,100.00 includes the driveway. The claimed RM 116,100.00 includes the driveway and a rear wall figure of RM 68,000.00 that the adjuster reduced to RM 64,000.00 on rates.</td><td>Item assessments: 64,000 / 14,500 / 6,800 / 22,000 / 4,800 <span class=\"meta\">(Adjuster's report, Measurement table)</span><br>Driveway cracks not caused by this event <span class=\"meta\">(Adjuster's report, Findings, Discrepancies with the incident report)</span></td></tr></table>\n<h3>Proximate cause</h3><p>Subsidence or landslip: shallow landslip of the cut slope behind Nos. 21 to 27 after prolonged rainfall from 29 December 2024. The slipped soil pushed the rear retaining wall over and moved the ground under the rear external wall, so the strip footing settled about 40 mm and rotated.</p><p>Prolonged rain, then slope failure (the dominant cause), then the retaining wall overturned and the footing under the rear external wall settled, cracking the wall and the kitchen floor slab.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Incident report, 15 January 2025: claim of RM 116,100.00 includes front driveway cracks repair (RM 4,800.00) as landslip damage, and rear wall rebuild at RM 68,000.00.</td><td>Front driveway cracking predates the loss and is not caused by this event; engineer finds no ground movement at the front on 4 January 2025. Rear wall rebuild assessed at RM 64,000.00 on rates.</td><td>Driveway excluded (RM 4,800.00 not admitted). Rear wall admitted at RM 64,000.00.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>Excess: FP510(d) takes 5% of the total sum insured (RM 34,000.00) or RM 25,000.00, whichever is lower, so RM 25,000.00 applies. The adjuster's conclusion of RM 107,300.00 is before excess.</li><li>Possible recovery from the owner of the slope is under review by the municipal council (adjuster's report). The examiner should consider it for subrogation, and the mortgagee under FC806B (house charged to a bank) should be considered in any payment.</li></ul>\n<h3>Advice</h3><p>The claim passes all six gates under FP510 for landslip, with the front driveway excluded as unrelated to the event. Working: admitted items of RM 107,300.00 less the FP510 excess of RM 25,000.00 gives RM 82,300.00. The sums insured (Item 1 RM 600,000.00; Item 2 RM 80,000.00) are not exceeded and no average applies. The examiner decides the claim, including the excess application and the recovery and mortgagee points.</p>\n<p class=\"meta\">Governing clause: FP510 (insuring wording, exclusions (a) and (d)); Condition 9(b). The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 82,300.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 5  RM     4,800.00  EXCLUDED by FP510 (damage not caused by the insured event)  (Front driveway cracks)</code></td></tr><tr><td><code>  excluded total       RM     4,800.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  600,000.00  value    RM 580,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   80,000.00  value     RM 70,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP510] refs [1, 2, 3, 4]</code></td></tr><tr><td><code>     subtotal          RM   107,300.00</code></td></tr><tr><td><code>     excess            RM    25,000.00   Lower of 5.0% of sum insured RM 34,000.00 or RM 25,000.00. Lower = RM 25,000.00.</code></td></tr><tr><td><code>     net               RM    82,300.00</code></td></tr><tr><td><code>  CLAIMED             RM   112,100.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    82,300.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 15 tool calls: 7 searches of the policy, 6 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><
