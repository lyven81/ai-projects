*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.65 "Segoe UI",Arial,sans-serif}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:8px}

a{color:var(--accent)}

th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--box);color:var(--navy)}
td.num,th.num{text-align:right;white-space:nowrap}

<script>
const TABS=[["incident","1. Incident report"],["adjuster","2. Adjuster's report"],["schedule","3. Policy schedule"],["advice","4. Underwriter's advice"],["hood","5. Under the hood"]];
const DATA={"CLM-2021-05512": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ooi Bee Choo &lt;[redacted]&gt;<br><b>To:</b> Cheah Lay Hoon &lt;[redacted]&gt;<br><b>Date:</b> Monday, 2 August 2021, 10:20 am<br><b>Subject:</b> Shop at 88 Lebuh Chulia broken into</div><p>Dear Ms Cheah,</p>\n<p>I am Ooi Bee Choo, I run the provision shop at 88, Lebuh Chulia, George Town. My son is helping me write this email.</p>\n<p>My shop was broken into on the night of 14 July. I closed the shop at about 10 pm on 14 July and went upstairs, we stay on the first floor. When I came down at about 6.30 am on 15 July, the back service door was open, the folding steel grille was forced up at the bottom track and the shop was in a mess.</p>\n<p>They took cigarettes, canned food, cooking oil and infant formula from the shelves and from the back store. The cash drawer under the front counter was prised open and emptied. Inside was about RM 9,500 in notes and coins, my takings from 12 to 14 July that I had not banked in yet.</p>\n<p>I made a police report at Balai Polis Patani Road the same morning at 9.12 am, report number GTN/007744/21. There was no fire, no smoke, nothing like that at any time. Only the back door, its frame and the grille were damaged.</p>\n<p>I did not inform you earlier because I thought this is only a police matter. Last week my son said maybe the shop policy can claim, so I am writing to you now. The shop has been insured with the same company for many years, every year renew. I do not keep the old schedules, only the current one.</p>\n<p>Please let me know what to do.</p>\n<p>Thank you,<br>Ooi Bee Choo<br>Tel: [redacted]</p>\n<p><b>Attachments:</b> Police report GTN-007744-21.pdf; 6 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Cheah Lay Hoon &lt;[redacted]&gt;<br><b>To:</b> Ooi Bee Choo &lt;[redacted]&gt;<br><b>Date:</b> Monday, 2 August 2021, 2:40 pm<br><b>Subject:</b> Re: Shop at 88 Lebuh Chulia broken into</div><p>Dear Madam Ooi,</p>\n<p>Sorry to hear about this. I have notified the insurance company today. Please send me the written claim with the list of items and amounts, together with the police report, photos, your stock list and invoices, and the repair quotation. If you can find any schedule or renewal notice for the earlier years, please send it also.</p>\n<p>Regards,<br>Lay Hoon</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ooi Bee Choo &lt;[redacted]&gt;<br><b>To:</b> Cheah Lay Hoon &lt;[redacted]&gt;<br><b>Date:</b> Friday, 6 August 2021, 4:05 pm<br><b>Subject:</b> Claim for break-in 15 July 2021, 88 Lebuh Chulia</div><p>Dear Ms Cheah,</p>\n<p>My claim for the break-in on the night of 14 to 15 July 2021:</p>\n<p>1. Stock taken: cigarettes, canned goods, cooking oil, infant formula: RM 28,000.00<br>2. Cash taken from the counter drawer: RM 9,500.00<br>3. Rear service door, frame and folding steel grille, repair and replacement: RM 3,200.00<br>4. Counter drawer and lock, replacement: RM 450.00</p>\n<p>Total RM 41,150.00</p>\n<p>I looked at home for the old schedules but cannot find them. Attached is the current schedule. No other insurance.</p>\n<p>Thank you,<br>Ooi Bee Choo</p>\n<p><b>Attachments:</b> Police report GTN-007744-21 15 Jul.pdf; Stock list.pdf; Supplier invoices Jun 2021.pdf; Daily takings record 12 to 14 Jul.pdf; Door and grille quotation 3 Aug.pdf; Policy schedule 30 Jul 2021 to 29 Jul 2022.pdf; 12 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Cheah Lay Hoon &lt;[redacted]&gt;<br><b>To:</b> Ooi Bee Choo &lt;[redacted]&gt;<br><b>Date:</b> Friday, 6 August 2021, 5:30 pm<br><b>Subject:</b> Re: Claim for break-in 15 July 2021, 88 Lebuh Chulia</div><p>Received Madam Ooi, thank you. I have submitted it to the insurance company.</p>\n<p>Lay Hoon</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Mutiara Loss Adjusters Sdn Bhd</b> · Our ref MLA/PG/21/0418 · Report dated 20 August 2021 · Adjuster: Tan Boon Keat</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>9 August 2021. Ground floor shop, rear store, front counter and rear service door inspected with the Insured.</td></tr><tr><td>Cause and origin</td><td>Forced entry at the rear service door overnight between about 10:00 pm on 14 July and 6:30 am on 15 July 2021. The folding steel grille was levered up at the lower track and the door opened. Goods taken from the shelves and the rear store; the cash drawer under the front counter prised open. No sign of fire, smoke, heat or explosion anywhere on the premises.</td></tr><tr><td>Reports relied on</td><td>Police report GTN/007744/21, Balai Polis Patani Road, lodged 15 July 2021 at 9:12 am: forced entry and theft of goods and cash, under investigation, no fire recorded. Supplier invoices for cigarettes and infant formula, June 2021. The Insured's stock listing, undated. The Insured's handwritten daily takings record, 12 to 14 July 2021. Quotation for door and grille repair, 3 August 2021.</td></tr><tr><td>People interviewed</td><td>The Insured. Her son, who suggested the claim to her.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Provision shop trading daily; first floor residence occupied by the Insured and her family throughout.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant to the loss.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey intermediate shophouse, no mezzanine; provision shop on the ground floor, residence above. Rear service door fitted with a folding steel grille. No change of trade or occupation and no transfer of interest.</td></tr><tr><td>Damage found per item</td><td>Rear service door, frame and folding grille forced and bent; counter drawer and lock broken. Shelves and rear store partly emptied. No other damage to the building.</td></tr><tr><td>Discrepancies with the incident report</td><td>The Insured states the shop has been insured with the Company for several years under annual policies. She produced only the schedule for 30 July 2021 to 29 July 2022. No schedule for any earlier period was produced by her or located on the Company's file.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Stock taken: cigarettes, canned goods, cooking oil, infant formula</td><td>Item 3 Stock in trade</td><td class=\"num\">28,000.00</td><td class=\"num\">28,000.00</td><td>Cost price per the Insured's stock listing; cigarettes and infant formula checked to June 2021 invoices</td></tr><tr><td>2</td><td>Cash taken from the counter drawer</td><td>None</td><td class=\"num\">9,500.00</td><td class=\"num\">9,500.00</td><td>Insured's daily takings record, 12 to 14 July 2021</td></tr><tr><td>3</td><td>Rear service door, frame and folding steel grille</td><td>Item 1 Building</td><td class=\"num\">3,200.00</td><td class=\"num\">3,200.00</td><td>Repair quotation of 3 August 2021 checked</td></tr><tr><td>4</td><td>Counter drawer and lock</td><td>Item 2 Contents, fixtures and fittings</td><td class=\"num\">450.00</td><td class=\"num\">450.00</td><td>Replacement</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>41,150.00</b></td><td class=\"num\"><b>41,150.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">260,000.00</td><td class=\"num\">245,000.00</td></tr><tr><td>Item 2 Contents, fixtures and fittings</td><td class=\"num\">70,000.00</td><td class=\"num\">62,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">55,000.00</td><td class=\"num\">48,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No recovery: the police investigation remains open.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 41,150.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PG/2021/006180</td></tr><tr><td>Insured</td><td>Ooi Bee Choo (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>30 July 2021 to 29 July 2022</td></tr><tr><td>Risk address</td><td>88, Lebuh Chulia, 10200 George Town, Pulau Pinang</td></tr><tr><td>Construction</td><td>Two-storey intermediate shophouse; brick walls, timber first floor, clay tile roof; rear service door with a folding steel grille; no mezzanine</td></tr><tr><td>Occupation</td><td>Provision shop (ground floor); residence occupied by the Insured (first floor)</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td>260,000.00</td></tr><tr><td>2</td><td>Contents, fixtures and fittings</td><td>70,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td>55,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>385,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not itemised</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FC804</td><td>Other Contents Clause</td></tr><tr><td>FC820</td><td>Temporary Storage Clause</td></tr><tr><td>FC815</td><td>Automatic Renewal Clause</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil stated</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote><blockquote>This Policy is deemed to be automatically renewed and the appropriate premium charged upon expiry<span class=\"cite\">FC815: Automatic Renewal Clause</span></blockquote>The date of loss, 14-15 July 2021, is before the period of insurance on the schedule, 30 July 2021 to 29 July 2022, which starts 15 days after the loss. The loss is not after the period, so the renewal and receipt questions for a post-period loss do not arise. FC815 is held, but it operates on expiry and renewal of this policy, and the schedule shows no earlier period covering 14-15 July 2021. Gate 1 fails on the schedule's own period.</td><td>Date of loss 2021-07-15 (forced entry between about 10:00 pm 14 July and 6:30 am 15 July 2021) <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Period of insurance 2021-07-30 to 2022-07-29 <span class=\"meta\">(Schedule, Period of insurance)</span><br>FC815 Automatic Renewal Clause held on schedule <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Only the schedule for 30 July 2021 to 29 July 2022 was produced; no earlier schedule found on the Company's file <span class=\"meta\">(Adjuster's report, Findings, Discrepancies with the incident report)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 1 failed. Advice on cause is given for the examiner's information only.</td><td></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 1 failed.</td><td></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 1 failed.</td><td></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 1 failed.</td><td></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 1 failed. Items were not classed.</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>burglary_or_theft (forced entry at the rear service door, goods and cash taken)</p><p>Forced entry at the rear service door overnight, about 10:00 pm 14 July to 6:30 am 15 July 2021; grille levered up, goods taken from shelves and rear store, cash drawer prised open. No fire, smoke, heat or explosion.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Incident report, email of 2 August 2021: the shop has been insured with the same company for many years, every year renewed.</td><td>Adjuster's report, Findings, Discrepancies: the insured produced only the schedule for 30 July 2021 to 29 July 2022; no schedule for any earlier period was produced or located on the Company's file.</td><td>Adjuster's finding applied: no policy period covering 14-15 July 2021 is shown on the file, so the claimant's account of earlier annual renewals is not accepted for this decision.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>Loss predates the current policy period by 15 days. Gate 1 fails on the schedule as produced. The examiner may wish to check the Company's own policy records for any earlier period (including any renewal under FC815) that covered 14-15 July 2021, since the claimant says the policy has been renewed annually for many years. Nothing on the file shows such a period.</li></ul>\n<h3>Advice</h3><p>The loss on 14-15 July 2021 falls before the period of insurance on the schedule (30 July 2021 to 29 July 2022), so there is no cover in force on the date of loss and the claim fails at gate 1. The adjuster's finding that no earlier schedule exists is applied; the claimant's account of prior annual renewals is not supported by the file. Before the claim is declined, the examiner should check the Company's records for any earlier policy period covering 14-15 July 2021. The examiner decides.</p>\n<p class=\"meta\">Governing clause: Operative clause (period of insurance during the Period of Insurance stated in the Schedule). The claims examiner decides.</p>\n<h3>Figure</h3><p>Not priced. No policy in force on the date of loss, so there is no cover to price.</p>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 7 tool calls: 3 searches of the policy, 1 gate checks, 1 pricing and 2 submissions. 1 call was refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>\"period of insurance, loss before inception date\"</td><td><code>CONDITION-21</code> primary<br><code>WARRANTY-FW726</code> primary<br><code>CLAUSE-FC842A</code> secondary<br><code>CONDITION-9</code> primary</td></tr>\n<tr><td>4</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2021-07-15</td><td class=\"meta\">Adjuster's report, Cause and origin (forced entry between about 10:00 pm 14 July and 6:30 am 15 July 2021)</td></tr><tr><td><code>period_start</code></td><td>2021-07-30</td><td class=\"meta\">Schedule, Period of insurance (30 July 2021 to 29 July 2022)</td></tr><tr><td><code>period_end</code></td><td>2022-07-29</td><td class=\"meta\">Schedule, Period of insurance (30 July 2021 to 29 July 2022)</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>Operative clause (period of insurance)</b>. Loss on 15 July 2021 falls before the period starts on 30 July 2021.<span class=\"meta\"></span></td></tr>\n<tr><td>5</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>4 items, sums insured and values at risk</td><td><span class=\"chip no\">Not priced</span> No policy in force on the date of loss, so there is no cover to price.</td></tr>\n<tr><td>6</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">quote_not_retrieved</span> <code>gates[1].quotes[1]</code> This quote is not in any wording retrieved for this claim: \"This Policy is deemed to be automatically renewed and the appropriate premium ch\". Quote retrieved wording exactly, or search for it first.</div></td></tr>\n<tr><td>7</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2023-11207": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Saturday, 2 December 2023</div><div class=\"msg out\">Encik Faizal, good morning. Sorry to disturb on Saturday. I just reached my shop at Jalan Kota, the whole downstairs is flooded with water 😩 Water still coming down from the ceiling at the back<span class=\"t\">8:14 am</span></div><div class=\"msg out\"><span class=\"att\">4 photos</span><span class=\"t\">8:15 am</span></div><div class=\"msg out\">I already switched off the main water. Calling plumber now<span class=\"t\">8:16 am</span></div><div class=\"msg in\"><span class=\"who\">Faizal Rahman</span>Morning Puan Lim. Alamak, so sorry to hear. Is anyone hurt? Please take more photos before cleaning up, and keep all the damaged things first, don't throw away<span class=\"t\">8:31 am</span></div><div class=\"msg out\">No one hurt. Downstairs is empty, the tenant moved out in October, I only come once a week to check. Ok I will take more photos<span class=\"t\">8:33 am</span></div><div class=\"msg out\">Plumber came. He opened the wall, the pipe to the upstairs toilet burst inside the wall. He said the joint very rusty. He already changed that part<span class=\"t\">11:52 am</span></div><div class=\"msg out\">I think the water ran the whole night, maybe longer. Ceiling at the back already fall down, walls all wet. My stationery boxes and files downstairs all soaked, 2 desks and the filing cabinet also spoilt<span class=\"t\">11:54 am</span></div><div class=\"msg in\"><span class=\"who\">Faizal Rahman</span>Noted Puan. I will inform the insurance company on Monday. Later send me the claim here with plumber bill, photos and quotation for repair. Keep the old pipe also<span class=\"t\">12:20 pm</span></div><div class=\"msg out\">Ok thank you Encik Faizal 🙏<span class=\"t\">12:21 pm</span></div><div class=\"day\">Monday, 4 December 2023</div><div class=\"msg in\"><span class=\"who\">Faizal Rahman</span>Puan, I have called the insurance company and notified them. When you have the plumber bill and repair quotation, please send me the claim here with all the documents<span class=\"t\">10:05 am</span></div><div class=\"msg out\">Ok Encik Faizal, will send once I get the quotation<span class=\"t\">10:12 am</span></div><div class=\"day\">Friday, 8 December 2023</div><div class=\"msg out\">Encik Faizal, here is my claim for the water damage on 2 Dec<span class=\"t\">9:31 pm</span></div><div class=\"msg out\">Ceiling downstairs RM 9,600<br>Wall plaster, skirting and painting RM 8,900<br>Stationery and office files RM 7,300<br>2 desks and 1 filing cabinet RM 3,150<br>Drying and cleaning RM 1,950<br><b>Total RM 30,900</b><span class=\"t\">9:33 pm</span></div><div class=\"msg out\"><span class=\"att\">Plumber bill 2 Dec.pdf</span> <span class=\"att\">Contractor quotation 7 Dec.pdf</span> <span class=\"att\">Stationery invoices.pdf</span> <span class=\"att\">Tenancy handover 15 Oct.pdf</span> <span class=\"att\">17 photos</span><span class=\"t\">9:35 pm</span></div><div class=\"msg out\">One more thing I should tell you. In September I asked a plumbing company to check the pipes because the water pressure upstairs was low. They said the toilet pipes rusty and should change. I got quotation in October but I wanted to wait for new tenant first before doing the work. Attaching their report and the quotation also<span class=\"t\">9:38 pm</span></div><div class=\"msg out\"><span class=\"att\">Paip Aman inspection report 19 Sep.pdf</span> <span class=\"att\">Pipe replacement quotation 6 Oct.pdf</span><span class=\"t\">9:39 pm</span></div><div class=\"msg in\"><span class=\"who\">Faizal Rahman</span>Received Puan, thank you. I will submit to the insurance company and let you know if they need anything else<span class=\"t\">9:52 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Teratai Adjusters Sdn Bhd</b> · Our ref TAS/PK/23/1102 · Report dated 15 December 2023 · Adjuster: Arumugam a/l Velu</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>5 December 2023. Both floors inspected. Ground floor retail area: ceiling boards collapsed at the rear, plaster and skirting saturated to about 600 mm. First floor washroom: the replaced section of supply pipe and the opened wall cavity.</td></tr><tr><td>Cause and origin</td><td>Failure of a soldered joint on the concealed 15 mm copper supply pipe to the first floor washroom. The removed section, retained by the plumber, shows heavy corrosion at and around the joint. Water ran down the cavity into the ground floor ceiling void.</td></tr><tr><td>Reports relied on</td><td>Plumber's job sheet, 2 December 2023: joint failed, adjacent pipework heavily corroded, section replaced. Inspection report by Syarikat Paip Aman, 19 September 2023: corrosion on exposed washroom pipework, concealed sections likely similar, replacement recommended as soon as practicable.</td></tr><tr><td>People interviewed</td><td>The Insured: confirmed the lot has been vacant since 15 October, weekly visits, repair deferred until a new tenant was found. The plumber: the failed joint lies on the same washroom pipework the September report described.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Ground floor untenanted from 15 October 2023 to 2 December 2023, 48 days, verified against the tenancy handover acknowledgement and the letting advertisement. No person in daily occupation of either floor; the Insured attended about weekly.</td></tr><tr><td>Maintenance and prior defects</td><td>Corrosion on the washroom supply pipework was identified on 19 September 2023 by a contractor the Insured engaged. Quotation obtained 6 October 2023. No repair carried out before the loss. The failure occurred on that pipework.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey intermediate shophouse, no mezzanine, as scheduled. No sprinkler installation. No change of trade or construction; the only change found is the vacancy of the ground floor.</td></tr><tr><td>Damage found per item</td><td>Ceiling, plaster and skirting on the ground floor; stationery cartons and office files stored at floor level; two desks and one filing cabinet with swollen particleboard. No damage to the first floor beyond the replaced pipe.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material. The Insured's account of the vacancy, the September inspection and the deferred repair is borne out by the documents seen.</td></tr><tr><td>Irregularities</td><td>None found. Stationery invoices reconcile with the stock seen on site; the contractor quotation is consistent with the damage.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Suspended ceiling</td><td>Item 1 Building</td><td class=\"num\">9,600.00</td><td class=\"num\">9,600.00</td><td>Reinstatement, quotation checked</td></tr><tr><td>2</td><td>Plaster, skirting, repainting</td><td>Item 1 Building</td><td class=\"num\">8,900.00</td><td class=\"num\">8,900.00</td><td>Reinstatement, quotation checked</td></tr><tr><td>3</td><td>Stationery stock and files</td><td>Item 2 Contents</td><td class=\"num\">7,300.00</td><td class=\"num\">7,300.00</td><td>Invoice cost</td></tr><tr><td>4</td><td>Desks and filing cabinet</td><td>Item 2 Contents</td><td class=\"num\">3,150.00</td><td class=\"num\">3,150.00</td><td>Replacement, no betterment found</td></tr><tr><td>5</td><td>Drying and cleaning</td><td>Item 1 Building</td><td class=\"num\">1,950.00</td><td class=\"num\">1,950.00</td><td>Invoice</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>30,900.00</b></td><td class=\"num\"><b>30,900.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">320,000.00</td><td class=\"num\">310,000.00</td></tr><tr><td>Item 2 Contents and personal effects</td><td class=\"num\">45,000.00</td><td class=\"num\">42,000.00</td></tr><tr><td>Item 3 Office equipment</td><td class=\"num\">18,000.00</td><td class=\"num\">16,500.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil. Wet stationery and files pulped; swollen particleboard furniture has no resale value.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery: the failed pipe is the Insured's own installation.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 30,900.00 before any excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PK/2023/001938</td></tr><tr><td>Insured</td><td>Lim Siew Fong</td></tr><tr><td>Period of insurance</td><td>1 January 2023 to 31 December 2023</td></tr><tr><td>Risk address</td><td>18, Jalan Kota, 34000 Taiping, Perak</td></tr><tr><td>Construction</td><td>Two-storey intermediate shophouse; brick walls, reinforced concrete first floor slab, concrete tile roof; no mezzanine</td></tr><tr><td>Occupation</td><td>Ground floor let as a retail lot; first floor used by the Insured as storage and office</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td>320,000.00</td></tr><tr><td>2</td><td>Contents and personal effects</td><td>45,000.00</td></tr><tr><td>3</td><td>Office equipment</td><td>18,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>383,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not insured</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP503</td><td>Storm, Tempest Endorsement</td></tr><tr><td>FP507B</td><td>Bursting or Overflowing of Water Tanks, Apparatus or Pipes Endorsement (Others)</td></tr><tr><td>FC804</td><td>Other Contents Clause</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 2 December 2023 falls within the schedule period 1 January 2023 to 31 December 2023. FC815 and receipt questions do not arise.</td><td>Date of loss 2023-12-02 <span class=\"meta\">(Incident report, WhatsApp 2 December 2023 (8:14 am))</span><br>Period 2023-01-01 to 2023-12-31 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>the insurance under this Policy shall extend to include loss or damage to the property insured caused by the bursting or overflowing of water tanks, apparatus or pipes installed in or on the buildings insured<span class=\"cite\">FP507B: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement - Others</span></blockquote>Burst pipe is not a base peril. It is brought in by FP507B, which is on the schedule. No new independent event: the corrosion is the deterioration that led to joint failure.</td><td>Proximate cause burst pipe; failed soldered joint on corroded supply pipe <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Endorsements held FP503, FP507B, FC804 <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim delivered 8 December 2023, six days after the 2 December loss. The agent's telephone notice on 4 December is not the written claim. The insured volunteered the September 2023 inspection report. The adjuster found no irregularities.</td><td>Written claim 8 December 2023 (9:31 pm) <span class=\"meta\">(Incident report, WhatsApp 8 December 2023)</span><br>No fraud or false declaration; no irregularities <span class=\"meta\">(Adjuster's report, Findings: Discrepancies and Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>FP507B BURSTING OR OVERFLOWING OF WATER TANKS APPARATUS OR PIPES ENDORSEMENT - OTHERS<span class=\"cite\">FP507B: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement - Others</span></blockquote>FP507B is held on the schedule and answers burst pipes. Its scope note covers other buildings generally of 5 storeys and below. The building is two storeys with no mezzanine, which fits the variant held.</td><td>Two-storey, no mezzanine <span class=\"meta\">(Schedule, Construction; Adjuster's report, Findings, Risk as found against the schedule)</span><br>FP507B held <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>(a) loss or damage caused whilst the premises are untenanted.<span class=\"cite\">FP507B: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement - Others</span></blockquote><blockquote>the Company shall not be liable for any loss or damage caused by a defect which the Insured has failed to remedy after having received notice of such defect either from the Company or any person or public body.<span class=\"cite\">FP507B: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement - Others</span></blockquote><blockquote>If the building insured or containing the insured property becomes unoccupied and so remains for a period of more than thirty (30) days<span class=\"cite\">Condition 9</span></blockquote>Exclusion (a) fails the claim. The ground floor retail lot, where all the damaged items are, was untenanted from 15 October to 2 December 2023 (48 days), verified against the handover acknowledgement and advertisement. Special Condition 3 also fails the claim. The corrosion was identified on 19 September 2023 by a contractor the Insured engaged, a quotation was obtained on 6 October 2023, and no repair was made before the loss. Condition 9(b) is also engaged on the 48-day vacancy. No sanction is endorsed. There is no warranty breach, and the adjuster found no change of trade or construction. The examiner should note that the burst was on the first floor, which was used by the Insured for storage and office, not let. The adjuster's finding that no one was in daily occupation of either floor supports the vacancy reading, but the exclusion is applied on the ground floor where the loss fell.</td><td>Ground floor untenanted 2023-10-15 to 2023-12-02, 48 days; no person in daily occupation of either floor <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Corrosion identified 2023-09-19 by contractor engaged by Insured; quotation 2023-10-06; no repair before loss <span class=\"meta\">(Adjuster's report, Findings, Maintenance and prior defects)</span><br>Insured's account of vacancy, September inspection and deferred repair <span class=\"meta\">(Incident report, WhatsApp 8 December 2023 (9:38 pm); Adjuster's report, Investigation, People interviewed)</span><br>No warranties; no sanctions endorsed under Condition 9 <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>No change of trade or construction; no sprinkler installation <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached because gate 5 failed. The item classes used for the but-for figure are provisional: items 1, 2, 3 and 4 insured damage; item 5 drying and cleaning as mitigation expense. Item 3 includes office files, which FC804(b) limits to stationery value and RM1,000 per document. The adjuster did not split stationery from files. Desks and filing cabinet are scheduled under Item 2 by the adjuster, though they may fall under Item 3 Office equipment. These do not change the outcome at gate 5.</td><td>Adjuster's measurement, items 1 to 5, assessed RM 30,900.00 <span class=\"meta\">(Adjuster's report, Measurement)</span></td></tr></table>\n<h3>Proximate cause</h3><p>Burst pipe: failure of a corroded soldered joint on the concealed 15 mm copper supply pipe to the first floor washroom, with water running into the ground floor ceiling void</p><p>Long-term corrosion of the washroom supply pipework (identified 19 September 2023, repair quoted 6 October 2023, not carried out) led to joint failure on 2 December 2023 and discharge of water into the ground floor.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Insured: the ground floor was empty, she attended about weekly, and the repair was deferred until a new tenant was found; she disclosed the September 2023 inspection and October quotation.</td><td>Ground floor untenanted 48 days, verified; no person in daily occupation of either floor; the September corrosion finding and the 6 October quotation were not acted on before the loss.</td><td>Adjuster's finding applied. The vacancy and prior notice are established, so FP507B exclusion (a) and Special Condition 3 apply.</td></tr></table>\n<h3>Advice</h3><p>The claim fails at gate 5. FP507B exclusion (a) excludes loss caused whilst the premises are untenanted, and the ground floor was untenanted for 48 days, where all the damage is. Special Condition 3 is a second, independent ground, because the corrosion was notified on 19 September 2023 and not remedied. The examiner decides; the but-for figure is RM 29,900.00 after the RM 1,000 FP507B excess, and the payable is nil.</p>\n<p class=\"meta\">Governing clause: FP507B, exclusion (a). The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 29,900.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  320,000.00  value    RM 310,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   45,000.00  value     RM 42,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM   18,000.00  value     RM 16,500.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP507B] refs [1, 2, 3, 4, 5]</code></td></tr><tr><td><code>     subtotal          RM    30,900.00</code></td></tr><tr><td><code>     excess            RM     1,000.00   Flat first RM 1,000.00 of each and every loss.</code></td></tr><tr><td><code>     net               RM    29,900.00</code></td></tr><tr><td><code>  CLAIMED             RM    30,900.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM    29,900.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 20 tool calls: 11 searches of the policy, 6 gate checks, 1 pricing and 2 submissions. 2 calls were refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP507B\"</td><td><code>ENDORSEMENT-FP507B</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>\"untenanted premises unoccupied building loss caused whilst\"</td><td><code>ENDORSEMENT-FP507B</code> override<br><code>ENDORSEMENT-FP507A</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>CLAUSE-FC825A</code> secondary<br><code>ENDORSEMENT-FP510D</code> informational <span class=\"meta\">(not held: cannot override)</span></td></tr>\n<tr><td>8</td><td><code>search_policy</code></td><td>code \"FC804\"</td><td><code>CLAUSE-FC804</code> secondary</td></tr>\n<tr><td>9</td><td><code>search_policy</code></td><td>code \"Condition 4\"</td><td><code>CONDITION-4</code> primary</td></tr>\n<tr><td>10</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>11</td><td><code>search_policy</code></td><td>\"documents books of account stationery office files contents excluded\"</td><td><code>CLAUSE-FC804</code> secondary<br><code>ENDORSEMENT-FP509</code> informational <span class=\"meta\">(not held: cannot override)</span></td></tr>\n<tr><td>12</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-12-02</td><td class=\"meta\">Incident report, WhatsAp ure, not a separate event</td></tr><tr><td><code>endorsements_held</code></td><td>FP503, FP507B, FC804</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP507A or FP507B</b>. Proximate cause: burst pipe. Not a base peril; FP507A or FP507B brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>15</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-12-02</td><td class=\"meta\">Incident report, WhatsApp 2 December 2023</td></tr><tr><td><code>written_claim_date</code></td><td>2023-12-08</td><td class=\"meta\">Incident report, WhatsApp 8 December 2023 (9:31 pm, claim with plumber bill and quotations)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Schedule and file: no written extension of time found</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: Discrepancies none material; Irregularities none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 8 December 2023, day 6 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>16</td><td><code>check_gate</code></td><td>Gate 4, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP503, FP507B, FC804</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr><tr><td><code>storeys_including_mezzanine</code></td><td>2</td><td class=\"meta\">Schedule, Construction; Adjuster's report, Findings: two-storey, no mezzanine</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP507B</b>. FP507B is on the schedule and answers the cause.<span class=\"meta\"></span></td></tr>\n<tr><td>17</td><td><code>check_gate</code></td><td>Gate 5, 8 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: No change of trade or construction; the only change found is the vacancy of the ground floor</td></tr><tr><td><code>unoccupied_days</code></td><td>48</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: ground floor untenanted 15 October to 2 December 2023, 48 days</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Incident report and adjuster's report: no change of ownership found</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr><tr><td><code>premises_untenanted</code></td><td>True</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: ground floor untenanted from 15 October 2023 to 2 December 2023; the damaged items are on the ground floor</td></tr><tr><td><code>sprinkler_leakage</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: No sprinkler installation</td></tr><tr><td><code>defect_notified_not_remedied</code></td><td>True</td><td class=\"meta\">Adjuster's report, Maintenance and prior defects: corrosion identified 19 September 2023 by a contractor the Insured engaged; quotation 6 October 2023; no repair before the loss. Insured's WhatsApp 8 December 2023 (9:38 pm)</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>FP507B exclusion (a)</b>. Loss or damage caused whilst the premises are untenanted is excluded.<span class=\"meta\"><br>FP507B exclusion (a) fail; FP507B exclusion (b) pass; FP507B Special Condition 3 fail; Warranty pass; Condition 9(a) pass; Condition 9(b) fail; Condition 9(d) pass</span></td></tr>\n<tr><td>18</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>5 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 29,900.00<details><summary>Working</summary><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  320,000.00  value    RM 310,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   45,000.00  value     RM 42,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM   18,000.00  value     RM 16,500.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [FP507B] refs [1, 2, 3, 4, 5]</code></div><div><code>     subtotal          RM    30,900.00</code></div><div><code>     excess            RM     1,000.00   Flat first RM 1,000.00 of each and every loss.</code></div><div><code>     net               RM    29,900.00</code></div><div><code>  CLAIMED             RM    30,900.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM    29,900.00</code></div></details></td></tr>\n<tr><td>19</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">quote_not_retrieved</span> <code>gates[4].quotes[0]</code> This quote is not in any wording retrieved for this claim: \"Applies to other buildings (generally 5 storeys and below).\". Quote retrieved wording exactly, or search for it first.</div><div><span class=\"chip err\">quote_not_retrieved</span> <code>gates[5].quotes[1]</code> This quote is not in any wording retrieved for this claim: \"The Company shall not be liable for any loss or damage caused by a defect which \". Quote retrieved wording exactly, or search for it first.</div></td></tr>\n<tr><td>20</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2025-09207": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Nor Azizah Razak &lt;[redacted]&gt;<br><b>To:</b> Norhayati Ismail &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 14 August 2025, 7:48 am<br><b>Subject:</b> Water leak at Farmasi Teluk Sisek, Jalan Teluk Sisek</div><p>Dear Puan Norhayati,</p>\n<p>I am the managing pharmacist of Farmasi Teluk Sisek Sdn Bhd at 18, Jalan Teluk Sisek, Kuantan. When I opened the shop at 7:30 this morning, water was pouring from the ceiling in the front half of the pharmacy. A pipe upstairs has burst; the water comes from the washroom side on the first floor, where we have our office and store. I shut the main water valve at about 7:35 am.</p>\n<p>The ceiling boards at the front have come down, the floor is flooded, two display shelves and the front counter are soaked, and a lot of our over-the-counter medicines, toiletries and baby products on the lower shelves are wet. No one was hurt.</p>\n<p>Our plumber is coming at 9 am. Please inform the insurance company.</p>\n<p>Regards,<br>Nor Azizah binti Razak<br>Managing Pharmacist, Farmasi Teluk Sisek Sdn Bhd</p>\n<p><b>Attachments:</b> 7 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Norhayati Ismail &lt;[redacted]&gt;<br><b>To:</b> Nor Azizah Razak &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 14 August 2025, 9:05 am<br><b>Subject:</b> Re: Water leak at Farmasi Teluk Sisek, Jalan Teluk Sisek</div><p>Dear Puan Azizah,</p>\n<p>Sorry to hear this. I have notified the insurance company this morning. Please keep the burst fitting and the damaged stock for the adjuster and take photos before cleaning. Send me the written claim with the list of items and amounts, the plumber's report and the quotations.</p>\n<p>Regards,<br>Norhayati</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Nor Azizah Razak &lt;[redacted]&gt;<br><b>To:</b> Norhayati Ismail &lt;[redacted]&gt;<br><b>Date:</b> Friday, 22 August 2025, 3:15 pm<br><b>Subject:</b> Claim: burst pipe 14 August 2025, Farmasi Teluk Sisek</div><p>Dear Puan Norhayati,</p>\n<p>Our claim for the burst pipe on 14 August 2025:</p>\n<p>1. Ceiling boards, wall plaster and repainting, ground floor: RM 19,800.00<br>2. Display shelves and front counter: RM 7,600.00<br>3. Stock damaged (over-the-counter medicines, toiletries, baby products): RM 12,500.00<br>4. Shop closed 2 days for cleaning, loss of sales: RM 3,200.00</p>\n<p>Total RM 43,100.00</p>\n<p>The plumber has replaced the burst fitting; we are not claiming that cost. No other insurance on the shop.</p>\n<p>Regards,<br>Nor Azizah binti Razak</p>\n<p><b>Attachments:</b> Plumber report Paip Pantai Timur 14 Aug.pdf; Contractor quotation 19 Aug.pdf; Shelf and counter quotation 20 Aug.pdf; Stock list and invoices Aug 2025.pdf; Daily sales record Aug 2025.pdf; 26 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Norhayati Ismail &lt;[redacted]&gt;<br><b>To:</b> Nor Azizah Razak &lt;[redacted]&gt;<br><b>Date:</b> Friday, 22 August 2025, 4:40 pm<br><b>Subject:</b> Re: Claim: burst pipe 14 August 2025, Farmasi Teluk Sisek</div><p>Received Puan Azizah, thank you. I have submitted it to the insurance company.</p>\n<p>Norhayati</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Mutiara Loss Adjusters Sdn Bhd</b> · Our ref MLA/PH/25/0733 · Report dated 8 September 2025 · Adjuster: Rajesh Kumar a/l Subramaniam</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>15 August 2025. Ground floor pharmacy and first floor office, store and washroom inspected with the managing pharmacist; the opened ceiling void below the washroom inspected.</td></tr><tr><td>Cause and origin</td><td>A brass compression fitting on the 15 mm cold water supply to the first floor washroom basin, in the ceiling void above the ground floor, split along its body. Water discharged into the void through the night and brought down the ceiling boards over the front half of the pharmacy. Discharge until the main valve was closed at about 7:35 am.</td></tr><tr><td>Reports relied on</td><td>Plumber's report by Paip Pantai Timur Enterprise, 14 August 2025: fitting split, no corrosion on the adjoining pipework, fitting replaced. Plumbing service record by the same contractor, 10 June 2025: washroom supply checked, no defects or leaks noted. The building has no automatic sprinkler installation.</td></tr><tr><td>People interviewed</td><td>The managing pharmacist. The pharmacy assistant who closed the shop at 10:00 pm on 13 August 2025. The plumbing contractor.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Pharmacy trading daily, 9:00 am to 10:00 pm, occupied by the Insured as its own premises. Closed overnight at the time of the discharge.</td></tr><tr><td>Maintenance and prior defects</td><td>Plumbing serviced by contract. No defect in the washroom supply was reported before the loss, and none was found on the pipework next to the failed fitting.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey intermediate shophouse: ground floor pharmacy, first floor office, store and washroom. Two storeys in total; no mezzanine floor; no further floors. Construction as found: brick walls, reinforced concrete first floor slab, concrete tile roof on timber trusses.</td></tr><tr><td>Damage found per item</td><td>Ceiling boards collapsed over the front half of the ground floor; wall plaster wet to about 400 mm; two display shelves and the front counter with swollen particleboard; stock on the lower shelves wetted.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material. Item 1 reduced on measurement: the rear store ceiling was not affected.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Ceiling boards, wall plaster and repainting, ground floor</td><td>Item 1 Building</td><td class=\"num\">19,800.00</td><td class=\"num\">18,400.00</td><td>Reinstatement; rear store area not affected, removed</td></tr><tr><td>2</td><td>Display shelves (2) and front counter</td><td>Item 2 Furniture, fixtures and fittings</td><td class=\"num\">7,600.00</td><td class=\"num\">7,600.00</td><td>Replacement, quotation checked</td></tr><tr><td>3</td><td>Stock: over-the-counter medicines, toiletries, baby products</td><td>Item 3 Stock in trade</td><td class=\"num\">12,500.00</td><td class=\"num\">12,500.00</td><td>Cost price per invoices; water-damaged items destroyed</td></tr><tr><td>4</td><td>Two days' loss of sales</td><td>None</td><td class=\"num\">3,200.00</td><td class=\"num\">3,200.00</td><td>Insured's sales record</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>43,100.00</b></td><td class=\"num\"><b>41,700.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">450,000.00</td><td class=\"num\">430,000.00</td></tr><tr><td>Item 2 Furniture, fixtures and fittings</td><td class=\"num\">60,000.00</td><td class=\"num\">55,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">80,000.00</td><td class=\"num\">100,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Value at risk, Item 3</td><td>Stock at cost on 14 August 2025 from the stock count of 31 July 2025, purchases and sales to the date of loss: RM 100,000.00.</td></tr><tr><td>Salvage</td><td>Nil. Wetted medicines and toiletries destroyed under the pharmacist's supervision.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery: the fitting is the Insured's own installation and out of any warranty.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 41,700.00 before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PH/2025/004126</td></tr><tr><td>Insured</td><td>Farmasi Teluk Sisek Sdn Bhd (Company No. 201101024418)</td></tr><tr><td>Period of insurance</td><td>1 March 2025 to 28 February 2026</td></tr><tr><td>Risk address</td><td>18, Jalan Teluk Sisek, 25000 Kuantan, Pahang</td></tr><tr><td>Construction</td><td>Two-storey intermediate shophouse; brick walls, reinforced concrete first floor slab, concrete tile roof</td></tr><tr><td>Occupation</td><td>Pharmacy (ground floor); office and store (first floor)</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">450,000.00</td></tr><tr><td>2</td><td>Furniture, fixtures and fittings</td><td class=\"num\">60,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td class=\"num\">80,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>590,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP507A</td><td>Bursting or Overflowing of Water Tanks Apparatus or Pipes Endorsement</td></tr><tr><td>FP503</td><td>Storm, Tempest Endorsement</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 14 August 2025 falls inside the period 1 March 2025 to 28 February 2026. FC815 and receipt questions do not arise.</td><td>Date of loss 2025-08-14 <span class=\"meta\">(Incident report, email of 14 August 2025 7:48 am)</span><br>Period 2025-03-01 to 2026-02-28 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>the insurance under this Policy shall extend to include loss or damage to the property insured caused by the bursting or overflowing of water tanks, apparatus or pipes installed in or on the buildings insured or containing the property insured<span class=\"cite\">FP507B: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement - Others</span></blockquote><blockquote>any loss or damage as aforesaid shall be deemed to be loss or damage by fire.<span class=\"cite\">FP507B: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement - Others</span></blockquote>Burst pipe is not a base peril. The Operative clause covers only fire or lightning, so the cause is brought in by FP507A/FP507B. No intervening event: the adjuster found no defect reported before the loss and none on the adjoining pipework. Whether the endorsement is held is gate 4.</td><td>Proximate cause: fitting split, burst pipe <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>No intervening event; no prior defect reported or found <span class=\"meta\">(Adjuster's report, Findings, Maintenance and prior defects)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Notice was given the day of the loss (14 August 2025). The written claim was delivered 22 August 2025, day 8 of the 15 allowed. The adjuster found no irregularities, so no false declaration or fraud is indicated.</td><td>Written claim 2025-08-22 <span class=\"meta\">(Incident report, email Claim: burst pipe 14 August 2025, 22 August 2025 3:15 pm)</span><br>No irregularities found <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st flag\">Passed, flagged</span></td><td><blockquote>the insurance under this Policy shall extend to include loss or damage to the property insured caused by the bursting or overflowing of water tanks, apparatus or pipes installed in or on the buildings insured or containing the property insured<span class=\"cite\">FP507A: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement</span></blockquote>FP507A is on the schedule, so the endorsement that answers the burst pipe is held. But the building is two storeys with no mezzanine. FP507A's scope note limits it to buildings exceeding five storeys, and FP507B's scope note covers other buildings generally five storeys and below. FP507B fits the building and is not held. Per the gate rule, a building that does not fit the variant held passes with a flag and does not fail. The examiner decides on the class mismatch.</td><td>Endorsements held: FP507A, FP503 <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Two storeys in total; no mezzanine <span class=\"meta\">(Adjuster's report, Findings, Risk as found against the schedule)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>(a) loss or damage caused whilst the premises are untenanted. (b) loss or damage by water discharged or leaking from an installation of automatic sprinklers.<span class=\"cite\">FP507A: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement</span></blockquote><blockquote>(b) If the building insured or containing the insured property becomes unoccupied and so remains for a period of more than thirty (30) days.<span class=\"cite\">Condition 9</span></blockquote><blockquote>shall cease immediately upon any fall or displacement<span class=\"cite\">Condition 4</span></blockquote>The premises were trading and occupied by the Insured; closed overnight only, so not untenanted. No sprinkler installation, so exclusion (b) does not apply. No warranties. No change of occupation, no unoccupied period over 30 days, no passing of interest, no sanction required. No defect notified and not remedied. The building did not fall or displace (ceiling boards collapsed only), so Condition 4 is not engaged.</td><td>Pharmacy trading daily, occupied by the Insured; closed overnight <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>No automatic sprinkler installation <span class=\"meta\">(Adjuster's report, Investigation, Reports relied on)</span><br>Warranties: None; Sanctions endorsed: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>This insurance does not cover loss of earnings, loss by delay, loss of market or other consequential or indirect loss or damage of any kind or description whatsoever except loss of rent when such loss is included in the cover under the policy.<span class=\"cite\">FP507A: Bursting Or Overflowing Of Water Tanks Apparatus Or Pipes Endorsement</span></blockquote>Items 1, 2 and 3 are insured property damaged by the burst pipe and are admitted (items 1 and 3 on the adjuster's assessed amounts). Item 4, two days' loss of sales of RM 3,200.00, is consequential loss excluded by FP507A Special Condition 2. No money or documents were claimed; the stock is medicines and toiletries, not Condition 8(e) items.</td><td>Item 1 assessed RM 18,400.00; Item 2 RM 7,600.00; Item 3 RM 12,500.00; Item 4 RM 3,200.00 <span class=\"meta\">(Adjuster's report, Measurement)</span></td></tr></table>\n<h3>Proximate cause</h3><p>burst_pipe</p><p>A brass compression fitting on the 15 mm cold water supply to the first floor washroom basin split along its body in the ceiling void above the ground floor. Water discharged into the void through the night and brought down the ceiling boards over the front half of the pharmacy. Main valve closed about 7:35 am on 14 August 2025.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Item 1, ceiling boards, wall plaster and repainting, ground floor: RM 19,800.00 claimed (email of 22 August 2025).</td><td>Item 1 reduced on measurement to RM 18,400.00: the rear store ceiling was not affected and is removed.</td><td>RM 18,400.00, the adjuster's assessed amount.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>Building class mismatch: FP507A is held, but the building does not fit its scope. Scope note of FP507A: \"Applies to buildings exceeding five (5) storeys (including a mezzanine floor).\" Scope note of FP507B: \"Applies to other buildings (generally 5 storeys and below).\" The examiner decides on the mismatch. FP507A and FP507B carry the same wording and the same RM 1,000 excess.</li><li>Average applied on item 3: stock at cost on the date of loss RM 100,000.00 against sum insured RM 80,000.00 (factor 0.8000). Items 1 and 2 are not averaged. This is from the calculation, not a gate flag.</li></ul>\n<h3>Advice</h3><p>All six gates pass, with a class-mismatch flag at gate 4: FP507A is held but the building is two storeys, and FP507B is the variant that fits. The figure is RM 35,000.00 payable. That is the claimed RM 41,700.00 (adjuster's figure) less RM 3,200.00 loss of sales (excluded by FP507A Special Condition 2), less the average on item 3 (RM 12,500.00 reduced to RM 10,000.00), less the RM 1,000.00 excess. The examiner decides, including the endorsement class mismatch and the item 3 average.</p>\n<p class=\"meta\">Governing clause: FP507A, exclusion (a) and (b), Special Condition 2; Condition 20 average as applied by calculate_payable. The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 35,000.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 4  RM     3,200.00  EXCLUDED by FP507A Special Condition 2  (Two days' loss of sales)</code></td></tr><tr><td><code>  excluded total       RM     3,200.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  450,000.00  value    RM 430,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   60,000.00  value     RM 55,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM   80,000.00  value RM  100,000.00  factor 0.8000  UNDERINSURED</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP507A] refs [1, 2, 3]</code></td></tr><tr><td><code>     subtotal          RM    38,500.00</code></td></tr><tr><td><code>     after average     RM    36,000.00</code></td></tr><tr><td><code>     excess            RM     1,000.00   Flat first RM 1,000.00 of each and every loss.</code></td></tr><tr><td><code>     net               RM    35,000.00</code></td></tr><tr><td><code>  CLAIMED             RM    41,700.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    35,000.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><t r><td><code>period_start</code></td><td>2025-03-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2026-02-28</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 14 August 2025 falls inside 1 March 2025 to 28 February 2026.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>burst_pipe</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin and Findings, Maintenance and prior defects</td></tr><tr><td><code>endorsements_held</code></td><td>FP507A, FP503</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP507A or FP507B</b>. Proximate cause: burst pipe. Not a base peril; FP507A or FP507B brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2025-08-14</td><td class=\"meta\">Incident report, email of 14 August 2025 7:48 am</td></tr><tr><td><code>written_claim_date</code></td><td>2025-08-22</td><td class=\"meta\">Incident report, email Claim: burst pipe 14 August 2025, Farmasi Teluk Sisek, 22 August 2025 3:15 pm</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report, email chain; no extension in writing on file</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 22 August 2025, day 8 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 4, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP507A, FP503</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr><tr><td><code>storeys_including_mezzanine</code></td><td>2</td><td class=\"meta\">Adjuster's report, Findings, Risk as found against the schedule: two storeys in total; no mezzanine</td></tr></table></details></td><td><span class=\"chip flag\">Passed, flagged</span> <b>FP507A</b>. FP507A is on the schedule and responds on its wording. Building class mismatch: FP507A is held, but the building does not fit its scope. The variant that fits is FP507B. Flagged for the claims examiner to decide.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>search_policy</code></td><td>code \"Condition 4\"</td><td><code>CONDITION-4</code> primary</td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 5, 9 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: trading daily, occupied by the Insured; closed overnight only</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Schedule and adjuster's report: Insured remains owner-occupier; no change noted</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None; no change requiring sanction</td></tr><tr><td><code>premises_untenanted</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>sprinkler_leakage</code></td><td>False</td><td class=\"meta\">Adjuster's report, Investigation, Reports relied on: the building has no automatic sprinkler installation</td></tr><tr><td><code>defect_notified_not_remedied</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Maintenance and prior defects: no defect reported before the loss</td></tr><tr><td><code>fall_or_displacement</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Damage found per item: ceiling boards collapsed, building not fallen or displaced</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP507A</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>FP507A exclusion (a) pass; FP507A exclusion (b) pass; FP507A Special Condition 3 pass; Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>14</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>4 items</td><td class=\"meta\">Adjuster's report, Measurement table</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP507A</b>. 3 of 4 items admitted.<span class=\"meta\"><br>ref 1 admitted; ref 2 admitted; ref 3 admitted; ref 4 excluded (FP507A Special Condition 2)</span></td></tr>\n<tr><td>15</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</di
