r>Rosnah</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Nurul Ain Mohd Faizal &lt;[redacted]&gt;<br><b>To:</b> Rosnah Hamid &lt;[redacted]&gt;<br><b>Date:</b> Wednesday, 25 September 2024, 4:10 pm<br><b>Subject:</b> Claim for fire 14 September 2024, 12 Jalan Badlishah</div><p>Dear Puan Rosnah,</p>\n<p>Our claim for the fire on 14 September 2024, against the items on the schedule:</p>\n<p>1. Ground floor ceiling, wall finishes, rewiring of affected circuits, roof repair to the rear section, repainting (Item 1): RM 46,000.00<br>2. Spiral dough mixer, destroyed (Item 2): RM 18,500.00<br>3. Deck oven, dough proofer and two stainless steel worktables, destroyed or heat damaged (Item 2): RM 62,000.00<br>4. Timber shelving and packaging store fittings (Item 2): RM 14,000.00<br>5. Stock destroyed: flour, sugar, butter, fillings, packaging (Item 3): RM 21,500.00<br>6. Soot removal, cleaning and disposal (Item 1): RM 6,200.00</p>\n<p>Total RM 168,200.00</p>\n<p>The stock was disposed of on 16 September under the health officer's supervision. We also got an independent electrical report and asked a registered valuer to value the premises as they were before the fire; both reports are attached. No other insurance.</p>\n<p>Thank you,<br>Nurul Ain binti Mohd Faizal</p>\n<p><b>Attachments:</b> Authorisation letter 20 Sep.pdf; Bomba report 19 Sep.pdf; Electrical report 23 Sep.pdf; Valuation report 24 Sep.pdf; Building quotation 23 Sep.pdf; Oven proofer and worktable quotations.pdf; Stock invoices Jul to Sep 2024.pdf; Health officer disposal record 16 Sep.pdf; 69 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Rosnah Hamid &lt;[redacted]&gt;<br><b>To:</b> Nurul Ain Mohd Faizal &lt;[redacted]&gt;<br><b>Date:</b> Wednesday, 25 September 2024, 5:00 pm<br><b>Subject:</b> Re: Claim for fire 14 September 2024, 12 Jalan Badlishah</div><p>Received Cik Nurul Ain, thank you. I have submitted it to the insurance company.</p>\n<p>Rosnah</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Cahaya Adjusters Sdn Bhd</b> · Our ref CAS/KD/24/0871 · Report dated 4 October 2024 · Adjuster: Zulkifli bin Hashim</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>17 September 2024. Production area, ground floor store, shopfront, internal staircase and the first floor store and office inspected with the claimant. The mixer, deck oven, proofer and worktables retained on site.</td></tr><tr><td>Cause and origin</td><td>Electrical fault within the motor of the spiral dough mixer standing against the rear wall of the production area. Fire spread from the mixer to the adjacent timber shelving and packaging materials, then across the production area, and burnt through part of the ground floor ceiling. Smoke and soot throughout the ground floor and the lower staircase; smoke staining only on the first floor.</td></tr><tr><td>Reports relied on</td><td>Fire and Rescue Department report, 19 September 2024: attended at 1:58 am, extinguished at 3:12 am; probable cause an electrical fault; severe localised burning at the mixer with fire spread outward from that position. Independent electrical report by a registered competent person, 23 September 2024: the mixer's motor windings show short circuiting and overheating consistent with an insulation failure within the motor, and the motor's own damage is attributable to that fault rather than to external burning; the premises wiring, distribution board and other machines showed no pre-existing defect, and their damage is consistent with exposure to the fire. Valuation report by a registered valuer, 24 September 2024. Local authority health officer's disposal record, 16 September 2024.</td></tr><tr><td>People interviewed</td><td>The claimant. The registered competent person who prepared the electrical report.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Bakery with on-site production, trading at this address since 2016. Closed after the evening production run on 13 September 2024; all staff left by 10:30 pm. Nobody resides on the first floor, which is storage and office.</td></tr><tr><td>Maintenance and prior defects</td><td>No pre-existing defect in the premises wiring, distribution board or the other machines (electrical report of 23 September 2024).</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey intermediate shophouse, no mezzanine; bakery and confectionery production on the ground floor, storage and office on the first floor, as scheduled. No change of trade or occupation and no transfer of interest: the Insured remains the registered proprietor of the premises and sole proprietor of the business.</td></tr><tr><td>Damage found per item</td><td>Spiral dough mixer destroyed, motor burnt out from within. Deck oven, dough proofer and two stainless steel worktables destroyed or heat damaged by the spreading fire. Timber shelving and packaging store fittings burnt. Ground floor ceiling burnt through in part; wall finishes, affected circuits and the rear roof section damaged; soot throughout the ground floor. Stock of flour, sugar, butter, fillings and packaging destroyed by fire, heat or contamination.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Ground floor ceiling, wall finishes, rewiring of affected circuits, roof repair to the rear section, repainting</td><td>Item 1 Building</td><td class=\"num\">46,000.00</td><td class=\"num\">46,000.00</td><td>Reinstatement, quotation of 23 September 2024 checked</td></tr><tr><td>2</td><td>Spiral dough mixer, destroyed</td><td>Item 2 Contents, plant and machinery</td><td class=\"num\">18,500.00</td><td class=\"num\">18,500.00</td><td>Replacement; the machine in which the electrical fault began</td></tr><tr><td>3</td><td>Deck oven, dough proofer and two stainless steel worktables</td><td>Item 2 Contents, plant and machinery</td><td class=\"num\">62,000.00</td><td class=\"num\">62,000.00</td><td>Supplier quotations checked; damaged by the fire spreading from the mixer</td></tr><tr><td>4</td><td>Timber shelving and packaging store fittings</td><td>Item 2 Contents, plant and machinery</td><td class=\"num\">14,000.00</td><td class=\"num\">14,000.00</td><td>Replacement</td></tr><tr><td>5</td><td>Stock in trade destroyed: flour, sugar, butter, fillings, packaging</td><td>Item 3 Stock in trade</td><td class=\"num\">21,500.00</td><td class=\"num\">21,500.00</td><td>Cost price per purchase invoices, July to September 2024</td></tr><tr><td>6</td><td>Soot removal, cleaning and disposal</td><td>Item 1 Building</td><td class=\"num\">6,200.00</td><td class=\"num\">6,200.00</td><td>Contractor's rates checked</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>168,200.00</b></td><td class=\"num\"><b>168,200.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">280,000.00</td><td class=\"num\">275,000.00</td></tr><tr><td>Item 2 Contents, plant and machinery</td><td class=\"num\">150,000.00</td><td class=\"num\">200,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">60,000.00</td><td class=\"num\">52,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Value at risk</td><td>From the valuation report of 24 September 2024, values immediately before the loss: building reinstatement value RM 275,000.00; contents, plant and machinery reinstatement value RM 200,000.00; stock in trade at cost RM 52,000.00.</td></tr><tr><td>Salvage</td><td>Nil. Stock disposed of under the supervision of the local authority health officer on 16 September 2024.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 168,200.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/KD/2024/002604</td></tr><tr><td>Insured</td><td>Mohd Faizal bin Abdul Rahman (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 March 2024 to 28 February 2025</td></tr><tr><td>Risk address</td><td>12, Jalan Badlishah, 08000 Sungai Petani, Kedah</td></tr><tr><td>Construction</td><td>Two-storey intermediate shophouse; brick walls, reinforced concrete first floor slab, concrete tile roof on steel trusses; no mezzanine</td></tr><tr><td>Occupation</td><td>Bakery and confectionery with on-site production (ground floor); storage and office (first floor)</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td>280,000.00</td></tr><tr><td>2</td><td>Contents, plant and machinery</td><td>150,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td>60,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>490,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not itemised</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP508A.01</td><td>Electrical Installations Clause (A), applicable to electrical machinery, plant and installation in manufacturing risks and workshops</td></tr><tr><td>FC816</td><td>Reinstatement Value Clause</td></tr><tr><td>FC805</td><td>Capital Additions Clause</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 14 September 2024 falls within the period of insurance 1 March 2024 to 28 February 2025. FC815 and the renewal limb do not arise.</td><td>date_of_loss 2024-09-14 <span class=\"meta\">(Incident report, email of 25 September 2024; Adjuster's report, Investigation)</span><br>period 2024-03-01 to 2025-02-28 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Proximate cause is fire, a base insured peril. The electrical fault is the origin of the fire, not a separate peril, and no intervening event occurred. No endorsement is needed to bring fire in.</td><td>Cause: electrical fault in mixer motor, fire spread outward from the mixer, no intervening event <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin and Reports relied on)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim sent 25 September 2024, day 11 after the 14 September loss, within 15 days. Notice was given on 15 September 2024. No written extension was needed. The adjuster found no irregularities and no false declaration.</td><td>written_claim_date 2024-09-25 <span class=\"meta\">(Incident report, email from Nurul Ain Mohd Faizal dated 25 September 2024)</span><br>No irregularities; no fraud or false declaration <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>THE COMPANY AGREES subject to the Terms and Conditions contained herein<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Fire is a base peril, so no endorsement needed to answer it. The tool returned no endorsement required. FP508A.01 is on the schedule but operates as an exclusion, applied at gate 6.</td><td>endorsements_held: FP508A.01, FC816, FC805 <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>Under any of the following circumstances the insurance ceases to attach as regards the property affected unless the Insured, before the occurrence of any loss or damage, obtains the sanction of the Company<span class=\"cite\">Condition 9</span></blockquote>No change of trade or occupation increasing risk, no unoccupied period (staff left 10:30 pm on 13 September and the bakery trades), no transfer of interest, no warranties, no sanctions endorsed, and no fall or displacement of the building. Condition 9 is not engaged.</td><td>Warranties: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Occupation unchanged; bakery trading; no transfer of interest; sanction none <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss and Risk as found against the schedule)</span><br>Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>This Company is expressly declared to be free from liability for loss of or damage to, any electrical machine, apparatus, or any portion of the electrical installation arising from or occasioned by over-running, excessive pressure, short-circuiting, self heating, arcing or leakage of electricity from whatever cause (lightning included) arising.<span class=\"cite\">FP508A.01: Electrical Installations Clause (A) (Applicable To Electrical Machinery, Plant And</span></blockquote><blockquote>this exemption shall only apply to the particular electrical machine, apparatus, or portion of the electrical installation so affected, and not to other machines, apparatus or electrical installation destroyed or damaged by fire set up by such particular machine<span class=\"cite\">FP508A.01: Electrical Installations Clause (A) (Applicable To Electrical Machinery, Plant And</span></blockquote>Five of six items admitted. The spiral dough mixer (Item 2, RM 18,500.00) is excluded under FP508A.01 because the motor short-circuited and the fault began in it. The oven, proofer, worktables and shelving are not excluded, because the proviso preserves cover for other machines damaged by fire set up by the mixer. Stock, building items and the soot clean-up are admitted as insured damage. Average under Condition 20 applies to Item 2 (sum insured RM 150,000.00 against value at risk RM 200,000.00, factor 0.75).</td><td>Mixer: machine in which the electrical fault began; replacement claimed RM 18,500.00 <span class=\"meta\">(Adjuster's report, Measurement, ref 2)</span><br>Oven, proofer, worktables RM 62,000.00 and shelving RM 14,000.00 damaged by the spreading fire <span class=\"meta\">(Adjuster's report, Measurement, refs 3 and 4)</span><br>Values at risk: Item 1 RM 275,000.00; Item 2 RM 200,000.00; Item 3 RM 52,000.00 <span class=\"meta\">(Adjuster's report, Measurement, Value at risk; valuation report of 24 September 2024)</span></td></tr></table>\n<h3>Proximate cause</h3><p>fire</p><p>Electrical fault within the motor of the spiral dough mixer (insulation failure, short circuiting and overheating, per the registered competent person's report of 23 September 2024), which set fire to the mixer; fire spread to the adjacent timber shelving and packaging, then across the production area and through part of the ground floor ceiling.</p><p>Intervening event: none.</p>\n<h3>Flags for the claims examiner</h3><ul><li>Class judgment for the examiner: ref 6, soot removal, cleaning and disposal (RM 6,200.00), is classed insured_damage, as clean-up of insured Item 1 damaged by smoke and soot. It is not classed mitigation_expense because the adjuster describes it as cleaning and disposal, not emergency work to stop further damage. If the examiner treats it as mitigation, the figure would change.</li><li>Underinsurance on Item 2: sum insured RM 150,000.00 against value at risk RM 200,000.00 (factor 0.75 under Condition 20). This reduces the payable on the admitted Item 2 items (oven, proofer, worktables and shelving, RM 76,000.00 claimed, RM 57,000.00 after average). The examiner should confirm the valuation basis.</li><li>Mixer excluded in full under FP508A.01 (RM 18,500.00). The exclusion applies only to the machine in which the fault began; the proviso preserves cover for the other machines damaged by fire.</li><li>Stock was disposed of on 16 September 2024 under health officer supervision; salvage is nil. Stock is at cost per invoices (RM 21,500.00).</li></ul>\n<h3>Advice</h3><p>The loss is by fire, an insured peril, inside the period, notified and claimed in writing within 15 days, with no endorsement or Condition 9 issue. The spiral dough mixer (RM 18,500.00) is excluded under FP508A.01 as the machine in which the electrical fault began, but the other machines and the building, stock and clean-up items are admitted. The payable of RM 130,700.00 reflects the Item 2 average (factor 0.75). The examiner decides, including the soot classing and the Item 2 valuation.</p>\n<p class=\"meta\">Governing clause: Operative clause (fire during the period, gate 2); FP508A.01 exclusion for the electrical machine where the fault began (gate 6); Condition 20 average on Item 2.. The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 130,700.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 2  RM    18,500.00  EXCLUDED by FP508A.01  (Spiral dough mixer, destroyed)</code></td></tr><tr><td><code>  excluded total       RM    18,500.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  280,000.00  value    RM 275,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM  150,000.00  value RM  200,000.00  factor 0.7500  UNDERINSURED</code></td></tr><tr><td><code>  Item 3  SI RM   60,000.00  value     RM 52,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 3, 4, 5, 6]</code></td></tr><tr><td><code>     subtotal          RM   149,700.00</code></td></tr><tr><td><code>     after average     RM   130,700.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM   130,700.00</code></td></tr><tr><td><code>  CLAIMED             RM   168,200.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM   130,700.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 16 tool calls: 7 searches of the policy, 7 gate checks, 1 pricing and 1 submission. 1 call was refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"FP508A.01\"</td><td><code>ENDORSEMENT-FP508A.01</code> override</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>8</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-09-14</td><td class=\"meta\">Incident report, email of 25 September 2024 and Adjuster's report, Investigation</td></tr><tr><td><code>period_start</code></td><td>2024-03-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2025-02-28</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 14 September 2024 falls inside 1 March 2024 to 28 February 2025.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>fire</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: fire spread from the mixer's electrical fault</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin and Reports relied on</td></tr><tr><td><code>endorsements_held</code></td><td>FP508A.01, FC816, FC805</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: fire, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-09-14</td><td class=\"meta\">Incident report, email of 25 September 2024</td></tr><tr><td><code>written_claim_date</code></td><td>2024-09-25</td><td class=\"meta\">Incident report, email from Nurul Ain Mohd Faizal dated 25 September 2024</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report, email of 15 September 2024 (no extension in writing)</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 25 September 2024, day 11 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP508A.01, FC816, FC805</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. No endorsement is required for a base peril.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 5, 6 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Risk as found against the schedule</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: all staff left by 10:30 pm, bakery trading</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Risk as found: no transfer of interest</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr><tr><td><code>fall_or_displacement</code></td><td>False</td><td class=\"meta\">Adjuster's report, Investigation: no fall or displacement reported</td></tr></table></details></td><td><span class=\"chip err\">clause_not_retrieved</span> Search the policy for FP508A.01 before this gate; a gate rests only on wording retrieved for this claim.</td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 5, 6 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses: Warranties None</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Risk as found against the schedule</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss: all staff left by 10:30 pm, bakery trading</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Risk as found: no transfer of interest</td></tr><tr><td><code>sanction_endorsed</code></td><td>False</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr><tr><td><code>fall_or_displacement</code></td><td>False</td><td class=\"meta\">Adjuster's report, Investigation: no fall or displacement reported</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 9</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>14</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>6 items</td><td class=\"meta\">Adjuster's report, Measurement table</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. 5 of 6 items admitted.<span class=\"meta\"><br>ref 1 admitted; ref 2 excluded (FP508A.01); ref 3 admitted; ref 4 admitted; ref 5 admitted; ref 6 admitted</span></td></tr>\n<tr><td>15</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>6 items, sums insured and values at risk</td><td><span class=\"chip ok\">Payable</span> RM 130,700.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 2  RM    18,500.00  EXCLUDED by FP508A.01  (Spiral dough mixer, destroyed)</code></div><div><code>  excluded total       RM    18,500.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  280,000.00  value    RM 275,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM  150,000.00  value RM  200,000.00  factor 0.7500  UNDERINSURED</code></div><div><code>  Item 3  SI RM   60,000.00  value     RM 52,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 3, 4, 5, 6]</code></div><div><code>     subtotal          RM   149,700.00</code></div><div><code>     after average     RM   130,700.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM   130,700.00</code></div><div><code>  CLAIMED             RM   168,200.00</code></div><div><code>  RECOMMENDED PAYABLE RM   130,700.00</code></div></details></td></tr>\n<tr><td>16</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2025-07741": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Chew Jun Hao &lt;[redacted]&gt;<br><b>To:</b> Farah Liyana &lt;[redacted]&gt;<br><b>Date:</b> Monday, 23 June 2025, 7:15 am<br><b>Subject:</b> Fire at JH Mobile Centre, Jalan Abdullah</div><p>Hi Cik Farah,</p>\n<p>My shop JH Mobile Centre at 63 Jalan Abdullah, Muar caught fire early this morning. The security guard of the bank next door called me at around 4:10 am. Bomba came and put out the fire. They said it started at the charging station on the front display counter.</p>\n<p>The front of the shop is badly burnt, the display counters and the glass cabinets are finished and most of the phones in the cabinets and the store drawer are burnt.</p>\n<p>Please help me inform the insurance.</p>\n<p>Thanks,<br>Jun Hao</p>\n<p><b>Attachments:</b> 4 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Farah Liyana &lt;[redacted]&gt;<br><b>To:</b> Chew Jun Hao &lt;[redacted]&gt;<br><b>Date:</b> Monday, 23 June 2025, 8:02 am<br><b>Subject:</b> Re: Fire at JH Mobile Centre, Jalan Abdullah</div><p>Hi Mr Chew,</p>\n<p>Sorry to hear this. I have notified the insurance company. Please get the Bomba report and police report. Do not throw anything away; the adjuster will need to see the burnt phones. Send me the written claim with the list of items and amounts, and your stock records and purchase invoices.</p>\n<p>Farah</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Chew Jun Hao &lt;[redacted]&gt;<br><b>To:</b> Farah Liyana &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 3 July 2025, 11:48 pm<br><b>Subject:</b> Claim for fire 23 June 2025</div><p>Hi Cik Farah,</p>\n<p>My claim:</p>\n<p>1. Shop renovation, ceiling, wiring, shutter: RM 24,000.00<br>2. Display counters and glass cabinets: RM 15,500.00<br>3. Stock of handphones, tablets and accessories: RM 96,000.00</p>\n<p>Total RM 135,500.00</p>\n<p>I just restocked a lot in May and June because of the school holiday promotion, all the supplier invoices are attached. No other insurance.</p>\n<p>Thanks,<br>Jun Hao</p>\n<p><b>Attachments:</b> Bomba report 23 Jun.pdf; Police report Muar 23 Jun.pdf; Renovation quotation 30 Jun.pdf; Counter and cabinet quotation.pdf; Stock list 22 Jun.xlsx; Supplier invoices Teknik Gadget Trading May to Jun 2025.pdf; Other supplier invoices.pdf; 20 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Farah Liyana &lt;[redacted]&gt;<br><b>To:</b> Chew Jun Hao &lt;[redacted]&gt;<br><b>Date:</b> Friday, 4 July 2025, 9:30 am<br><b>Subject:</b> Re: Claim for fire 23 June 2025</div><p>Received Mr Chew. Submitted to the insurance company this morning.</p>\n<p>Farah</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Seri Adjusters Sdn Bhd</b> · Our ref SAS/JH/25/0802 · Report dated 28 July 2025 · Adjuster: Gopal a/l Krishnan</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>25 June 2025. Ground floor shop lot inspected with the Insured; burnt handsets in the display cabinets and the store drawer counted and their IMEI numbers recorded where legible.</td></tr><tr><td>Cause and origin</td><td>Fire began at a multi-port charging station on the front display counter; a lithium battery pack on charge overnight went into thermal runaway. Fire spread to the counter, cabinets and ceiling.</td></tr><tr><td>Reports relied on</td><td>Bomba report, 23 June 2025: accidental fire, battery on charge. Police report at Muar district police headquarters, 23 June 2025. Letter from Teknik Gadget Trading, 21 July 2025, with its billing system log. Bank statements of the Insured's business account, January to June 2025.</td></tr><tr><td>People interviewed</td><td>The Insured. The bank security guard who raised the alarm. The sales manager of Teknik Gadget Trading. The Insured's shop assistant.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Mobile phone retail shop trading daily, closed overnight.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant.</td></tr><tr><td>Risk as found against the schedule</td><td>Ground floor shop lot used for retail of mobile phones and accessories, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Ceiling, wiring and shutter at the front burnt; counters and cabinets destroyed; 61 handsets and tablets and a quantity of accessories burnt.</td></tr><tr><td>Discrepancies with the incident report</td><td>The claim states heavy restocking in May and June 2025. The point of sale system shows stock at cost of RM 41,000.00 on 22 June 2025, and the handsets recovered match that record.</td></tr><tr><td>Irregularities</td><td>Four invoices from Teknik Gadget Trading, dated between 12 May and 14 June 2025 and totalling RM 55,000.00, were submitted with the claim. The supplier's billing log shows all four were created on 30 June 2025, seven days after the fire. The supplier's sales manager states they were issued at the Insured's request and that no goods were delivered against them. No payment for them appears in the Insured's bank statements. The IMEI numbers listed on them match none of the handsets recovered. The Insured, when shown the log, did not dispute the creation date.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Shop renovation: ceiling, wiring, roller shutter</td><td>Item 1 Renovation</td><td class=\"num\">24,000.00</td><td class=\"num\">22,000.00</td><td>Reinstatement; rates adjusted</td></tr><tr><td>2</td><td>Display counters and glass cabinets</td><td>Item 2 Furniture, fixtures and fittings</td><td class=\"num\">15,500.00</td><td class=\"num\">15,500.00</td><td>Replacement, quotation checked</td></tr><tr><td>3</td><td>Stock: handphones, tablets and accessories</td><td>Item 3 Stock in trade</td><td class=\"num\">96,000.00</td><td class=\"num\">41,000.00</td><td>Verified stock only: point of sale records and invoices confirmed by suppliers; see Irregularities</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>135,500.00</b></td><td class=\"num\"><b>78,500.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Renovation</td><td class=\"num\">60,000.00</td><td class=\"num\">55,000.00</td></tr><tr><td>Item 2 Furniture, fixtures and fittings</td><td class=\"num\">40,000.00</td><td class=\"num\">35,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">150,000.00</td><td class=\"num\">41,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery identified.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 78,500.00 on the verified evidence, before the application of any policy terms. The RM 55,000.00 of invoices described under Irregularities is not supported. Policy liability is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/JH/2025/000923</td></tr><tr><td>Insured</td><td>Chew Jun Hao, trading as JH Mobile Centre (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 January 2025 to 31 December 2025</td></tr><tr><td>Risk address</td><td>Ground floor, 63, Jalan Abdullah, 84000 Muar, Johor</td></tr><tr><td>Construction</td><td>Ground floor of a two-storey intermediate shophouse; brick walls, reinforced concrete slab, concrete tile roof</td></tr><tr><td>Occupation</td><td>Retail of mobile phones and accessories</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Renovation</td><td class=\"num\">60,000.00</td></tr><tr><td>2</td><td>Furniture, fixtures and fittings</td><td class=\"num\">40,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td class=\"num\">150,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>250,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>None</td><td>No endorsements or clauses</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>Nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 23 June 2025 falls inside the schedule period 1 January 2025 to 31 December 2025. FC815 and receipt questions do not arise.</td><td>Date of loss 2025-06-23 <span class=\"meta\">(Incident report, email of 23 June 2025)</span><br>Period 2025-01-01 to 2025-12-31 <span class=\"meta\">(Policy schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Adjuster traces the origin to a battery in thermal runaway, which is fire. No intervening event. Fire is a base insured peril, so no endorsement is needed to bring it in.</td><td>Proximate cause fire; intervening event none <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>if any false declaration be made or used in support thereof, or if any fraudulent means or devices are used by the Insured or any one acting on his behalf to obtain any benefit under this Policy<span class=\"cite\">Condition 15</span></blockquote><blockquote>No claim under this Policy shall be payable unless the terms of this Condition have been complied with.<span class=\"cite\">Condition 12</span></blockquote>The written claim (3 July 2025, day 10) is within 15 days, so Condition 12 time limb is met. However, the adjuster found that four Teknik Gadget Trading invoices totalling RM 55,000.00, submitted in support of the claim, were created on 30 June 2025, seven days after the fire. The supplier says they were issued at the Insured's request with no goods delivered. No payment appears in the bank statements and the IMEIs match no recovered handset. A false declaration was therefore used in support of the claim, and Condition 15 forfeits all benefit.</td><td>Written claim dated 2025-07-03, day 10 after loss; no extension in writing <span class=\"meta\">(Incident report, claimant's email 3 July 2025; forwarded 4 July 2025)</span><br>Four invoices dated 12 May to 14 June 2025, RM 55,000.00, created 2025-06-30 per supplier billing log; no goods delivered; no payment in bank statements; IMEIs match no recovered handset <span class=\"meta\">(Adjuster's report, Findings, Irregularities; Reports relied on (billing system log, bank statements))</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: chain stopped at gate 3.</td><td></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: chain stopped at gate 3.</td><td></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: chain stopped at gate 3. Item-level view is given in the figure working only.</td><td></td></tr></table>\n<h3>Proximate cause</h3><p>Fire (base insured peril). Dominant effective cause: a lithium battery pack on a multi-port charging station went into thermal runaway overnight.</p><p>Battery on charge overnight went into thermal runaway; fire began at the charging station on the front display counter and spread to the counter, cabinets and ceiling.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Restocked heavily in May and June 2025 for the school holiday promotion; stock claim RM 96,000.00 supported by supplier invoices of RM 55,000.00 (incident report, email of 3 July 2025).</td><td>Point of sale system shows stock at cost of RM 41,000.00 on 22 June 2025, matching handsets recovered. The four invoices were created 30 June 2025, no goods were delivered, and no payment appears in bank statements (adjuster's report, Findings).</td><td>Adjuster's finding: stock verified at RM 41,000.00; the RM 55,000.00 of invoices is not supported and is excluded from the figure.</td></tr><tr><td>Renovation claimed at RM 24,000.00.</td><td>Reinstatement assessed at RM 22,000.00 after rate adjustment (adjuster's report, Measurement, ref 1).</td><td>Adjuster's assessed RM 22,000.00 used.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>Gate 3 fraud limb rests on the adjuster's finding of invoice creation dates from the supplier's billing log. The Insured did not dispute the creation date when shown the log (adjuster's report, Irregularities). The examiner should note that the invoices were submitted in support of the claim and the supplier's sales manager confirms they were issued without goods, which supports the Condition 15 finding.</li><li>Figure working: the calculate_payable working shows claimed RM 133,500.00 because the assessed amounts were entered per item. The claim as submitted is RM 135,500.00. The RM 2,000.00 difference is the adjuster's rate adjustment on item 1 and does not change the figure.</li></ul>\n<h3>Advice</h3><p>The claim fails at gate 3. Condition 15 forfeits all benefit because four invoices of RM 55,000.00, submitted in support of the claim, were created seven days after the fire and no goods were delivered against them. The verified fire loss on the adjuster's figures is RM 78,500.00, but that is a but-for figure only and is not payable. The examiner decides whether to decline on Condition 15.</p>\n<p class=\"meta\">Governing clause: Condition 15 (fraud or false declaration in support of the claim forfeits all benefit under the policy), read with Condition 12.. The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 78,500.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 3A  RM    55,000.00  EXCLUDED by Operative clause (damage not caused by the insured event)  (Stock claimed beyond verified records: four )</code></td></tr><tr><td><code>  excluded total       RM    55,000.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM   60,000.00  value     RM 55,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   40,000.00  value     RM 35,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM  150,000.00  value     RM 41,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [BASE] refs [1, 2, 3]</code></td></tr><tr><td><code>     subtotal          RM    78,500.00</code></td></tr><tr><td><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></td></tr><tr><td><code>     net               RM    78,500.00</code></td></tr><tr><td><code>  CLAIMED             RM   133,500.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM    78,500.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 10 tool calls: 5 searches of the policy, 3 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>6</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2025-06-23</td><td class=\"meta\">Incident report, email of 23 June 2025</td></tr><tr><td><code>period_start</code></td><td>2025-01-01</td><td class=\"meta\">Policy schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2025-12-31</td><td class=\"meta\">Policy schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 23 June 2025 falls inside 1 January 2025 to 31 December 2025.<span class=\"meta\"></span></td></tr>\n<tr><td>7</td><td><code>check_gate</code></td><td>Gate 2, 2 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>fire</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: lithium battery pack on charge went into thermal runaway; fire spread to counter, cabinets and ceiling</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Proximate cause: fire, a base insured peril (fire or lightning).<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2025-06-23</td><td class=\"meta\">Incident report, email of 23 June 2025</td></tr><tr><td><code>written_claim_date</code></td><td>2025-07-03</td><td class=\"meta\">Incident report, claimant's email of 3 July 2025 (Claim for fire 23 June 2025), forwarded 4 July 2025</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Policy file: no written extension of time recorded</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>True</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: four Teknik Gadget Trading invoices (RM 55,000.00) created 30 June 2025, no goods delivered, IMEIs match no recovered handset, supplier sales manager confirms issued at Insured's request</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>Condition 15</b>. Written claim on day 10 is in time, but a false declaration or fraud was used in support of the claim. All benefit under the policy is forfeited.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>4 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 78,500.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 3A  RM    55,000.00  EXCLUDED by Operative clause (damage not caused by the insured event)  (Stock claimed beyond verified records: four )</code></div><div><code>  excluded total       RM    55,000.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM   60,000.00  value     RM 55,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   40,000.00  value     RM 35,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM  150,000.00  value     RM 41,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [BASE] refs [1, 2, 3]</code></div><div><code>     subtotal          RM    78,500.00</code></div><div><code>     excess            RM         0.00   No excess. Schedule states nil for this peril.</code></div><div><code>     net               RM    78,500.00</code></div><div><code>  CLAIMED             RM   133,500.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM    78,500.00</code></div></details></td></tr>\n<tr><td>10</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2023-02857": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Thursday, 2 March 2023</div><div class=\"msg out\">Kak Aminah good morning. My workshop at Jalan Genuang kena banjir last night. Very heavy rain and strong wind whole night, then Sungai Segamat water came up. Inside the workshop water almost waist level<span class=\"t\">7:05 am</span></div><div class=\"msg out\"><span class=\"att\">5 photos</span><span class=\"t\">7:06 am</span></div><div class=\"msg in\"><span class=\"who\">Aminah binti Bakar</span>Ravi, alamak. Are you and the workers ok? Don't go in if the current is strong. Take photos and videos once safe<span class=\"t\">7:30 am</span></div><div class=\"msg out\">All ok kak. Compressor, hoist motor, all my tools under water. Spare parts on the bottom racks all spoilt. One customer car also inside for repair<span class=\"t\">7:34 am</span></div><div class=\"msg in\"><span class=\"who\">Aminah binti Bakar</span>Ok noted. I will inform the insurance company this morning. Once water goes down send me the claim with the list and amounts, with quotations<span class=\"t\">7:50 am</span></div><div class=\"msg in\"><span class=\"who\">Aminah binti Bakar</span>Ravi, I have notified the insurance company. Adjuster will contact you<span class=\"t\">11:20 am</span></div><div class=\"day\">Thursday, 9 March 2023</div><div class=\"msg out\">Kak, here is the claim for the flood<span class=\"t\">9:12 pm</span></div><div class=\"msg out\">1. Workshop repair, wall, roller shutter motor, wiring RM 14,800<br>2. Air compressor, hydraulic hoist motor, tools RM 22,600<br>3. Spare parts stock RM 18,900<br>4. Customer car (Myvi) interior and engine damage RM 6,500<br><b>Total RM 62,800</b><span class=\"t\">9:14 pm</span></div><div class=\"msg out\"><span class=\"att\">Quotation repair workshop.pdf</span> <span class=\"att\">Compressor and hoist quotation.pdf</span> <span class=\"att\">Spare parts stock list.pdf</span> <span class=\"att\">Customer car repair estimate.pdf</span> <span class=\"att\">18 photos</span><span class=\"t\">9:15 pm</span></div><div class=\"msg out\">I got the storm cover in my policy right kak? Because the wind was very strong that night also<span class=\"t\">9:17 pm</span></div><div class=\"msg in\"><span class=\"who\">Aminah binti Bakar</span>Received Ravi. I will submit everything to the insurance company tomorrow<span class=\"t\">9:30 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Seri Adjusters Sdn Bhd</b> · Our ref SAS/JH/23/0341 · Report dated 24 March 2023 · Adjuster: Low Wei Jie</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>4 March 2023, after the water receded. Single-storey workshop, yard and rear store inspected with the Insured. Flood line on internal walls at 0.95 m.</td></tr><tr><td>Cause and origin</td><td>Overflow of Sungai Segamat after prolonged heavy rain from 28 February 2023. Water entered from the road and the rear drain and stood inside the workshop overnight on 1 to 2 March 2023. Roof sheets, ridge cap and walls intact; no opening made by wind.</td></tr><tr><td>Reports relied on</td><td>Department of Irrigation and Drainage river level records for Segamat, 28 February to 4 March 2023, river above danger level from the evening of 1 March. Segamat district disaster management notice of flood evacuation for Jalan Genuang, 1 March 2023. Electrical contractor's test report, 6 March 2023.</td></tr><tr><td>People interviewed</td><td>The Insured. His senior mechanic, who closed the workshop at 6:00 pm on 1 March. The owner of the adjoining tyre shop, flooded to the same depth.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Motor repair workshop trading six days a week.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant to the loss.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey detached workshop used for motor vehicle servicing and mechanical repair, as scheduled. No spray painting booth, spray guns or paint mixing found on the premises.</td></tr><tr><td>Damage found per item</td><td>Wall plaster, roller shutter motor and power points below the flood line; compressor, hoist motor and tools water damaged; spare parts on the lower racks rusted and contaminated. A customer's vehicle left for repair was flooded inside the workshop.</td></tr><tr><td>Discrepancies with the incident report</td><td>The Insured describes strong wind on the night. The roof and walls show no wind damage, and no water entered through the roof. The damage was caused by water entering from outside at ground level.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Workshop building: wall plaster, roller shutter motor, wiring below flood line</td><td>Item 1 Building</td><td class=\"num\">14,800.00</td><td class=\"num\">13,900.00</td><td>Reinstatement; rates adjusted</td></tr><tr><td>2</td><td>Air compressor, hydraulic hoist motor, hand and power tools</td><td>Item 2 Machinery, tools and equipment</td><td class=\"num\">22,600.00</td><td class=\"num\">21,400.00</td><td>Repair and replacement, depreciation for age</td></tr><tr><td>3</td><td>Spare parts stock on lower racks</td><td>Item 3 Stock in trade</td><td class=\"num\">18,900.00</td><td class=\"num\">18,900.00</td><td>Cost price per supplier invoices</td></tr><tr><td>4</td><td>Customer's vehicle under repair (Perodua Myvi)</td><td>None</td><td class=\"num\">6,500.00</td><td class=\"num\">6,500.00</td><td>Repair estimate</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>62,800.00</b></td><td class=\"num\"><b>60,700.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">250,000.00</td><td class=\"num\">240,000.00</td></tr><tr><td>Item 2 Machinery, tools and equipment</td><td class=\"num\">90,000.00</td><td class=\"num\">85,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">40,000.00</td><td class=\"num\">36,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Scrap value of the compressor motor RM 150.00, already deducted.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found on the workshop. The customer's vehicle is insured under the owner's own motor policy.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 60,700.00 before the application of any policy terms, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/JH/2022/006615</td></tr><tr><td>Insured</td><td>Ravi a/l Muniandy, trading as Ravi Auto Service (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>15 June 2022 to 14 June 2023</td></tr><tr><td>Risk address</td><td>PT 4417, Jalan Genuang, 85000 Segamat, Johor</td></tr><tr><td>Construction</td><td>Single-storey detached workshop; brick walls, concrete floor, metal deck roof on steel trusses</td></tr><tr><td>Occupation</td><td>Motor vehicle servicing and mechanical repair workshop</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">250,000.00</td></tr><tr><td>2</td><td>Machinery, tools and equipment</td><td class=\"num\">90,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td class=\"num\">40,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>380,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP503</td><td>Storm, Tempest Endorsement</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>FW704B Restriction of Spray Painting / Powder Spraying Warranty</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 2023-03-01 falls within the schedule period 15 June 2022 to 14 June 2023. FC815 is not needed.</td><td>Date of loss 2023-03-01 (night of 1 to 2 March 2023) <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Period of insurance 2022-06-15 to 2023-06-14 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Flood (including overflow of the sea)<span class=\"cite\">FP504: Flood Endorsement</span></blockquote><blockquote>destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Flood is not a base peril under the Operative clause, which covers fire or lightning only. Flood is insured anywhere in the policy only by FP504, which is not on the schedule. Per the gate result, the peril is tested as insured anywhere, held or not, so gate 2 passes. Whether FP504 is held is decided at gate 4. No intervening event: the adjuster found no wind opening, so the claimant's storm account does not displace flood as the cause.</td><td>Proximate cause: overflow of Sungai Segamat, water entering at ground level <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>Wind did not open the roof or walls; no water entered through the roof <span class=\"meta\">(Adjuster's report, Findings, Discrepancies with the incident report)</span><br>Endorsements held: FP503 only <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim sent 2023-03-09, day 8 of 15 after the 2023-03-01 loss. The agent notified the insurer on 2 March. No written extension was needed. No fraud or false declaration found by the adjuster.</td><td>Written claim delivered 2023-03-09 <span class=\"meta\">(Incident report, Thursday 9 March 2023 (9:12 pm))</span><br>Irregularities: none found <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Flood (including overflow of the sea)<span class=\"cite\">FP504: Flood Endorsement</span></blockquote>The endorsement that answers flood is FP504. It is not on the schedule, and the schedule holds only FP503 (storm, tempest). FP503 does not bring in flood. Its Special Condition 1 excludes water or rain unless the roof or walls are first damaged by wind, and the adjuster found no such damage. The gate returned its failure citing Condition 6(b), but Condition 6(b) as retrieved concerns typhoon, hurricane, tornado and cyclone, not flood. The operative ground is FP504 not being held. The examiner should rely on that ground, not on the Condition 6(b) citation.</td><td>Endorsements held: FP503 only; FP504 not on schedule <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>No wind damage to roof or walls; water from ground level <span class=\"meta\">(Adjuster's report, Findings, Discrepancies with the incident report)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain stopped at gate 4.</td><td></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: the chain stopped at gate 4. The adjuster's measurement is noted: items 1 to 3 assessed RM 13,900, RM 21,400 and RM 18,900, and the customer's vehicle RM 6,500 (not property insured; insured under the owner's own motor policy). These were not classed or priced.</td><td>Assessed amounts and measurement <span class=\"meta\">(Adjuster's report, Measurement)</span></td></tr></table>\n<h3>Proximate cause</h3><p>flood</p><p>Prolonged heavy rain from 28 February 2023 caused the Sungai Segamat to overflow. Water entered the workshop from the road and the rear drain at ground level and stood inside overnight on 1 to 2 March 2023. No wind opening in roof or walls.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Strong wind and storm cover in the policy should respond to the flood damage, because the wind was very strong that night (incident report, 9 March 2023, 9:17 pm).</td><td>Roof sheets, ridge cap and walls intact; no opening made by wind; water entered from outside at ground level (adjuster's report, Investigation and Findings).</td><td>Adjuster's finding applied: the damage was caused by flood water, not wind, so FP503 does not respond.</td></tr></table>\n<h3>Flags for the claims examiner</h3><ul><li>FP504 (flood) is not on the schedule. The claimant's loss is flood, and the only held endorsement is FP503 (storm). The examiner should check whether the insured held or was offered FP504 before deciding.</li><li>The check cited Condition 6(b) for the gate 4 failure. As retrieved, Condition 6(b) covers typhoon, hurricane, tornado and cyclone. Use the FP504-not-held reason as the basis.</li></ul>\n<h3>Advice</h3><p>The claim fails at gate 4. Flood is insured only by FP504, which is not on the schedule, and FP503 does not reach flood water that did not enter through wind-damaged roof or walls. The claimant's storm argument is not supported by the adjuster's findings. The gate result cites Condition 6(b), but the operative ground is FP504 not being held. The claim is not payable as scheduled. Gates 5 and 6 were not reached. The examiner decides.</p>\n<p class=\"meta\">Governing clause: Condition 6(b). The claims examiner decides.</p>\n<h3>Figure</h3><p>Not priced. The endorsement that answers the cause is not held, so there is no cover to price at any figure.</p>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 18 tool calls: 11 searches of the policy, 4 gate checks, 1 pricing and 2 submissions. 1 call was refused or sent back and then fixed.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP503\"</td><td><code>ENDORSEMENT-FP503</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"FC815\"</td><td><code>CLAUSE-FC815</code> secondary</td></tr>\n<tr><td>8</td><td><code>search_policy</code></td><td>\"flood inundation river overflow water damage cover\"</td><td><code>ENDORSEMENT-FP504</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP507A</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP507B</code> informational <span class=\"meta\">(not held: cannot override)</span><br><code>ENDORSEMENT-FP510</code> informational <span class=\"meta\">(not held: cannot override)</span></td></tr>\n<tr><td>9</td><td><code>search_policy</code></td><td>code \"FW704B\"</td><td><code>WARRANTY-FW704B</code> primary</td></tr>\n<tr><td>10</td><td><code>search_policy</code></td><td>code \"Condition 4\"</td><td><code>CONDITION-4</code> primary</td></tr>\n<tr><td>11</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-03-01</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (water stood inside overnight 1 to 2 March 2023; river above danger level from evening of 1 March)</td></tr><tr><td><code>period_start</code></td><td>2022-06-15</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2023-06-14</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 1 March 2023 falls inside 15 June 2022 to 14 June 2023.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>flood</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (overflow of Sungai Segamat after prolonged heavy rain; water entered from road and rear drain)</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin and Findings, Discrepancies with the incident report (no wind opening; damage from water at ground level)</td></tr><tr><td><code>endorsements_held</code></td><td>FP503</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP504</b>. Proximate cause: flood. Not a base peril; FP504 brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-03-01</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>written_claim_date</code></td><td>2023-03-09</td><td class=\"meta\">Incident report, Thursday 9 March 2023 (claim sent 9:12 pm via agent)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report and Adjuster's report: no written extension of time found</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 9 March 2023, day 8 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>14</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP503</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>Condition 6(b)</b>. FP504 is not on the schedule, so Condition 6(b) stands. The loss is not covered.<span class=\"meta\"></span></td></tr>\n<tr><td>15</td><td><code>search_policy</code></td><td>code \"Condition 6\"</td><td><code>CONDITION-6</code> primary</td></tr>\n<tr><td>16</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>4 items, sums insured and values at risk</td><td><span class=\"chip no\">Not priced</span> The endorsement that answers the cause is not held, so there is no cover to price at any figure.</td></tr>\n<tr><td>17</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip no\">Sent back</span> <div><span class=\"chip err\">clause_mismatch</span> <code>governing_clause</code> The governing clause is 'Operative clause (fire or lightning only); flood brought in only by FP504, not held (gate 4).', but the result rests on 'Condition 6(b)' (the clause check_gate returned at the deciding gate). Name that clause; mention other grounds in the advice text.</div></td></tr>\n<tr><td>18</td><td><code>submit_advice</code></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2023-12440": {"incident": "<h2>Incident report</h2><div class=\"chat\"><div class=\"day\">Saturday, 20 January 2024</div><div class=\"msg out\">Mr Leong, good morning. This is Chong Mei Ling, Chong Kah Weng's wife, the sundry and hardware shop at 25 Jalan Idris, Kampar. Sorry only contacting you now. Our shop kena flood last month, 20 December, when Sungai Kampar overflowed<span class=\"t\">10:05 am</span></div><div class=\"msg out\">Water came in from the back lane around 3 am, went up to about 1.2 metres downstairs and only went down on the afternoon of 21 Dec. Me and my 2 kids moved upstairs, nobody hurt<span class=\"t\">10:07 am</span></div><div class=\"msg out\">After that no electricity and no phone line for a few days, then the whole family busy cleaning, and the kids' school also had to settle. My husband is working in Singapore, he only came back after new year. So only now I come to you<span class=\"t\">10:08 am</span></div><div class=\"msg in\"><span class=\"who\">Leong Wai Kit</span>Alamak Mei Ling, sorry to hear. Glad all of you are safe. So the flood was on 20 December? Please send me everything you have, the list of items with amounts, photos
