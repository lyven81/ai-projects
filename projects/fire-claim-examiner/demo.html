and quotations, and I will notify the insurance company today<span class=\"t\">10:20 am</span></div><div class=\"msg out\">Ok. Downstairs everything spoilt. Stock on the lower shelves and on the floor, walls and cabinets wet up to about 1.3 m, the chest freezer, display chiller and the POS machine all spoilt. My clothes and the household linen in the back room also<span class=\"t\">10:41 am</span></div><div class=\"msg out\">Also when the water went down, the back boundary wall about 4 metres leaned and partly fell, and the back driveway sank uneven. Contractor says the soil under it got soaked and washed away. The house itself no crack<span class=\"t\">10:43 am</span></div><div class=\"msg out\">And the cash in the tin in the drawer under the counter, RM 6,800, takings from 16 to 19 Dec, I didn't bank in yet before the flood<span class=\"t\">10:44 am</span></div><div class=\"msg out\">Here is the claim<span class=\"t\">11:30 am</span></div><div class=\"msg out\">1. Building: wall plaster, skirting, doors, electrical points and painting to 1.5m RM 34,600<br>2. Shop cabinets and shelving RM 11,200<br>3. Chest freezer, display chiller, POS terminal RM 9,800<br>4. Stock destroyed RM 22,400<br>5. Personal effects, clothing and household linen RM 8,900<br>6. Rear boundary wall, rebuild 4 metre section RM 7,600<br>7. Rear driveway, relay the sunken part RM 5,300<br>8. Cash in counter drawer RM 6,800<br>9. Silt removal, drying and cleaning RM 4,150<br><b>Total RM 110,750</b><span class=\"t\">11:32 am</span></div><div class=\"msg out\"><span class=\"att\">JPS flood bulletin Kampar 20 Dec.pdf</span> <span class=\"att\">Building quotation 15 Jan.pdf</span> <span class=\"att\">Boundary wall and driveway quotation 15 Jan.pdf</span> <span class=\"att\">Stock invoices Sep to Dec 2023.pdf</span> <span class=\"att\">Daily takings record 16 to 19 Dec.pdf</span> <span class=\"att\">Freezer and chiller receipts.pdf</span> <span class=\"att\">63 photos</span><span class=\"t\">11:34 am</span></div><div class=\"msg out\">My husband's IC no: <span class=\"att\">redacted</span>. No other insurance<span class=\"t\">11:36 am</span></div><div class=\"msg in\"><span class=\"who\">Leong Wai Kit</span>Received Mei Ling. I have notified the insurance company and submitted your claim today. The adjuster will contact you<span class=\"t\">12:15 pm</span></div></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Bayu Loss Adjusters Sdn Bhd</b> · Our ref BLA/PK/24/0058 · Report dated 9 February 2024 · Adjuster: Wong Kar Mun</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>23 January 2024, about one month after the water receded. Ground floor shop, rear room, rear boundary wall and paved rear driveway inspected with the claimant. Flood line on internal walls at about 1.3 m. Most damaged stock already discarded; seen in the claimant's photographs.</td></tr><tr><td>Cause and origin</td><td>Overflow of Sungai Kampar after continuous heavy rain from the afternoon of 19 December 2023. Water entered the ground floor from the rear lane at about 3:00 am on 20 December 2023, rose to about 1.2 m and stood until the afternoon of 21 December. As the water receded, a section of the rear boundary wall about four metres long leaned and partly collapsed and the paved rear driveway settled unevenly, the ground beneath having been saturated and washed out. The main building shows no cracking or settlement.</td></tr><tr><td>Reports relied on</td><td>Department of Irrigation and Drainage flood bulletin, Kampar district, 20 December 2023: Sungai Kampar above the danger threshold from 1:40 am to 4:00 pm. Contractor quotations for building reinstatement and for the boundary wall and driveway, 15 January 2024. Supplier invoices for stock, September to December 2023. The claimant's handwritten daily takings record, 16 to 19 December 2023. Purchase receipts for the chest freezer (2021) and display chiller (2022). The claimant's photographs, timestamped 20 to 23 December 2023. Title search: the Insured is the registered proprietor.</td></tr><tr><td>People interviewed</td><td>The claimant. The contractor who quoted for the boundary wall and driveway.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Shop trading; first floor residence occupied throughout by the claimant and her two children. The Insured works in Singapore and returns monthly.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant to the loss.</td></tr><tr><td>Risk as found against the schedule</td><td>Two-storey intermediate shophouse, no mezzanine, as scheduled; rear boundary wall and paved rear driveway within the lot, not separately itemised. No change of trade or occupation.</td></tr><tr><td>Damage found per item</td><td>Wall plaster, skirting, doors and electrical points below about 1.5 m; shop cabinetry and shelving soaked; chest freezer, display chiller and point of sale terminal water damaged; stock on lower shelving and at floor level destroyed; clothing and household linen in the ground floor rear room destroyed; rear boundary wall leaning and partly collapsed over about four metres; rear driveway settled. Silt throughout the ground floor.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material.</td></tr><tr><td>Irregularities</td><td>First notice of the loss and the written claim both reached the Company on 20 January 2024, 31 days after the loss. No request for more time was made to the Company before that date and no written extension of time appears on the file. Reasons given by the claimant: no electricity or mobile coverage for several days, cleaning, the children's school arrangements, and the Insured in Singapore until the new year.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Building: wall plaster, skirting, doors, electrical points and repainting to 1.5 m</td><td>Item 1 Building</td><td class=\"num\">34,600.00</td><td class=\"num\">34,600.00</td><td>Reinstatement, quotation checked</td></tr><tr><td>2</td><td>Shop cabinetry and shelving</td><td>Item 2 Contents and personal effects</td><td class=\"num\">11,200.00</td><td class=\"num\">11,200.00</td><td>Replacement</td></tr><tr><td>3</td><td>Chest freezer, display chiller and point of sale terminal</td><td>Item 2 Contents and personal effects</td><td class=\"num\">9,800.00</td><td class=\"num\">9,800.00</td><td>Replacement; purchase receipts 2021 and 2022 seen</td></tr><tr><td>4</td><td>Stock in trade destroyed</td><td>Item 3 Stock in trade</td><td class=\"num\">22,400.00</td><td class=\"num\">22,400.00</td><td>Cost price per supplier invoices</td></tr><tr><td>5</td><td>Personal effects, clothing and household linen</td><td>Item 2 Contents and personal effects</td><td class=\"num\">8,900.00</td><td class=\"num\">8,900.00</td><td>Replacement</td></tr><tr><td>6</td><td>Rear boundary wall, rebuild four metre section</td><td>Item 1 Building (within the lot)</td><td class=\"num\">7,600.00</td><td class=\"num\">7,600.00</td><td>Quotation checked; wall leaned as the saturated ground washed out</td></tr><tr><td>7</td><td>Rear paved driveway, relay settled section</td><td>Item 1 Building (within the lot)</td><td class=\"num\">5,300.00</td><td class=\"num\">5,300.00</td><td>Quotation checked; driveway settled as the saturated ground washed out</td></tr><tr><td>8</td><td>Cash in the counter drawer</td><td>None</td><td class=\"num\">6,800.00</td><td class=\"num\">6,800.00</td><td>Claimant's daily takings record, 16 to 19 December 2023</td></tr><tr><td>9</td><td>Silt removal, drying and cleaning</td><td>Item 1 Building</td><td class=\"num\">4,150.00</td><td class=\"num\">4,150.00</td><td>Contractor's rates checked</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>110,750.00</b></td><td class=\"num\"><b>110,750.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">300,000.00</td><td class=\"num\">285,000.00</td></tr><tr><td>Item 2 Contents and personal effects</td><td class=\"num\">85,000.00</td><td class=\"num\">76,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">40,000.00</td><td class=\"num\">35,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil. Flood-damaged stock and appliances discarded.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 110,750.00 before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/PK/2023/009021</td></tr><tr><td>Insured</td><td>Chong Kah Weng (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 December 2023 to 30 November 2024</td></tr><tr><td>Risk address</td><td>25, Jalan Idris, 31900 Kampar, Perak</td></tr><tr><td>Construction</td><td>Two-storey intermediate shophouse; brick walls, reinforced concrete first floor slab, concrete tile roof; rear boundary wall and paved rear driveway within the lot; no mezzanine</td></tr><tr><td>Occupation</td><td>Sundry and hardware shop (ground floor); residence (first floor)</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th>Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td>300,000.00</td></tr><tr><td>2</td><td>Contents and personal effects</td><td>85,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td>40,000.00</td></tr><tr><td></td><td><b>Total</b></td><td><b>425,000.00</b></td></tr><tr><td></td><td>Money and cash</td><td>Not itemised</td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP504</td><td>Flood Endorsement</td></tr><tr><td>FP510</td><td>Subsidence and Landslip Endorsement, Standard Cover</td></tr><tr><td>FC816</td><td>Reinstatement Value Clause</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 20 December 2023 falls inside the period 1 December 2023 to 30 November 2024. FC815 facts are not needed.</td><td>date_of_loss 2023-12-20 <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>period 2023-12-01 to 2024-11-30 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Flood (including overflow of the sea)<span class=\"cite\">FP504: Flood Endorsement</span></blockquote>Proximate cause is flood, which is not a base peril. FP504 brings it in, and whether FP504 is held is tested at gate 4. The wall and driveway movement followed from flood-saturated ground, so no separate intervening event was found.</td><td>Cause: overflow of Sungai Kampar, water in ground floor 2023-12-20 <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>No new independent event; wall and driveway followed from saturated ground <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st fail\">Failed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing for the loss and damage<span class=\"cite\">Condition 12</span></blockquote><blockquote>No claim under this Policy shall be payable unless the terms of this Condition have been complied with.<span class=\"cite\">Condition 12</span></blockquote>The written claim and first notice both reached the Company on 20 January 2024, day 31 after the 20 December 2023 loss. The adjuster found no request for more time before that date and no written extension on file. The claimant's reasons (no electricity or phone for several days, cleaning, the children's school, the Insured in Singapore until the new year) explain the delay but are not a written extension by the Company. No fraud or false declaration was found, so Condition 15 is not engaged.</td><td>Written claim and first notice received 2024-01-20 <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span><br>No written extension of time on the file; no request before 2024-01-20 <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span><br>No fraud or false declaration found <span class=\"meta\">(Adjuster's report, Findings)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: chain stopped at gate 3. FP504 and FP510 are held on the schedule, so no endorsement gap would arise at this gate.</td><td>Endorsements held: FP504, FP510, FC816 <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: chain stopped at gate 3. For the examiner's information, the adjuster records no change of occupation and no unoccupied period, and the schedule records no sanctions under Condition 9.</td><td>Occupation unchanged; shop and residence occupied throughout <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Sanctions endorsed under Condition 9: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st skip\">Not reached</span></td><td>Not reached: chain stopped at gate 3. For the examiner's information, the calculation tool excluded the boundary wall and driveway under FP504 Special Condition 1(c), and the cash under Condition 8(e), before the Condition 20 average and the excess.</td><td>Items and assessed amounts per measurement <span class=\"meta\">(Adjuster's report, Measurement)</span></td></tr></table>\n<h3>Proximate cause</h3><p>flood</p><p>Overflow of Sungai Kampar after continuous heavy rain from 19 December 2023; water entered the ground floor from the rear lane about 3:00 am on 20 December 2023 and stood until the afternoon of 21 December. As it receded, the saturated ground under the rear boundary wall and driveway washed out and the wall leaned and partly collapsed and the driveway settled.</p><p>Intervening event: none.</p>\n<h3>Advice</h3><p>The claim fails at gate 3. The written claim was made on 2024-01-20, 31 days after the 2023-12-20 loss, against Condition 12's 15 days, and no further time was allowed in writing. Unless the Company allowed further time in writing (none is on the file), no claim is payable. The examiner decides. If the examiner were minded to allow further time, the working returned by the calculation is RM 88,550.00 before any further gate, after excluding the wall and driveway (RM 12,900.00 under FP504 Special Condition 1(c)) and the cash (RM 6,800.00 under Condition 8(e)), and after the RM 2,500.00 excess. That figure would still need gates 4 to 6 to be run, and the wall and driveway treatment should be checked against FP510 exclusion (a) as well.</p>\n<p class=\"meta\">Governing clause: Condition 12. The claims examiner decides.</p>\n<h3>Figure</h3><p>Not payable. But for the ground above, the policy would have paid RM 88,550.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 6  RM     7,600.00  EXCLUDED by FP504 Special Condition 1(c)  (Rear boundary wall, rebuild four metre secti)</code></td></tr><tr><td><code>  ref 7  RM     5,300.00  EXCLUDED by FP504 Special Condition 1(c)  (Rear paved driveway, relay settled section)</code></td></tr><tr><td><code>  ref 8  RM     6,800.00  EXCLUDED by Condition 8(e)  (Cash in counter drawer)</code></td></tr><tr><td><code>  excluded total       RM    19,700.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  300,000.00  value    RM 285,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   85,000.00  value     RM 76,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM   40,000.00  value     RM 35,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP504] refs [1, 2, 3, 4, 5, 9]</code></td></tr><tr><td><code>     subtotal          RM    91,050.00</code></td></tr><tr><td><code>     excess            RM     2,500.00   Lesser of (a) 1.0% of total sums insured RM 425,000.00 = RM 4,250.00, or (b) RM 2,500.00. Lesser = RM 2,500.00.</code></td></tr><tr><td><code>     net               RM    88,550.00</code></td></tr><tr><td><code>  CLAIMED             RM   110,750.00</code></td></tr><tr><td><code>  BUT-FOR, NOT PAYABLE RM    88,550.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 13 tool calls: 8 searches of the policy, 3 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP504\"</td><td><code>ENDORSEMENT-FP504</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"FP510\"</td><td><code>ENDORSEMENT-FP510</code> override</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>8</td><td><code>search_policy</code></td><td>code \"Condition 4\"</td><td><code>CONDITION-4</code> primary</td></tr>\n<tr><td>9</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-12-20</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2023-12-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-11-30</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 20 December 2023 falls inside 1 December 2023 to 30 November 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>flood</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: overflow of Sungai Kampar, water entered from rear lane 2023-12-20</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin: wall and driveway movement followed from saturated ground washed out by the flood</td></tr><tr><td><code>endorsements_held</code></td><td>FP504, FP510, FC816</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP504</b>. Proximate cause: flood. Not a base peril; FP504 brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2023-12-20</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>written_claim_date</code></td><td>2024-01-20</td><td class=\"meta\">Adjuster's report, Findings, Irregularities</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: no written extension of time on the file</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings: no fraud or false declaration found</td></tr></table></details></td><td><span class=\"chip no\">Failed</span> <b>Condition 12</b>. Written claim on 20 January 2024, day 31 against 15, with no further time allowed in writing. No claim is payable unless Condition 12 is complied with. The Company may still allow further time in writing.<span class=\"meta\"></span></td></tr>\n<tr><td>12</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>9 items, sums insured and values at risk</td><td><span class=\"chip no\">Not payable</span> but-for RM 88,550.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 6  RM     7,600.00  EXCLUDED by FP504 Special Condition 1(c)  (Rear boundary wall, rebuild four metre secti)</code></div><div><code>  ref 7  RM     5,300.00  EXCLUDED by FP504 Special Condition 1(c)  (Rear paved driveway, relay settled section)</code></div><div><code>  ref 8  RM     6,800.00  EXCLUDED by Condition 8(e)  (Cash in counter drawer)</code></div><div><code>  excluded total       RM    19,700.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  300,000.00  value    RM 285,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   85,000.00  value     RM 76,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM   40,000.00  value     RM 35,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [FP504] refs [1, 2, 3, 4, 5, 9]</code></div><div><code>     subtotal          RM    91,050.00</code></div><div><code>     excess            RM     2,500.00   Lesser of (a) 1.0% of total sums insured RM 425,000.00 = RM 4,250.00, or (b) RM 2,500.00. Lesser = RM 2,500.00.</code></div><div><code>     net               RM    88,550.00</code></div><div><code>  CLAIMED             RM   110,750.00</code></div><div><code>  BUT-FOR, NOT PAYABLE RM    88,550.00</code></div></details></td></tr>\n<tr><td>13</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-15093": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Wan Ahmad Zaki &lt;[redacted]&gt;<br><b>To:</b> Chong Pei Shan &lt;[redacted]&gt;<br><b>Date:</b> Friday, 29 November 2024, 6:18 pm<br><b>Subject:</b> Banjir masuk kilang, Pengkalan Chepa</div><p>Dear Ms Chong,</p>\n<p>I want to inform you that flood water entered my keropok factory at Lot 22, Kawasan Perindustrian Pengkalan Chepa this afternoon. The river behind the industrial area overflowed after three days of rain. By about 2 pm the water was already inside, now about knee level, 3 feet maybe. I already moved what I could to the mezzanine office but the machines and most of the stock are on the floor.</p>\n<p>I cannot go inside now, the road is closed. I will check again when the water goes down.</p>\n<p>Thank you,<br>Wan Ahmad Zaki<br>Kilang Keropok Zaki</p>\n<p><b>Attachments:</b> 3 photos taken from the main road</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Chong Pei Shan &lt;[redacted]&gt;<br><b>To:</b> Wan Ahmad Zaki &lt;[redacted]&gt;<br><b>Date:</b> Friday, 29 November 2024, 7:02 pm<br><b>Subject:</b> Re: Banjir masuk kilang, Pengkalan Chepa</div><p>Dear Encik Zaki,</p>\n<p>Very sorry to hear this, please stay safe first. I have informed the insurance company of the flood tonight. Your policy has the flood endorsement. When the water goes down, take photos before cleaning, keep the damaged stock and machines, and send me the claim with the list, amounts and quotations.</p>\n<p>Regards,<br>Pei Shan</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Wan Ahmad Zaki &lt;[redacted]&gt;<br><b>To:</b> Chong Pei Shan &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 10 December 2024, 10:41 am<br><b>Subject:</b> Claim for flood damage 29 Nov 2024</div><p>Dear Ms Chong,</p>\n<p>Water went down on 2 December. Here is my claim:</p>\n<p>1. Building: wall plaster, doors, electrical points, cleaning and sanitising: RM 21,400.00<br>2. Machinery: vacuum sealer, packing machine motors rewinding, conveyor: RM 24,300.00<br>3. Stock: packed keropok and packaging materials: RM 34,500.00<br>4. Signboard at the front gate fell and damaged: RM 2,200.00<br>5. Two weeks no production, wages and lost sales: RM 9,000.00</p>\n<p>Total RM 91,400.00</p>\n<p>No other insurance. Attached are the quotations and photos.</p>\n<p>Thank you,<br>Wan Ahmad Zaki</p>\n<p><b>Attachments:</b> Contractor quotation Binaan Kemboja 6 Dec.pdf; Machinery repair quotation 7 Dec.pdf; Stock list and invoices Nov 2024.pdf; Signboard quotation.pdf; Production and wages record Dec 2024.pdf; 26 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Chong Pei Shan &lt;[redacted]&gt;<br><b>To:</b> Wan Ahmad Zaki &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 10 December 2024, 2:15 pm<br><b>Subject:</b> Re: Claim for flood damage 29 Nov 2024</div><p>Received Encik Zaki, I have submitted your claim to the insurance company today.</p>\n<p>Pei Shan</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Teratai Adjusters Sdn Bhd</b> · Our ref TAS/KB/24/2290 · Report dated 23 December 2024 · Adjuster: Mohd Hafiz bin Yusof</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>4 December 2024, two days after the water receded. Single-storey factory and front yard inspected with the Insured. Flood line on internal walls at 0.85 m.</td></tr><tr><td>Cause and origin</td><td>River overflow. Water entered from the rear drainage reserve and the front yard and stood inside the factory from the afternoon of 29 November to 2 December 2024. No rainwater entry through the roof; roof and walls intact.</td></tr><tr><td>Reports relied on</td><td>Department of Irrigation and Drainage river level records for the Pengkalan Chepa station, 27 November to 3 December 2024, showing the river above danger level. Kota Bharu district flood relief notice closing the industrial area road on 29 November 2024. Machinery contractor's inspection report dated 7 December 2024.</td></tr><tr><td>People interviewed</td><td>The Insured. The factory supervisor, who was on site until 1:30 pm on 29 November. The occupier of the adjoining Lot 23, flooded to the same depth.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Factory in operation, five-day week, eleven workers.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant to the loss.</td></tr><tr><td>Risk as found against the schedule</td><td>Single-storey detached factory with a mezzanine office, used for producing and packing fish crackers, as scheduled.</td></tr><tr><td>Damage found per item</td><td>Wall plaster, timber doors and power points below the flood line; three machines with water-damaged motors and controls; floor-level stock and packaging soaked and contaminated. The free-standing signboard at the front gate was undermined by the water and toppled.</td></tr><tr><td>Discrepancies with the incident report</td><td>None material. The building claim included rewiring above the flood line, which was not affected.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Building: wall plaster, doors, electrical points, cleaning and sanitising</td><td>Item 1 Building</td><td class=\"num\">21,400.00</td><td class=\"num\">18,600.00</td><td>Reinstatement; rewiring of points above flood line removed</td></tr><tr><td>2</td><td>Machinery: vacuum sealer, packing machine motors rewound, conveyor</td><td>Item 2 Machinery</td><td class=\"num\">24,300.00</td><td class=\"num\">24,300.00</td><td>Repair quotation checked</td></tr><tr><td>3</td><td>Stock: packed keropok and packaging materials</td><td>Item 3 Stock in trade</td><td class=\"num\">34,500.00</td><td class=\"num\">31,800.00</td><td>Cost price; stock on the mezzanine undamaged and deducted</td></tr><tr><td>4</td><td>Front gate signboard</td><td>None (outdoor fixture)</td><td class=\"num\">2,200.00</td><td class=\"num\">2,200.00</td><td>Replacement quotation</td></tr><tr><td>5</td><td>Two weeks' loss of production, wages and sales</td><td>None</td><td class=\"num\">9,000.00</td><td class=\"num\">9,000.00</td><td>Insured's figures</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>91,400.00</b></td><td class=\"num\"><b>85,900.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">450,000.00</td><td class=\"num\">430,000.00</td></tr><tr><td>Item 2 Machinery</td><td class=\"num\">180,000.00</td><td class=\"num\">175,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">120,000.00</td><td class=\"num\">100,000.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Salvage</td><td>Nil. Contaminated food stock destroyed under the supervision of the district health office.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found. No third-party recovery.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 85,900.00 before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/KN/2024/000874</td></tr><tr><td>Insured</td><td>Wan Ahmad Zaki bin Wan Ismail, trading as Kilang Keropok Zaki (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 January 2024 to 31 December 2024</td></tr><tr><td>Risk address</td><td>Lot 22, Kawasan Perindustrian Pengkalan Chepa, 16100 Kota Bharu, Kelantan</td></tr><tr><td>Construction</td><td>Single-storey detached factory with mezzanine office; brick walls, concrete floor, metal deck roof on steel trusses</td></tr><tr><td>Occupation</td><td>Fish cracker (keropok) production and packing</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">450,000.00</td></tr><tr><td>2</td><td>Machinery</td><td class=\"num\">180,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td class=\"num\">120,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>750,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP503</td><td>Storm, Tempest Endorsement</td></tr><tr><td>FP504</td><td>Flood Endorsement</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 29 November 2024 falls inside the schedule period 1 January 2024 to 31 December 2024. FC815 and receipt questions do not arise.</td><td>Date of loss 2024-11-29 <span class=\"meta\">(Incident report, email of 29 November 2024; Adjuster's report, Investigation, Cause and origin)</span><br>Period 2024-01-01 to 2024-12-31 <span class=\"meta\">(Schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Flood (including overflow of the sea)<span class=\"cite\">FP504: Flood Endorsement</span></blockquote>Flood is not a base peril under the Operative clause (fire or lightning only). FP504 brings flood in. Proximate cause is flood, with no intervening event; the water came from the river overflow.</td><td>Proximate cause flood, no intervening event <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span><br>River level records show river above danger level; road closed by flood relief notice 29 November 2024 <span class=\"meta\">(Adjuster's report, Investigation, Reports relied on)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Written claim delivered 10 December 2024, day 11 after the loss of 29 November 2024, within 15 days. No written extension needed. No fraud or false declaration found.</td><td>Written claim dated 2024-12-10 <span class=\"meta\">(Incident report, email of 10 December 2024)</span><br>No irregularities found <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>this insurance extends to cover loss or damage directly caused by fire or otherwise occasioned by or through or in consequence of Flood (including overflow of the sea)<span class=\"cite\">FP504: Flood Endorsement</span></blockquote>FP504 is held on the schedule and answers flood. The building is single-storey with a mezzanine, so no variant mismatch arises for this peril.</td><td>Endorsements held FP503 and FP504 <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>the insurance ceases to attach as regards the property affected unless the Insured, before the occurrence of any loss or damage, obtains the sanction of the Company signified by endorsement<span class=\"cite\">Condition 9</span></blockquote>No warranties on the schedule. Factory in operation at the date of loss, so no change of occupation and no unoccupancy. No passing of interest. FP504 Special Conditions 1 and 3 are applied at gate 6, not here. Building did not fall or displace, so Condition 4 does not arise.</td><td>Warranties: None <span class=\"meta\">(Schedule, Endorsements and clauses)</span><br>Factory in operation, five-day week, eleven workers; occupation as scheduled <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span><br>Sanctions endorsed under Condition 9: None; no change reported <span class=\"meta\">(Schedule, Endorsements and clauses)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>Unless specifically and separately insured this endorsement does not cover Metal smoke stacks, awnings, blinds, signs or other outdoor fixtures or fittings of any description.<span class=\"cite\">FP504: Flood Endorsement</span></blockquote><blockquote>This endorsement does not extend the insurance under this Policy to cover: (a) Consequential loss of any kind.<span class=\"cite\">FP504: Flood Endorsement</span></blockquote>Items 1 to 3 (building RM 18,600.00, machinery RM 24,300.00, stock RM 31,800.00) are admitted as insured damage to scheduled items. Item 4, the front gate signboard (RM 2,200.00), is an outdoor fixture not separately insured and is excluded by FP504 Special Condition 3. Item 5, lost production, wages and sales (RM 9,000.00), is consequential loss excluded by FP504 Special Condition 1(a). The stock figure already deducts undamaged mezzanine stock, and the building figure removes rewiring above the flood line.</td><td>Adjuster's assessed amounts per item <span class=\"meta\">(Adjuster's report, Measurement table)</span><br>No signboard or consequential cover separately insured; schedule carries only items 1 to 3 <span class=\"meta\">(Schedule, Sums insured)</span></td></tr></table>\n<h3>Proximate cause</h3><p>Flood: river overflow from the rear drainage reserve and front yard, standing inside the factory from the afternoon of 29 November to 2 December 2024</p><p>River overflowed after three days of rain; water entered through the rear drainage reserve and the front yard and stood inside the factory. No rainwater entry through the roof; roof and walls intact.</p><p>Intervening event: none.</p>\n<h3>Claimant's account and the adjuster's finding</h3>\n<table><tr><th>Claimant's account</th><th>Adjuster's finding</th><th>Finding applied</th></tr><tr><td>Claim of RM 91,400.00 across five items, including the building claim for rewiring, stock at RM 34,500.00, and the signboard and two weeks' lost production and wages (RM 9,000.00).</td><td>Assessed at RM 85,900.00: building RM 18,600.00 (rewiring above flood line removed, which was not affected), stock RM 31,800.00 (mezzanine stock undamaged and deducted), machinery RM 24,300.00, signboard RM 2,200.00 and lost production RM 9,000.00 as the insured's own figures.</td><td>Adjuster's assessed amounts applied. Signboard and lost production are then excluded at gate 6 and by the calculation; the claimant's amounts for the rest are reduced as the adjuster found.</td></tr></table>\n<h3>Advice</h3><p>The claim passes all six gates on flood under FP504, which is held. The admitted items are building, machinery and stock, RM 74,700.00 in total, from which the FP504 excess of RM 2,500.00 is taken, giving RM 72,200.00. The signboard (RM 2,200.00) is excluded as an outdoor fixture not separately insured, and lost production and wages (RM 9,000.00) as consequential loss. The examiner decides whether to pay RM 72,200.00.</p>\n<p class=\"meta\">Governing clause: FP504 Flood Endorsement, Excess Clause and Special Conditions 1(a) and 3. The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 72,200.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 4  RM     2,200.00  EXCLUDED by FP504 Special Condition 3  (Front gate signboard)</code></td></tr><tr><td><code>  ref 5  RM     9,000.00  EXCLUDED by FP504 Special Condition 1(a)  (Two weeks' loss of production, wages and sal)</code></td></tr><tr><td><code>  excluded total       RM    11,200.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  450,000.00  value    RM 430,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM  180,000.00  value    RM 175,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM  120,000.00  value    RM 100,000.00  factor 1.0  no average</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP504] refs [1, 2, 3]</code></td></tr><tr><td><code>     subtotal          RM    74,700.00</code></td></tr><tr><td><code>     excess            RM     2,500.00   Lesser of (a) 1.0% of total sums insured RM 750,000.00 = RM 7,500.00, or (b) RM 2,500.00. Lesser = RM 2,500.00.</code></td></tr><tr><td><code>     net               RM    72,200.00</code></td></tr><tr><td><code>  CLAIMED             RM    85,900.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    72,200.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice.</td><td>The examiner</td></tr></table>\n<h3>This run</h3>\n<p>Claude Haiku 5.5 read the incident report, the adjuster's report, the policy schedule, then made 14 tool calls: 6 searches of the policy, 6 gate checks, 1 pricing and 1 submission.</p>\n<table><tr><th>#</th><th>Tool</th><th>The AI asked for</th><th>Code returned</th></tr>\n<tr><td>1</td><td><code>search_policy</code><div class=\"meta\">Finds the wording, ranked by authority against this claim's schedule</div></td><td>code \"Operative clause\"</td><td><code>OPERATIVE-CLAUSE</code> primary</td></tr>\n<tr><td>2</td><td><code>search_policy</code></td><td>code \"FP504\"</td><td><code>ENDORSEMENT-FP504</code> override</td></tr>\n<tr><td>3</td><td><code>search_policy</code></td><td>code \"Condition 12\"</td><td><code>CONDITION-12</code> primary</td></tr>\n<tr><td>4</td><td><code>search_policy</code></td><td>code \"Condition 15\"</td><td><code>CONDITION-15</code> primary</td></tr>\n<tr><td>5</td><td><code>search_policy</code></td><td>code \"Condition 8\"</td><td><code>CONDITION-8</code> primary</td></tr>\n<tr><td>6</td><td><code>search_policy</code></td><td>code \"Condition 9\"</td><td><code>CONDITION-9</code> primary</td></tr>\n<tr><td>7</td><td><code>check_gate</code><div class=\"meta\">Code applies the gate's test to the facts and sets the status</div></td><td>Gate 1, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-11-29</td><td class=\"meta\">Incident report, email of 29 November 2024; Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>period_start</code></td><td>2024-01-01</td><td class=\"meta\">Schedule, Period of insurance</td></tr><tr><td><code>period_end</code></td><td>2024-12-31</td><td class=\"meta\">Schedule, Period of insurance</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Operative clause</b>. Loss on 29 November 2024 falls inside 1 January 2024 to 31 December 2024.<span class=\"meta\"></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>flood</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (river overflow from rear drainage reserve and front yard)</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>endorsements_held</code></td><td>FP503, FP504</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP504</b>. Proximate cause: flood. Not a base peril; FP504 brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-11-29</td><td class=\"meta\">Incident report, email of 29 November 2024</td></tr><tr><td><code>written_claim_date</code></td><td>2024-12-10</td><td class=\"meta\">Incident report, email of 10 December 2024 (Claim for flood damage 29 Nov 2024)</td></tr><tr><td><code>extension_until</code></td><td>none</td><td class=\"meta\">Incident report; no written extension in the file</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: none found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 10 December 2024, day 11 of 15. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>endorsements_held</code></td><td>FP503, FP504</td><td class=\"meta\">Schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP504</b>. FP504 is on the schedule and answers the cause.<span class=\"meta\"></span></td></tr>\n<tr><td>11</td><td><code>check_gate</code></td><td>Gate 5, 5 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Schedule, Endorsements and clauses (Warranties: None)</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss (factory in operation)</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Schedule, Insured; no change of interest reported</td></tr><tr><td><code>sanction_endorsed</code></td><td>True</td><td class=\"meta\">Schedule, Sanctions endorsed under Condition 9: None</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP504</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>5 items</td><td class=\"meta\">Adjuster's report, Measurement table</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP504</b>. 3 of 5 items admitted.<span class=\"meta\"><br>ref 1 admitted; ref 2 admitted; ref 3 admitted; ref 4 excluded (FP504 Special Condition 3); ref 5 excluded (FP504 Special Condition 1(a))</span></td></tr>\n<tr><td>13</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>5 items, sums insured and values at risk</td><td><span class=\"chip ok\">Payable</span> RM 72,200.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 4  RM     2,200.00  EXCLUDED by FP504 Special Condition 3  (Front gate signboard)</code></div><div><code>  ref 5  RM     9,000.00  EXCLUDED by FP504 Special Condition 1(a)  (Two weeks' loss of production, wages and sal)</code></div><div><code>  excluded total       RM    11,200.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  450,000.00  value    RM 430,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM  180,000.00  value    RM 175,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM  120,000.00  value    RM 100,000.00  factor 1.0  no average</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [FP504] refs [1, 2, 3]</code></div><div><code>     subtotal          RM    74,700.00</code></div><div><code>     excess            RM     2,500.00   Lesser of (a) 1.0% of total sums insured RM 750,000.00 = RM 7,500.00, or (b) RM 2,500.00. Lesser = RM 2,500.00.</code></div><div><code>     net               RM    72,200.00</code></div><div><code>  CLAIMED             RM    85,900.00</code></div><div><code>  RECOMMENDED PAYABLE RM    72,200.00</code></div></details></td></tr>\n<tr><td>14</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the advice before it is recorded</div></td><td>The six-gate advice, quotes, facts, flags, governing clause and figure</td><td><span class=\"chip ok\">Recorded</span> The guard found every quote in retrieved wording, every status as code set it, the governing clause and the figure as code returned them.</td></tr>\n</table>"}, "CLM-2024-08853": {"incident": "<h2>Incident report</h2>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ting Siew Hua &lt;[redacted]&gt;<br><b>To:</b> Abang Zulkifli &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 16 July 2024, 10:48 am<br><b>Subject:</b> Lorry crashed into my shop front this morning</div><p>Dear Encik Zulkifli,</p>\n<p>At about 8:15 this morning a lorry from a logistics company was reversing to deliver to the shop next door and hit the front of my minimart at Jalan Bendahara, Miri. The roller shutter is bent, the glass panels are broken and the pillar at the corner is cracked. The display shelves at the front fell over and many of my goods on them are damaged.</p>\n<p>The lorry belongs to Syarikat Angkut Pantas Sdn Bhd. The driver, Encik Hamdan bin Sapuan, stopped and gave me his details. We made a police report together.</p>\n<p>Please inform the insurance company.</p>\n<p>Thank you,<br>Ting Siew Hua<br>Kedai Runcit Siew Hua</p>\n<p><b>Attachments:</b> Police report Miri 16 Jul.pdf; 6 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Abang Zulkifli &lt;[redacted]&gt;<br><b>To:</b> Ting Siew Hua &lt;[redacted]&gt;<br><b>Date:</b> Tuesday, 16 July 2024, 12:30 pm<br><b>Subject:</b> Re: Lorry crashed into my shop front this morning</div><p>Dear Madam Ting,</p>\n<p>Sorry to hear this. I have notified the insurance company of the impact damage. Your policy has the impact endorsement. Please keep the damaged goods and take photos before clearing up. Send me the written claim with the list of items and amounts and the quotations, within 15 days of today.</p>\n<p>Regards,<br>Abang Zulkifli</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ting Siew Hua &lt;[redacted]&gt;<br><b>To:</b> Abang Zulkifli &lt;[redacted]&gt;<br><b>Date:</b> Thursday, 25 July 2024, 9:20 pm<br><b>Subject:</b> Request for more time: claim for lorry impact 16 July</div><p>Dear Encik Zulkifli,</p>\n<p>The contractor says the corner pillar needs a structural engineer to check before he can quote, and the engineer can only come next week. Can I get more time to send the claim?</p>\n<p>Thank you,<br>Siew Hua</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Abang Zulkifli &lt;[redacted]&gt;<br><b>To:</b> Ting Siew Hua &lt;[redacted]&gt;<br><b>Date:</b> Friday, 26 July 2024, 3:05 pm<br><b>Subject:</b> Re: Request for more time: claim for lorry impact 16 July</div><p>Dear Madam Ting,</p>\n<p>The insurance company has replied by email. It allows you further time to deliver the written claim until 16 August 2024. Their email is attached.</p>\n<p>Regards,<br>Abang Zulkifli</p>\n<p><b>Attachments:</b> Insurer email extension of time 26 Jul 2024.pdf</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Ting Siew Hua &lt;[redacted]&gt;<br><b>To:</b> Abang Zulkifli &lt;[redacted]&gt;<br><b>Date:</b> Friday, 9 August 2024, 4:35 pm<br><b>Subject:</b> Claim for lorry impact 16 July 2024</div><p>Dear Encik Zulkifli,</p>\n<p>My claim:</p>\n<p>1. Roller shutter and glass panels: RM 12,600.00<br>2. Corner pillar repair (as per engineer): RM 8,900.00<br>3. Display shelves: RM 4,300.00<br>4. Goods damaged (bottles, cans, packets): RM 6,750.00<br>5. My delivery van parked in front, rear door dented by the fallen shutter frame: RM 3,200.00</p>\n<p>Total RM 35,750.00</p>\n<p>No other insurance on my shop.</p>\n<p>Thank you,<br>Siew Hua</p>\n<p><b>Attachments:</b> Engineer report Ir. Wong 5 Aug.pdf; Contractor quotation 7 Aug.pdf; Shelf quotation.pdf; Stock list and invoices.pdf; Van workshop estimate.pdf; 18 photos</p></div>\n<div class=\"mail\"><div class=\"hd\"><b>From:</b> Abang Zulkifli &lt;[redacted]&gt;<br><b>To:</b> Ting Siew Hua &lt;[redacted]&gt;<br><b>Date:</b> Friday, 9 August 2024, 5:10 pm<br><b>Subject:</b> Re: Claim for lorry impact 16 July 2024</div><p>Received Madam Ting, within the extended date. Submitted to the insurance company.</p>\n<p>Abang Zulkifli</p></div>", "adjuster": "<h2>Adjuster's report</h2><p><b>Bayu Loss Adjusters Sdn Bhd</b> · Our ref BLA/SW/24/0412 · Report dated 30 August 2024 · Adjuster: Juliana anak Nyipa</p>\n<h3>Investigation</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Site inspection</td><td>18 July 2024, with the Insured; second visit 12 August 2024 after the engineer's report.</td></tr><tr><td>Cause and origin</td><td>A 3-tonne lorry owned by Syarikat Angkut Pantas Sdn Bhd, reversing along the service lane to deliver to the adjoining lot, struck the shopfront at the corner pillar. The shutter frame and glass panels gave way; the front display shelves were knocked over. The falling shutter frame struck the rear door of the Insured's van parked in front.</td></tr><tr><td>Reports relied on</td><td>Police report at Miri district police headquarters, 16 July 2024, lodged jointly by the Insured and the lorry driver; the driver admits reversing into the shopfront. Structural engineer's report by Ir. Wong Teck Leong, 5 August 2024: cover concrete spalled and one link exposed at the corner pillar, structurally repairable. Insurer's email to the agent, 26 July 2024, allowing the Insured further time to deliver the written claim to 16 August 2024.</td></tr><tr><td>People interviewed</td><td>The Insured. The lorry driver, Encik Hamdan bin Sapuan, an employee of the lorry owner. The shop assistant present at the time.</td></tr></table>\n<h3>Findings</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Occupancy at the date of loss</td><td>Minimart trading daily.</td></tr><tr><td>Maintenance and prior defects</td><td>None relevant.</td></tr><tr><td>Risk as found against the schedule</td><td>Ground floor of a two-storey corner shophouse used as a minimart, as scheduled. The lorry is not owned by or under the control of the Insured, her family or her staff; the driver is employed by the lorry owner.</td></tr><tr><td>Damage found per item</td><td>Shutter and four glass panels destroyed; corner pillar spalled; four display shelves bent; stock on them broken or crushed; van rear door dented.</td></tr><tr><td>Discrepancies with the incident report</td><td>None.</td></tr><tr><td>Irregularities</td><td>None found.</td></tr></table>\n<h3>Measurement</h3>\n<table><tr><th>Ref</th><th>Item</th><th>Schedule item</th><th class=\"num\">Claimed (RM)</th><th class=\"num\">Assessed (RM)</th><th>Basis</th></tr><tr><td>1</td><td>Roller shutter and glass shopfront panels</td><td>Item 1 Building</td><td class=\"num\">12,600.00</td><td class=\"num\">12,600.00</td><td>Replacement, quotation checked</td></tr><tr><td>2</td><td>Corner reinforced concrete pillar, repair to engineer's specification</td><td>Item 1 Building</td><td class=\"num\">8,900.00</td><td class=\"num\">8,900.00</td><td>Quotation checked against the engineer's specification</td></tr><tr><td>3</td><td>Front display shelves</td><td>Item 2 Furniture, fixtures and fittings</td><td class=\"num\">4,300.00</td><td class=\"num\">4,300.00</td><td>Replacement</td></tr><tr><td>4</td><td>Stock damaged on the front shelves</td><td>Item 3 Stock in trade</td><td class=\"num\">6,750.00</td><td class=\"num\">6,750.00</td><td>Cost price per invoices</td></tr><tr><td>5</td><td>Insured's delivery van, rear door dented</td><td>None</td><td class=\"num\">3,200.00</td><td class=\"num\">3,200.00</td><td>Workshop estimate</td></tr><tr><td></td><td><b>Total</b></td><td></td><td class=\"num\"><b>35,750.00</b></td><td class=\"num\"><b>35,750.00</b></td><td></td></tr></table>\n<table><tr><th>Schedule item</th><th class=\"num\">Sum insured (RM)</th><th class=\"num\">Value at risk at the date of loss (RM)</th></tr><tr><td>Item 1 Building</td><td class=\"num\">400,000.00</td><td class=\"num\">380,000.00</td></tr><tr><td>Item 2 Furniture, fixtures and fittings</td><td class=\"num\">60,000.00</td><td class=\"num\">55,000.00</td></tr><tr><td>Item 3 Stock in trade</td><td class=\"num\">50,000.00</td><td class=\"num\">62,500.00</td></tr></table>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Value at risk, Item 3</td><td>Stock at cost on 16 July 2024 from the Insured's stock count of 30 June 2024, purchases and sales to the date of loss: RM 62,500.00.</td></tr><tr><td>Salvage</td><td>Nil.</td></tr><tr><td>Other insurance and recovery</td><td>No other insurance declared or found on the shop. The lorry is insured under the owner's motor policy; recovery against the lorry owner and its motor insurer is available and recommended.</td></tr></table>\n<h3>Close</h3>\n<table><tr><th>Area</th><th>Finding</th></tr><tr><td>Evidence outstanding</td><td>None.</td></tr><tr><td>Adjuster's conclusion</td><td>Loss adjusted at RM 35,750.00 before the application of any policy terms or excess, subject to policy liability, which is for the insurer.</td></tr></table>", "schedule": "<h2>Policy schedule</h2><table><tr><th>Field</th><th>Detail</th></tr><tr><td>Policy number</td><td>FP/SW/2024/005536</td></tr><tr><td>Insured</td><td>Ting Siew Hua, trading as Kedai Runcit Siew Hua (NRIC [redacted])</td></tr><tr><td>Period of insurance</td><td>1 March 2024 to 28 February 2025</td></tr><tr><td>Risk address</td><td>Ground floor, Lot 1146, Jalan Bendahara, 98000 Miri, Sarawak</td></tr><tr><td>Construction</td><td>Ground floor of a two-storey corner shophouse; reinforced concrete frame, brick walls, concrete tile roof</td></tr><tr><td>Occupation</td><td>Minimart (retail of groceries and sundries)</td></tr></table>\n<h3>Sums insured</h3>\n<table><tr><th>Item</th><th>Description</th><th class=\"num\">Sum insured (RM)</th></tr><tr><td>1</td><td>Building</td><td class=\"num\">400,000.00</td></tr><tr><td>2</td><td>Furniture, fixtures and fittings</td><td class=\"num\">60,000.00</td></tr><tr><td>3</td><td>Stock in trade</td><td class=\"num\">50,000.00</td></tr><tr><td></td><td><b>Total</b></td><td class=\"num\"><b>510,000.00</b></td></tr></table>\n<h3>Endorsements and clauses</h3>\n<table><tr><th>Code</th><th>Title</th></tr><tr><td>FP506A</td><td>Impact Damage Endorsement, Excluding Insured's Own Vehicles</td></tr></table>\n<table><tr><th>Term</th><th>Detail</th></tr><tr><td>Warranties</td><td>None</td></tr><tr><td>Excess</td><td>As per endorsement wording; nil for the fire peril</td></tr><tr><td>Sanctions endorsed under Condition 9</td><td>None</td></tr></table>", "advice": "<h2>Underwriter's advice</h2>\n<table><tr><th>Gate</th><th>Status</th><th>Wording and application</th><th>Fact relied on</th></tr><tr><td>1. Period of insurance</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>if the Property Insured described in the said Schedule or any part of such property be destroyed or damaged by FIRE or LIGHTNING during the Period of Insurance stated in the Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Loss on 16 July 2024 falls within the period 1 March 2024 to 28 February 2025 on the schedule. FC815 is not needed.</td><td>Date of loss 2024-07-16 <span class=\"meta\">(Incident report, email of 16 July 2024)</span><br>Period 2024-03-01 to 2025-02-28 <span class=\"meta\">(Policy schedule, Period of insurance)</span></td></tr><tr><td>2. Peril insured</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>the insurance under this Policy shall extend to include loss or damage to the property described in the Schedule and/or to walls, gates and fences around and pertaining thereto directly resulting from impact by any road vehicles<span class=\"cite\">FP506A: Impact Damage Endorsement - Excluding Insured</span></blockquote>Impact is not a base peril in the Operative clause (fire or lightning). FP506A brings impact by road vehicles within cover. Whether FP506A is held is tested at gate 4.</td><td>Proximate cause: impact; intervening event: none <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin)</span></td></tr><tr><td>3. Conditions precedent</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>shall within 15 days after the loss or damage, or such further time as the Company may in writing allow in that behalf, deliver to the Company: a) A claim in writing<span class=\"cite\">Condition 12</span></blockquote><blockquote>if any false declaration be made or used in support thereof<span class=\"cite\">Condition 15</span></blockquote>Loss 16 July 2024. The 15-day period ran to 31 July 2024. The Company allowed further time in writing to 16 August 2024 (insurer's email of 26 July 2024). The written claim was delivered 9 August 2024, within that extension. No fraud or false declaration found.</td><td>Written claim date 2024-08-09 <span class=\"meta\">(Incident report, claim email of 9 August 2024)</span><br>Extension to 2024-08-16 allowed in writing <span class=\"meta\">(Adjuster's report, Investigation, Reports relied on (insurer's email 26 July 2024))</span><br>No irregularities; no false declaration <span class=\"meta\">(Adjuster's report, Findings, Irregularities)</span></td></tr><tr><td>4. Endorsement held</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>IMPACT DAMAGE ENDORSEMENT - EXCLUDING INSURED’S OWN VEHICLES<span class=\"cite\">FP506A: Impact Damage Endorsement - Excluding Insured</span></blockquote>FP506A is on the schedule and answers impact by road vehicle. The building is not a variant-specific risk, so no class flag arises.</td><td>Endorsements held: FP506A <span class=\"meta\">(Policy schedule, Endorsements and clauses)</span></td></tr><tr><td>5. Endorsement satisfied</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>impact by any road vehicles, forklift, other mechanically or electrically propelled vehicles (other than vehicles held as stock)<span class=\"cite\">FP506A: Impact Damage Endorsement - Excluding Insured</span></blockquote><blockquote>Under any of the following circumstances the insurance ceases to attach as regards the property affected unless the Insured, before the occurrence of any loss or damage, obtains the sanction of the Company<span class=\"cite\">Condition 9</span></blockquote>The impacting vehicle is the lorry owned by Syarikat Angkut Pantas Sdn Bhd, not owned by or under the control of the Insured, her family or staff. The driver is employed by the lorry owner. The van is damaged property, not the impacting vehicle. No warranties on the schedule. Occupation unchanged (minimart trading daily). No unoccupied period and no change of interest. No Condition 9 sanction was needed. The building was not displaced.</td><td>Lorry owned by Syarikat Angkut Pantas Sdn Bhd; driver employed by lorry owner, not insured's service <span class=\"meta\">(Adjuster's report, Investigation, Cause and origin and Findings, Risk as found)</span><br>Warranties: None; Sanctions endorsed under Condition 9: None <span class=\"meta\">(Policy schedule, Endorsements and clauses)</span><br>Minimart trading daily <span class=\"meta\">(Adjuster's report, Findings, Occupancy at the date of loss)</span></td></tr><tr><td>6. Item admitted</td><td><span class=\"st pass\">Passed</span></td><td><blockquote>loss or damage to the property described in the Schedule<span class=\"cite\">FP506A: Impact Damage Endorsement - Excluding Insured</span></blockquote><blockquote>the Property Insured described in the said Schedule<span class=\"cite\">Operative clause: fire or lightning during the Period of Insurance</span></blockquote>Items 1 to 4 are scheduled property damaged by impact and are admitted. Item 5, the Insured's own delivery van, has no schedule item and is not property described in the Schedule, so it is excluded (classed not_property_insured). Four of five items are admitted.</td><td>Measurement items 1 to 5 with assessed amounts <span class=\"meta\">(Adjuster's report, Measurement table)</span><br>Van has no schedule item <span class=\"meta\">(Adjuster's report, Measurement table, item 5 (Schedule item: None))</span></td></tr></table>\n<h3>Proximate cause</h3><p>Impact by a road vehicle (the lorry owned by Syarikat Angkut Pantas Sdn Bhd) reversing into the shopfront at the corner pillar. Dominant effective cause: impact.</p><p>Lorry reversed along the service lane into the shopfront; the corner pillar was struck and the shutter frame and glass panels gave way; the front display shelves were knocked over and stock on them broken or crushed; the falling shutter frame dented the rear door of the Insured's van parked in front.</p><p>Intervening event: none.</p>\n<h3>Advice</h3><p>All six gates pass on the adjuster's findings. The lorry is a third-party vehicle, so FP506A responds to the building, furniture and stock damage. The van (RM 3,200.00) is outside the Schedule and is excluded. Item 3 stock is underinsured: the sum insured is RM 50,000.00 against a value at risk of RM 62,500.00, so average at 0.8 reduces the RM 6,750.00 stock claim to RM 5,400.00 before the RM 50.00 excess. The examiner decides. The adjuster also recommends recovery against the lorry owner and its motor insurer, which is for the examiner to pursue.</p>\n<p class=\"meta\">Governing clause: FP506A, impact damage by road vehicle (Operative clause for the property described in the Schedule). The claims examiner decides.</p>\n<h3>Figure</h3><p>Payable RM 31,150.00.</p><table><tr><th>Working, in the calculator's order</th></tr><tr><td><code>STEP 1  EXCLUSIONS</code></td></tr><tr><td><code>  ref 5  RM     3,200.00  EXCLUDED by Operative clause (Property Insured described in the Schedule)  (Insured's delivery van, rear door dented)</code></td></tr><tr><td><code>  excluded total       RM     3,200.00</code></td></tr><tr><td><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></td></tr><tr><td><code>  Item 1  SI RM  400,000.00  value    RM 380,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 2  SI RM   60,000.00  value     RM 55,000.00  factor 1.0  no average</code></td></tr><tr><td><code>  Item 3  SI RM   50,000.00  value RM   62,500.00  factor 0.8000  UNDERINSURED</code></td></tr><tr><td><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></td></tr><tr><td><code>  [FP506A] refs [1, 2, 3, 4]</code></td></tr><tr><td><code>     subtotal          RM    32,550.00</code></td></tr><tr><td><code>     after average     RM    31,200.00</code></td></tr><tr><td><code>     excess            RM        50.00   Flat first RM 50.00 of each and every loss.</code></td></tr><tr><td><code>     net               RM    31,150.00</code></td></tr><tr><td><code>  CLAIMED             RM    35,750.00</code></td></tr><tr><td><code>  RECOMMENDED PAYABLE RM    31,150.00</code></td></tr></table>", "hood": "<h2>Under the hood</h2>\n<p>One AI agent, the underwriter, works this claim through an MCP server. It reads the claim file, looks up the policy wording, and hands each decision to code. Below is the recorded run of this claim, call by call, as the tool log holds it.</p>\n<h3>How the pieces fit</h3>\n<table><tr><th>Part</th><th>What it is</th><th>Who acts</th></tr><tr><td>Resources</td><td><code>claim://{claim_no}/incident</code>, <code>/adjuster</code>, <code>/schedule</code>: the three documents an examiner reads, attached to the agent's first message. <code>policy://clause/{code}</code> serves any clause of the wording.</td><td>MCP server</td></tr><tr><td><code>search_policy</code></td><td>The retrieval step of the knowledge assistant: vector and keyword search over 117 clauses, a reranker, then precedence by authority against this claim's schedule. Only wording returned here may be quoted or relied on.</td><td>AI asks, code answers</td></tr><tr><td><code>check_gate</code></td><td>The AI supplies the facts with their source; code applies the gate's test and sets the status, in order 1 to 6.</td><td>AI supplies facts, code decides the status</td></tr><tr><td><code>calculate_payable</code></td><td>Code prices the loss after the gates.</td><td>Code</td></tr><tr><td><code>submit_advice</code></td><td>The guard checks quotes, statuses, governing clause and figure; a fault is sent back with the line named.</td><td>Code checks, the AI fixes</td></tr><tr><td>The decision</td><td>The claims examiner reads the file and the advice ></span></td></tr>\n<tr><td>8</td><td><code>check_gate</code></td><td>Gate 2, 3 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>proximate_cause</code></td><td>impact</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>intervening_event</code></td><td>none</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin</td></tr><tr><td><code>endorsements_held</code></td><td>FP506A</td><td class=\"meta\">Policy schedule, Endorsements and clauses</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP506A or FP506B</b>. Proximate cause: impact. Not a base peril; FP506A or FP506B brings it in. Whether it is held is gate 4.<span class=\"meta\"></span></td></tr>\n<tr><td>9</td><td><code>check_gate</code></td><td>Gate 3, 4 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>date_of_loss</code></td><td>2024-07-16</td><td class=\"meta\">Incident report, email of 16 July 2024</td></tr><tr><td><code>written_claim_date</code></td><td>2024-08-09</td><td class=\"meta\">Incident report, claim email of 9 August 2024</td></tr><tr><td><code>extension_until</code></td><td>2024-08-16</td><td class=\"meta\">Adjuster's report, Investigation, Reports relied on (insurer's email 26 July 2024)</td></tr><tr><td><code>false_declaration_or_fraud</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Irregularities: None found</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>Condition 12</b>. Written claim delivered 9 August 2024, day 24, within the further time allowed in writing to 16 August 2024. No fraud or false declaration.<span class=\"meta\"></span></td></tr>\n<tr><td>10</td><td><code>check_gate</code></td><td>Gate 4, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td ss</span></td></tr>\n<tr><td>12</td><td><code>check_gate</code></td><td>Gate 5, 7 facts<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>warranty_breached</code></td><td>False</td><td class=\"meta\">Policy schedule, Endorsements and clauses (Warranties: None)</td></tr><tr><td><code>occupation_changed_increasing_risk</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss (minimart trading daily, as scheduled)</td></tr><tr><td><code>unoccupied_days</code></td><td>0</td><td class=\"meta\">Adjuster's report, Findings, Occupancy at the date of loss</td></tr><tr><td><code>interest_passed_not_by_will_or_law</code></td><td>False</td><td class=\"meta\">Adjuster's report, Findings; Policy schedule (insured unchanged)</td></tr><tr><td><code>sanction_endorsed</code></td><td>True</td><td class=\"meta\">Policy schedule, Sanctions endorsed under Condition 9: None (no change requiring sanction)</td></tr><tr><td><code>vehicle_belongs_to_insured</code></td><td>False</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (impacting vehicle is the lorry owned by Syarikat Angkut Pantas Sdn Bhd); Findings, Risk as found (lorry not owned by or under control of the Insured, family or staff; driver employed by lorry owner)</td></tr><tr><td><code>fall_or_displacement</code></td><td>False</td><td class=\"meta\">Adjuster's report, Investigation, Cause and origin (building not displaced; shutter frame fell onto the van)</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP506A</b>. Every test for the clause that answers the cause is met; no warranty breached; Condition 9 not engaged.<span class=\"meta\"><br>FP506A pass; Warranty pass; Condition 9(a) pass; Condition 9(b) pass; Condition 9(d) pass</span></td></tr>\n<tr><td>13</td><td><code>check_gate</code></td><td>Gate 6, 1 fact<details><summary>Facts supplied</summary><table><tr><th>Fact</th><th>Value</th><th>Source</th></tr><tr><td><code>items</code></td><td>5 items</td><td class=\"meta\">Adjuster's report, Measurement table</td></tr></table></details></td><td><span class=\"chip ok\">Passed</span> <b>FP506A</b>. 4 of 5 items admitted.<span class=\"meta\"><br>ref 1 admitted; ref 2 admitted; ref 3 admitted; ref 4 admitted; ref 5 excluded (Operative clause (Property Insured described in the Schedule))</span></td></tr>\n<tr><td>14</td><td><code>calculate_payable</code><div class=\"meta\">Code prices the loss: exclusions, average per item, excess</div></td><td>5 items, sums insured and values at risk</td><td><span class=\"chip ok\">Payable</span> RM 31,150.00<details><summary>Working</summary><div><code>STEP 1  EXCLUSIONS</code></div><div><code>  ref 5  RM     3,200.00  EXCLUDED by Operative clause (Property Insured described in the Schedule)  (Insured's delivery van, rear door dented)</code></div><div><code>  excluded total       RM     3,200.00</code></div><div><code>STEP 2  CONDITION 20 AVERAGE, PER SCHEDULE ITEM</code></div><div><code>  Item 1  SI RM  400,000.00  value    RM 380,000.00  factor 1.0  no average</code></div><div><code>  Item 2  SI RM   60,000.00  value     RM 55,000.00  factor 1.0  no average</code></div><div><code>  Item 3  SI RM   50,000.00  value RM   62,500.00  factor 0.8000  UNDERINSURED</code></div><div><code>STEP 3  GROUPS, AVERAGE APPLIED THEN EXCESS</code></div><div><code>  [FP506A] refs [1, 2, 3, 4]</code></div><div><code>     subtotal          RM    32,550.00</code></div><div><code>     after average     RM    31,200.00</code></div><div><code>     excess            RM        50.00   Flat first RM 50.00 of each and every loss.</code></div><div><code>     net               RM    31,150.00</code></div><div><code>  CLAIMED             RM    35,750.00</code></div><div><code>  RECOMMENDED PAYABLE RM    31,150.00</code></div></details></td></tr>\n<tr><td>15</td><td><code>submit_advice</code><div class=\"meta\">The guard checks the ad
