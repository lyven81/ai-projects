<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kereta Sewa staff phone</title>
<link rel="icon" href="../../favicon.ico" sizes="any"><link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fff;--card:#fff;--ink:#103f45;--muted:#5b7f84;--line:#d3e5e6;--navy:#0e4f57;--accent:#13808a;--box:#f1f8f8;--warn:#b8641c;--warnbg:#fbf1e6;--flash:#fff3c4;--urg:#b4462f;--urgbg:#fbece8;--barbg:#fff;--barink:#0e4f57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181a;--card:#182225;--ink:#e2eeee;--muted:#9ab3b5;--line:#2a3a3d;--navy:#8fd0d5;--accent:#5cc0c8;--box:#141d1f;--warn:#e0a060;--warnbg:#2b2117;--flash:#4a3f17;--urg:#f0927c;--urgbg:#3a2019;--barbg:#173033;--barink:#e2eeee}}
:root[data-theme="dark"]{--bg:#11181a;--card:#182225;--ink:#e2eeee;--muted:#9ab3b5;--line:#2a3a3d;--navy:#8fd0d5;--accent:#5cc0c8;--box:#141d1f;--warn:#e0a060;--warnbg:#2b2117;--flash:#4a3f17;--urg:#f0927c;--urgbg:#3a2019;--barbg:#173033;--barink:#e2eeee}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
.page{max-width:430px;margin:0 auto;padding:12px 16px 20px}
.crumbs{font-size:12.5px;color:var(--muted);margin:0 2px 8px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{text-decoration:underline}
footer{font-size:12px;color:var(--muted);margin:12px 2px 0}
.app{display:flex;flex-direction:column;height:min(860px,calc(100vh - 90px));min-height:560px;background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
@supports (height:100dvh){.app{height:min(860px,calc(100dvh - 90px))}}
@media (max-width:500px){.page{padding:8px 0 12px}.crumbs,footer{margin-left:16px;margin-right:16px}.app{border-radius:0;border-left:0;border-right:0}}
body.embed .page{max-width:none;padding:0}
body.embed .app{height:100vh;min-height:0;border:0;border-radius:0}
@supports (height:100dvh){body.embed .app{height:100dvh}}
.bar{background:var(--barbg);color:var(--barink);border-bottom:1px solid var(--line);padding:11px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;flex:none}
.bar b{font-size:16px}.bar span{font-size:13px;opacity:.9}
.toast{flex:none;background:var(--warnbg);color:var(--warn);font-size:12.5px;padding:6px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.toast:empty{display:none}
.toast button{border:0;background:none;color:var(--warn);font-weight:700;cursor:pointer;padding:0}
.scroll{flex:1;overflow:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
.pane{display:none}.pane.on{display:block}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;font-size:12px;padding:7px 0 8px;color:var(--muted);cursor:pointer;position:relative}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs svg{display:block;margin:0 auto 1px;width:22px;height:22px}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;line-height:17px;min-width:18px}
.badge:empty{display:none}
.bump{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.45)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.m{color:var(--muted);font-size:12.5px}
.sum{margin:0 2px 8px}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.sec:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip .n{display:inline-block;min-width:18px;margin-left:5px;font-size:11px;font-weight:700;padding:0 6px;border-radius:9px;background:var(--navy);color:var(--card);text-align:center}
.chip.urgent .n{background:var(--urg)}
.chip.on{border-color:var(--accent);background:var(--box);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.list button{display:flex;width:100%;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 11px;cursor:pointer;font-size:13px}
.list button:last-child{border-bottom:0}
.list button.on{background:var(--box);box-shadow:inset 3px 0 0 var(--accent)}
.list b{color:var(--navy);font-weight:600}
.list small{color:var(--muted);white-space:nowrap;font-size:11.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.card.urgent{border:2px solid var(--urg)}
.card.flash{animation:flash 1.5s ease}
@keyframes flash{0%,35%{background:var(--flash);box-shadow:0 0 0 3px var(--warn)}100%{background:var(--card);box-shadow:none}}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px;background:var(--box);border-bottom:1px solid var(--line);font-weight:700;color:var(--navy);font-size:14px}
.card.urgent .ch{background:var(--urgbg);color:var(--urg)}
.ch small{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.kv{padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.kv>.k{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.kv .q{white-space:pre-line;font-style:italic;display:block}
.kv .pre{white-space:pre-line}
.kv.rec{background:var(--warnbg)}
.kv.rec>.k{color:var(--warn)}
.kv .diff{color:var(--urg);font-weight:600;display:block}
.kv a.rule{display:inline-block;margin:0 6px 2px 0;padding:0 7px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;text-decoration:none;background:var(--box)}
.thumbs{display:flex;gap:6px;margin-top:4px}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:64px;height:90px;cursor:zoom-in;background:var(--box)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.charge{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--warnbg);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--warn);flex-wrap:wrap}
.charge input{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px}
.btns{display:flex;gap:7px;padding:10px 12px 12px}
.btn{flex:1;text-align:center;font-size:13.5px;font-weight:600;border-radius:8px;padding:8px 0;background:var(--accent);color:#fff;border:1px solid var(--accent);text-decoration:none;cursor:pointer}
.btn.alt{background:var(--card);color:var(--accent)}
.btn.done{background:var(--navy);border-color:var(--navy);color:var(--card)}
.btn.warn{background:var(--card);color:var(--urg);border-color:var(--urg)}
.btn.small{flex:none;padding:6px 12px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px}
.line{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:7px 11px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .h{width:48px;flex:none;font-weight:700;color:var(--navy)}
.tag{border-radius:6px;padding:1px 7px;display:inline-block;font-size:12.5px}
.t-pick{background:var(--box);color:var(--accent);border:1px dashed var(--accent)}
.t-ret{background:var(--navy);color:var(--card)}
.t-pend{background:#efb24a;color:#3b2500}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:6px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:18px;color:var(--navy)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mhead b{color:var(--navy);font-size:15px}
.mhead button{width:40px;height:32px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;color:var(--accent);font-size:16px}
.mhead button:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid .wd{font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.grid button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 0 3px;cursor:pointer;min-height:44px;font-size:12.5px;font-weight:700;color:var(--navy)}
.grid button.past{opacity:.55}
.grid button.today{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.grid button.sel{outline:2px solid var(--accent);outline-offset:-1px}
.grid .pad{visibility:hidden}
.grid .occ{display:block;margin:3px auto 0;height:5px;width:80%;border-radius:3px;background:var(--line);overflow:hidden}
.grid .occ i{display:block;height:100%;background:var(--accent)}
.grid .cnt{display:block;font-size:9.5px;font-weight:400;color:var(--muted)}
.tier{display:flex;justify-content:space-between;font-size:13px;padding:6px 11px;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}
.tier .bar2{flex:1;margin:7px 10px 0;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tier .bar2 i{display:block;height:100%;background:var(--accent)}
.lb{position:fixed;inset:0;background:rgba(10,14,20,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:82vh;border-radius:8px}
.lb .x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
/* Phone home screen (embedded demo only) */
.home{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;color:#fff;overflow:hidden}
.home.on{display:flex}
.home svg.wp{position:absolute;inset:0;width:100%;height:100%}
.home .sb{position:relative;width:100%;display:flex;justify-content:space-between;padding:8px 18px 0;font-size:12.5px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.home .clock{position:relative;margin-top:56px;font-size:64px;font-weight:300;line-height:1;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.home .date{position:relative;margin-top:6px;font-size:15px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.home .widget{position:relative;margin:26px 18px 0;align-self:stretch;background:rgba(255,255,255,.84);color:#0e4f57;border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.home .widget b{display:block;font-size:13.5px}
.home .widget span{display:block;font-size:12.5px;color:#2f6a70;margin-top:2px}
.home .dock{position:relative;margin-top:auto;margin-bottom:26px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.home .dock button{width:58px;height:58px;border-radius:16px;border:0;background:#fff;color:#13808a;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.home .dock svg{width:30px;height:30px}
.notif{position:absolute;left:10px;right:10px;top:10px;z-index:8;background:rgba(255,255,255,.97);color:#1f2a36;border-radius:16px;padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.22);transform:translateY(-140%);transition:transform .35s ease;border:1px solid #d3e5e6}
.notif.on{transform:translateY(0)}
.notif .nh{display:flex;justify-content:space-between;font-size:11.5px;color:#5b7f84;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.notif .nt{font-size:14px;font-weight:700;color:#0e4f57;margin-top:3px}
.notif.urgent .nt{color:#b4462f}
.notif .nb{font-size:13px;color:#3d4f53;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){.notif{transition:none}}
</style>
</head>

<script>
"use strict";
const SEED = /*__SEED_JSON__*/null;
const CLAUSES = /*__CLAUSES_JSON__*/null;
const T = CarRentalTools, H = T.helpers;
const LIVE_KEY = "kereta-sewa-v1", REPLAY_KEY = "kereta-sewa-replay-v1";   // the live key is shared with every version of the pages
const params = new URLSearchParams(location.search);
const EMBED = params.get("embed") === "1";
const KEY = params.get("store") || LIVE_KEY;
const REPLAY = KEY === REPLAY_KEY;
if (params.get("theme") === "dark" || params.get("theme") === "light") document.documentElement.setAttribute("data-theme", params.get("theme"));
if (EMBED) { document.body.classList.add("embed"); document.getElementById("crumbs").remove(); document.getElementById("footer").remove(); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const LONGDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

// ---------- the store ----------
// Live: the shared demo data, moved to today (stateForNow), clock = now.
// Replay: the copy the replay page writes, on the benchmark's fixed clock.
let memory = null;
function loadState() {
  let raw = null;
  try { const t = localStorage.getItem(KEY); if (t) raw = JSON.parse(t); } catch (e) {}
  if (!raw && memory) raw = clone(memory);
  if (REPLAY) { const s = raw && raw.bookings ? raw : clone(SEED); memory = clone(s); return s; }
  if (raw && (!raw.meta || raw.meta.seed_version !== SEED.meta.seed_version)) raw = null;
  const s = T.stateForNow(raw, clone(SEED), new Date());
  if (!raw || s !== raw) writeRaw(s);
  memory = clone(s);
  return s;
}
function writeRaw(state) { memory = clone(state); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const channel = (() => { try { return "BroadcastChannel" in window ? new BroadcastChannel("kereta-sewa") : null; } catch (e) { return null; } })();
function saveAndTell(state) { writeRaw(state); try { if (channel) channel.postMessage({ type: "changed", store: KEY }); } catch (e) {} }
const nowIso = () => REPLAY ? ((state && state.meta && state.meta.replay_now) || T.SEED_NOW) : T.localIso(new Date());

// ---------- view state ----------
let state = null;
const ui = { appOpen: false, tab: "inbox", cat: null, caseId: null, month: null, day: null, toast: "", charges: {} };
let known = null, lastOpen = null, flashId = null;

// ---------- inbox ----------
const GROUP_LABEL = { urgent: "Urgent", requests: "Booking requests", cancels: "Cancellation requests", booking_rules: "Booking rules", existing_booking: "Existing booking", money_and_disputes: "Money and disputes", process: "Asks for a person and other" };
const CAT_ORDER = ["urgent", "requests", "cancels", "booking_rules", "existing_booking", "money_and_disputes", "process"];
const groupOf = r => Object.keys(T.HANDOVER_GROUPS).find(g => T.HANDOVER_GROUPS[g].includes(r)) || "process";
const when = iso => iso ? `${H.dateText(iso)}, ${H.timeText(iso)}` : "";
function ago(iso) {
  if (!iso) return "";
  const m = Math.round(H.toMin(nowIso()) - H.toMin(iso));
  if (isNaN(m)) return "";
  if (m < 1) return "just now";
