    if (p && p.method === "receipt" && p.fields) pay = `Receipt ${H.rm(p.fields.amount_rm)}, reference ${esc(p.fields.reference)}. ` + (p.differences.length ? p.differences.map(d => `<span class="diff">${esc(d)}</span>`).join("") : "Matches the booking. Check the bank.") +
      `<div class="thumbs"><button data-img="${esc(imgSrc(p.image))}" aria-label="Enlarge receipt"><img src="${esc(imgSrc(p.image))}" alt="Receipt for ${esc(b.booking_ref)}"></button></div>`;
    const away = !!b.delivery, set = away && b.delivery.charge_rm != null;
    const place = b.pickup_place === b.return_place ? b.pickup_place : `Pickup ${b.pickup_place}\nReturn ${b.return_place}`;
    return `<div class="card" id="card-${esc(it.id)}"><div class="ch"><span>${esc(b.booking_ref)} · ${esc(kind ? "payment reported" : "booking request")}</span><small>${esc(H.timeText(b.requested_at))} · ${esc(ago(b.requested_at))}</small></div>` +
      row("Customer", esc(`${b.customer_name} · ${b.mobile}`) + `<span class="m"> · licence ${esc(b.licence_no)}</span>`) +
      row("Car", esc(`${b.model} · ${b.tier} · ${b.car_id}`)) +
      row("Pickup and return", esc(`${when(b.pickup_at)} to ${when(b.return_at)}`)) +
      row("Place", `<span class="pre">${esc(place)}</span>`) +
      row("Amount", esc(`Rental ${H.rm(b.price_rm)} · deposit ${H.rm(b.deposit_rm)}` + (away ? (set ? ` · delivery ${H.rm(b.delivery.charge_rm)}` : " · delivery charge not set") : ""))) +
      row("Payment", pay) +
      (b.after_hours ? row("Made", "Outside 9am to 6pm: review from 9am (" + ruleLink("R3") + ")") : "") +
      row("Told the customer", b.told_customer ? `<span class="pre">${esc(b.told_customer)}</span>` : "") +
      (away && !set ? `<div class="charge"><label for="ch-${esc(b.booking_ref)}">Delivery charge (RM)</label><input id="ch-${esc(b.booking_ref)}" inputmode="numeric" data-charge="${esc(b.booking_ref)}" value="${esc(ui.charges[b.booking_ref] || "")}" placeholder="0"><button class="btn small" data-act="setDeliveryCharge" data-id="${esc(b.booking_ref)}">Set</button><span>RM 1 per km from KLIA (${ruleLink("R11")}). The agent quoted no figure.</span></div>` : "") +
      row("Recommended action", esc(`Find ${H.rm(b.deposit_rm)} with reference ${b.booking_ref} in the bank, then Confirm; if it is not there, Reject.`), "rec") +
      `<div class="btns"><button class="btn" data-act="confirm" data-id="${esc(b.booking_ref)}">Confirm</button><button class="btn warn" data-act="reject" data-id="${esc(b.booking_ref)}">Reject</button></div></div>`;
  }
  const c = it.c, b = it.b;
  return `<div class="card" id="card-${esc(it.id)}"><div class="ch"><span>${esc(c.cancellation_id)} · ${esc(c.booking_ref)}</span><small>${esc(H.timeText(c.requested_at))} · ${esc(ago(c.requested_at))}</small></div>` +
    row("Customer", b ? esc(`${b.customer_name} · ${b.mobile} · verified`) : "") +
    row("Booking", b ? esc(`${b.model} · ${when(b.pickup_at)} to ${when(b.return_at)}`) : "") +
    row("Quoted refund", `${esc(H.rm(c.refund_rm))} under ${ruleLink(c.clause)}: ${esc(c.clause === "R19" ? "24 hours or more before pickup" : "less than 24 hours before pickup, deposit kept")}`) +
    row("Told the customer", c.told_customer ? `<span class="pre">${esc(c.told_customer)}</span>` : "") +
    row("Recommended action", esc(c.refund_rm ? `Confirm, then refund ${H.rm(c.refund_rm)} to the original payment method within 24 hours.` : "Confirm; the deposit is kept."), "rec") +
    `<div class="btns">${contactBtns(b && b.mobile)}<button class="btn done" data-act="confirmCancellation" data-id="${esc(c.cancellation_id)}">Confirm cancellation</button></div></div>`;
}
function renderInbox() {
  const all = items(), counts = {};
  all.forEach(i => (counts[i.cat] = (counts[i.cat] || 0) + 1));
  const cats = Object.keys(counts).sort((a, b) => (a === "urgent" ? -1 : b === "urgent" ? 1 : 0) || counts[b] - counts[a] || CAT_ORDER.indexOf(a) - CAT_ORDER.indexOf(b));
  if (!ui.cat || !counts[ui.cat]) { ui.cat = cats[0] || null; ui.caseId = null; }
  let html = `<div class="m sum">${all.length ? `${all.length} waiting · urgent first, then by number of cases` : "Nothing waiting"}</div>`;
  html += `<div class="chips">` + cats.map(c => `<button class="chip${c === "urgent" ? " urgent" : ""}${c === ui.cat ? " on" : ""}" data-cat="${c}">${esc(GROUP_LABEL[c])}<span class="n" id="n-${c}">${counts[c]}</span></button>`).join("") + `</div>`;
  const list = all.filter(i => i.cat === ui.cat).sort((a, b) => ui.cat === "requests" ? ((a.unpaid ? 0 : 1) - (b.unpaid ? 0 : 1)) || String(a.at).localeCompare(String(b.at)) : String(a.at).localeCompare(String(b.at)));
  if (!list.some(i => i.id === ui.caseId)) ui.caseId = list.length ? list[0].id : null;
  if (!list.length) html += `<div class="empty">All caught up. Requests and handovers from the agent appear here.</div>`;
  else {
    html += `<div class="list">` + list.map(i => `<button data-case="${esc(i.id)}" class="${i.id === ui.caseId ? "on" : ""}"><span><b>${esc(i.ref)}</b> · ${esc(i.who)}</span><small>${esc(ago(i.at))}</small></button>`).join("") + `</div>`;
    const it = list.find(i => i.id === ui.caseId);
    if (it) html += cardHtml(it);
  }
  document.getElementById("p-inbox").innerHTML = html;
  const badge = document.getElementById("badge");
  badge.textContent = all.length ? String(all.length) : "";
  if (lastOpen !== null && all.length > lastOpen) { badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump"); }
  if (flashId && ui.caseId === flashId) {
    const card = document.getElementById("card-" + flashId);
    if (card) { card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1600); }
    flashId = null;
  }
  return all.length;
}

// ---------- Today ----------
const ACTIVE = ["pending", "confirmed", "rented", "cancellation_requested"];
function renderToday() {
  const now = nowIso(), today = now.slice(0, 10);
  const picks = state.bookings.filter(b => b.pickup_at.slice(0, 10) === today && ["pending", "confirmed", "cancellation_requested"].includes(b.status));
  const rets = state.bookings.filter(b => b.return_at.slice(0, 10) === today && b.status === "rented");
  const lines = picks.map(b => ({ t: b.pickup_at.slice(11, 16), html: `<span class="tag ${b.status === "pending" ? "t-pend" : "t-pick"}">Pickup${b.status === "pending" ? ", pending" : ""}</span> ${esc(b.booking_ref)} · ${esc(b.model)} · ${esc(b.customer_name)}<br><span class="m">${esc(b.pickup_place)}</span>` }))
    .concat(rets.map(b => ({ t: b.return_at.slice(11, 16), html: `<span class="tag t-ret">Return</span> ${esc(b.booking_ref)} · ${esc(b.model)} · ${esc(b.customer_name)}<br><span class="m">${esc(b.return_place)}</span>` })))
    .sort((a, b) => a.t.localeCompare(b.t));
  const out = state.bookings.filter(b => b.status === "rented").length;
  const busy = new Set(state.bookings.filter(b => ACTIVE.includes(b.status) && b.pickup_at.slice(0, 10) <= today && b.return_at.slice(0, 10) >= today).map(b => b.car_id));
  const maint = state.cars.filter(c => c.status === "maintenance").length;
  let html = `<div class="sec">${esc(LONGDAYS[new Date(today + "T00:00:00Z").getUTCDay()])}, ${esc(H.dateText(today))}, now ${esc(H.timeText(now))}</div>`;
  html += `<div class="stats"><div><b>${out}</b>cars out on rental</div><div><b>${state.cars.length - busy.size - maint}</b>cars free today</div><div><b>${picks.length}</b>pickups today</div><div><b>${rets.length}</b>returns due today</div></div>`;
  html += `<div class="sec">Pickups and returns, 9am to 6pm</div>`;
  html += lines.length ? `<div class="card">${lines.map(l => `<div class="line"><span class="h">${esc(H.timeText(today + "T" + l.t))}</span><span>${l.html}</span></div>`).join("")}</div>` : `<div class="empty">No pickups or returns today.</div>`;
  const tom = H.addDays(today, 1);
  const tp = state.bookings.filter(b => b.pickup_at.slice(0, 10) === tom && ["pending", "confirmed"].includes(b.status));
  html += `<div class="sec">Coming up</div><div class="card"><div class="line"><span>Tomorrow, ${esc(H.dateText(tom))}: ${tp.length} pickup${tp.length === 1 ? "" : "s"}${tp.length ? ", first at " + esc(H.timeText(tp.map(b => b.pickup_at).sort()[0])) : ""}. <a href="#" data-goto="${esc(tom)}">Open in Fleet</a></span></div></div>`;
  document.getElementById("p-today").innerHTML = html;
}

// ---------- Fleet: a month of days, then the chosen day by tier ----------
function dayInfo(d) {
  const on = state.bookings.filter(b => ACTIVE.concat(["returned"]).includes(b.status) && b.pickup_at.slice(0, 10) <= d && b.return_at.slice(0, 10) >= d);
  return { on, cars: new Set(on.map(b => b.car_id)) };
}
function renderFleet() {
  const today = nowIso().slice(0, 10);
  const days = []; for (let d = state.meta.seed_start; d <= state.meta.seed_end; d = H.addDays(d, 1)) days.push(d);
  const months = [...new Set(days.map(d => d.slice(0, 7)))];
  if (!ui.month || !months.includes(ui.month)) ui.month = months.includes(today.slice(0, 7)) ? today.slice(0, 7) : months[0];
  if (!ui.day || !days.includes(ui.day)) ui.day = days.includes(today) ? today : days[0];
  const [y, m] = ui.month.split("-").map(Number), idx = months.indexOf(ui.month);
  let html = `<div class="mhead"><button data-mon="-1" ${idx <= 0 ? "disabled" : ""} aria-label="Previous month">&larr;</button><b>${MONTHS[m - 1]} ${y}</b><button data-mon="1" ${idx >= months.length - 1 ? "disabled" : ""} aria-label="Next month">&rarr;</button></div>`;
  html += `<div class="grid">` + ["M", "T", "W", "T", "F", "S", "S"].map(d => `<div class="wd">${d}</div>`).join("");
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), pad = (first + 6) % 7, last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let p = 0; p < pad; p++) html += `<div class="pad"></div>`;
  for (let d = 1; d <= last; d++) {
    const iso = `${ui.month}-${String(d).padStart(2, "0")}`;
    if (!days.includes(iso)) { html += `<div class="pad"></div>`; continue; }
    const n = dayInfo(iso).cars.size, pct = Math.round(100 * n / state.cars.length);
    html += `<button class="${[iso < today ? "past" : "", iso === today ? "today" : "", iso === ui.day ? "sel" : ""].filter(Boolean).join(" ")}" data-day="${iso}" title="${n} of ${state.cars.length} cars booked">${d}<span class="occ"><i style="width:${pct}%"></i></span><span class="cnt">${n}/${state.cars.length}</span></button>`;
  }
  html += `</div>`;
  const info = dayInfo(ui.day);
  html += `<div class="sec">${esc(H.dateText(ui.day))}${ui.day === today ? " · today" : ""} · ${info.cars.size} of ${state.cars.length} cars booked</div><div class="card">`;
  html += Object.keys(T.TIERS).map(t => {
    const cs = state.cars.filter(c => c.tier === t), n = cs.filter(c => info.cars.has(c.car_id)).length, mt = cs.filter(c => c.status === "maintenance").length;
    return `<div class="tier"><span>${esc(t)}</span><span class="bar2"><i style="width:${Math.round(100 * n / cs.length)}%"></i></span><span class="m">${n} of ${cs.length}${mt ? `, ${mt} in maintenance` : ""}</span></div>`;
  }).join("") + `</div>`;
  const moves = info.on.filter(b => b.pickup_at.slice(0, 10) === ui.day || b.return_at.slice(0, 10) === ui.day).sort((a, b) => a.pickup_at.localeCompare(b.pickup_at));
  html += `<div class="sec">Pickups and returns this day (${moves.length})</div>`;
  html += moves.length ? `<div class="card">${moves.slice(0, 20).map(b => {
    const p = b.pickup_at.slice(0, 10) === ui.day;
    return `<div class="line"><span class="h">${esc(H.timeText(p ? b.pickup_at : b.return_at))}</span><span><span class="tag ${b.status === "pending" ? "t-pend" : p ? "t-pick" : "t-ret"}">${p ? "Pickup" : "Return"}</span> ${esc(b.booking_ref)} · ${esc(b.model)} · ${esc(b.status.replace("_", " "))}</span></div>`;
  }).join("")}${moves.length > 20 ? `<div class="line m">and ${moves.length - 20} more</div>` : ""}</div>` : `<div class="empty">None.</div>`;
  document.getElementById("p-fleet").innerHTML = html;
}

// ---------- home screen and notifications (embedded demo) ----------
function renderHome(open) {
  const now = nowIso();
  document.getElementById("home-clock").textContent = now.slice(11, 16);
  document.getElementById("sb-time").textContent = now.slice(11, 16);
  document.getElementById("home-date").textContent = `${LONGDAYS[new Date(now.slice(0, 10) + "T00:00:00Z").getUTCDay()]}, ${+now.slice(8, 10)} ${MONTHS[+now.slice(5, 7) - 1]}`;
  document.getElementById("home-widget").textContent = open ? `${open} item${open === 1 ? "" : "s"} waiting in the inbox. The agent is answering customers.` : "Nothing needs you right now. The agent is answering customers.";
  document.getElementById("home").classList.toggle("on", EMBED && (!ui.appOpen || ui.holdHome));
}
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
let notifTimer = null;
function notify(it, then) {
  const n = document.getElementById("notif");
  n.classList.toggle("urgent", it.cat === "urgent");
  document.getElementById("notif-t").textContent = `${GROUP_LABEL[it.cat]} · ${it.ref}`;
  document.getElementById("notif-b").textContent = it.h ? it.h.customer_asked : it.c ? `Cancellation, refund ${H.rm(it.c.refund_rm)}` : `${it.b.model}, ${when(it.b.pickup_at)}${it.b.payment.reported ? ", payment reported" : ""}`;
  n.classList.add("on");
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => { n.classList.remove("on"); then(); }, REDUCED ? 0 : 1800);
}
function render() {
  const now = nowIso();
  document.getElementById("today-text").textContent = `${H.dateText(now)}, ${H.timeText(now)}`;
  document.getElementById("toast").innerHTML = ui.toast ? `<span>${esc(ui.toast)}</span><button data-toast-x aria-label="Dismiss">×</button>` : "";
  const open = renderInbox(); renderToday(); renderFleet(); renderHome(open);
  lastOpen = open;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === ui.tab));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.dataset.p === ui.tab));
}

// ---------- live updates: a new item arrives as a notification, then the app opens on its card ----------
function reload() {
  state = loadState();
  const all = items(), now = all.map(sig);
  if (known) {
    const fresh = all.filter(i => !known.has(sig(i)));
    known = new Set(now);
    if (fresh.length) {
      const it = fresh.find(i => i.cat === "urgent") || fresh[fresh.length - 1];
      const show = () => { ui.holdHome = false; ui.appOpen = true; ui.tab = "inbox"; ui.cat = it.cat; ui.caseId = it.id; flashId = it.id; document.getElementById("scroll").scrollTop = 0; render(); };
      if (EMBED) { ui.holdHome = document.getElementById("home").classList.contains("on"); render(); notify(it, show); }
      else show();
      return;
    }
  }
  known = new Set(now);
  render();
}
if (channel) channel.onmessage = e => { const d = e.data || {}; if (!d.store || d.store === KEY || (d.type === "reset" && !REPLAY)) { if (d.type === "reset") ui.appOpen = false; reload(); } };
window.addEventListener("storage", e => { if (e.key === KEY || e.key === null) reload(); });
window.KeretaStaff = { reload, home: () => { ui.appOpen = false; known = null; reload(); } };
document.getElementById("home-open").addEventListener("click", () => { ui.appOpen = true; render(); });

// ---------- actions ----------
function act(fn, id, extra) {
  state = loadState();
  const r = fn(state, id, nowIso(), extra);
  if (!r.ok) { ui.toast = r.message; render(); return; }
  saveAndTell(state);
  known = new Set(items().map(sig));
  ui.toast = r.message ? "Sent to the customer: " + r.message : `${id} closed.`;
  ui.caseId = null;
  render();
}
document.getElementById("lb").addEventListener("click", () => document.getElementById("lb").classList.remove("on"));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("lb").classList.remove("on"); });
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.charge) ui.charges[e.target.dataset.charge] = e.target.value; });
document.querySelector(".app").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-toast-x]")) { ui.toast = ""; render(); return; }
  const tab = t.closest("[data-t]");
  if (tab) { ui.tab = tab.dataset.t; render(); document.getElementById("scroll").scrollTop = 0; return; }
  const cat = t.closest("[data-cat]");
  if (cat) { ui.cat = cat.dataset.cat; ui.caseId = null; render(); return; }
  const cs = t.closest("[data-case]");
  if (cs) { ui.caseId = cs.dataset.case; render(); const c = document.getElementById("card-" + ui.caseId); if (c) c.scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  const img = t.closest("[data-img]");
  if (img) { document.getElementById("lb-img").src = img.dataset.img; document.getElementById("lb").classList.add("on"); return; }
  const a = t.closest("[data-act]");
  if (a) {
    if (a.dataset.act === "setDeliveryCharge") act(T.STAFF.setDeliveryCharge, a.dataset.id, String(ui.charges[a.dataset.id] || "").replace(/[^0-9.]/g, "") || "x");
    else act(T.STAFF[a.dataset.act], a.dataset.id);
    return;
  }
  const ct = t.closest("[data-contact]");
  if (ct) { ui.toast = `Demo: this would open ${ct.dataset.contact === "call" ? "a call" : "WhatsApp"} to ${ct.dataset.to}. The numbers are made up.`; render(); return; }
  const mon = t.closest("[data-mon]");
  if (mon) {
    const days = []; for (let d = state.meta.seed_start; d <= state.meta.seed_end; d = H.addDays(d, 1)) days.push(d);
    const months = [...new Set(days.map(d => d.slice(0, 7)))], i = months.indexOf(ui.month) + Number(mon.dataset.mon);
    if (months[i]) { ui.month = months[i]; ui.day = days.find(d => d.startsWith(ui.month)); }
    render(); return;
  }
  const day = t.closest("[data-day]");
  if (day) { ui.day = day.dataset.day; render(); return; }
  const go = t.closest("[data-goto]");
  if (go) { e.preventDefault(); ui.day = go.dataset.goto; ui.month = ui.day.slice(0, 7); ui.tab = "fleet"; render(); return; }
});
if (!EMBED) ui.appOpen = true;
reload();
</script>
