01-F003","section":"S01","grader":{"verdict":"sound","note":"The English says the margin decreased, so 上升 reverses the direction, and 下降 corrects it."}},{"target":"P16","n":16,"kind":"paragraph","specialist":"accuracy","category":"mistranslation","severity":"should","en_span":"a depot in Klang","zh_span":"一处仓库","zh_start":33,"issue":"\"Depot\" is rendered as 仓库, which means warehouse and is a different facility in this report.","suggestion":"一处物流站","reason":"The English says \"depot\", whereas \"warehouse\" is used elsewhere for storage facilities.","source":"B1","comment_only":false,"id":"S01-F004","section":"S01","grader":{"verdict":"doubtful","note":"Distinguishing \"depot\" from the Shah Alam \"warehouse\" (仓库) is a fair point. However, 物流站 is only one possible rendering, and the editor should confirm the term, or check whether the glossary covers it."}},{"target":"P1","n":1,"kind":"paragraph","specialist":"section","category":"quotation","severity":"must","en_span":"(\"the Group\")","zh_span":"“本集团“","zh_start":28,"issue":"The defined term closes with an opening quotation mark instead of a closing one.","suggestion":"“本集团”","reason":"The English defined term \"the Group\" must be enclosed in a correctly opened and closed pair of marks.","source":"H4","comment_only":false,"id":"S01-F005","section":"S01","grader":{"verdict":"sound","note":"The closing mark is wrongly an opening quotation mark, and the fix gives a proper “ ” pair as H1 and H4 require."}},{"target":"P10","n":10,"kind":"paragraph","specialist":"accuracy","category":"addition","severity":"must","en_span":"Freight forwarding remained the largest segment","zh_span":"货运代理生意很火，仍是最大分部","zh_start":0,"issue":"The colloquial phrase 生意很火 has no counterpart in the English.","suggestion":"货运代理仍是最大分部","reason":"The English only says freight forwarding remained the largest segment, and a disclosure must not use colloquial wording.","source":"B1","comment_only":false,"id":"S01-F006","section":"S01","flags":[{"specialist":"accuracy","category":"addition","severity":"must","en_span":"Freight forwarding remained the largest segment","zh_span":"生意很火，","issue":"The Chinese adds a colloquial remark that freight forwarding business is booming, which the English does not say.","reason":"The English only states that freight forwarding remained the largest segment and contains no claim about how strong its business is.","source":"B1","suggestion":""},{"specialist":"section","category":"wording","severity":"must","en_span":"Freight forwarding remained the largest segment","zh_span":"货运代理生意很火，仍是最大分部","issue":"The colloquial phrase 生意很火 has no counterpart in the English.","reason":"The English only says freight forwarding remained the largest segment, and a disclosure must not use colloquial wording.","source":"H7","suggestion":"货运代理仍是最大分部"},{"specialist":"register","category":"register","severity":"must","en_span":"Freight forwarding remained the largest segment","zh_span":"货运代理生意很火，仍是最大分部","issue":"The colloquial phrase 生意很火 (business is booming) has no basis in the English and does not belong in a regulatory filing.","reason":"The English only states that freight forwarding remained the largest segment, in a plain and measured tone.","source":"B3","suggestion":"货运代理仍是最大分部"}],"change_by":"same","grader":{"verdict":"sound","note":"生意很火 is colloquial and has no counterpart in the English, so deleting it is the minimal correct fix."}},{"target":"P17","n":17,"kind":"paragraph","specialist":"section","category":"punctuation","severity":"must","en_span":"(\"1Q FYE2026\")","zh_span":"(“2026财年第一季度”)","zh_start":16,"issue":"The brackets are half-width.","suggestion":"（“2026财年第一季度”）","reason":"House style requires full-width brackets around the defined term, as in the English parenthetical for 1Q FYE2026.","source":"H1","comment_only":false,"id":"S01-F007","section":"S01","grader":{"verdict":"sound","note":"Under H1 the brackets around the defined term must be full-width, as in the later 2025 parenthetical."}},{"target":"P18","n":18,"kind":"paragraph","specialist":"section","category":"fluency","severity":"must","en_span":"All three operating segments contributed to the growth in revenue.","zh_span":"三个营运分部均做出了贡献到收入增长","zh_start":0,"issue":"The sentence is ungrammatical and reads as a literal rendering.","suggestion":"三个营运分部均对收入增长做出了贡献","reason":"The English says all three segments contributed to the revenue growth, which needs the natural structure 对……做出贡献.","source":"B2","comment_only":false,"id":"S01-F008","section":"S01","grader":{"verdict":"sound","note":"做出了贡献到收入增长 is ungrammatical, and 对收入增长做出了贡献 is the natural structure with unchanged meaning."}},{"target":"F4","n":0,"kind":"front","specialist":"accuracy","category":"omission","severity":"must","en_span":"assumes no responsibility for its accuracy or completeness","zh_span":"保荐人未审阅本报告内容。","zh_start":34,"issue":"The Chinese leaves out the Sponsor's statement that it assumes no responsibility for the report's accuracy or completeness.","suggestion":"保荐人未审阅本报告内容，且对其准确性或完整性不承担任何责任。","reason":"The English says the Sponsor has not reviewed the contents and also assumes no responsibility for accuracy or completeness.","source":"B4","comment_only":false,"id":"S01-F009","section":"S01","grader":{"verdict":"sound","note":"The disclaimer of responsibility is missing from the protected sponsor statement, and adding it is a permitted accuracy correction that leaves the existing wording untouched."}},{"target":"P5","n":5,"kind":"paragraph","specialist":"accuracy","category":"mistranslation","severity":"must","en_span":"There were no unusual items","zh_span":"出现影响","zh_start":5,"issue":"The negation is lost, so the Chinese says unusual items occurred.","suggestion":"并无出现影响","reason":"The English says there were no unusual items affecting the Group's assets, liabilities, equity, net income or cash flows.","source":"B1","comment_only":false,"id":"S01-F010","section":"S01","grader":{"verdict":"sound","note":"The negation is lost, so the Chinese asserts that unusual items occurred, and restoring 并无 fixes the meaning."}}],"failed":[],"failedRequests":[],"conflicts":[]},{"id":"S02","collected":true,"findings":[{"target":"P31","n":31,"kind":"paragraph","specialist":"accuracy","category":"mistranslation","severity":"must","en_span":"to remain satisfactory","zh_span":"必将再创新高","zh_start":40,"issue":"The Chinese 「必将再创新高」 mistranslates \"remain satisfactory\" by asserting certain record-high performance, which also shifts the Board's measured expectation into a promotional claim.","suggestion":"将保持令人满意","reason":"Replacing it with 「将保持令人满意」 restores the English meaning and the cautious, factual register expected in a regulatory disclosure.","source":"B1","comment_only":false,"id":"S02-F001","section":"S02","flags":[{"specialist":"accuracy","category":"mistranslation","severity":"must","en_span":"to remain satisfactory","zh_span":"必将再创新高","issue":"The Chinese says performance will certainly hit new highs, whereas the English only says it is expected to remain satisfactory.","reason":"The English means performance is expected to stay satisfactory, not to reach record levels, and the Chinese overstates this in a promotional tone.","source":"B1","suggestion":"将保持令人满意"},{"specialist":"register","category":"register","severity":"must","en_span":"to remain satisfactory","zh_span":"必将再创新高","issue":"The Chinese turns the Board's measured expectation into a promotional claim of certain record performance.","reason":"The English says only that performance is expected to remain satisfactory, with no certainty and no claim of a new high.","source":"H7","suggestion":"将保持理想"}],"change_by":"consolidator","grader":{"verdict":"sound","note":"「必将再创新高」 turns \"remain satisfactory\" into a promotional certainty. 「将保持令人满意」 restores both the meaning and the measured tone required by H7."}},{"target":"P31","n":31,"kind":"paragraph","specialist":"accuracy","category":"addition","severity":"must","en_span":"the Board expects the performance of the Group for the financial year ending 31 December 2026 to remain satisfactory.","zh_span":"预计全年盈利将增长三成。","zh_start":47,"issue":"The Chinese adds a forecast that full-year profit will grow by 30%, which is not in the English.","suggestion":"","reason":"The English gives no profit growth figure or forecast, only that performance is expected to remain satisfactory.","source":"B1","comment_only":false,"id":"S02-F002","section":"S02","grader":{"verdict":"sound","note":"The English has no 30% profit growth forecast, so this is an addition. Deleting the sentence is the correct fix."}},{"target":"P36","n":36,"kind":"paragraph","specialist":"accuracy","category":"mistranslation","severity":"must","en_span":"RM48.00 million","zh_span":"4.8亿令吉","zh_start":34,"issue":"The amount is converted wrongly: RM48.00 million is 4,800万令吉, not 4.8亿令吉.","suggestion":"4,800万令吉","reason":"The English figure is RM48.00 million, which is 4,800万令吉, so the Chinese overstates it tenfold.","source":"H2","comment_only":false,"id":"S02-F003","section":"S02","grader":{"verdict":"sound","note":"RM48.00 million converts to 4,800万令吉 under H2. 4.8亿令吉 overstates the proceeds tenfold."}},{"target":"P23","n":23,"kind":"paragraph","specialist":"accuracy","category":"mistranslation","severity":"must","en_span":"Compared with the immediate preceding quarter ended 31 December 2025","zh_span":"与去年同期相比","zh_start":0,"issue":"The Chinese compares with the corresponding quarter of the previous year instead of the immediate preceding quarter ended 31 December 2025.","suggestion":"与截至2025年12月31日的上一季度相比","reason":"The English compares with the immediate preceding quarter, not the preceding year corresponding quarter.","source":"B1","comment_only":false,"id":"S02-F004","section":"S02","grader":{"verdict":"sound","note":"The English compares with the immediate preceding quarter ended 31 December 2025, not the same quarter last year. The suggested wording is accurate."}},{"target":"P24","n":24,"kind":"paragraph","specialist":"accuracy","category":"mistranslation","severity":"must","en_span":"The decrease was mainly due to lower parcel and freight volumes after the fourth-quarter peak of year-end online sales, and fewer working days during the quarter","zh_span":"包裹及货运量下降以及工作日减少，主要由于收入减少，时值第四季度年终网购高峰过后及农历新年和开斋节假期。","zh_start":0,"issue":"Cause and effect are reversed: the Chinese says lower volumes and fewer working days were due to lower revenue.","suggestion":"收入减少主要由于第四季度年终网购高峰过后包裹及货运量下降，以及本季度因农历新年和开斋节假期而工作日减少。","reason":"The English says the revenue decrease was caused by lower parcel and freight volumes and fewer working days.","source":"B1","comment_only":false,"id":"S02-F005","section":"S02","flags":[{"specialist":"accuracy","category":"mistranslation","severity":"must","en_span":"The decrease was mainly due to lower parcel and freight volumes after the fourth-quarter peak of year-end online sales, and fewer working days during the quarter","zh_span":"包裹及货运量下降以及工作日减少，主要由于收入减少，时值第四季度年终网购高峰过后及农历新年和开斋节假期。","issue":"Cause and effect are reversed: the Chinese says lower volumes and fewer working days were due to lower revenue.","reason":"The English says the revenue decrease was caused by lower parcel and freight volumes and fewer working days.","source":"B1","suggestion":"收入减少主要由于第四季度年终网购高峰过后包裹及货运量下降，以及本季度因农历新年和开斋节假期而工作日减少。"},{"specialist":"section","category":"structure","severity":"must","en_span":"The decrease was mainly due to lower parcel and freight volumes after the fourth-quarter peak of year-end online sales, and fewer working days during the quarter because of the Chinese New Year and Hari Raya Aidilfitri holidays.","zh_span":"包裹及货运量下降以及工作日减少，主要由于收入减少，时值第四季度年终网购高峰过后及农历新年和开斋节假期。","issue":"The cause and effect are reversed, so lower volumes and fewer working days are presented as the effect of the revenue decrease.","reason":"The English says the decrease in revenue was mainly caused by lower parcel and freight volumes and fewer working days, not the other way round.","source":"B2","suggestion":"收入减少主要由于第四季度年终网购高峰过后包裹及货运量下降，以及本季度因农历新年和开斋节假期而工作日减少。"}],"change_by":"same","grader":{"verdict":"sound","note":"The Chinese reverses cause and effect. The suggestion correctly makes lower volumes and fewer working days the causes of the revenue decrease."}},{"target":"P30","n":30,"kind":"paragraph","specialist":"accuracy","category":"omission","severity":"must","en_span":"The rationalisation of diesel subsidies may increase transport costs.","zh_span":"本集团对营运环境的风险保持警惕。","zh_start":0,"issue":"The sentence on diesel subsidy rationalisation possibly increasing transport costs is missing.","suggestion":"本集团对营运环境的风险保持警惕。柴油补贴合理化可能增加运输成本。","reason":"The English lists the rationalisation of diesel subsidies, which may increase transport costs, as one of the risks.","source":"B1","comment_only":false,"id":"S02-F006","section":"S02","grader":{"verdict":"sound","note":"The diesel subsidy risk sentence is missing from the Chinese. The suggestion restores it in the English order."}},{"target":"P32","n":32,"kind":"paragraph","specialist":"section","category":"punctuation","severity":"should","en_span":"profit guarantee for the current quarter: accordingly, no variance","zh_span":"盈利保证,因此,不列示","zh_start":18,"issue":"Half-width commas are used in the Chinese sentence.","suggestion":"盈利保证，因此，不列示","reason":"The house style requires full-width Chinese punctuation outside figures.","source":"H1","comment_only":false,"id":"S02-F007","section":"S02","grader":{"verdict":"sound","note":"Half-width commas in Chinese text breach H1. Full-width commas fix it."}},{"target":"P33","n":33,"kind":"paragraph","specialist":"section","category":"fluency","severity":"must","en_span":"The tax expense for the current quarter was RM3.11 million, representing an effective tax rate of 24.01%. This is slightly higher than the statutory tax rate of 24%, mainly because certain expenses were not deductible for tax purposes.","zh_span":"本季度税项支出为311万令吉而由于部分开支不可扣税所以实际税率为24.01%略高于24%的法定税率。","zh_start":0,"issue":"The sentence is an unpunctuated run-on with clumsy connectives (而由于…所以) and the cause is misplaced.","suggestion":"本季度税项支出为311万令吉，实际税率为24.01%，略高于24%的法定税率，主要由于部分开支不可扣税。","reason":"The English gives the tax expense and the effective tax rate, then explains that the slightly higher rate was mainly due to non-deductible expenses, which needs clear clauses and punctuation.","source":"B2","comment_only":false,"id":"S02-F008","section":"S02","grader":{"verdict":"sound","note":"The original is an unpunctuated run-on that also drops \"mainly\". The suggested restructuring adds proper punctuation and 主要由于, matching the English."}}],"failed":[],"failedRequests":[],"conflicts":[]},{"id":"S03","collected":true,"findings":[],"failed":[],"failedRequests":[],"conflicts":[]}],"decisions":{},"banned":["AI","Claude","Anthropic","model","LLM","模型","人工智能"],"intro":"This is the Chinese version of a fictional company's quarterly report, checked against its English original. The glossary stage has already corrected the settled terms; three specialists then raised 24 flags, each checked in code. Flags on the same words share one box with one correction, giving 18 boxes, and a separate grader annotated each one.","run_note":"The findings come from one recorded run on the Message Batches API."};</script>
<script>
"use strict";
const T = window.QualityCheckTools, AD = window.ApplyDecisions, RS = window.ReviewSummary;
const EMBED = window.CTQC_DATA || null;           // the demo: the recorded run built in
const LS_KEY = "ctqc-demo-decisions-v1";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const VIEWS = [["review", "Review"], ["report", "Reviewed report"], ["summary", "Review summary"], ["terms", "Terms"], ["listed", "Failed checks"], ["stats", "Accept rate"]];
let D = null, view = "review", sec = null, pi = 0, fi = 0, editing = null, showChanges = true;

// ---------- data: local server or embedded ----------
function readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { return {}; } }
function writeLocal(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) { /* private window: decisions last for this visit */ } }
async function load() {
  D = EMBED ? JSON.parse(JSON.stringify(EMBED)) : await fetch("/api/all").then((r) => r.json());
  if (EMBED) D.decisions = readLocal();
  T.indexDocument(D.doc);
}
async function saveDecision(id, decision, text) {
  const f = allFindings().find((x) => x.id === id);
  if (EMBED) {
    if (decision === "undo") delete D.decisions[id];
    else {
      const entry = { decision, at: new Date().toISOString() };
      if (decision === "edit") { const c = T.checkEdit(D.doc, f, text, D.banned); if (!c.ok) return { ok: false, error: c.error }; entry.text = c.text; }
      D.decisions[id] = entry;
    }
    writeLocal(D.decisions);
    return { ok: true };
  }
  const r = await fetch("/api/decision", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, decision, text }) }).then((x) => x.json());
  if (r.ok) { if (r.decision) D.decisions[id] = r.decision; else delete D.decisions[id]; }
  return r;
}
const allFindings = () => D.sections.flatMap((s) => s.findings);
const applied = () => AD.applyAll(D.doc, D.glossary_report, allFindings(), D.decisions, D.banned);

// ---------- shell ----------
function nav() {
  document.getElementById("views").innerHTML = VIEWS.map(([k, t]) => `<button class="${view === k ? "on" : ""}" onclick="go('${k}')">${t}</button>`).join("");
  const n = allFindings().length, d = allFindings().filter((f) => D.decisions[f.id]).length;
  document.getElementById("prog").textContent = `${d} of ${n} findings decided`;
}
window.go = (k) => { view = k; editing = null; try { history.replaceState(null, "", "#" + k); } catch (e) {} render(); window.scrollTo(0, 0); };
function intro() {
  if (!EMBED) return;
  document.getElementById("intro").innerHTML = `<div class="intro">
    <p><b>You are the editor.</b> ${esc(D.intro)}</p>
    <p>Accept, edit or reject each finding on the <b>Review</b> page. Your decisions rewrite the <b>Reviewed report</b> and recount the <b>Review summary</b> straight away. They stay in this browser only.</p>
    <p class="acts"><button onclick="resetDemo()">Reset my decisions</button><span class="muted">${esc(D.run_note)}</span></p></div>`;
}
window.resetDemo = () => { if (!confirm("Clear every decision you made on this page?")) return; D.decisions = {}; writeLocal({}); pi = 0; fi = 0; render(); };
function render() {
  nav();
  ({ review: viewReview, report: viewReport, summary: viewSummary, terms: viewTerms, listed: viewListed, stats: viewStats }[view] || viewReview)();
  document.querySelectorAll("#main table").forEach((t) => { if (t.parentNode.className === "tw") return; const d = document.createElement("div"); d.className = "tw"; t.parentNode.insertBefore(d, t); d.appendChild(t); });
}

// ---------- Review ----------
function section() { return D.sections.find((s) => s.id === sec) || D.sections[0]; }
function targetsOf(s) {
  const all = D.doc.sections.find((x) => x.id === s.id).keys.map((k) => D.doc.byKey[k]);
  const withF = new Set(s.findings.map((f) => f.target));
  return document.getElementById("onlyf") && !document.getElementById("onlyf").checked ? all : all.filter((t) => withF.has(t.key));
}
function highlight(t, fs) {
  const marks = [];
  for (const p of t.protected) marks.push({ a: p.start, b: p.end, cls: "p" });
  fs.forEach((f) => marks.push({ a: f.zh_start, b: f.zh_start + f.zh_span.length, cls: "f", id: f.id }));
  const pts = new Set([0, t.zh.length]); marks.forEach((m) => { pts.add(m.a); pts.add(m.b); });
  const cuts = [...pts].sort((x, y) => x - y); let out = "";
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = cuts[i], b = cuts[i + 1];
    const f = marks.find((m) => m.cls === "f" && m.a <= a && m.b >= b), p = marks.find((m) => m.cls === "p" && m.a <= a && m.b >= b);
    let h = esc(t.zh.slice(a, b)); if (p) h = `<span class="p">${h}</span>`; if (f) h = `<mark class="f" data-id="${f.id}">${h}</mark>`; out += h;
  }
  return out;
}
function viewReview() {
  const s = section(); sec = s.id;
  const counts = (x) => `${x.findings.filter((f) => D.decisions[f.id]).length}/${x.findings.length} decided`;
  const only = document.getElementById("onlyf") ? document.getElementById("onlyf").checked : true;
  const list = targetsOf(s);
  const head = `<div class="acts" style="margin:12px 0"><select id="sec" aria-label="Section" onchange="sec=this.value;pi=0;fi=0;render()">${D.sections.map((x) => { const ds = D.doc.sections.find((y) => y.id === x.id); return `<option value="${x.id}" ${x.id === s.id ? "selected" : ""}>${x.id} · ${ds.front_matter ? "F1 to F4, " : ""}P${ds.from} to P${ds.to} · ${counts(x)}</option>`; }).join("")}</select>
    <label class="muted"><input type="checkbox" id="onlyf" ${only ? "checked" : ""} onchange="pi=0;fi=0;render()"> only paragraphs with findings</label>
    <span class="keys">j / k paragraph · n / p finding · a accept · e edit · r reject · u undo</span></div>`;
  const main = document.getElementById("main");
  if (!list.length) { main.innerHTML = head + `<p class="muted">No findings in this section.</p>`; return; }
  pi = Math.max(0, Math.min(pi, list.length - 1));
  const t = list[pi], fs = s.findings.filter((f) => f.target === t.key);
  fi = Math.max(0, Math.min(fi, fs.length - 1));
  const conflictsOf = (id) => (s.conflicts || []).filter((c) => c.a === id || c.b === id);
  main.innerHTML = head + `<div class="para"><h2>${esc(t.key)}${t.name ? ` <span class="tag">${esc(t.name)}</span>` : ""}
      <span class="muted">${pi + 1} of ${list.length}</span><span><button onclick="move(-1)">◀ prev</button> <button onclick="move(1)">next ▶</button></span></h2>
    ${t.heading_en ? `<div class="hd">${esc(t.heading_en)} · ${esc(t.heading_zh)}</div>` : ""}
    <div class="en">${esc(t.en)}</div><div class="zh">${highlight(t, fs)}</div>
    ${t.protected.length ? `<div class="note">Grey dashed text is a protected passage: accuracy corrections only, never a change of wording or tone.</div>` : ""}
    ${t.zh_original ? `<div class="note">The glossary stage already corrected a term here (see Terms).</div>` : ""}</div>
  ${fs.map((f, i) => {
    const d = D.decisions[f.id];
    const g = f.grader ? `<span class="g-${esc(f.grader.verdict)}">grader: ${esc(f.grader.verdict)}</span> <span class="muted">${esc(f.grader.note)}</span>` : "";
    const conf = conflictsOf(f.id).map((c) => `<span class="tag">overlaps ${esc(c.a === f.id ? c.b : c.a)}</span>`).join(" ");
    return `<div class="find ${i === fi ? "sel" : ""} ${d ? d.decision : ""}" onclick="fi=${i};render()">
      <div class="meta"><b>${esc(f.id)}</b><span>${f.flags ? `${f.flags.length} flags` : `${esc(f.specialist)} · ${esc(f.category)}`} · ${esc(f.severity)}</span>${f.flags ? "" : `<span>source ${esc(f.source)}</span>`}${{ comment: '<span class="tag">comment only</span>', delete: '<span class="tag">deletes the words</span>', change: "" }[T.findingMode(D.doc, f)]}${conf}</div>
      ${f.flags ? `<div class="flags">${f.flags.map((x) => `<div class="flag"><b>${esc(x.specialist)}</b> · ${esc(x.category)} · ${esc(x.severity)} · source ${esc(x.source)}: ${esc(x.issue)} <span class="muted">English: “${esc(x.en_span)}”</span></div>`).join("")}</div>` : ""}
      ${T.findingMode(D.doc, f) === "comment"
        ? `<div class="chg"><span class="muted">Comment on</span> <mark class="f">${esc(f.zh_span)}</mark> <span class="muted">· the text is not changed</span></div>
           ${f.category === "omission" ? `<div class="muted">Missing from the Chinese: <span class="new">${esc(f.en_span)}</span></div>` : ""}`
        : `<div class="chg">${f.flags ? `<span class="lbl">Correction</span> ` : ""}<span class="old">${esc(f.zh_span)}</span>${f.suggestion ? ` → <span class="new">${esc(d && d.decision === "edit" ? d.text : f.suggestion)}</span>` : ` → <span class="muted">(deleted)</span>`}</div>`}
      ${f.flags ? `<div class="muted">${f.change_by === "consolidator" ? `One change written to cover every flag: ${esc(f.issue)}` : f.change_by === "same" ? "Every flag proposed this same change." : esc(f.issue)}</div>`
        : `<div>${esc(f.issue)}</div><div class="muted">${esc(f.reason)} · English: “${esc(f.en_span)}”</div>`}
      ${g ? `<div>${g}</div>` : ""}
      ${editing === f.id ? `<textarea id="edtext" onclick="event.stopPropagation()">${esc(d && d.text ? d.text : f.suggestion)}</textarea><div class="acts"><button class="pri" onclick="event.stopPropagation();decide('${f.id}','edit')">Save edit</button><button onclick="event.stopPropagation();editing=null;render()">Cancel</button><span id="ederr" class="err"></span></div>`
        : `<div class="acts"><button onclick="event.stopPropagation();decide('${f.id}','accept')">Accept (a)</button>${f.suggestion ? `<button onclick="event.stopPropagation();editing='${f.id}';render()">Edit (e)</button>` : ""}<button onclick="event.stopPropagation();decide('${f.id}','reject')">Reject (r)</button>${d ? `<button onclick="event.stopPropagation();decide('${f.id}','undo')">Undo (u)</button><span class="muted">${esc(d.decision)}ed</span>` : ""}</div>`}
    </div>`; }).join("")}`;
  document.querySelectorAll("mark.f").forEach((m) => { if (fs[fi] && m.dataset.id === fs[fi].id) m.classList.add("sel"); });
  if (editing) { const x = document.getElementById("edtext"); if (x) x.focus(); }
}
window.move = (d) => { pi += d; fi = 0; editing = null; render(); };
window.decide = async (id, decision) => {
  const text = decision === "edit" ? document.getElementById("edtext").value : undefined;
  const r = await saveDecision(id, decision, text);
  if (!r.ok) { const e = document.getElementById("ederr"); if (e) e.textContent = r.error; else alert(r.error); return; }
  editing = null;
  const s = section(), list = targetsOf(s), fs = list[pi] ? s.findings.filter((f) => f.target === list[pi].key) : [];
  if (decision !== "undo" && fi < fs.length - 1) fi++;
  render();
};
document.addEventListener("keydown", (e) => {
  if (view !== "review" || !D || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
  const s = section(), list = targetsOf(s), fs = list[pi] ? s.findings.filter((f) => f.target === list[pi].key) : [], f = fs[fi];
  if (e.key === "j") move(1); else if (e.key === "k") move(-1);
  else if (e.key === "n") { fi = Math.min(fi + 1, fs.length - 1); render(); } else if (e.key === "p") { fi = Math.max(fi - 1, 0); render(); }
  else if (f && e.key === "a") decide(f.id, "accept"); else if (f && e.key === "r") decide(f.id, "reject"); else if (f && e.key === "u") decide(f.id, "undo");
  else if (f && e.key === "e" && f.suggestion) { e.preventDefault(); editing = f.id; render(); }
});

// ---------- Reviewed report ----------
function viewReport() {
  const A = applied(), byId = Object.fromEntries(allFindings().map((f) => [f.id, f]));
  const changes = A.gate.changes.length - A.plan.skipped.length, comments = A.gate.comments.length;
  let n = 0; const num = {};
  const paras = D.doc.targets.map((t) => {
    const r = A.reviewed[t.key];
    let html = "";
    if (!showChanges) html = esc(r.clean);
    else for (const x of r.runs) {
      let h = esc(x.text);
      if (x.st === "gins") h = `<ins class="g" title="Glossary stage">${h}</ins>`;
      else if (x.st === "gdel") h = `<del class="g" title="Glossary stage">${h}</del>`;
      else if (x.st === "eins") h = `<ins class="e" title="${esc(x.notes.join(", "))}">${h}</ins>`;
      else if (x.st === "edel") h = `<del class="e">${h}</del>`;
      const cs = x.notes.filter((id) => byId[id] && T.findingMode(D.doc, byId[id]) === "comment");
      if (cs.length && x.st !== "eins") h = `<span class="c">${h}</span>`;
      html += h;
    }
    const cms = [...new Set(r.runs.flatMap((x) => x.notes))].filter((id) => byId[id]);
    if (showChanges) for (const id of cms) { num[id] = ++n; html += `<sup class="c">${n}</sup>`; }
    const notes = showChanges ? cms.map((id) => { const f = byId[id]; return `<div class="cm">${num[id]}. ${esc(f.id)} [${esc(f.category)}] ${esc(f.issue)}${T.findingMode(D.doc, f) === "comment" ? " (comment)" : ""}</div>`; }).join("") : "";
    const head = t.heading_zh ? `<h4>${esc(t.heading_zh)}</h4>` : "";
    return `${head}<p><span class="k">${esc(t.key)}</span>${html}</p>${notes}`;
  }).join("");
  document.getElementById("main").innerHTML = `<div class="acts" style="margin:12px 0">
      <button class="${showChanges ? "pri" : ""}" onclick="showChanges=true;render()">Show changes</button><button class="${showChanges ? "" : "pri"}" onclick="showChanges=false;render()">Clean text</button>
      <span class="muted">${changes} tracked change${changes === 1 ? "" : "s"} and ${comments} comment${comments === 1 ? "" : "s"} from your decisions${A.plan.skipped.length ? `; ${A.plan.skipped.length} accepted change(s) overlap another and are not applied (${A.plan.skipped.map((x) => esc(x.id)).join(", ")})` : ""}.</span></div>
    ${showChanges ? `<div class="legend"><span><ins class="e">inserted</ins> <del class="e">deleted</del> your decisions</span><span><ins class="g">inserted</ins> <del class="g">deleted</del> glossary stage</span><span><span class="c">highlighted</span><sup class="c">1</sup> comment</span></div>` : ""}
    <div class="doc">${paras}</div>`;
}

// ---------- Summary, Terms, Failed checks, Accept rate ----------
function viewSummary() {
  const A = applied();
  const s = RS.summarise(D.doc, D.glossary_report, D.sections, D.decisions, A);
  document.getElementById("main").innerHTML = `<div class="doc" style="font-size:15px">${RS.renderSummary(s)}</div>`;
}
function viewTerms() {
  const ch = D.glossary_report.changes || [];
  document.getElementById("main").innerHTML = `<p class="muted">The glossary settles these terms. The glossary stage replaced every listed rendering to avoid with the approved one, as a tracked change, before the specialists read the text. ${ch.length} change${ch.length === 1 ? "" : "s"} made.</p>
    <table><tr><th>Entry</th><th>English</th><th>Approved Chinese</th><th>Avoid</th><th>Changed by the glossary stage</th></tr>${D.glossary.entries.map((e) => {
      const here = ch.filter((c) => c.entry === e.id);
      return `<tr><td>${esc(e.id)}</td><td>${esc(e.en)}</td><td>${esc(e.zh)}</td><td>${esc(e.avoid.join("、"))}</td><td>${here.map((c) => `${esc(c.target)}: ${esc(c.from)} → ${esc(c.to)}`).join("<br>")}</td></tr>`; }).join("")}</table>`;
}
function viewListed() {
  const l = D.sections.flatMap((s) => [...(s.failed || []).map((x) => ({ section: s.id, ...x })), ...(s.failedRequests || []).map((x) => ({ section: s.id, request: true, ...x }))]);
  document.getElementById("main").innerHTML = l.length ? `<table><tr><th>Section</th><th>What</th><th>Error</th></tr>${l.map((x) => `<tr><td>${esc(x.section)}</td><td>${x.request ? "request " + esc(x.custom_id) : esc(JSON.stringify(x.finding)).slice(0, 300)}</td><td>${esc(x.error.category)}: ${esc(x.error.message)}</td></tr>`).join("")}</table>`
    : `<p class="muted">Nothing failed the checks in code: every finding the specialists returned passed, or was fixed in a retry round.</p>`;
}
function viewStats() {
  const by = {};
  for (const f of allFindings()) { const x = by[f.category] = by[f.category] || { total: 0, accept: 0, edit: 0, reject: 0 }; x.total++; const d = D.decisions[f.id]; if (d) x[d.decision]++; }
  document.getElementById("main").innerHTML = `<table><tr><th>Category</th><th>Findings</th><th>Accepted</th><th>Edited</th><th>Rejected</th><th>Accept rate</th></tr>${Object.entries(by).map(([k, v]) => { const dec = v.accept + v.edit + v.reject; return `<tr><td>${esc(k)}</td><td>${v.total}</td><td>${v.accept}</td><td>${v.edit}</td><td>${v.reject}</td><td>${dec ? Math.round((100 * (v.accept + v.edit)) / dec) + "%" : ""}</td></tr>`; }).join("")}</table>`;
}

(async () => {
  await load();
  sec = D.sections[0].id;
  const h = (location.hash || "").slice(1); if (VIEWS.some(([k]) => k === h)) view = h;
  intro(); render();
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (k !== view && VIEWS.some(([x]) => x === k)) go(k); });
})();
</script>
</body></html>
